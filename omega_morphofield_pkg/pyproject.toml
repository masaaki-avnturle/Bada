[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-morphofield"
version = "0.1.0"
description = "形態形成場(Gray-Scott反応拡散)＋外部場ドリフトと、腫瘍停滞・耐性競合の個体群動態シミュレーション（教育用）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Masaaki Yamaguchi" }]
keywords = ["reaction-diffusion", "turing-pattern", "morphogenesis", "tumor-dynamics", "adaptive-therapy", "bada", "omega"]
dependencies = []

[project.scripts]
omega-morphofield = "omega_morphofield.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["omega_morphofield"]
