<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ZoneBrowser — ウルトラネットワーク専用ブラウザ (zone://)</title>
<style>
  :root { color-scheme: light dark; --bg:#04060a; --panel:#0a1220; --line:#1c2838;
          --ink:#d6e2ee; --dim:#8aa0b8; --gold:#c8a44a; --green:#2e9e57; --red:#d0574a; --blue:#4a80d0; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: system-ui,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif; }
  #chrome { position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#0a1220,#070c15);
            border-bottom:1px solid var(--line); padding:10px 12px; }
  .navrow { display:flex; gap:8px; align-items:center; }
  .navbtn { width:36px; height:36px; border:1px solid var(--line); border-radius:8px; background:#132033;
            color:var(--ink); font-size:16px; cursor:pointer; }
  .navbtn:disabled { opacity:.4; cursor:default; }
  .navbtn:hover:not(:disabled) { filter:brightness(1.2); }
  #addr { flex:2; display:flex; align-items:center; gap:8px; background:#020407; border:1px solid var(--line);
          border-radius:20px; padding:6px 14px; }
  #lock { font-size:14px; }
  #url { flex:1; background:transparent; border:0; outline:0; color:var(--ink); font-size:14px;
         font-family:"SFMono-Regular",Consolas,monospace; }
  #searchbox { flex:1; display:flex; align-items:center; gap:6px; background:#020407; border:1px solid var(--line);
               border-radius:20px; padding:6px 12px; min-width:180px; }
  #q { flex:1; background:transparent; border:0; outline:0; color:var(--ink); font-size:13px; }
  #go { border:0; background:var(--green); color:#eafff0; border-radius:16px; padding:7px 16px; cursor:pointer; font-weight:600; }
  #search { border:0; background:#2a3a4e; color:#eaf2ff; border-radius:16px; padding:7px 14px; cursor:pointer; }
  @media (max-width:900px){ #searchbox,#search{ display:none; } }
  .brand { display:flex; align-items:center; gap:8px; margin-right:6px; }
  .brand .o { color:var(--gold); font-size:20px; font-weight:700; }
  .brand small { color:var(--dim); }
  main { display:grid; grid-template-columns: 220px 1fr 300px; gap:0; height:calc(100% - 58px); }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } #side,#sec{ display:none; } }
  #side { border-right:1px solid var(--line); padding:14px; overflow:auto; }
  #side h3, #sec h3 { margin:0 0 10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  #side a { display:block; color:var(--blue); text-decoration:none; font-size:13px; padding:6px 8px; border-radius:6px;
            font-family:"SFMono-Regular",Consolas,monospace; word-break:break-all; }
  #side a:hover { background:#101d2e; }
  #page { overflow:auto; padding:28px 34px; }
  #page h1.doc { font-size:26px; margin:0 0 6px; }
  #page h2.doc { font-size:19px; margin:22px 0 6px; color:var(--gold); }
  #page p.doc { margin:8px 0; line-height:1.65; max-width:64ch; }
  #page a.zlink { color:var(--blue); text-decoration:none; border-bottom:1px solid #24405f; cursor:pointer; }
  #page a.zlink:hover { color:#8fb6ff; }
  #page .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-right:6px; }
  .ok { background:#123a24; color:#7ce0a3; } .bad { background:#3a1614; color:#f2a49b; }
  #sec { border-left:1px solid var(--line); padding:14px; overflow:auto; font-size:12.5px; }
  #sec .kv { display:flex; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px dashed #16222f; }
  #sec .kv b { color:var(--dim); font-weight:500; }
  #sec .kv span { text-align:right; font-family:"SFMono-Regular",Consolas,monospace; word-break:break-all; }
  #sec .big { font-size:13px; margin-top:12px; }
  .status-200 { color:#7ce0a3; } .status-err { color:#f2a49b; }
  #raw { margin-top:14px; }
  #raw summary { color:var(--dim); cursor:pointer; }
  #raw pre { background:#020407; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto;
             font-size:11px; max-height:220px; white-space:pre-wrap; }
  footer { grid-column:1/-1; }
</style>
</head>
<body>
<div id="chrome">
  <div class="navrow">
    <div class="brand"><span class="o">Ω</span><div><b>ZoneBrowser</b><br><small>ultra-network · zone://</small></div></div>
    <button class="navbtn" id="back"  title="戻る">‹</button>
    <button class="navbtn" id="fwd"   title="進む">›</button>
    <button class="navbtn" id="reload" title="再読み込み">⟳</button>
    <div id="addr">
      <span id="lock" title="Jones量子暗号で保護">🔒</span>
      <input id="url" spellcheck="false" autocomplete="off" value="zone://url.or.jp/"/>
    </div>
    <button id="go">開く</button>
    <div id="searchbox">
      <span style="opacity:.6">🔎</span>
      <input id="q" spellcheck="false" autocomplete="off" placeholder="ゾーン全体を検索 (cognitive_system)"/>
    </div>
    <button id="search">検索</button>
  </div>
</div>

<main>
  <nav id="side">
    <h3>ゾーン インデックス</h3>
    <div id="bookmarks"></div>
    <h3 style="margin-top:18px">ネットワーク</h3>
    <div id="peers" style="font-size:12px;color:var(--dim);font-family:monospace"></div>
  </nav>

  <section id="page"><p class="doc" style="color:var(--dim)">読み込み中…</p></section>

  <aside id="sec">
    <h3>セキュリティ</h3>
    <div id="secbody"></div>
    <details id="raw"><summary>zone プロトコル トレース</summary><pre id="rawpre"></pre></details>
  </aside>
</main>

<script>
/* ==== Bada language core (inlined) ==== */
/* ============================================================================
 * bada.js — The Bada language (Unknown-Prior Engine language), JavaScript port.
 *
 * A faithful port of the C reference (lexer.c / parser.c / interp.c /
 * transpile.c) so the same Bada programs run in the browser (APK / EXE /
 * Ubuntu app) with the documented numerics:
 *   (i)  zero preservation  — confident zeros survive the phase step
 *   (ii) |psi|^2 == a       — the unit-modulus phase only reweights
 *
 * Additions over the C reference, per the paper "Reviser-Extensible Grammars:
 * a Q#-targeted quantum front end for the Unknown-Prior Engine":
 *   - @reviser : grammar { rule ... } — grammar-extension transactions whose
 *     production rules are committed to a rule ledger consulted by the parser
 *     (extension points: stmt / expr / postfix; latest-highest priority;
 *     program-order scope).
 *   - A Q#-style quantum sublanguage on the phase core: qubit, H, X, S, T,
 *     Rz, CNOT, Measure — gates are phase/permutation steps, measurement is
 *     an append-only ledger commit.
 *   - Omega::Quantum inference library: prepare_unknown, observe, estimate,
 *     forbidden (append-only measurement record, max-entropy start).
 *   - Generic string primitives (split / substr / str_find / ord / chr) so
 *     the zone:// URL scheme of the ultra-network WWW (examples/zone.bada)
 *     can be written entirely in Bada itself: the runtime supplies only
 *     character-level access, the parser, DHT and quantum guard are Bada.
 *
 * Exports (UMD): BadaLang.run / tokens / ast / emitC / VERSION
 * ==========================================================================*/
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.BadaLang = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var VERSION = "1.1.0";

  /* ------------------------------------------------------------------ *
   * Tokens
   * ------------------------------------------------------------------ */
  var KEYWORDS = {
    Omega: "OMEGA", DATABASE: "DATABASE", tuplespace: "TUPLESPACE",
    TupleSpace: "TUPLESPACE", asperal: "ASPERAL", struct: "STRUCT",
    def: "DEF", typedef: "TYPEDEF", "return": "RETURN", "if": "IF",
    "else": "ELSE", "while": "WHILE", "for": "FOR", "in": "IN",
    "static": "STATIC", dynamic: "DYNAMIC", refine: "REFINE", star: "STAR",
    "true": "TRUE", "false": "FALSE", nil: "NIL", let: "LET",
    print: "PRINT", each: "EACH"
  };

  function isDigit(c) { return c >= "0" && c <= "9"; }
  function isAlpha(c) { return /[A-Za-z_]/.test(c); }
  function isAlnum(c) { return /[A-Za-z0-9_]/.test(c); }

  function tokenize(src) {
    var toks = [], pos = 0, line = 1, n = src.length;
    function peek() { return pos < n ? src[pos] : "\0"; }
    function peek2() { return pos + 1 < n ? src[pos + 1] : "\0"; }
    function adv() { var c = src[pos++]; if (c === "\n") line++; return c; }
    function mk(type, lexeme, num) {
      return { type: type, lexeme: lexeme, num: num || 0, line: line };
    }
    for (;;) {
      /* skip whitespace + comments (#, //) */
      for (;;) {
        var c0 = peek();
        if (c0 === " " || c0 === "\t" || c0 === "\r" || c0 === "\n") { adv(); }
        else if (c0 === "#") { while (pos < n && peek() !== "\n") adv(); }
        else if (c0 === "/" && peek2() === "/") { while (pos < n && peek() !== "\n") adv(); }
        else break;
      }
      var startLine = line;
      var c = peek();
      if (pos >= n) { toks.push({ type: "EOF", lexeme: "<eof>", num: 0, line: line }); break; }

      /* numbers */
      if (isDigit(c)) {
        var s = pos;
        while (isDigit(peek())) adv();
        var isf = false;
        if (peek() === "." && isDigit(peek2())) { isf = true; adv(); while (isDigit(peek())) adv(); }
        if (peek() === "e" || peek() === "E") { isf = true; adv(); if (peek() === "+" || peek() === "-") adv(); while (isDigit(peek())) adv(); }
        var text = src.slice(s, pos);
        toks.push({ type: isf ? "FLOAT" : "INT", lexeme: text, num: parseFloat(text), line: startLine });
        continue;
      }
      /* identifiers / keywords: allow @ prefix and trailing ? / ! */
      if (isAlpha(c) || c === "@") {
        var s2 = pos;
        if (c === "@") adv();
        while (isAlnum(peek())) adv();
        if (peek() === "?" || peek() === "!") adv();
        var buf = src.slice(s2, pos);
        if (buf[0] === "@") {
          if (buf === "@reviser") { toks.push({ type: "REVISER", lexeme: buf, num: 0, line: startLine }); continue; }
          toks.push({ type: "IDENT", lexeme: buf, num: 0, line: startLine });
          continue;
        }
        if (buf === "do") { toks.push({ type: "IDENT", lexeme: "do", num: 0, line: startLine }); continue; }
        if (Object.prototype.hasOwnProperty.call(KEYWORDS, buf)) {
          toks.push({ type: KEYWORDS[buf], lexeme: buf, num: 0, line: startLine });
          continue;
        }
        toks.push({ type: "IDENT", lexeme: buf, num: 0, line: startLine });
        continue;
      }
      /* strings — double quoted, and single quoted (used by rule patterns) */
      if (c === '"' || c === "'") {
        var quote = c;
        adv();
        var out = "";
        while (pos < n && peek() !== quote) {
          var ch = adv();
          if (ch === "\\") {
            var e = adv();
            out += e === "n" ? "\n" : e === "t" ? "\t" : e === '"' ? '"' : e === "'" ? "'" : e === "\\" ? "\\" : e;
          } else out += ch;
        }
        if (peek() === quote) adv();
        toks.push({ type: "STRING", lexeme: out, num: 0, line: startLine });
        continue;
      }

      adv(); /* consume c */
      switch (c) {
        case "(": toks.push(mk("LPAREN", "(")); continue;
        case ")": toks.push(mk("RPAREN", ")")); continue;
        case "{": toks.push(mk("LBRACE", "{")); continue;
        case "}": toks.push(mk("RBRACE", "}")); continue;
        case "[": toks.push(mk("LBRACK", "[")); continue;
        case "]": toks.push(mk("RBRACK", "]")); continue;
        case ",": toks.push(mk("COMMA", ",")); continue;
        case ".": toks.push(mk("DOT", ".")); continue;
        case "|": toks.push(mk("PIPE", "|")); continue;
        case "~": toks.push(mk("CONSIST", "~")); continue;
        case "+": toks.push(mk("PLUS", "+")); continue;
        case "*": toks.push(mk("STAR_OP", "*")); continue;
        case "/": toks.push(mk("SLASH", "/")); continue;
        case "%": toks.push(mk("PERCENT", "%")); continue;
        case ";": toks.push(mk("SEMI", ";")); continue;
        case "-":
          if (peek() === ">") { adv(); toks.push(mk("QUERY", "->")); continue; }
          toks.push(mk("MINUS", "-")); continue;
        case "<":
          if (peek() === "-") { adv(); toks.push(mk("LARROW", "<-")); continue; }
          if (peek() === "=") { adv(); toks.push(mk("LE", "<=")); continue; }
          toks.push(mk("LT", "<")); continue;
        case ">":
          if (peek() === ">") { adv(); toks.push(mk("COMMIT", ">>")); continue; }
          if (peek() === "=") { adv(); toks.push(mk("GE", ">=")); continue; }
          toks.push(mk("GT", ">")); continue;
        case "=":
          if (peek() === "=") { adv(); toks.push(mk("EQ", "==")); continue; }
          if (peek() === ">") { adv(); toks.push(mk("ARROW", "=>")); continue; }
          toks.push(mk("ASSIGN", "=")); continue;
        case "!":
          if (peek() === "=") { adv(); toks.push(mk("NE", "!=")); continue; }
          toks.push(mk("NOT", "!")); continue;
        case "&":
          if (peek() === "&") { adv(); toks.push(mk("AND", "&&")); continue; }
          toks.push(mk("AND", "&")); continue;
        case ":":
          if (peek() === "=") {
            adv();
            if (peek() === ">") { adv(); toks.push(mk("DEFARROW", ":=>")); continue; }
            toks.push(mk("WALRUS", ":=")); continue;
          }
          if (peek() === ":") { adv(); toks.push(mk("SCOPE", "::")); continue; }
          toks.push(mk("COLON", ":")); continue;
      }
      toks.push(mk("ERROR", c));
    }
    return toks;
  }

  /* ------------------------------------------------------------------ *
   * AST
   * ------------------------------------------------------------------ */
  function node(type, line) {
    return { type: type, line: line, num: 0, str: null, boolean: false, kids: [], params: [], body: null };
  }

  /* ------------------------------------------------------------------ *
   * Parser (recursive descent, + rule-ledger extension points)
   * ------------------------------------------------------------------ */
  function Parser(toks) {
    this.toks = toks;
    this.i = 0;
    this.errors = [];
    /* the parse-time rule ledger (grammar facts committed by @reviser :
       grammar transactions; consulted latest-first; program-order scope) */
    this.ruleLedger = [];
  }
  Parser.prototype.cur = function () { return this.toks[this.i]; };
  Parser.prototype.peekn = function (k) { var j = this.i + k; if (j >= this.toks.length) j = this.toks.length - 1; return this.toks[j]; };
  Parser.prototype.check = function (t) { return this.cur().type === t; };
  Parser.prototype.advance = function () { var t = this.cur(); if (this.i < this.toks.length - 1) this.i++; return t; };
  Parser.prototype.match = function (t) { if (this.check(t)) { this.advance(); return true; } return false; };
  Parser.prototype.perr = function (msg) {
    this.errors.push("[parse error] line " + this.cur().line + " near '" + (this.cur().lexeme || "?") + "': " + msg);
  };
  Parser.prototype.expect = function (t, what) { if (!this.match(t)) this.perr(what); };

  Parser.prototype.parsePipeParams = function (holder) {
    this.expect("PIPE", "expected '|'");
    while (!this.check("PIPE") && !this.check("EOF")) {
      if (this.check("IDENT")) { holder.params.push(this.cur().lexeme); this.advance(); }
      else this.advance();
      if (this.check("PIPE")) break;
      if (this.check("COMMA")) this.advance();
    }
    this.expect("PIPE", "expected closing '|'");
  };

  /* ---- rule-ledger matching -------------------------------------- */
  /* pattern atom: {kind:'tok', text} literal, {kind:'hole'} expression hole */
  Parser.prototype.tryRules = function (heads) {
    /* latest commit wins (highest priority), then ledger order */
    for (var r = this.ruleLedger.length - 1; r >= 0; r--) {
      var rule = this.ruleLedger[r];
      if (heads.indexOf(rule.head) < 0) continue;
      if (!rule.pattern.length || rule.pattern[0].kind !== "tok") continue; /* avoid left recursion */
      if (this.cur().lexeme !== rule.pattern[0].text) continue;
      var save = this.i;
      var holes = [];
      var ok = true;
      for (var k = 0; k < rule.pattern.length; k++) {
        var atom = rule.pattern[k];
        if (atom.kind === "tok") {
          if (this.cur().lexeme === atom.text && !this.check("EOF")) this.advance();
          else { ok = false; break; }
        } else { /* hole: capture a full expression */
          holes.push(this.parseExpr());
        }
      }
      if (!ok) { this.i = save; continue; }
      var ext = node("EXTENDED", this.toks[save].line);
      ext.str = rule.name;
      ext.rule = rule;
      ext.kids = holes;
      return ext;
    }
    return null;
  };

  Parser.prototype.parsePrimary = function () {
    /* extension point: rules with head 'expr' / 'postfix' before built-ins */
    var ext = this.tryRules(["expr", "postfix"]);
    if (ext) return ext;

    var t = this.cur();
    switch (t.type) {
      case "INT": case "FLOAT": { var n1 = node(t.type === "INT" ? "INT" : "FLOAT", t.line); n1.num = t.num; this.advance(); return n1; }
      case "STRING": { var n2 = node("STRING", t.line); n2.str = t.lexeme; this.advance(); return n2; }
      case "TRUE": { var n3 = node("BOOL", t.line); n3.boolean = true; this.advance(); return n3; }
      case "FALSE": { var n4 = node("BOOL", t.line); n4.boolean = false; this.advance(); return n4; }
      case "NIL": { var n5 = node("NIL", t.line); this.advance(); return n5; }
      case "STAR": { var n6 = node("IDENT", t.line); n6.str = "STAR"; this.advance(); return n6; }
      case "LPAREN": { this.advance(); var e = this.parseExpr(); this.expect("RPAREN", "expected ')'"); return e; }
      case "LBRACK": {
        this.advance();
        var a = node("ARRAY", t.line);
        while (!this.check("RBRACK") && !this.check("EOF")) {
          a.kids.push(this.parseExpr());
          if (!this.match("COMMA")) break;
        }
        this.expect("RBRACK", "expected ']'");
        return a;
      }
      case "PIPE": { /* lambda */
        var lam = node("LAMBDA", t.line);
        this.parsePipeParams(lam);
        if (this.check("IDENT") && this.cur().lexeme === "do") {
          this.advance();
          var body = node("BLOCK", t.line);
          while (!(this.check("IDENT") && this.cur().lexeme === "end") && !this.check("EOF"))
            body.kids.push(this.parseStmt());
          if (this.check("IDENT") && this.cur().lexeme === "end") this.advance();
          lam.body = body;
        } else {
          lam.body = this.parseExpr();
        }
        return lam;
      }
      case "OMEGA": { var n7 = node("IDENT", t.line); n7.str = "Omega"; this.advance(); return n7; }
      case "TUPLESPACE": { var n8 = node("IDENT", t.line); n8.str = "TupleSpace"; this.advance(); return n8; }
      case "IDENT": { var n9 = node("IDENT", t.line); n9.str = t.lexeme; this.advance(); return n9; }
      case "DATABASE": { var nA = node("IDENT", t.line); nA.str = "DATABASE"; this.advance(); return nA; }
      default:
        this.perr("expected expression");
        this.advance();
        return node("NIL", t.line);
    }
  };

  Parser.prototype.parsePostfix = function () {
    var e = this.parsePrimary();
    for (;;) {
      if (this.match("LPAREN")) {
        var call = node("CALL", e.line);
        call.kids.push(e);
        while (!this.check("RPAREN") && !this.check("EOF")) {
          call.kids.push(this.parseExpr());
          if (!this.match("COMMA")) break;
        }
        this.expect("RPAREN", "expected ')'");
        e = call;
      } else if (this.match("LBRACK")) {
        var idx = node("INDEX", e.line);
        idx.kids.push(e);
        if (!this.check("RBRACK")) idx.kids.push(this.parseExpr());
        this.expect("RBRACK", "expected ']'");
        e = idx;
      } else if (this.match("DOT")) {
        var m = this.cur();
        if (this.check("EACH")) {
          this.advance();
          var each = node("EACH", m.line);
          each.kids.push(e);
          var lam = node("LAMBDA", m.line);
          if (this.check("PIPE")) this.parsePipeParams(lam);
          if (this.check("IDENT") && this.cur().lexeme === "do") {
            this.advance();
            var body = node("BLOCK", m.line);
            while (!(this.check("IDENT") && this.cur().lexeme === "end") && !this.check("EOF"))
              body.kids.push(this.parseStmt());
            if (this.check("IDENT") && this.cur().lexeme === "end") this.advance();
            lam.body = body;
          } else {
            lam.body = this.parseExpr();
          }
          each.kids.push(lam);
          e = each;
        } else {
          var name = m.lexeme;
          this.advance();
          if (this.match("LPAREN")) {
            var call2 = node("CALL", m.line);
            var meth = node("GET", m.line);
            meth.str = name;
            meth.kids.push(e);
            call2.kids.push(meth);
            while (!this.check("RPAREN") && !this.check("EOF")) {
              call2.kids.push(this.parseExpr());
              if (!this.match("COMMA")) break;
            }
            this.expect("RPAREN", "expected ')'");
            e = call2;
          } else {
            var get = node("GET", m.line);
            get.str = name;
            get.kids.push(e);
            e = get;
          }
        }
      } else if (this.match("SCOPE")) {
        var m2 = this.cur();
        var name2 = m2.lexeme || "?";
        this.advance();
        var get2 = node("GET", m2.line);
        get2.str = name2;
        get2.kids.push(e);
        e = get2;
      } else break;
    }
    return e;
  };

  Parser.prototype.parseUnary = function () {
    if (this.check("MINUS") || this.check("NOT")) {
      var op = this.advance();
      var n = node("UNARY", op.line);
      n.str = op.lexeme;
      n.kids.push(this.parseUnary());
      return n;
    }
    return this.parsePostfix();
  };

  Parser.prototype.bin = function (sub, ops) {
    var left = sub.call(this);
    for (;;) {
      var matched = false;
      for (var i = 0; i < ops.length; i++) {
        if (this.check(ops[i][0])) {
          var op = this.advance();
          var n = node("BINARY", op.line);
          n.str = ops[i][1];
          n.kids.push(left);
          n.kids.push(sub.call(this));
          left = n;
          matched = true;
          break;
        }
      }
      if (!matched) break;
    }
    return left;

  Parser.prototype.parseFactor = function () { return this.bin(this.parseUnary, [["STAR_OP", "*"], ["SLASH", "/"], ["PERCENT", "%"]]); };
  Parser.prototype.parseTerm = function () { return this.bin(this.parseFactor, [["PLUS", "+"], ["MINUS", "-"]]); };
  Parser.prototype.parseCompare = function () { return this.bin(this.parseTerm, [["LT", "<"], ["LE", "<="], ["GT", ">"], ["GE", ">="]]); };
  Parser.prototype.parseEquality = function () { return this.bin(this.parseCompare, [["EQ", "=="], ["NE", "!="], ["CONSIST", "~"]]); };
  Parser.prototype.parseAnd = function () { return this.bin(this.parseEquality, [["AND", "&&"]]); };
  Parser.prototype.parseOr = function () { return this.bin(this.parseAnd, [["OR", "||"]]); };

  Parser.prototype.parseQuery = function () {
    var left = this.parseOr();
    while (this.check("ARROW") || this.check("QUERY")) {
      var op = this.advance();
      var n = node("QUERY", op.line);
      n.kids.push(left);
      n.kids.push(this.parseOr());
      left = n;
    }
    return left;
  };

  Parser.prototype.parseCommit = function () {
    var left = this.parseQuery();
    for (;;) {
      if (this.check("COMMIT")) {
        this.advance();
        var n = node("COMMIT", left.line);
        n.kids.push(left);
        n.kids.push(this.parseQuery());
        left = n;
      } else if (this.check("LARROW")) {
        this.advance();
        var n2 = node("LARROW", left.line);
        n2.kids.push(left);
        n2.kids.push(this.parseQuery());
        left = n2;

  Parser.prototype.parseExpr = function () { return this.parseCommit(); };

  Parser.prototype.parseBlock = function () {
    var line = this.cur().line;
    this.expect("LBRACE", "expected '{'");
    var b = node("BLOCK", line);

      b.kids.push(this.parseDecl());
    this.expect("RBRACE", "expected '}'");
    return b;
  };

  Parser.prototype.parseFunc = function () {
    var line = this.cur().line;
    this.expect("DEF", "expected 'def'");
    var fn = node("FUNC", line);
    if (this.check("IDENT")) { fn.str = this.cur().lexeme; this.advance(); }
    else fn.str = "anon";
    if (this.check("PIPE")) this.parsePipeParams(fn);
    else if (this.match("LPAREN")) {
      while (!this.check("RPAREN") && !this.check("EOF")) {
        if (this.check("IDENT")) { fn.params.push(this.cur().lexeme); this.advance(); }
        else this.advance();
        if (!this.match("COMMA")) break;
      }
      this.expect("RPAREN", "expected ')'");
    }
    if (this.check("LBRACE")) {
      fn.body = this.parseBlock();
    } else if (this.match("COMMIT") || this.match("ARROW") || this.match("DEFARROW") || this.match("ASSIGN")) {
      var body = node("BLOCK", line);
      var ret = node("RETURN", line);
      ret.kids.push(this.parseExpr());
      body.kids.push(ret);
      this.match("SEMI");
      fn.body = body;
    } else {
      var body2 = node("BLOCK", line);
      var ret2 = node("RETURN", line);
      ret2.kids.push(this.parseExpr());
      body2.kids.push(ret2);
      fn.body = body2;
    }
    return fn;
  };

  Parser.prototype.parseAsperal = function () {
    var line = this.cur().line;
    this.expect("ASPERAL", "expected 'asperal'");
    if (this.check("PIPE")) {
      var n = node("ASPERAL", line);
      n.str = "union";
      this.parsePipeParams(n);
      this.match("DEFARROW");
      if (this.check("LBRACE")) n.body = this.parseBlock();
      return n;
    }
    var st = node("STRUCT", line);
    if (this.check("IDENT")) { st.str = this.cur().lexeme; this.advance(); }
    else if (this.check("TUPLESPACE")) { st.str = "TupleSpace"; this.advance(); }
    else st.str = "anon";
    if (this.match("COLON")) this.match("STRUCT");
    else this.match("STRUCT");
    st.body = this.parseBlock();
    return st;
  };

  Parser.prototype.parseOmega = function () {
    var line = this.cur().line;
    this.expect("OMEGA", "expected 'Omega'");
    var n = node("OMEGA_DB", line);
    if (this.match("SCOPE")) {
      if (this.check("DATABASE")) { this.advance(); n.str = "DATABASE"; }
      else if (this.check("TUPLESPACE")) { this.advance(); n.str = "Tuplespace"; }
      else if (this.check("IDENT")) { n.str = this.cur().lexeme; this.advance(); }
      else n.str = "DATABASE";
    } else n.str = "DATABASE";
    if (this.match("LBRACK")) {
      if (this.check("TUPLESPACE") || this.check("IDENT")) this.advance();
      this.expect("RBRACK", "expected ']'");
    }
    if (this.match("LT")) { if (this.check("DATABASE") || this.check("IDENT")) this.advance(); }
    n.body = this.parseBlock();
    return n;
  };

  /* @reviser — either the value-level learning loop (executes its block),
     or, when the header names 'grammar', a grammar-extension transaction:
        @reviser : grammar {
            rule "name" head [ 'tok' expr ... ] => denotation
        }
     Rules are committed to the parse-time rule ledger (program-order scope,
     latest-highest priority) and, at run time, appended to the tuplespace
     ledger as ["rule", name, head, ...] facts (auditability). */
  Parser.prototype.parseReviser = function () {
    var line = this.cur().line;
    this.expect("REVISER", "expected '@reviser'");
    var isGrammar = false;
    var j = this.i;
    while (j < this.toks.length && this.toks[j].type !== "LBRACE" && this.toks[j].type !== "EOF") {
      if (this.toks[j].lexeme === "grammar") isGrammar = true;
      j++;
    }
    /* skip header noise up to '{' */
    while (!this.check("LBRACE") && !this.check("EOF")) this.advance();
    if (isGrammar) return this.parseGrammarBlock(line);
    var n = node("REVISER", line);
    n.body = this.parseBlock();
    return n;
  };

  Parser.prototype.parseGrammarBlock = function (line) {
    var g = node("GRAMMAR", line);
    g.rules = [];
    this.expect("LBRACE", "expected '{'");
    while (!this.check("RBRACE") && !this.check("EOF")) {
      if (this.check("IDENT") && this.cur().lexeme === "rule") {
        this.advance();
        var rule = { name: "?", head: "expr", pattern: [], denotation: null, prio: this.ruleLedger.length };
        if (this.check("STRING") || this.check("IDENT")) { rule.name = this.cur().lexeme; this.advance(); }
        if (this.check("IDENT") || this.check("STRUCT")) { rule.head = this.cur().lexeme; this.advance(); }
        this.expect("LBRACK", "expected '[' pattern");
        while (!this.check("RBRACK") && !this.check("EOF")) {
          var t = this.cur();
          if (t.type === "STRING") { rule.pattern.push({ kind: "tok", text: t.lexeme }); this.advance(); }
          else if (t.type === "IDENT" && t.lexeme === "expr") { rule.pattern.push({ kind: "hole" }); this.advance(); }
          else { rule.pattern.push({ kind: "tok", text: t.lexeme }); this.advance(); }
          this.match("COMMA");
        }
        this.expect("RBRACK", "expected ']'");
        this.expect("ARROW", "expected '=>' denotation");
        rule.denotation = this.parseExpr();
        /* monotone append: the rule ledger only grows */
        this.ruleLedger.push(rule);
        g.rules.push(rule);
        this.match("SEMI");
      } else {
        this.perr("expected 'rule' in grammar reviser");
        this.advance();
      }

    this.expect("RBRACE", "expected '}'");
    return g;
  };

  Parser.prototype.parseIf = function () {
    var line = this.cur().line;
    this.expect("IF", "if");
    var n = node("IF", line);
    var par = this.match("LPAREN");
    n.kids.push(this.parseExpr());
    if (par) this.expect("RPAREN", ")");
    n.kids.push(this.parseBlock());
    if (this.match("ELSE")) {
      if (this.check("IF")) n.kids.push(this.parseIf());
      else n.kids.push(this.parseBlock());
    }
    return n;
  };

  Parser.prototype.parseWhile = function () {
    var line = this.cur().line;
    this.expect("WHILE", "while");
    var n = node("WHILE", line);
    var par = this.match("LPAREN");
    n.kids.push(this.parseExpr());
    if (par) this.expect("RPAREN", ")");
    n.kids.push(this.parseBlock());
    return n;
  };

  Parser.prototype.parseFor = function () {
    var line = this.cur().line;
    this.expect("FOR", "for");
    var n = node("FOR", line);
    n.str = this.cur().lexeme;
    if (this.check("IDENT")) this.advance();

    n.kids.push(this.parseExpr());
    n.kids.push(this.parseBlock());
    return n;
  };

  Parser.prototype.parseStmt = function () {
    var line = this.cur().line;
    /* extension point: rules with head 'stmt' before built-ins */
    var ext = this.tryRules(["stmt"]);
    if (ext) { this.match("SEMI"); return ext; }

    if (this.check("DEF")) return this.parseFunc();
    if (this.check("ASPERAL")) return this.parseAsperal();
    if (this.check("OMEGA")) return this.parseOmega();
    if (this.check("REVISER")) return this.parseReviser();
    if (this.check("IF")) return this.parseIf();
    if (this.check("WHILE")) return this.parseWhile();
    if (this.check("FOR")) return this.parseFor();
    if (this.check("TYPEDEF")) {
      this.advance();
      var n = node("STRUCT", line);
      n.str = "typedef";
      while (!this.check("LBRACE") && !this.check("EOF")) this.advance();
      n.body = this.parseBlock();
      return n;
    }
    if (this.match("RETURN")) {
      var r = node("RETURN", line);
      if (!this.check("RBRACE") && !this.check("SEMI")) r.kids.push(this.parseExpr());
      this.match("SEMI");
      return r;
    }
    if (this.match("PRINT")) {
      var pn = node("PRINT", line);
      var par = this.match("LPAREN");
      pn.kids.push(this.parseExpr());
      while (this.match("COMMA")) pn.kids.push(this.parseExpr());
      if (par) this.expect("RPAREN", ")");
      this.match("SEMI");
      return pn;
    }
    if (this.check("IDENT") && this.peekn(1).type === "WALRUS") {
      var b = node("BIND", line);
      b.str = this.cur().lexeme;
      this.advance(); this.advance();
      b.kids.push(this.parseExpr());
      this.match("SEMI");
      return b;
    }
    var e = this.parseExpr();
    if (this.check("ASSIGN")) {
      this.advance();
      var a = node("ASSIGN", line);
      a.kids.push(e);
      a.kids.push(this.parseExpr());
      this.match("SEMI");
      return a;
    }
    this.match("SEMI");
    return e;
  };

  Parser.prototype.parseDecl = function () { return this.parseStmt(); };

  function parseProgram(src) {
    var toks = tokenize(src);
    var p = new Parser(toks);
    var prog = node("PROGRAM", 1);
    while (!p.check("EOF")) {
      var d = p.parseDecl();
      if (d) prog.kids.push(d);
      if (p.errors.length > 50) { p.errors.push("too many parse errors, aborting"); break; }
    }
    return { program: prog, errors: p.errors, ruleLedger: p.ruleLedger };
  }

  /* ------------------------------------------------------------------ *
   * Values
   * ------------------------------------------------------------------ */

  function Vnum(x) { return { t: "num", num: x }; }
  function Vbool(b) { return { t: "bool", b: b }; }
  function Vstr(s) { return { t: "str", str: s == null ? "" : String(s) }; }
  function Vstar() { return { t: "star" }; }
  function Varr(items) { return { t: "arr", items: items || [] }; }
  function Vdist(p) { return { t: "dist", p: p }; }

  }

    var p = new Array(items.length);

    return p;

    switch (v.t) {

      case "bool": return v.b;
      case "num": return v.num !== 0;
      case "str": return v.str.length > 0;
      default: return true;
    }
  }

  /* C %g-alike for string concat */
  function fmtG(x) {
    if (!isFinite(x)) return String(x);
    if (x === Math.trunc(x) && Math.abs(x) < 1e15) return String(x);
    return String(parseFloat(x.toPrecision(6)));
  }
  function fmtNum(x) {
    if (x === Math.trunc(x) && isFinite(x) && Math.abs(x) < 9.2e18) return String(Math.trunc(x));
    return x.toFixed(5);
  }
  /* C "%.2e" with >=2 exponent digits */
  function fmtSci(x) {
    var s = x.toExponential(2); /* e.g. 5.55e-17 or 1.23e-7 */
    return s.replace(/e([+-])(\d)$/, "e$10$2");
  }

  function printValue(v) {
    switch (v.t) {
      case "nil": return "nil";
      case "star": return "star";
      case "bool": return v.b ? "true" : "false";
      case "num": return fmtNum(v.num);
      case "str": return v.str;
      case "arr": return "[" + v.items.map(printValue).join(", ") + "]";
      case "dist": return "dist[" + Array.prototype.map.call(v.p, function (x) { return x.toFixed(5); }).join(", ") + "]";
      case "phase": return "phase[V=" + v.v + ", |.|=1]";
      case "ts": return "tuplespace<" + (v.ts ? v.ts.facts.length : 0) + " facts>";
      case "func": return "<fn " + (v.decl && v.decl.str ? v.decl.str : "lambda") + ">";
      case "native": return "<native fn>";
      case "struct": return "<struct " + v.name + ">";
      case "inst": return "<" + v.name + " instance>";
      case "reg": {

      default: return "?";
    }
  }

  /* ------------------------------------------------------------------ *
   * Quantum register on the phase core
   * psi_i = sqrt(a_i) * exp(i * theta_i)  — stored as re/im amplitude
   * vectors; gates are index permutations and/or phase contributions.
   * ------------------------------------------------------------------ */
  function regNew(n) {
    var V = 1 << n;
    var re = new Float64Array(V), im = new Float64Array(V);
    re[0] = 1;
    return { n: n, re: re, im: im };
  }
  function regProbs(reg) {
    var V = reg.re.length, p = new Array(V), s = 0;
    for (var i = 0; i < V; i++) { p[i] = reg.re[i] * reg.re[i] + reg.im[i] * reg.im[i]; s += p[i]; }
    if (s > 0) for (var j = 0; j < V; j++) p[j] /= s;
    return p;
  }
  function gateH(reg, q) {
    var V = reg.re.length, bit = 1 << q, r = Math.SQRT1_2;
    for (var i = 0; i < V; i++) {
      if (i & bit) continue;
      var j = i | bit;
      var ar = reg.re[i], ai = reg.im[i], br = reg.re[j], bi = reg.im[j];
      reg.re[i] = r * (ar + br); reg.im[i] = r * (ai + bi);
      reg.re[j] = r * (ar - br); reg.im[j] = r * (ai - bi);
    }

  function gateX(reg, q) {
    var V = reg.re.length, bit = 1 << q;
    for (var i = 0; i < V; i++) {

      var j = i | bit;
      var tr = reg.re[i], ti = reg.im[i];
      reg.re[i] = reg.re[j]; reg.im[i] = reg.im[j];
      reg.re[j] = tr; reg.im[j] = ti;

  function gatePhase(reg, q, lam) {

    var c = Math.cos(lam), s = Math.sin(lam);

      if (!(i & bit)) continue;
      var ar = reg.re[i], ai = reg.im[i];
      reg.re[i] = ar * c - ai * s;
      reg.im[i] = ar * s + ai * c;
    }

    var V = reg.re.length, cb = 1 << c, tb = 1 << t;

        var tr = reg.re[i], ti = reg.im[i];
        reg.re[i] = reg.re[j]; reg.im[i] = reg.im[j];
        reg.re[j] = tr; reg.im[j] = ti;

  /* ------------------------------------------------------------------ *

    this.qstate = { prior: null };        /* Omega::Quantum estimator */
    this.global = new Env(null);

    this.maxSteps = opts.maxSteps || 20000000;

  function Emitter() {
    this.lines = [];
    this.tmp = 0;
    this.declared = Object.create(null);
  }
  Emitter.prototype.push = function (s) { this.lines.push(s); };

  function lowerCall(E, n, holes) {
    var callee = n.kids[0];
    var argc = n.kids.length - 1;
    function arg(i, dflt) {
      return i < argc ? lowerExpr(E, n.kids[i + 1], holes) : (dflt || "bnil()");
    }
    if (callee.type === "IDENT") {
      var name = callee.str;
      switch (name) {
        case "softmax": return "b_softmax(" + arg(0) + ")";
        case "entropy": return "b_entropy(" + arg(0) + ")";
        case "unknown_prior": return "b_unknown_prior(" + arg(0) + ")";
        case "dist": return "(" + arg(0) + ")";
        case "len": {
          if (argc > 0 && n.kids[1].type === "IDENT" &&
              (n.kids[1].str === "tuplespace" || n.kids[1].str === "Omega" || n.kids[1].str === "TupleSpace"))
            return "bnum(bledger_len())";
          var a0 = arg(0);
          return "bnum((" + a0 + ").t==BV_ARR?(" + a0 + ").arr->n:((" + a0 + ").t==BV_DIST?(" + a0 + ").dist->v:((" + a0 + ").t==BV_REG?(" + a0 + ").reg->v:0)))";
        }
        case "sqrt": return "bnum(sqrt(bnumof(" + arg(0) + ")))";
        case "log": return "bnum(log(bnumof(" + arg(0) + ")))";
        case "exp": return "bnum(exp(bnumof(" + arg(0) + ")))";
        case "abs": return "bnum(fabs(bnumof(" + arg(0) + ")))";
        case "ledger": return "bnum(bledger_len())";
        case "zeros_of": return "b_zeros_of(" + arg(0) + ")";
        case "maxdiff": return "b_maxdiff(" + arg(0) + "," + arg(1) + ")";
        case "sci": return "b_sci(" + arg(0) + ")";
        case "f5": return "b_f5(" + arg(0) + ")";
        case "last_a": return "b_last_a()";
        case "update": {
          if (argc > 2) return "b_update(" + arg(0) + "," + arg(1) + ",bnumof(" + arg(2) + "))";
          return "b_update(" + arg(0) + "," + arg(1) + ",0.5)";
        }
        case "cognitive_system": {
          var b0 = arg(0), b1 = arg(1, "bnil()"), b2 = arg(2, "bnil()");
          var t1 = "t" + (E.tmp++), t2 = "t" + (E.tmp++);
          E.push("  BV " + t1 + "=" + b1 + "; BV " + t2 + "=" + b2 + ";");
          return "b_cognitive(" + b0 + ",(" + t1 + ").t==BV_ARR?(" + t1 + ").arr:0,(" + t2 + ").t==BV_ARR?(" + t2 + ").arr:0)";
        }
        /* quantum sublanguage */
        case "qubit": return "b_qubit(" + arg(0) + ")";
        case "H": return "b_H(" + arg(0) + "," + (argc > 1 ? "(int)bnumof(" + arg(1) + ")" : "0") + ")";
        case "X": return "b_X(" + arg(0) + "," + (argc > 1 ? "(int)bnumof(" + arg(1) + ")" : "0") + ")";
        case "S": return "b_S(" + arg(0) + "," + (argc > 1 ? "(int)bnumof(" + arg(1) + ")" : "0") + ")";
        case "T": return "b_T(" + arg(0) + "," + (argc > 1 ? "(int)bnumof(" + arg(1) + ")" : "0") + ")";
        case "Rz": return "b_Rz(" + arg(0) + "," + (argc > 1 ? "bnumof(" + arg(1) + ")" : "0") + "," + (argc > 2 ? "(int)bnumof(" + arg(2) + ")" : "0") + ")";
        case "CNOT": return "b_CNOT(" + arg(0) + "," + (argc > 1 ? "(int)bnumof(" + arg(1) + ")" : "0") + "," + (argc > 2 ? "(int)bnumof(" + arg(2) + ")" : "1") + ")";
        case "Measure": case "commit_measurement": return "b_measure(" + arg(0) + ")";
        case "observe": return "b_observe(" + arg(0) + ")";
        case "phase_uniform": return "b_phase_uniform(" + arg(0) + ")";
        case "prepare_unknown": return "b_prepare_unknown(" + arg(0) + ")";
        case "estimate": return "b_estimate()";
        case "forbidden": return "b_forbidden()";
      }
    }
    /* method call: x.append(v) -> bcommit(v) */
    if (callee.type === "GET" && callee.str === "append") {
      return "bnum(bcommit(" + arg(0) + "))";
    }
    return "bnil()";
  }

  function cQuote(s) {
    return s.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n").replace(/\t/g, "\\t");
  }

  function lowerExpr(E, n, holes) {
    if (!n) return "bnil()";
    switch (n.type) {
      case "INT": case "FLOAT": {
        var s = String(n.num);
        if (!/[.eE]/.test(s)) s += ".0";
        return "bnum(" + s + ")";
      }
      case "STRING": return 'bstr("' + cQuote(n.str || "") + '")';
      case "BOOL": return "bnum(" + (n.boolean ? 1 : 0) + ")";
      case "NIL": return "bnil()";
      case "IDENT": {
        if (holes && Object.prototype.hasOwnProperty.call(holes, n.str)) return holes[n.str];
        if (n.str === "tuplespace" || n.str === "Omega" || n.str === "TupleSpace")
          return "bnum(bledger_len())";
        return "v_" + n.str;
      }
      case "ARRAY": {
        var id = E.tmp++;
        E.push("  BArr*t" + id + "=barr();");
        for (var i = 0; i < n.kids.length; i++) {
          var e = lowerExpr(E, n.kids[i], holes);
          E.push("  bpush(t" + id + "," + e + ");");
        }
        return "barrv(t" + id + ")";
      }
      case "BINARY": {
        var l = lowerExpr(E, n.kids[0], holes);
        var r = lowerExpr(E, n.kids[1], holes);
        switch (n.str) {
          case "+": return "badd(" + l + "," + r + ")";
          case "-": return "bsub(" + l + "," + r + ")";
          case "*": return "bmul(" + l + "," + r + ")";
          case "/": return "bdiv(" + l + "," + r + ")";
          case "<": return "bnum(bnumof(" + l + ")<bnumof(" + r + ")?1:0)";
          case "<=": return "bnum(bnumof(" + l + ")<=bnumof(" + r + ")?1:0)";
          case ">": return "bnum(bnumof(" + l + ")>bnumof(" + r + ")?1:0)";
          case ">=": return "bnum(bnumof(" + l + ")>=bnumof(" + r + ")?1:0)";
          case "==": return "bnum(bnumof(" + l + ")==bnumof(" + r + ")?1:0)";
          case "!=": return "bnum(bnumof(" + l + ")!=bnumof(" + r + ")?1:0)";
          case "%": return "bnum(fmod(bnumof(" + l + "),bnumof(" + r + ")))";
          case "&&": return "bnum((bnumof(" + l + ")!=0&&bnumof(" + r + ")!=0)?1:0)";
          case "||": return "bnum((bnumof(" + l + ")!=0||bnumof(" + r + ")!=0)?1:0)";
          default: return "bnum(bnumof(" + l + ")+bnumof(" + r + "))";
        }
      }
      case "CALL": return lowerCall(E, n, holes);
      case "UNARY": {
        var u = lowerExpr(E, n.kids[0], holes);
        if (n.str === "-") return "bnum(-bnumof(" + u + "))";
        if (n.str === "!") return "bnum(bnumof(" + u + ")==0?1:0)";
        return "(" + u + ")";
      }
      case "INDEX": {
        var b = lowerExpr(E, n.kids[0], holes);
        var ix = n.kids.length > 1 ? lowerExpr(E, n.kids[1], holes) : "bnum(0)";
        return "bindex(" + b + "," + ix + ")";
      }
      case "COMMIT": {
        var cl = lowerExpr(E, n.kids[0], holes);
        var id2 = E.tmp++;
        E.push("  BV c" + id2 + "=" + cl + "; bcommit(c" + id2 + ");");
        return lowerExpr(E, n.kids[1], holes);
      }
      case "QUERY": {
        var q0 = lowerExpr(E, n.kids[0], holes);
        var id3 = E.tmp++;
        E.push("  BV q" + id3 + "=" + q0 + "; (void)q" + id3 + ";");
        return lowerExpr(E, n.kids[1], holes);
      }
      case "EXTENDED": {
        /* lower an extended form by lowering the rule denotation with the
           captured holes substituted (rule lookup happens before lowering,
           so the native back end sees only ordinary engine calls) */
        var hmap = {};
        for (var h = 0; h < n.kids.length; h++) {
          var he = lowerExpr(E, n.kids[h], holes);
          var ht = "h" + (E.tmp++);
          E.push("  BV " + ht + "=" + he + ";");
          hmap["_" + (h + 1)] = ht;
        }
        return lowerExpr(E, n.rule.denotation, hmap);
      }
      case "GET": return "bnil()";
      default: return "bnil()";
    }
  }

  function lowerStmt(E, n) {
    switch (n.type) {
      case "BIND": {
        var e = lowerExpr(E, n.kids[0], null);
        if (E.declared[n.str]) E.push("  v_" + n.str + "=" + e + ";");
        else { E.declared[n.str] = true; E.push("  BV v_" + n.str + "=" + e + "; (void)v_" + n.str + ";"); }
        break;
      }
      case "ASSIGN": {
        if (n.kids[0].type === "IDENT") {
          var e2 = lowerExpr(E, n.kids[1], null);
          if (!E.declared[n.kids[0].str]) { E.declared[n.kids[0].str] = true; E.push("  BV v_" + n.kids[0].str + "=" + e2 + ";"); }
          else E.push("  v_" + n.kids[0].str + "=" + e2 + ";");
        }
        break;
      }
      case "PRINT": {
        var parts = [];
        for (var i = 0; i < n.kids.length; i++) parts.push(lowerExpr(E, n.kids[i], null));
        var stmt = "  ";
        for (var j = 0; j < parts.length; j++) {
          stmt += "bprint(" + parts[j] + ");";
          if (j < parts.length - 1) stmt += 'printf(" ");';
        }
        stmt += 'printf("\\n");';
        E.push(stmt);
        break;
      }
      case "OMEGA_DB": case "REVISER":
        if (n.body) for (var k = 0; k < n.body.kids.length; k++) lowerStmt(E, n.body.kids[k]);
        break;
      case "GRAMMAR":
        E.push("  /* grammar transaction: " + n.rules.map(function (r) { return r.name; }).join(", ") + " (resolved before lowering) */");
        break;
      case "BLOCK":
        for (var l = 0; l < n.kids.length; l++) lowerStmt(E, n.kids[l]);
        break;
      case "FUNC": case "STRUCT": case "ASPERAL":
        E.push("  /* decl '" + (n.str || "?") + "' specialised at compile time (interp register) */");
        break;
      case "IF": {
        var c = lowerExpr(E, n.kids[0], null);
        E.push("  if(bnumof(" + c + ")!=0){");
        lowerStmt(E, n.kids[1]);
        E.push("  }");
        if (n.kids.length > 2) { E.push("  else {"); lowerStmt(E, n.kids[2]); E.push("  }"); }
        break;
      }
      case "WHILE": {
        var wc = lowerExpr(E, n.kids[0], null);
        E.push("  while(bnumof(" + wc + ")!=0){");
        lowerStmt(E, n.kids[1]);
        E.push("  }");
        break;
      }
      case "FOR":
        E.push("  /* 'for' outside the transpiled subset (runs in the interpreter) */");
        break;
      default: {
        var ex = lowerExpr(E, n, null);
        E.push("  (void)(" + ex + ");");
      }
    }
  }

  function transpileToC(program) {
    var E = new Emitter();
    var body = [];
    E.lines = body;
    for (var i = 0; i < program.kids.length; i++) lowerStmt(E, program.kids[i]);
    return C_RUNTIME + "\nint main(void){\n" + body.join("\n") + "\n  return 0;\n}\n";
  }

  /* ------------------------------------------------------------------ *
   * AST / token dumps (for the IDE's inspector panes)
   * ------------------------------------------------------------------ */
  function dumpAst(n, d, out) {
    var pad = new Array(d + 1).join("  ");
    var s = pad + n.type.toLowerCase();
    if (n.str) s += " '" + n.str + "'";
    if (n.type === "INT" || n.type === "FLOAT") s += " " + n.num;
    if (n.params && n.params.length) s += " |" + n.params.join(",") + "|";
    out.push(s);
    for (var i = 0; i < n.kids.length; i++) dumpAst(n.kids[i], d + 1, out);
    if (n.body) dumpAst(n.body, d + 1, out);
  }

  /* ------------------------------------------------------------------ *
   * Public API
   * ------------------------------------------------------------------ */
  return {
    VERSION: VERSION,
    tokenize: tokenize,
    parse: parseProgram,
    tokens: function (src) {

    },
    ast: function (src) {
      var p = parseProgram(src);
      var out = [];
      dumpAst(p.program, 0, out);
      return { text: out.join("\n"), errors: p.errors };
    },
    run: function (src, opts) {
      opts = opts || {};
      var lines = [];
      var p = parseProgram(src);
      var interp = new Interp({
        out: function (s) { lines.push(s); if (opts.out) opts.out(s); },
        maxSteps: opts.maxSteps
      });
      var ok = true, error = null;
      try {
        interp.exec(p.program, interp.global);
      } catch (e) {
        ok = false;
        error = String(e && e.message ? e.message : e);
        lines.push("[runtime error] " + error);
      }
      return {
        ok: ok && p.errors.length === 0,
        output: lines.join("\n"),
        parseErrors: p.errors,
        error: error,
        ledgerLen: interp.ledger.facts.length,
        rules: p.ruleLedger.map(function (r) { return r.name + " (" + r.head + ")"; })
      };
    },
    emitC: function (src) {
      var p = parseProgram(src);
      var c = transpileToC(p.program);
      return { ok: p.errors.length === 0, c: c, errors: p.errors };
    }
  };

/* ==== zone:// runtime library + site (inlined) ==== */
var ZONE_LIB = "# ============================================================\n# zone-lib.bada -- the zone:// ultra-network runtime as a Bada\n# LIBRARY (functions only, no demo output), so a dedicated\n# browser can drive one navigation at a time.\n#\n# The browser generates, per navigation:\n#     <this library>\n#     NET := zone_boot()\n#     zone_publish(NET, url, content)   # for every page of the site\n#     zone_serve(NET, requested_url)    # emits a machine-parseable block\n#\n# Security is the Jones-polynomial quantum cipher of\n# omega_jones_crypto_pkg (knot -> Kauffman/Jones key -> AEAD) plus a\n# Bell-pair QKD session salt, exactly as in examples/zone.bada.\n# ============================================================\n\nRING := 4096\n\n# UltraDatabase replication factor: Omega.DATABASE[first, second, third,\n# fourth] -- every zone record is mirrored across the 4 nearest peers on\n# the ring, so there is no single point of failure and a forged replica\n# is out-voted (and healed) by the honest quorum.\nREPLICAS := 4\n\n# ---- L1 sponge: zone:// naming --------------------------------------\ndef str_hash(s) {\n    h := 7\n    i := 0\n    n := len(s)\n    while (i < n) { h := (h * 31 + ord(s, i)) % 999983; i := i + 1 }\n    return h\n}\ndef zone_id(s) { return str_hash(s) % RING }\n\ndef zone_parse(url) {\n    if (str_find(url, \"zone://\") != 0) { return [] }\n    rest := substr(url, 7, len(url) - 7)\n    cut := str_find(rest, \"/\")\n    if (cut < 0) { return [rest, \"/\", split(rest, \".\")] }\n    host := substr(rest, 0, cut)\n    path := substr(rest, cut, len(rest) - cut)\n    return [host, path, split(host, \".\")]\n}\n\n# ---- L3 key schedule: Jones-polynomial quantum cipher ---------------\ndef ipow(base, e) {\n    if (e < 0) {\n        r := 1.0\n        k := 0\n        m := 0 - e\n        while (k < m) { r := r * base; k := k + 1 }\n        return 1.0 / r\n    }\n    r := 1.0\n    k := 0\n    while (k < e) { r := r * base; k := k + 1 }\n    return r\n}\ndef uf_find(parent, x) {\n    r := x\n    while (parent[r] >= 0) { r := parent[r] }\n    return r\n}\ndef kauffman(cross, A) {\n    n := len(cross)\n    if (n == 0) { return 1.0 }\n    maxlbl := 0\n    i := 0\n    while (i < n) {\n        k := 1\n        while (k <= 4) {\n            if (cross[i][k] > maxlbl) { maxlbl := cross[i][k] }\n            k := k + 1\n        }\n        i := i + 1\n    }\n    U := maxlbl + 1\n    states := 1\n    p := 0\n    while (p < n) { states := states * 2; p := p + 1 }\n    d := (0 - (A * A)) - (1.0 / (A * A))\n    sum := 0.0\n    bits := []\n    i := 0\n    while (i < n) { bits <- 0; i := i + 1 }\n    st := 0\n    while (st < states) {\n        parent := []\n        q := 0\n        while (q < U) { parent <- (0 - 1); q := q + 1 }\n        a_cnt := 0\n        b_cnt := 0\n        i := 0\n        while (i < n) {\n            e0 := cross[i][1]\n            e1 := cross[i][2]\n            e2 := cross[i][3]\n            e3 := cross[i][4]\n            if (bits[i] == 0) {\n                ra := uf_find(parent, e0)\n                rb := uf_find(parent, e1)\n                if (ra != rb) { parent[ra] = rb }\n                ra := uf_find(parent, e2)\n                rb := uf_find(parent, e3)\n                if (ra != rb) { parent[ra] = rb }\n                a_cnt := a_cnt + 1\n            } else {\n                ra := uf_find(parent, e1)\n                rb := uf_find(parent, e2)\n                if (ra != rb) { parent[ra] = rb }\n                ra := uf_find(parent, e3)\n                rb := uf_find(parent, e0)\n                if (ra != rb) { parent[ra] = rb }\n                b_cnt := b_cnt + 1\n            }\n            i := i + 1\n        }\n        seen := []\n        q := 0\n        while (q < U) { seen <- 0; q := q + 1 }\n        loops := 0\n        lbl := 0\n        while (lbl < U) {\n            r := uf_find(parent, lbl)\n            if (seen[r] == 0) { seen[r] = 1; loops := loops + 1 }\n            lbl := lbl + 1\n        }\n        weight := ipow(A, a_cnt - b_cnt)\n        lf := ipow(d, loops - 1)\n        sum := sum + weight * lf\n        c := 0\n        carry := 1\n        while (c < n && carry == 1) {\n            if (bits[c] == 0) { bits[c] = 1; carry := 0 }\n            else { bits[c] = 0 }\n            c := c + 1\n        }\n        st := st + 1\n    }\n    return sum\n}\ndef jones_key(diagram) {\n    As := [0.8, 1.0, 1.2, 1.5, 2.0]\n    acc := \"jones|\"\n    i := 0\n    while (i < len(As)) { acc := acc + f5(kauffman(diagram, As[i])) + \"|\"; i := i + 1 }\n    return str_hash(acc)\n}\ndef zone_diagram(host) {\n    if (host == \"bada.or.jp\") {\n        return [ [0,1,2,3,4,1], [1,3,4,5,6,1], [2,5,6,7,8,1], [3,7,8,1,2,1] ]\n    }\n    return [ [0,1,2,3,4,1], [1,3,4,5,6,1], [2,5,6,1,2,1] ]\n}\n\n# ---- keystream AEAD -------------------------------------------------\ndef lcg(state) { return (state * 48271) % 2147483647 }\ndef key_seed(key, salt) {\n    state := (key + salt * 2654435761) % 2147483647\n    if (state <= 0) { state := state + 2147483646 }\n    return state\n}\n# the keystream works on 16-bit code units so any character (incl. CJK)\n# round-trips through encrypt/decrypt.\ndef zone_encrypt(plain, key, salt) {\n    state := key_seed(key, salt)\n    out := []\n    i := 0\n    while (i < len(plain)) {\n        state := lcg(state)\n        out <- (ord(plain, i) + (state % 65536)) % 65536\n        i := i + 1\n    }\n    return out\n}\ndef zone_decrypt(ct, key, salt) {\n    state := key_seed(key, salt)\n    out := \"\"\n    i := 0\n    while (i < len(ct)) {\n        state := lcg(state)\n        out := out + chr((ct[i] - (state % 65536) + 65536) % 65536)\n        i := i + 1\n    }\n    return out\n}\ndef zone_tag(ct, key, salt) {\n    h := (key % 999983) + salt + 1\n    i := 0\n    while (i < len(ct)) { h := (h * 31 + ct[i] + 7) % 2147483647; i := i + 1 }\n    return h\n}\ndef zone_seal(plain, key, salt) {\n    ct := zone_encrypt(plain, key, salt)\n    return [ct, salt        moved := false\n        nb := peer_neighbors(net, cur)\n        best := cur\n        j := 0\n        while (j < 3) {\n            if (ring_dist(nb[j][1], key) < ring_dist(best[1], key)) { best := nb[j] }\n            j := j + 1\n        }\n        if (best[1] != cur[1]) { cur := best; route <- cur[0]; moved := true }\n        hop := hop + 1\n    }\n    return route\n}\ndef store_lookup(store, url) {\n    i := 0\n    while (i < len(store)) {\n        if (store[i][0] == url) { return store[i] }\n        i := i + 1\n    }\n    return []\n}\n\n# ---- UltraDatabase: the REPLICAS nearest peers (Omega.DATABASE[1..4]) -\ndef dht_replicas(net, key) {\n    used := []\n    i := 0\n    while (i < len(net)) { used <- 0; i := i + 1 }\n    order := []\n    r := 0\n    while (r < REPLICAS && r < len(net)) {\n        best := 0 - 1\n        bd := 0\n        j := 0\n        while (j < len(net)) {\n            if (used[j] == 0) {\n                d := ring_dist(net[j][1], key)\n                if (best < 0) { best := j; bd := d }\n                else { if (d < bd) { best := j; bd := d } }\n            }\n            j := j + 1\n        }\n        used[best] = 1\n        order <- net[best]\n        r := r + 1\n    }\n    return order\n}\n\n# ---- boot the ultra network (six peers, no server) ------------------\ndef zone_boot() {\n    raw := []\n    raw <- peer_new(\"tokyo.zone.jp\")\n    raw <- peer_new(\"osaka.zone.jp\")\n    raw <- peer_new(\"nagoya.zone.jp\")\n    raw <- peer_new(\"sapporo.zone.jp\")\n    raw <- peer_new(\"fukuoka.zone.jp\")\n    raw <- peer_new(\"naha.zone.jp\")\n    return net_sort(raw)\n}\n\n# deep-copy a ciphertext (byte) array so each replica is independent\ndef arr_copy(a) {\n    out := []\n    i := 0\n    while (i < len(a)) { out <- a[i]; i := i + 1 }\n    return out\n}\n\n# ---- write one sealed record into a peer's store (insert or overwrite)\n# Each replica keeps its OWN copy of the ciphertext (arrays are references),\n# so tampering with one replica cannot silently corrupt the others.\ndef store_put(owner, url, sealed) {\n    ct := arr_copy(sealed[0])\n    rec := store_lookup(owner[2], url)\n    if (len(rec) == 0) { owner[2] <- [url, ct, sealed[1], sealed[2]] }\n    else { rec[1] = ct; rec[2] = sealed[1]; rec[3] = sealed[2] }\n}\n\n# ---- publish (encrypted, replicated across the UltraDatabase quorum) --\ndef zone_publish(net, url, content) {\n    p := zone_parse(url)\n    if (len(p) == 0) { return false }\n    host := p[0]\n    key := zone_id(url)\n    jk := jones_key(zone_diagram(host))\n    sess := qkd_session()\n    salt := sess[1]\n    sealed := zone_seal(content, jk, salt)\n    reps := dht_replicas(net, key)\n    i := 0\n    while (i < len(reps)) { store_put(reps[i], url, sealed); i := i + 1 }\n    return true\n}\n\n# ---- serve one navigation: emit a machine-parseable block -----------\n# The dedicated browser reads only lines beginning with \"@@\".\ndef zone_serve(net, url) {\n    p := zone_parse(url)\n    if (len(p) == 0) {\n        print(\"@@STATUS 400\")\n        print(\"@@BODY_BEGIN\")\n        print(\"# 400 bad-zone\")\n        print(\"not a zone:// URL\")\n        print(\"@@BODY_END\")\n        return \"\"\n    }\n    host := p[0]\n    key := zone_id(url)\n    route := zone_route(net, key)\n    owner := dht_nearest(net, key)\n    print(\"@@HOST\", host)\n    print(\"@@PATH\", p[1])\n    print(\"@@KEY\", key)\n    print(\"@@ROUTE\", route)\n    print(\"@@NODE\", owner[0])\n    sess := qkd_session()\n    if (!sess[0]) {\n        print(\"@@QKD compromised\")\n        print(\"@@STATUS 495\")\n        print(\"@@BODY_BEGIN\")\n        print(\"# 495 quantum-channel-compromised\")\n        print(\"the Bell pair lost correlation -- someone is on the wire\")\n        print(\"@@BODY_END\")\n        return \"\"\n    }\n    print(\"@@QKD ok\")\n    jk := jones_key(zone_diagram(host))\n    reps := dht_replicas(net, key)\n    total := len(reps)\n\n    # --- UltraDatabase quorum read: verify every replica's AEA EY\", jk)\n    print(\"@@QUORUM\", good, total)\n    print(\"@@REPAIRED\", repaired)\n    print(\"@@STATUS 200\")\n    print(\"@@BODY_BEGIN\")\n    print(body)\n    print(\"@@BODY_END\")\n    return body\n}\n\n# ====================================================================\n# cognitive_system search (the earlier ultranetwork's emerge_equation /\n# manifold_scan, fused in): decrypt the Akashic index, score each page by\n# keyword overlap, then reweight the scores through the phase core\n# (softmax = |psi|^2) into a relevance distribution and rank it.\n# ====================================================================\ndef lower_one(cc) {\n    if (cc >= 65 && cc <= 90) { return cc + 32 }\n    return cc\n}\n# count case-insensitive occurrences of needle in hay (both lowercased)\ndef count_occ(hay, needle) {\n    nl := len(needle)\n    if (nl == 0) { return 0 }\n    c := 0\n    i := 0\n    while (i + nl <= len(hay)) {\n        k := 0\n        match := true\n        while (k < nl && match) {\n            if (lower_one(ord(hay, i + k)) != lower_one(ord(needle, k))) { match := false }\n            k := k + 1\n        }\n        if (match) { c := c + 1 }\n        i := i + 1\n    }\n    return c\n}\ndef score_text(text, terms) {\n    s := 0.0\n    t := 0\n    while (t < len(terms)) {\n        s := s + count_occ(text, terms[t])\n        t := t + 1\n    }\n    return s\n}\n# read (quorum) and decrypt one url's plaintext, or \"\" if unavailable\ndef zone_read_plain(net, url) {\n    p := zone_parse(url)\n    if (len(p) == 0) { return \"\" }\n    jk := jones_key(zone_diagram(p[0]))\n    reps := dht_replicas(net, zone_id(url))\n    i := 0\n    while (i < len(reps)) {\n        rec := store_lookup(reps[i][2], url)\n        if (len(rec) > 0) {\n            opened := zone_open([ rec[1], rec[2], rec[3] ], jk)\n            if (len(opened) > 0) { return opened[0] }\n        }\n        i := i + 1\n    }\n    return \"\"\n}\ndef zone_search(net, urls, query) {\n    terms := split(query, \" \")\n    logits := []\n    raw := []\n    i := 0\n    while (i < len(urls)) {\n        sc := score_text(zone_read_plain(net, urls[i]), terms)\n        raw <- sc\n        # map a raw hit-count to a logit; misses fall far below (ruled out)\n        if (sc > 0) { logits <- sc } else { logits <- (0 - 40.0) }\n        i := i + 1\n    }\n    # phase core: relevance = |psi|^2 = softmax(logits) (cognitive_system)\n    rel := cognitive_system(logits, [], [])\n    print(\"@@SEARCH_QUERY\", query)\n    print(\"@@SEARCH_ENTROPY\", entropy(rel))\n    # rank by relevance (selection sort over indices), emit hits only\n    used := []\n    i := 0\n    while (i < len(urls)) { used <- 0; i := i + 1 }\n    ranked := 0\n    while (ranked < len(urls)) {\n        best := 0 - 1\n        bv := 0\n        j := 0\n        while (j < len(urls)) {\n            if (used[j] == 0) {\n                if (best < 0) { best := j; bv := rel[j] }\n                else { if (rel[j] > bv) { best := j; bv := rel[j] } }\n            }\n            j := j + 1\n        }\n        used[best] = 1\n        if (raw[best] > 0) { print(\"@@HIT\", f5(rel[best]), urls[best]) }\n        ranked := ranked + 1\n    }\n    print(\"@@SEARCH_DONE\")\n    return \"\"\n}\n";
var ZONE_SITE = {"zone://url.or.jp/":"# Ultra Network\n## サーバーもDNSも無い、もう一つのWWW\nzone:// は https:/http: に代わる、ウルトラネットワークのWWWスキームです。中央サーバも DNS ルートも無く、ページはピア同士の P2P リング (DHT) だけで解決され、Jones 多項式量子暗号で端から端まで保護されます。\n## この専用ブラウザについて\nアドレスバーに zone:// のアドレスを入力すると、ピアのハッシュから構築されたリングを辿ってページを持つノードを探し、Bell 対 QKD でセッション鍵を合意し、結び目から導いた鍵で本文を復号して表示します。\n## サイトを見て回る\n-> zone://url.or.jp/labs/quantum | 量子ラボ — 位相コア上の量子計算\n-> zone://url.or.jp/security | セキュリティ — Jones量子暗号の仕組み\n-> zone://url.or.jp/about | このネットワークについて\n-> zone://bada.or.jp/ | Bada 言語ポータル (別ゾーン・別の結び目鍵)\n-> zone://ghost.or.jp/nowhere | 存在しないゾーン (404 のデモ)","zone://url.or.jp/labs/quantum":"# 量子ラボ\n## qubit がゾーンを流れる\nこのゾーンは Bada の量子サブ言語で書かれています。qubit(n) でレジスタを作り、H・X・S・T・Rz・CNOT の各ゲートは位相コミット、Measure は追記専用レジャーへのコミットです。\n## 零の保存\n禁制状態 (振幅ゼロ) は位相ステップを通しても厳密にゼロのまま保たれます。これがウルトラネットワークの改ざん検知の土台になっています。\n-> zone://url.or.jp/ | ← ホームに戻る\n-> zone://url.or.jp/security | セキュリティの詳細へ","zone://url.or.jp/security":"# セキュリティ — Jones 多項式量子暗号\n## 鍵は結び目から生まれる\n各ゾーンの長期鍵は、そのゾーン固有の結び目図の Kauffman ブラケット / Jones 多項式を複数の変数値で標本化してハッシュすることで導出されます。結び目がゾーンの秘密、多項式がその鍵スケジュールです。\n## QKD と AEAD\nBell 対 (H+CNOT+Measure) がセッションごとのソルトを合意し、本文は Jones 鍵とソルトから作った鍵ストリームで暗号化、鍵付き認証タグで封緘されます。改ざんや誤った結び目はタグ照合に失敗し 409 zone-guard-reject になります。\n## 右のパネルを見てください\nこのページ自体も暗号化されて届いています。右のセキュリティパネルに DHT 鍵・経路・Jones 鍵・AEAD タグ・暗号文の先頭バイトが表示されています。\n-> zone://url.or.jp/ | ← ホームに戻る","zone://url.or.jp/about":"# このネットワークについて\nウルトラネットワークは、山口フレームワークの TupleSpace / Akashic レコードの発想を土台にした、サーバーレスな次世代 WWW の構想です。すべてのページ・取得・測定は追記専用の台帳 (Akashic ゾーン台帳) に事実として刻まれます。\n## 特徴\n中央の権威が無いこと、単一障害点が無いこと、通信が量子暗号で守られること。zone:// はその入口です。\n-> zone://url.or.jp/ | ← ホームに戻る\n-> zone://bada.or.jp/ | Bada 言語ポータルへ","zone://bada.or.jp/":"# Bada 言語ポータル\nこのゾーンは url.or.jp とは別の結び目 (8の字結び目) を鍵に使う、独立したゾーンです。別の鍵で暗号化されているため、右パネルの Jones 鍵が先ほどのゾーンと異なることを確認できます。\n## Bada とは\nプログラムそのものがレジャーの事実になる量子プログラミング言語です。zone:// のランタイム全体もこの Bada 言語だけで書かれています。\n-> zone://bada.or.jp/download | ダウンロード\n-> zone://url.or.jp/ | url.or.jp ホームへ戻る","zone://bada.or.jp/download":"# ダウンロード\nこの ZoneBrowser 自体が単一 HTML ファイルとして配布されています。ダウンロードしてブラウザで開くだけで、サーバー無しにウルトラネットワークを閲覧できます。\n## 入手方法\nリポジトリの bada_gui_ide/dist/zone-browser.html、またはリリースの配布 zip から入手できます。\n-> zone://bada.or.jp/ | ← Bada ポータルに戻る"};
</script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var urlInput = $("url"), pageEl = $("page"), secEl = $("secbody"), rawEl = $("rawpre");

  /* ---- history ---- */
  var hist = [], hi = -1;

  function badaLiteral(s) { return JSON.stringify(String(s)); }

  /* build the per-navigation Bada program and run the zone runtime */
  function resolve(url) {
    var prog = ZONE_LIB + "\nNET := zone_boot()\n";
    for (var u in ZONE_SITE) if (Object.prototype.hasOwnProperty.call(ZONE_SITE, u))
      prog += "zone_publish(NET, " + badaLiteral(u) + ", " + badaLiteral(ZONE_SITE[u]) + ")\n";
    prog += "zone_serve(NET, " + badaLiteral(url) + ")\n";
    var lines = [];
    var r = BadaLang.run(prog, { maxSteps: 20000000, out: function (s) { lines.push(s); } });
    return { ok: r.ok, out: lines.join("\n"), ledger: r.ledgerLen };
  }

  /* parse the @@ block emitted by zone_serve */
  function parseBlock(text) {
    var meta = { status: "?", host: "", path: "", key: "", route: "", node: "",
                 qkd: "", cipher: "", tag: "", jones: "", quorum: "", repaired: "", body: "" };
    var lines = text.split("\n"), body = [], inBody = false;
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (ln === "@@BODY_BEGIN") { inBody = true; continue; }
      if (ln === "@@BODY_END") { inBody = false; continue; }
      if (inBody) { body.push(ln); continue; }
      if (ln.indexOf("@@") !== 0) continue;
      var sp = ln.indexOf(" ");
      var key = (sp < 0 ? ln : ln.slice(0, sp)).slice(2);
      var val = sp < 0 ? "" : ln.slice(sp + 1);
      if (key === "STATUS") meta.status = val;
      else if (key === "HOST") meta.host = val;
      else if (key === "PATH") meta.path = val;
      else if (key === "KEY") meta.key = val;
      else if (key === "ROUTE") meta.route = val;
      else if (key === "NODE") meta.node = val;
      else if (key === "QKD") meta.qkd = val;
      else if (key === "CIPHER") meta.cipher = val;
      else if (key === "TAG") meta.tag = val;
      else if (key === "JONESKEY") meta.jones = val;
      else if (key === "QUORUM") meta.quorum = val;
      else if (key === "REPAIRED") meta.repaired = val;
    }
    meta.body = body.join("\n");
    return meta;
  }

  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  /* render the zone page markup:
       # Title            -> h1
       ## Section         -> h2
       -> zone://... | L  -> clickable link
       (blank)            -> paragraph break
       text               -> paragraph                                         */
  function renderPage(meta) {
    if (meta.status !== "200") {
      var cls = "bad";
      pageEl.innerHTML =
        '<h1 class="doc">' + esc(meta.status) + '</h1>' +
        '<p class="doc"><span class="pill ' + cls + '">zone error</span></p>' +
        renderBody(meta.body);
      return;
    }
    var healPill = (meta.repaired && meta.repaired !== "0")
      ? '<span class="pill ok">self-healed ' + esc(meta.repaired) + ' replica</span>' : '';
    pageEl.innerHTML =
      '<p class="doc"><span class="pill ok">🔒 200 zone-delivered</span>' +
      '<span class="pill ok">Jones-AEAD verified</span>' +
      '<span class="pill ok">QKD ' + esc(meta.qkd) + '</span>' +
      '<span class="pill ok">UltraDB quorum ' + esc(meta.quorum || "—") + '</span>' + healPill + '</p>' +
      renderBody(meta.body);
    /* wire up clickable zone links */
    var links = pageEl.querySelectorAll("a.zlink");
    for (var i = 0; i < links.length; i++) {
      links[i].addEventListener("click", function (e) {
        e.preventDefault(); navigate(this.getAttribute("data-href"), true);
      });
    }
  }

  function renderBody(body) {
    var out = [], lines = body.split("\n"), h1done = false;
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i].replace(/\s+$/,"");
      if (ln === "") continue;
      var m;
      if ((m = /^##\s+(.*)$/.exec(ln))) { out.push('<h2 class="doc">' + esc(m[1]) + '</h2>'); continue; }
      if ((m = /^#\s+(.*)$/.exec(ln))) {
        if (!h1done) { out.push('<h1 class="doc">' + esc(m[1]) + '</h1>'); h1done = true; }
        else out.push('<h2 class="doc">' + esc(m[1]) + '</h2>');
        continue;
      }
      if ((m = /^->\s*(\S+)\s*\|\s*(.*)$/.exec(ln))) {
        out.push('<p class="doc"><a class="zlink" data-href="' + esc(m[1]) + '" href="#">' + esc(m[2]) + '</a> ' +
                 '<small style="color:var(--dim)">' + esc(m[1]) + '</small></p>');
        continue;
      }
      out.push('<p class="doc">' + esc(ln) + '</p>');
    }
    return out.join("");
  }

  function renderSecurity(meta, ledger) {
    var errCls = meta.status === "200" ? "status-200" : "status-err";
    function kv(k, v) { return '<div class="kv"><b>' + k + '</b><span>' + esc(v || "—") + '</span></div>'; }
    secEl.innerHTML =
      '<div class="big ' + errCls + '">status ' + esc(meta.status) + '</div>' +
      kv("host", meta.host) +
      kv("path", meta.path) +
      kv("DHT key", meta.key) +
      kv("owner node", meta.node) +
      kv("route", meta.route) +
      kv("QKD (Bell)", meta.qkd) +
      kv("Jones key", meta.jones) +
      kv("AEAD tag", meta.tag) +
      kv("cipher[0..2]/len", meta.cipher) +
      kv("UltraDB quorum", meta.quorum) +
      kv("self-healed", meta.repaired) +
      kv("Akashic ledger", ledger + " facts");
  }

  /* ---- cognitive_system search over the whole zone ---- */
  function runSearch(query) {
    query = String(query).trim();
    if (!query) return;
    var urls = [];
    for (var u in ZONE_SITE) if (Object.prototype.hasOwnProperty.call(ZONE_SITE, u)) urls.push(u);
    var prog = ZONE_LIB + "\nNET := zone_boot()\n";
    for (var k = 0; k < urls.length; k++)
      prog += "zone_publish(NET, " + badaLiteral(urls[k]) + ", " + badaLiteral(ZONE_SITE[urls[k]]) + ")\n";
    var arr = "[" + urls.map(badaLiteral).join(", ") + "]";
    prog += "zone_search(NET, " + arr + ", " + badaLiteral(query) + ")\n";
    var lines = [];
    BadaLang.run(prog, { maxSteps: 20000000, out: function (s) { lines.push(s); } });
    var out = lines.join("\n");
    rawEl.textContent = out;
    var hits = [], entropy = "";
    var ls = out.split("\n");
    for (var i = 0; i < ls.length; i++) {
      if (ls[i].indexOf("@@SEARCH_ENTROPY ") === 0) entropy = ls[i].slice(17);
      else if (ls[i].indexOf("@@HIT ") === 0) {
        var rest = ls[i].slice(6), sp = rest.indexOf(" ");
        hits.push({ rel: rest.slice(0, sp), url: rest.slice(sp + 1) });
      }
    }
    var html = '<p class="doc"><span class="pill ok">cognitive_system 検索</span>' +
      '<span class="pill ok">relevance entropy ' + esc(entropy) + '</span></p>' +
      '<h1 class="doc">「' + esc(query) + '」の検索結果</h1>';
    if (!hits.length) html += '<p class="doc">一致するゾーンページはありませんでした。</p>';
    for (var h = 0; h < hits.length; h++) {
      html += '<p class="doc"><a class="zlink" data-href="' + esc(hits[h].url) + '" href="#">' + esc(hits[h].url) + '</a> ' +
              '<small style="color:var(--dim)">relevance ' + esc(hits[h].rel) + '</small></p>';
    }
    pageEl.innerHTML = html;
    var links = pageEl.querySelectorAll("a.zlink");
    for (var j = 0; j < links.length; j++)
      links[j].addEventListener("click", function (e) { e.preventDefault(); navigate(this.getAttribute("data-href"), true); });
    setLock(true);
    secEl.innerHTML = '<div class="big status-200">cognitive_system 検索</div>' +
      '<div class="kv"><b>query</b><span>' + esc(query) + '</span></div>' +
      '<div class="kv"><b>relevance entropy</b><span>' + esc(entropy) + '</span></div>' +
      '<div class="kv"><b>hits</b><span>' + hits.length + '</span></div>' +
      '<div class="kv"><b>method</b><span>softmax = |psi|^2 (phase core)</span></div>';
    pageEl.scrollTop = 0;
  }

  function setLock(ok) { $("lock").textContent = ok ? "🔒" : "⚠️"; }

  function navigate(url, push) {
    url = String(url).trim();
    if (url.indexOf("zone://") !== 0) {
      if (url.indexOf("://") < 0) url = "zone://" + url; /* bare host -> zone:// */
    }
    urlInput.value = url;
    var res = resolve(url);
    rawEl.textContent = res.out;
    var meta = parseBlock(res.out);
    setLock(meta.status === "200");
    renderPage(meta);
    renderSecurity(meta, res.ledger);
    if (push) { hist = hist.slice(0, hi + 1); hist.push(url); hi = hist.length - 1; }
    updateNav();
    pageEl.scrollTop = 0;
  }

  function updateNav() {
    $("back").disabled = hi <= 0;
    $("fwd").disabled = hi >= hist.length - 1;
  }

  /* ---- sidebar: bookmarks + peers ---- */
  function buildSidebar() {
    var bm = $("bookmarks"), html = "";
    for (var u in ZONE_SITE) if (Object.prototype.hasOwnProperty.call(ZONE_SITE, u))
      html += '<a data-href="' + esc(u) + '" href="#">' + esc(u) + '</a>';
    bm.innerHTML = html;
    var links = bm.querySelectorAll("a");
    for (var i = 0; i < links.length; i++)
      links[i].addEventListener("click", function (e) { e.preventDefault(); navigate(this.getAttribute("data-href"), true); });
    /* peers: derive from a boot+trace of any navigation's ring (parse from a probe) */
    var probe = resolve("zone://url.or.jp/");
    $("peers").textContent = "6 peers · ring 4096\n(server-less P2P DHT)";
  }

  /* ---- events ---- */
  $("go").addEventListener("click", function () { navigate(urlInput.value, true); });
  urlInput.addEventListener("keydown", function (e) { if (e.key === "Enter") navigate(urlInput.value, true); });
  $("back").addEventListener("click", function () { if (hi > 0) { hi--; navigate(hist[hi], false); } });
  $("fwd").addEventListener("click", function () { if (hi < hist.length - 1) { hi++; navigate(hist[hi], false); } });
  $("reload").addEventListener("click", function () { navigate(urlInput.value, false); });
  $("search").addEventListener("click", function () { runSearch($("q").value); });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") runSearch($("q").value); });

  /* boot */
  buildSidebar();
  navigate("zone://url.or.jp/", true);
})();
</script>
</body>
</html>
