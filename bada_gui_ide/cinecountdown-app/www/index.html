<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Bada 映画カウントダウンエディタ</title>
<style>
:root{
  --bg:#07090d; --panel:#0e1420; --panel2:#0a0f18; --edge:#1d2838;
  --text:#dde6f2; --dim:#8294ac; --accent:#ffcf4a; --accent2:#3cff8e; --cyan:#4fe8ff;
  --mono:"SFMono-Regular",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 16px;border-bottom:1px solid var(--edge);background:linear-gradient(180deg,#0b1220,var(--bg));flex:none;display:flex;align-items:center;gap:12px}
header h1{font-size:16px;color:var(--accent)}
header h1 .ic{margin-right:6px}
header .sub{color:var(--dim);font-size:11.5px}
header .grow{flex:1}
#wrap{flex:1;display:flex;min-height:0}
#side{width:320px;flex:none;border-right:1px solid var(--edge);overflow-y:auto;padding:12px 14px;background:var(--panel2)}
@media(max-width:780px){#wrap{flex-direction:column}#side{width:auto;border-right:none;border-bottom:1px solid var(--edge);max-height:42vh}}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#canvaswrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:0;padding:10px}
canvas{max-width:100%;max-height:100%;background:#000;box-shadow:0 10px 50px #000,0 0 0 1px #1a2535;border-radius:6px}
#transport{flex:none;display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--edge);background:var(--panel)}
#scrub{flex:1}
.grp{margin-bottom:14px}
.grp h2{font-size:11px;color:var(--cyan);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px;border-bottom:1px solid var(--edge);padding-bottom:4px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.row label{color:var(--dim);flex:1}
.row input[type=number],.row input[type=text],.row select{width:110px;font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--edge);border-radius:6px;padding:5px 7px;font-size:12.5px}
.row input[type=text]{width:150px}
.row input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--edge);border-radius:6px;background:none}
.row.chk label{flex:none}
.row.chk{gap:6px}
button{font:inherit;color:#06130a;background:linear-gradient(135deg,#ffd45a,#f0a830);border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:bold;font-size:13px}
button.ghost{background:var(--panel);color:var(--text);border:1px solid var(--edge);font-weight:normal}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
.exp{display:flex;flex-wrap:wrap;gap:7px}
.exp button{font-size:12px;padding:7px 10px}
#time{font-family:var(--mono);font-size:12.5px;color:var(--dim);min-width:120px}
#num{font-family:var(--mono);color:var(--accent);font-weight:bold}
#msg{font-size:12px;color:var(--accent2);min-height:16px;margin-top:6px;font-family:var(--mono)}
.rec{color:#ff6a6a!important}
</style>
</head>
<body>
<header>
  <h1><span class="ic">🎬</span>Bada 映画カウントダウンエディタ</h1>
  <span class="sub">フィルムリーダー (SMPTE) を編集 → 動画/画像で書き出し</span>
  <span class="grow"></span>
  <span class="sub" id="dur"></span>
</header>
<div id="wrap">
  <div id="side">
    <div class="grp">
      <h2>カウント</h2>
      <div class="row"><label>開始番号</label><input type="number" id="c_start" min="1" max="99" value="8"/></div>
      <div class="row"><label>終了番号</label><input type="number" id="c_end" min="1" max="99" value="2"/></div>
      <div class="row"><label>1 番あたり秒</label><input type="number" id="c_step" min="0.2" max="10" step="0.1" value="1"/></div>
      <div class="row"><label>FPS</label><input type="number" id="c_fps" min="1" max="60" value="24"/></div>
      <div class="row"><label>末尾の黒 (秒)</label><input type="number" id="c_hold" min="0" max="10" step="0.1" value="0.5"/></div>
    </div>
    <div class="grp">
      <h2>文字</h2>
      <div class="row"><label>タイトル</label><input type="text" id="c_title" value="BADA PICTURES"/></div>
      <div class="row"><label>サブタイトル</label><input type="text" id="c_subtitle" value=""/></div>
    </div>
    <div class="grp">
      <h2>見た目</h2>
      <div class="row"><label>テーマ</label>
        <select id="c_theme">
          <option value="academy">Academy (白黒)</option>
          <option value="amber">Amber (琥珀)</option>
          <option value="blue">Blue (青)</option>
          <option value="green">Green (蛍光)</option>
          <option value="mono">Mono (純白)</option>
        </select></div>
      <div class="row"><label>背景 / 文字 / 掃引</label>
        <input type="color" id="c_bg" value="#0a0a0a"/>
        <input type="color" id="c_ink" value="#ededed"/>
        <input type="color" id="c_accent" value="#cfcfcf"/>
      </div>
      <div class="row chk"><input type="checkbox" id="c_sweep" checked/><label>掃引ハンド</label>
        <input type="checkbox" id="c_crosshair" checked/><label>十字</label></div>
      <div class="row chk"><input type="checkbox" id="c_grain" checked/><label>グレイン</label>
        <input type="checkbox" id="c_vignette" checked/><label>ビネット</label></div>
      <div class="row chk"><input type="checkbox" id="c_letterbox"/><label>レターボックス</label>
        <input type="checkbox" id="c_flash" checked/><label>フラッシュ</label></div>
    </div>
    <div class="grp">
      <h2>音</h2>
      <div class="row chk"><input type="checkbox" id="c_beep" checked/><label>ビープ</label>
        <input type="checkbox" id="c_beepeach"/><label>各整数で鳴らす</label></div>
      <div class="row"><label>ビープする番号</label><input type="number" id="c_beepat" min="1" max="99" value="2"/></div>
    </div>
    <div class="grp">
      <h2>書き出し</h2>
      <div class="exp">
        <button id="e_webm">🎬 動画 (WebM) 録画</button>
        <button class="ghost" id="e_png">🖼 現在フレーム PNG</button>
        <button class="ghost" id="e_json">💾 設定 JSON</button>
        <button class="ghost" id="e_html">📄 単体HTMLプレーヤー</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>
  <div id="stage">
    <div id="canvaswrap"><canvas id="cv" width="1280" height="720"></canvas></div>
    <div id="transport">
      <button id="play">▶ 再生</button>
      <button class="ghost" id="reset">⏮ 先頭</button>
      <input type="range" id="scrub" min="0" max="1000" value="0"/>
      <span id="time">0.00s · <span id="num">8</span></span>
    </div>
  </div>
</div>

<script src="countdown.js"></script>
<script>
(function(){
  "use strict";
  var CD = window.BadaCountdown;
  var $ = function(id){ return document.getElementById(id); };
  var cv = $("cv"), ctx = cv.getContext("2d");
  var playing = false, t = 0, startClock = 0, startT = 0, raf = null;
  var actx = null, beepIdx = 0, beepSchedule = [];

  function readCfg(){
    return CD.normalize({
      start:+$("c_start").value, end:+$("c_end").value, stepSeconds:+$("c_step").value,
      fps:+$("c_fps").value, holdAfter:+$("c_hold").value,
      title:$("c_title").value, subtitle:$("c_subtitle").value,
      theme:$("c_theme").value,
      colors:{ bg:$("c_bg").value, ink:$("c_ink").value, accent:$("c_accent").value },
      beep:$("c_beep").checked, beepEach:$("c_beepeach").checked, beepAt:+$("c_beepat").value,
      sweep:$("c_sweep").checked, crosshair:$("c_crosshair").checked,
      grain:$("c_grain").checked, vignette:$("c_vignette").checked,
      letterbox:$("c_letterbox").checked, flash:$("c_flash").checked
    });
  }
  var cfg = readCfg();

  function applyThemeToPickers(){
    var th = CD.THEMES[$("c_theme").value]; if(!th) return;
    $("c_bg").value = th.bg; $("c_ink").value = th.ink; $("c_accent").value = th.accent;
  }

  function drawAt(time){
    var st = CD.stateAtTime(cfg, time);
    CD.render(ctx, cv.width, cv.height, st, cfg);
    $("num").textContent = st.phase==="done" ? "●" : st.number;
    $("time").firstChild.nodeValue = time.toFixed(2) + "s · ";
    var total = CD.duration(cfg);
    $("scrub").value = Math.round(total>0 ? (time/total)*1000 : 0);
  }
  function refreshStatic(){
    cfg = readCfg();
    $("dur").textContent = "尺 " + CD.duration(cfg).toFixed(1) + "s · " + CD.totalFrames(cfg) + "F";
    if (t > CD.duration(cfg)) t = 0;
    drawAt(t);
  }

  /* ── 音声 (WebAudio) ── */
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function beepInto(destOrNull, when, freq){
    if(!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type="sine"; o.frequency.value=freq||1000;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.5, when+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when+0.12);
    o.connect(g); g.connect(actx.destination); if(destOrNull) g.connect(destOrNull);
    o.start(when); o.stop(when+0.14);
  }
  function scheduleBeeps(fromT, dest){
    if(!ensureAudio()) return;
    var times = CD.beepTimes(cfg), base = actx.currentTime;
    times.forEach(function(bt){ if(bt>=fromT-0.01){ beepInto(dest||null, base + (bt-fromT), 1000); } });
  }

  /* ── 再生ループ ── */
  function loop(){
    if(!playing) return;
    t = startT + (performance.now()-startClock)/1000;
    var total = CD.duration(cfg);
    if(t >= total){ t = total; drawAt(t); stop(); return; }
    drawAt(t);
    raf = requestAnimationFrame(loop);
  }
  function play(){
    if(playing) return;
    cfg = readCfg();
    if(t >= CD.duration(cfg)) t = 0;
    playing = true; startClock = performance.now(); startT = t;
    $("play").textContent = "⏸ 停止";
    scheduleBeeps(t, null);
    raf = requestAnimationFrame(loop);
  }
  function stop(){
    playing = false; if(raf) cancelAnimationFrame(raf); raf=null;
    $("play").textContent = "▶ 再生";
  }
  $("play").onclick = function(){ playing ? stop() : play(); };
  $("reset").onclick = function(){ stop(); t=0; drawAt(0); };
  $("scrub").addEventListener("input", function(){
    stop(); cfg = readCfg();
    t = (+$("scrub").value/1000)*CD.duration(cfg); drawAt(t);
  });

  /* 入力変更で即反映 */
  ["c_start","c_end","c_step","c_fps","c_hold","c_title","c_subtitle",
   "c_bg","c_ink","c_accent","c_sweep","c_crosshair","c_grain","c_vignette",
   "c_letterbox","c_flash","c_beep","c_beepeach","c_beepat"].forEach(function(id){
    var el = $(id);
    el.addEventListener("input", function(){ if(!playing) refreshStatic(); else cfg=readCfg(); });
    el.addEventListener("change", function(){ if(!playing) refreshStatic(); });
  });
  $("c_theme").addEventListener("change", function(){ applyThemeToPickers(); refreshStatic(); });

  function setMsg(m){ $("msg").textContent = m||""; }
  function download(blob, name){
    var a=document.createElement("a"), url=URL.createObjectURL(blob);
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  /* ── 書き出し ── */
  $("e_png").onclick = function(){
    cv.toBlob(function(b){ if(b){ download(b, "countdown-frame.png"); setMsg("PNG を書き出しました"); } }, "image/png");
  };
  $("e_json").onclick = function(){
    var c = readCfg();
    download(new Blob([JSON.stringify(c,null,2)],{type:"application/json"}), "countdown.json");
    setMsg("設定 JSON を書き出しました");
  };
  $("e_html").onclick = function(){
    var c = readCfg();
    var engine = (window.__countdownSource || "");
    var html = buildStandalone(c, engine);
    download(new Blob([html],{type:"text/html"}), "countdown-player.html");
    setMsg(engine ? "単体HTMLプレーヤー (エンジン同梱) を書き出しました"
                  : "HTMLプレーヤーを書き出しました (同じ場所に countdown.js を置いてください)");
  };
  $("e_webm").onclick = function(){ recordWebM(); };

  var recording = false;
  function recordWebM(){
    if(recording) return;
    if(typeof MediaRecorder==="undefined" || !cv.captureStream){ setMsg("この環境では WebM 録画に未対応です (PNG/HTML をご利用ください)"); return; }
    cfg = readCfg(); stop(); t = 0; ensureAudio();
    var stream = cv.captureStream(cfg.fps);
    var dest = null;
    try { if(actx){ dest = actx.createMediaStreamDestination(); stream.addTrack(dest.stream.getAudioTracks()[0]); } } catch(e){}
    var mime = ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].filter(function(m){ return MediaRecorder.isTypeSupported(m); })[0] || "video/webm";
    var chunks=[], rec;
    try { rec = new MediaRecorder(stream,{mimeType:mime}); }
    catch(e){ setMsg("録画を開始できません: "+e.message); return; }
    rec.ondataavailable = function(ev){ if(ev.data && ev.data.size) chunks.push(ev.data); };
    rec.onstop = function(){
      recording=false; $("e_webm").classList.remove("rec"); $("e_webm").textContent="🎬 動画 (WebM) 録画";
      download(new Blob(chunks,{type:mime.split(";")[0]}), "countdown.webm");
      setMsg("WebM 動画を書き出しました");
    };
    recording=true; $("e_webm").classList.add("rec"); $("e_webm").textContent="● 録画中…";
    setMsg("録画中…");
    scheduleBeeps(0, dest);
    rec.start();
    // 実時間でカウントダウンを描画
    var total = CD.duration(cfg), c0 = performance.now();
    (function rloop(){
      var tt = (performance.now()-c0)/1000;
      if(tt >= total){ drawAt(total); setTimeout(function(){ try{rec.stop();}catch(e){} }, 120); return; }
      t = tt; drawAt(tt); requestAnimationFrame(rloop);
    })();
  }

  function buildStandalone(c, engineSrc){
    var cfgJson = JSON.stringify(c);
    var engineTag = engineSrc ? ("<script>"+engineSrc+"<\/script>")
                              : "<script src='countdown.js'><\/script>";
    return [
"<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>",
"<title>"+(c.title||"Countdown")+" — Bada Countdown</title>",
"<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#c{position:fixed;inset:0;margin:auto;max-width:100%;max-height:100%}",
"#p{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font:bold 20px sans-serif;background:#0008;border:1px solid #fff4;border-radius:10px;padding:14px 22px;cursor:pointer}</style>",
"</head><body><canvas id='c' width='1280' height='720'></canvas><div id='p'>▶ 再生</div>",
engineTag,
"<script>(function(){var CD=window.BadaCountdown,cfg="+cfgJson+";var cv=document.getElementById('c'),x=cv.getContext('2d'),p=document.getElementById('p');",
"function draw(t){CD.render(x,cv.width,cv.height,CD.stateAtTime(cfg,t),cfg);}draw(0);",
"var ac=null;function beeps(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}CD.beepTimes(cfg).forEach(function(bt){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=1000;g.gain.setValueAtTime(0.0001,ac.currentTime+bt);g.gain.exponentialRampToValueAtTime(0.5,ac.currentTime+bt+0.01);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+bt+0.12);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+bt);o.stop(ac.currentTime+bt+0.14);});}",
"p.onclick=function(){p.style.display='none';beeps();var t0=performance.now(),tot=CD.duration(cfg);(function l(){var t=(performance.now()-t0)/1000;if(t>=tot){draw(tot);p.textContent='▶ 再生';p.style.display='block';return;}draw(t);requestAnimationFrame(l);})();};",
"})();<\/script></body></html>"
    ].join("\n");
  }

  /* 単体HTML用にエンジンのソースを取得 (同梱用)。
     Electron ではプリロードの engineSource() (fs 読み込み)、
     http(s) では fetch。file:// のブラウザ プレビューでは取得せず、
     書き出した HTML は隣の countdown.js を参照する形になる (CORS 回避)。 */
  (function fetchEngine(){
    if (window.cineNative && typeof window.cineNative.engineSource === "function"){
      Promise.resolve(window.cineNative.engineSource()).then(function(src){
        if (src && !src.error) window.__countdownSource = typeof src === "string" ? src : src.text;
      }).catch(function(){});
      return;
    }
    if (location.protocol === "http:" || location.protocol === "https:"){
      fetch("countdown.js").then(function(r){ return r.text(); })
        .then(function(src){ window.__countdownSource = src; }).catch(function(){});
    }
  })();

  applyThemeToPickers(); $("c_bg").value="#0a0a0a"; $("c_ink").value="#ededed"; $("c_accent").value="#cfcfcf";
  refreshStatic();
})();
</script>
</body>
</html>
