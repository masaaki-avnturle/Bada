# Calamares 設定 — Bada VM Pro OS を実ディスクへインストール
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id:     bada
  module: welcome
  config: welcome.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - grubcfg
  - packages
  - umount
- show:
  - finished

branding: badaos
prompt-install: true
dont-chroot: false
