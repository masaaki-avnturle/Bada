# squashfs をインストール先へ展開 (casper のライブメディア配置)
---
unpack:
  - source: "/cdrom/casper/filesystem.squashfs"
    sourcefs: "squashfs"
    destination: ""
  # texlive-full 入りでも FAT32 (Rufus ISO モード) に入るよう分割したレイヤ
  - source: "/cdrom/casper/filesystem-tex.squashfs"
    sourcefs: "squashfs"
    destination: ""
  - source: "/cdrom/casper/filesystem-fonts.squashfs"
    sourcefs: "squashfs"
    destination: ""
