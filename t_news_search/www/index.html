<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ch.T — TupleSpace News 速報検索</title>
<style>
:root{--bg:#080a11;--panel:#0d111c;--line:rgba(120,160,230,.14);--red:#ff3b46;--red2:#ff6a72;
 --txt:rgba(228,236,250,.94);--txt2:rgba(150,172,210,.62);--accent:#4a9eff;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif;
 height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}

/* ── ヘッダ（局バグ / 時刻 / LIVE）── */
#top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:9px 16px;background:linear-gradient(180deg,#0e1420,#0a0d16);border-bottom:1px solid var(--line)}
.bug{display:flex;align-items:center;gap:9px}
.bug .ch{font-weight:800;letter-spacing:.02em;background:var(--red);color:#fff;padding:4px 9px;border-radius:5px;font-size:14px;box-shadow:0 0 14px rgba(255,59,70,.4)}
.bug .nm{font-weight:700;letter-spacing:.14em;color:rgba(210,225,255,.9);font-size:12px}
.bug .nm small{display:block;font-weight:400;letter-spacing:.24em;color:var(--txt2);font-size:8px;margin-top:2px}
#clock{font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.08em;color:rgba(200,220,255,.85)}
.live{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--red2)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}

/* ── 検索バー ── */
#searchbar{flex:0 0 auto;padding:12px 16px 8px;border-bottom:1px solid var(--line);background:rgba(10,14,24,.7)}
.srow{display:flex;gap:8px}
#q{flex:1;background:rgba(6,10,20,.9);border:1px solid var(--line);color:var(--txt);border-radius:9px;
 padding:12px 14px;font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
#q:focus{border-color:var(--accent);background:rgba(8,14,30,.95)}
#q::placeholder{color:rgba(130,155,205,.4)}
#go{background:var(--red);color:#fff;border:0;border-radius:9px;padding:0 20px;font-size:14px;font-weight:700;
 letter-spacing:.1em;cursor:pointer;transition:.2s;touch-action:manipulation}
#go:hover{background:#ff5560}
#cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.cat{font-size:11px;padding:6px 12px;border:1px solid var(--line);background:transparent;color:var(--txt2);
 border-radius:20px;cursor:pointer;transition:.18s;touch-action:manipulation}
.cat.on{background:rgba(74,158,255,.16);border-color:var(--accent);color:rgba(160,205,255,.95)}
.cat.hot.on{background:rgba(255,59,70,.16);border-color:var(--red);color:var(--red2)}

/* ── 本体 ── */
#main{flex:1 1 0;display:flex;min-height:0}
#results{flex:1 1 0;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}
#results::-webkit-scrollbar{width:4px}#results::-webkit-scrollbar-thumb{background:rgba(120,160,255,.25)}
#results h2{font-size:10px;letter-spacing:.3em;color:var(--txt2);margin:2px 0 10px;font-weight:600}
.item{border:1px solid var(--line);border-radius:11px;background:rgba(13,18,30,.7);padding:12px 14px;margin-bottom:10px;
 cursor:pointer;transition:.18s}
.item:hover{border-color:rgba(120,160,255,.4);background:rgba(18,26,44,.8)}
.item .hl{display:flex;gap:8px;align-items:flex-start}
.badge{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:5px;margin-top:2px}
.badge.b{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,59,70,.4)}
.badge.n{background:rgba(74,158,255,.18);color:rgba(160,205,255,.9);border:1px solid rgba(74,158,255,.35)}
.item .head{font-size:15px;font-weight:700;line-height:1.5;color:rgba(232,240,255,.97)}
.item .meta{font-size:10.5px;color:var(--txt2);margin-top:7px;letter-spacing:.03em}
.item .meta b{color:rgba(170,200,250,.9)}
.item .body{font-size:12.5px;line-height:1.8;color:rgba(200,216,244,.8);margin-top:10px;
 max-height:0;overflow:hidden;transition:max-height .3s;padding-right:4px}
.item.open .body{max-height:220px}
.item .urg{display:inline-block;height:4px;border-radius:3px;margin-left:8px;vertical-align:middle;
 background:linear-gradient(90deg,var(--accent),var(--red))}

/* ── 放送パネル ── */
#air{flex:0 0 340px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:rgba(9,12,20,.85)}
#air-h{padding:10px 14px;font-size:10px;letter-spacing:.28em;color:var(--txt2);border-bottom:1px solid var(--line)}
#air-canvas-wrap{position:relative;height:210px;flex:0 0 auto;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,rgba(20,28,55,.9),#06080f)}
#air-canvas{position:absolute;inset:0}
#air-lower{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;background:linear-gradient(0deg,rgba(6,9,16,.96),transparent)}
#air-lower .tag{display:inline-block;background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:4px}
#air-lower .txt{font-size:13px;font-weight:700;line-height:1.4;margin-top:6px;color:rgba(235,242,255,.97)}
#air-list{flex:1 1 0;overflow-y:auto;padding:10px 12px}
#air-list::-webkit-scrollbar{width:3px}#air-list::-webkit-scrollbar-thumb{background:rgba(120,160,255,.25)}
.mini{font-size:11.5px;line-height:1.5;color:rgba(200,216,244,.82);padding:8px 0;border-bottom:1px solid rgba(120,160,230,.08);cursor:pointer}
.mini:hover{color:#fff}
.mini .t{color:var(--red2);font-weight:700;font-size:9px;letter-spacing:.06em;margin-right:6px}

/* ── ティッカー ── */
#ticker{flex:0 0 auto;display:flex;align-items:center;background:#0a0d16;border-top:1px solid var(--line);height:36px;overflow:hidden}
#ticker .lbl{flex:0 0 auto;background:var(--red);color:#fff;font-weight:800;font-size:11px;letter-spacing:.1em;
 padding:0 12px;height:100%;display:flex;align-items:center}
#ticker .track{flex:1 1 0;overflow:hidden;white-space:nowrap;position:relative}
#ticker .move{display:inline-block;padding-left:100%;animation:scroll 38s linear infinite;font-size:12.5px;color:rgba(215,228,250,.9)}
#ticker .move span{margin:0 26px}
#ticker .move b{color:var(--red2)}
@keyframes scroll{to{transform:translateX(-100%)}}

#note{flex:0 0 auto;padding:5px 16px;font-size:9px;color:rgba(120,145,190,.5);background:#070910;text-align:center;letter-spacing:.04em}

@media(max-width:820px){
 #air{display:none}
 .item .head{font-size:14px}
}
</style>
</head>
<body>
<div id="top">
  <div class="bug">
    <span class="ch">Ch.T</span>
    <span class="nm">TupleSpace NEWS<small>大域予知報道 · 熱エントロピー速報</small></span>
  </div>
  <div id="clock">--:--:--</div>
  <div class="live"><span class="dot"></span>LIVE 速報</div>
</div>

<div id="searchbar">
  <div class="srow">
    <input id="q" placeholder="探したいニュースを検索（例: 地震 / 経済 / 宇宙 / 選挙）" spellcheck="false">
    <button id="go">検索</button>
  </div>
  <div id="cats"></div>
</div>

<div id="main">
  <div id="results">
    <h2 id="results-title">最新の速報</h2>
    <div id="results-list"></div>
  </div>
  <div id="air">
    <div id="air-h">ON AIR — 放送中</div>
    <div id="air-canvas-wrap">
      <canvas id="air-canvas"></canvas>
      <div id="air-lower"><span class="tag">速報</span><div class="txt" id="air-txt">—</div></div>
    </div>
    <div id="air-list"></div>
  </div>
</div>

<div id="ticker">
  <div class="lbl">速報</div>
  <div class="track"><div class="move" id="ticker-move"></div></div>
</div>
<div id="note">※ 本アプリの「速報」は Bada 熱エントロピー多様体エンジンが生成する架空のニュースです（実在の報道・団体・人物とは関係ありません）。Ch.T は架空の放送局です。</div>

<script>
// ═══════════════════════════════════════════════════════════════
// Bada 数理エンジン（ガンマ / ζ ゲージ / 大域的部分積分多様体）— 緊急度 Ξ
// ═══════════════════════════════════════════════════════════════
const Bada=(()=>{
 const G=7,C=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,
  -176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
 function gamma(x){if(x===0)return Infinity;if(x<0.5)return Math.PI/(Math.sin(Math.PI*x)*gamma(1-x));
  x-=1;let a=C[0];const t=x+G+0.5;for(let i=1;i<G+2;i++)a+=C[i]/(x+i);
  return Math.sqrt(2*Math.PI)*Math.pow(t,x+0.5)*Math.exp(-t)*a;}
 const lg=x=>Math.log(Math.abs(gamma(x)));
 const beta=(p,q)=>Math.exp(lg(p)+lg(q)-lg(p+q));
 const xLogX=x=>x<=0?0:x*Math.log(x);
 function element(x){if(x<=1)return 1;const xl=xLogX(x);if(Math.abs(xl)<1e-9)return 1;return 1/(xl*xl);}
 function zetaGauge(p,q,x){const lx=Math.log(x);if(Math.abs(lx)<1e-12)return beta(p,q);return beta(p,q)/lx;}
 const GEOM=[['S^3',1],['H^1×E^1',-0.5],['E^1',0],['S^1×E^1',0.3],['S^2×E^1',0.6],['H^1×S^1',-0.3],['H^1',-1],['S^2×E',0.5]];
 return{gamma,element,zetaGauge,GEOM};
})();

// ═══════════════════════════════════════════════════════════════
// 速報生成（熱エントロピー多様体エンジン）— 検索語を織り込み
// ═══════════════════════════════════════════════════════════════
const GEO_CAT={'S^3':'科学','H^1×E^1':'政治','E^1':'社会','S^1×E^1':'国際','S^2×E^1':'気象','H^1×S^1':'経済','H^1':'災害','S^2×E':'社会'};
const GEO_HUE={'S^3':205,'H^1×E^1':28,'E^1':150,'S^1×E^1':265,'S^2×E^1':190,'H^1×S^1':320,'H^1':12,'S^2×E':95};
const SUBJECTS=['政府','中央銀行','国際機関','研究チーム','気象当局','市当局','大手企業','宇宙機関','市民団体','電力会社','医療機関','交通局','証券市場','大学連合'];
const ACTIONS={'政治':['が新方針を発表','が緊急会見を開く','が合意に達する','が法案を提出'],
 '経済':['が過去最高を更新','で急変動を観測','が指標を下方修正','が大型投資を表明'],
 '災害':['に警報を発令','で異常を観測','が避難を呼びかけ','の被害を確認'],
 '国際':['が共同声明を発表','で協議を開始','が制裁を検討','が支援を表明'],
 '科学':['が新発見を報告','が観測に成功','が理論を提唱','が実証実験を開始'],
 '気象':['が記録的数値を観測','に特別警報','の予報を更新','で前線が停滞'],
 '社会':['で新制度を導入','が調査結果を公表','が対応を強化','が再開を決定']};
const PLACES=['首都圏','沿岸部','全国','国際市場','上空','地下網','情報圏','極地','都市中枢','広域','群衆','電力網'];
const TOPICS=['大域積分多様体','熱エントロピー','ゼータ変動','ガンマ収束','量子場','気候','経済指標','宇宙観測','ネットワーク','エネルギー','安全保障','医療'];

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function genItem(query,i){
 const q=(query||'').trim();
 const H=hashStr('T-news|'+q+'|'+i);
 const frac=(H%100000)/100000;
 const g=Bada.GEOM[Math.floor(frac*8)%8];
 const geo=g[0], cat=GEO_CAT[geo], hue=GEO_HUE[geo];
 const subj=SUBJECTS[(H>>>3)%SUBJECTS.length];
 const acts=ACTIONS[cat]||ACTIONS['社会'];
 const act=acts[(H>>>7)%acts.length];
 const place=PLACES[(H>>>11)%PLACES.length];
 const topic=q?q:TOPICS[(H>>>15)%TOPICS.length];
 const hd=0.8+frac*3.0, md=Bada.element(2+((H>>>5)%50)/10);
 const xi=Bada.zetaGauge(hd+1,md+1,6+((H>>>9)%40));   // 緊急度 Ξ（ガンマ関数ベース）
 const ageMin=(H>>>13)%720;                            // 0〜12時間前
 const breaking=ageMin<9 || xi>0.15;
 const headline=`${place}の${subj}、「${topic}」${act}`;
 const body=`「${topic}」をめぐり、${place}の${subj}が${act}。Ch.T が大域的部分積分多様体で解析したところ、`+
  `世界熱エントロピー由来の緊急度は Ξ=${xi.toFixed(3)}（多様体幾何 ${geo}）。関係各所が対応を進めており、続報が入り次第お伝えします。`;
 return {topic,cat,subj,act,place,geo,hue,xi,ageMin,breaking,headline,body};
}
function timeLabel(m){if(m<1)return'たった今';if(m<60)return m+'分前';return Math.floor(m/60)+'時間前';}

// 検索語 + カテゴリで速報リストを生成
let curQuery='', curCat='all';
function buildResults(){
 let items=[];
 for(let i=0;i<26;i++)items.push(genItem(curQuery,i));
 // 緊急度スコア（Ξ + 直近性）で並べ、上位を「速報」に
 items.forEach(it=>{it.score=it.xi+(it.ageMin<30?0.25:0)+(it.ageMin<9?0.25:0);});
 items.sort((a,b)=>b.score-a.score);
 items.forEach((it,idx)=>{it.breaking=(idx<8)||it.ageMin<9;});
 // カテゴリ絞り込み
 let out=items;
 if(curCat==='速報') out=items.filter(x=>x.breaking);
 else if(curCat!=='all') out=items.filter(x=>x.cat===curCat);
 return out.slice(0,14);
}
function render(){
 const items=buildResults();
 document.getElementById('results-title').textContent=curQuery?('「'+curQuery+'」の速報検索結果 — '+items.length+'件'):'最新の速報';
 const list=document.getElementById('results-list');list.innerHTML='';
 if(!items.length){list.innerHTML='<div style="color:rgba(150,172,210,.6);font-size:13px;padding:16px 0">該当する速報はありません。別の語やカテゴリでお試しください。</div>';}
 items.forEach(it=>{
  const el=document.createElement('div');el.className='item';
  const urgW=Math.min(80,it.xi*260)+'px';
  el.innerHTML='<div class="hl"><span class="badge '+(it.breaking?'b':'n')+'">'+(it.breaking?'速報':it.cat)+'</span>'+
   '<div class="head">'+esc(it.headline)+'</div></div>'+
   '<div class="meta">'+it.cat+' · <b>'+timeLabel(it.ageMin)+'</b> · 緊急度 Ξ='+it.xi.toFixed(3)+
   '<span class="urg" style="width:'+urgW+'"></span> · 幾何 '+it.geo+'</div>'+
   '<div class="body">'+esc(it.body)+'</div>';
  el.onclick=()=>el.classList.toggle('open');
  list.appendChild(el);
 });
 // 放送パネル & ティッカーは最新速報から
 const breaking=items.filter(x=>x.breaking);
 const air=(breaking[0]||items[0]);
 if(air){document.getElementById('air-txt').textContent=air.headline;airHue=air.hue;}
 const al=document.getElementById('air-list');al.innerHTML='';
 items.slice(0,10).forEach(it=>{const m=document.createElement('div');m.className='mini';
  m.innerHTML='<span class="t">'+(it.breaking?'速報':it.cat)+'</span>'+esc(it.headline);
  m.onclick=()=>{document.getElementById('air-txt').textContent=it.headline;airHue=it.hue;};al.appendChild(m);});
 const mv=document.getElementById('ticker-move');
 mv.innerHTML=items.map(it=>'<span><b>'+(it.breaking?'【速報】':'')+'</b>'+esc(it.headline)+'</span>').join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// カテゴリチップ
const CATS=[['all','すべて'],['速報','速報'],['政治','政治'],['経済','経済'],['災害','災害'],['国際','国際'],['科学','科学'],['気象','気象'],['社会','社会']];
function buildCats(){const c=document.getElementById('cats');
 CATS.forEach(([k,l])=>{const b=document.createElement('button');b.className='cat'+(k==='速報'?' hot':'')+(k==='all'?' on':'');
  b.textContent=l;b.dataset.k=k;b.onclick=()=>{curCat=k;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
  c.appendChild(b);});}

// 検索
function doSearch(){curQuery=document.getElementById('q').value;render();}
document.getElementById('go').onclick=doSearch;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

// 時計
function tick(){const d=new Date();const p=n=>String(n).padStart(2,'0');
 document.getElementById('clock').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
setInterval(tick,1000);tick();

// 放送ビジュアル（熱エントロピー球）
const ac=document.getElementById('air-canvas'),actx=ac.getContext('2d');
let airHue=205,arot=0,DPR=1;
const PTS=[];for(let i=0;i<150;i++){const y=1-(i/149)*2;const r=Math.sqrt(1-y*y);const th=i*2.399963;PTS.push([Math.cos(th)*r,y,Math.sin(th)*r]);}
function airResize(){DPR=window.devicePixelRatio||1;const w=ac.clientWidth,h=210;ac.width=w*DPR;ac.height=h*DPR;actx.setTransform(DPR,0,0,DPR,0,0);}
function airLoop(){const w=ac.clientWidth,h=210,cx=w/2,cy=h*0.44,R=Math.min(w,h)*0.30;
 actx.clearRect(0,0,w,h);
 const g=actx.createRadialGradient(cx,cy,0,cx,cy,R*2.4);
 g.addColorStop(0,'hsla('+airHue+',70%,55%,.32)');g.addColorStop(1,'rgba(6,8,15,0)');
 actx.fillStyle=g;actx.fillRect(0,0,w,h);
 arot+=0.006;const cb=Math.cos(arot),sb=Math.sin(arot),tl=0.4;
 const pr=PTS.map(p=>{let x=p[0]*cb-p[2]*sb,z=p[0]*sb+p[2]*cb,y=p[1];const y2=y*Math.cos(tl)-z*Math.sin(tl),z2=y*Math.sin(tl)+z*Math.cos(tl);return{x:cx+x*R,y:cy+y2*R,z:z2};});
 pr.sort((a,b)=>a.z-b.z);
 pr.forEach(p=>{const d=(p.z+1)/2;actx.globalAlpha=0.25+d*0.7;actx.fillStyle='hsla('+airHue+','+(60+d*30)+'%,'+(50+d*30)+'%,1)';
  actx.beginPath();actx.arc(p.x,p.y,0.6+d*2,0,7);actx.fill();});
 actx.globalAlpha=1;requestAnimationFrame(airLoop);}
airResize();window.addEventListener('resize',airResize);airLoop();

// init
buildCats();render();
</script>
</body>
</html>
