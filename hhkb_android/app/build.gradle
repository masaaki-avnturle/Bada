plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bada.hhkb'
    compileSdk 34          // required by AGP 8.x (build-time SDK only)

    defaultConfig {
        applicationId "com.bada.hhkb"
        minSdk 21          // Android 5.0+ for broad device support (Android 12 targeted)
        targetSdk 31       // Android 12 runtime behaviour
        versionCode 1
        versionName "1.0"
    }

    // Stable, committed debug key so every CI build is signed identically.
    // Without this, each CI run uses a fresh random debug key and updating a
    // previously-installed build fails with "アプリがインストールされていません".
    signingConfigs {
        debug {
            storeFile file("bada-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No external dependencies — pure Android framework (InputMethodService).
dependencies {
}
