plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bada.xp'
    compileSdk 34

    defaultConfig {
        applicationId "com.bada.xp"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"   // Bada XP — file upload + app generation
    }

    buildTypes {
        release {
            // debuggable, unsigned -> `assembleRelease` still needs a signing config
            // for install; use `assembleDebug` for a ready-to-install APK.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies: the app is a WebView shell over assets/www,
// built only against the Android framework. (Keeps the APK tiny and avoids
// transitive Kotlin stdlib clashes.)
dependencies {
}
