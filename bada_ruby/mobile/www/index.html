<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Bada XP — ChatGPT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0b0f1a; --panel:#141a2b; --line:#243049; --me:#1f6feb; --bot:#1b2336;
          --txt:#e7ecf5; --dim:#9fb0cc; --accent:#5fd0c4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
              font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:env(safe-area-inset-top) 12px 8px; padding-top:max(10px,env(safe-area-inset-top));
           background:var(--panel); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:30px; height:30px; }
  .brand h1 { font-size:17px; margin:0; font-weight:700; letter-spacing:.5px; }
  .brand .tag { font-size:11px; color:var(--dim); }
  .verbar { display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-size:12px; background:var(--bot); border:1px solid var(--line); color:var(--txt);
          padding:4px 8px; border-radius:999px; }
  .chip b { color:var(--accent); }
  button { font:inherit; color:var(--txt); background:var(--bot); border:1px solid var(--line);
           border-radius:8px; padding:6px 10px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.small { font-size:12px; padding:4px 8px; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:14px; line-height:1.5; white-space:pre-wrap;
         word-break:break-word; font-size:15px; }
  .msg.me  { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line);
             border-bottom-left-radius:4px; }
  .msg .meta { display:block; font-size:11px; color:var(--dim); margin-top:6px; }
  footer { padding:10px 10px max(10px,env(safe-area-inset-bottom)); background:var(--panel);
           border-top:1px solid var(--line); }
  .row { display:flex; gap:8px; }
  #q { flex:1; resize:none; max-height:120px; background:var(--bot); color:var(--txt);
       border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
  #send { background:var(--me); border-color:var(--me); font-weight:600; min-width:64px; }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:14px;
           width:min(92vw,420px); padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h3 { margin:0 0 10px; }
  dialog label { font-size:13px; color:var(--dim); display:block; margin:10px 0 4px; }
  dialog input, dialog select { width:100%; background:var(--bot); color:var(--txt);
           border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  .ladder { list-style:none; margin:8px 0 0; padding:0; }
  .ladder li { display:flex; justify-content:space-between; align-items:center; gap:8px;
               padding:7px 8px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; font-size:13px; }
  .ladder li.cur { border-color:var(--accent); }
  .ladder .note { color:var(--dim); font-size:11px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .chips .f { font-size:12px; background:var(--bot); border:1px solid var(--line);
              border-radius:999px; padding:3px 9px; display:flex; gap:6px; align-items:center; }
  .chips .f .x { color:var(--dim); cursor:pointer; font-weight:700; }
  .msg pre { margin:8px 0 0; padding:8px; background:#0c1120; border:1px solid var(--line);
             border-radius:8px; overflow-x:auto; font-size:12px; line-height:1.45; white-space:pre; }
  .msg .dl { margin-top:8px; font-size:12px; background:var(--accent); color:#04211d;
             border:none; border-radius:8px; padding:6px 10px; font-weight:700; }
  .hint { font-size:11px; color:var(--dim); margin-top:8px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="icon.svg" alt="">
    <div>
      <h1>Bada XP <span class="tag">— ChatGPT 分派</span></h1>
      <div class="tag">大域的部分積分多様体 × シャノン不変量 Ξ</div>
    </div>
    <div style="margin-left:auto; display:flex; gap:6px;">
      <button class="small" id="btnVer">バージョン</button>
      <button class="small" id="btnSet">設定</button>
    </div>
  </div>
  <div class="verbar">
    <span class="chip">版: <b id="verName">—</b></span>
    <span class="chip">engine: <b id="engName">local</b></span>
    <button class="small" id="btnDown">▼ ダウングレード</button>
    <button class="small" id="btnUp">▲ アップグレード</button>
  </div>
</header>

<div id="log"></div>

<footer>
  <div id="chips" class="chips"></div>
  <div class="row">
    <button id="attach" class="small" title="ファイルを添付（OneDrive/ドライブ/端末）">📎</button>
    <textarea id="q" rows="1" placeholder="質問を入力…（例：意識とは何か / 添付から要約・アプリ生成）"></textarea>
    <button id="send">送信</button>
  </div>
  <div class="row" style="margin-top:6px; align-items:center;">
    <button id="gen" class="small">⚙ アプリ生成</button>
    <span class="hint" id="attachHint" style="margin:0 0 0 auto"></span>
  </div>
  <input id="file" type="file" multiple hidden>
</footer>

<dialog id="verDlg">
  <h3>ChatGPT バージョン台帳</h3>
  <div class="tag" style="font-size:12px;color:var(--dim)">上＝高性能 ／ 下＝ローカル分派。前のバージョンへダウングレードできます。</div>
  <ul class="ladder" id="ladderUl"></ul>
  <div class="row" style="margin-top:8px">
    <button id="btnReset">既定（ムートス）に戻す</button>
    <button id="verClose" style="margin-left:auto">閉じる</button>
  </div>
</dialog>

<dialog id="setDlg">
  <h3>設定 — 本物の ChatGPT に接続</h3>
  <p class="hint" style="margin-top:0">本物の AI 応答には API キーが必要です（あなたのキー）。未設定だと
  オフラインの<b>デモ・エンジン（定型文）</b>になります。キーは<b>この端末内だけ</b>に保存され、
  ブラウザから選んだ提供元へ直接送られます（共有端末では入れないでください）。</p>
  <label>提供元 (Provider)</label>
  <select id="provider">
    <option value="anthropic">Anthropic（Claude）— 推奨</option>
    <option value="openai">OpenAI（ChatGPT）/ 互換</option>
  </select>
  <label>API キー</label>
  <input id="apiKey" type="password" placeholder="sk-ant-... / sk-..." autocomplete="off">
  <label>モデル（任意・空欄で既定）</label>
  <input id="modelOverride" type="text" placeholder="例: claude-opus-4-8 / gpt-4o-mini" autocomplete="off">
  <label id="baseLabel" style="display:none">OpenAI 互換のベース URL（任意）</label>
  <input id="openaiBase" type="text" placeholder="https://api.openai.com/v1" autocomplete="off" style="display:none">
  <div class="row" style="margin-top:10px; align-items:center">
    <button id="setTest">接続テスト</button>
    <span class="hint" id="setResult" style="margin:0 0 0 auto"></span>
  </div>
  <div class="row" style="margin-top:10px">
    <button id="setClear">キーを消去</button>
    <button id="setSave" style="margin-left:auto;background:var(--me);border-color:var(--me)">保存</button>
  </div>
</dialog>

<script>
"use strict";
// ===== Bada XP engine (faithful standalone port of the Ruby OmegaChat core) =====
const LANCZOS_G = 7;
const LANCZOS_C = [0.99999999999980993,676.5203681218851,-1259.1392167224028,
  771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,
  9.9843695780195716e-6,1.5056327351493116e-7];
function gamma(x){
  if (x === 0) return Infinity;
  if (x < 0.5) return Math.PI/(Math.sin(Math.PI*x)*gamma(1-x));
  x -= 1; let a = LANCZOS_C[0]; const t = x + LANCZOS_G + 0.5;
  for (let i=1;i<LANCZOS_G+2;i++) a += LANCZOS_C[i]/(x+i);
  return Math.sqrt(2*Math.PI)*Math.pow(t,x+0.5)*Math.exp(-t)*a;
}
const logGamma = x => Math.log(Math.abs(gamma(x)));
const beta = (p,q) => Math.exp(logGamma(p)+logGamma(q)-logGamma(p+q));
function zetaGauge(p,q,x){ const lx = Math.log(x); return Math.abs(lx)<1e-15?Infinity:beta(p,q)/lx; }
function xLogX(x){ return x<=0?0:x*Math.log(x); }
const TOKEN_RE = /[A-Za-z0-9_]+|[一-鿿぀-ゟ゠-ヿ]/g;
const tokenize = s => (String(s).match(TOKEN_RE) || []);
function shannon(tokens){
  if (!tokens.length) return 0;
  const f = {}; tokens.forEach(t => f[t]=(f[t]||0)+1);
  const n = tokens.length; let h = 0;
  for (const k in f){ const p=f[k]/n; h -= p*Math.log2(p); }
  return h;
}
function distribution(tokens){
  const f={}; tokens.forEach(t=>f[t]=(f[t]||0)+1); const n=tokens.length;
  return Object.entries(f).map(([t,c])=>[t,c/n]).sort((a,b)=>b[1]-a[1]);
}
function manifoldElement(x){ if(x<=1)return 1; const xl=xLogX(x); return Math.abs(xl)<1e-9?1:1/(xl*xl); }
function integral(dist){ return dist.reduce((s,[,p],i)=>s+p*manifoldElement(i+2),0); }
function xi(text){
  const tk = tokenize(text), h = shannon(tk), m = integral(distribution(tk)), n = tk.length;
  return zetaGauge(h+1, m+1, n+1);
}
const ofEntropy = s => shannon(tokenize(s));

const THEORY = [
  "大域的部分積分多様体 M 上で、エントロピー不変量 Ξ は複素回転体 e^{iθ} の下で保存される。",
  "ガンマ関数 Γ(γ) の部分積分により β(p,q) が現れ、これが ζ(s)=x·log x のゲージを与える。",
  "シャノンのエントロピー H を多様体線素 1/(x·log x)² で重み付け積分すると不変量 Ξ を得る。",
  "特殊相対性理論のコマ幾何の可積分系がエラーを修正し、Ξ を閉軌道 ∮ 上で安定化させる。",
  "未知エンジンは質問のエントロピー値 H_q を多様体不変量 Ξ_q に写し、近傍の知識を生成する。"
];
const EQUATIONS = [
  "ζ(s) = β(p,q)/log x = x·log x","β(p,q) = Γ(p)Γ(q)/Γ(p+q)",
  "∬ 1/(x·log x)² dx_m = π(χ,x)∇ d∇","□ = 2(sin(ix·log x) + cos(ix·log x))",
  "∮ e^{-□} d□ = π e,  e^π ≅ π^e","H = -Σ p·log₂ p,  Ξ = β(H+1, M+1)/log(N+1)",
  "⊕(iℏ∇)^⊕L = e^{-x·log x}","Γ′(γ) dx_m = T,  ζ(s) e^{-f} dV = β(p,q)/log x"
];
function localReply(question){
  const target = ofEntropy(question);
  const body = THEORY.slice().sort((a,b)=>Math.abs(ofEntropy(a)-target)-Math.abs(ofEntropy(b)-target))
                     .slice(0,3).join(" ");
  return `${body} (Ξ=${xi(question).toFixed(4)})`;
}
function localEquation(question){
  const target = ofEntropy(question);
  return EQUATIONS.slice().sort((a,b)=>Math.abs(ofEntropy(a)-target)-Math.abs(ofEntropy(b)-target))[0];
}
// Intent classification (mirrors std/multigpt.bada classify()).
function classifyReq(req){
  const has = s => req.includes(s);
  if(has("方程式")||has("equation")) return "equation";
  if(has("論文")||has("paper")) return "paper";
  if(has("証明")||has("prove")||has("予想")) return "proof";
  if(has("回路")||has("FPGA")||has("Verilog")||has("verilog")) return "circuit";
  if(has("アプリ")||has("ソース")||has("コード")||has("app")||has("code")) return "application";
  return "chat";
}
// Stats of a text (token count, Shannon H, invariant Ξ, top tokens).
function fileStats(text){
  const tk = tokenize(text);
  const top = distribution(tk).slice(0,5);
  return { n: tk.length, h: shannon(tk), xi: xi(text), top };
}
// Generate a runnable Bada app whose numbers come from the uploaded file(s).
function generateApp(req, atts){
  const names = atts.length ? atts.map(a=>a.name).join(", ") : "(添付なし)";
  const all = atts.map(a=>a.text).join("\n");
  const st = fileStats(all || req);
  const probs = (st.top.length ? st.top : [["·",1]]).map(([,p])=>p.toFixed(4)).join(", ");
  const q = '"';
  const L = [];
  L.push("# 生成アプリ (Bada XP): " + req);
  L.push("# 添付ファイル: " + names);
  L.push('import "std/special.bada"');
  L.push('import "std/manifold.bada"');
  L.push("");
  L.push("def main()");
  L.push("  print " + q + "=== " + req + " ===" + q);
  L.push("  print " + q + "添付: " + names + q);
  L.push("  print " + q + "Γ(5) = " + q + " + str(Special.gamma(5))");
  L.push("  arr ps <- [" + probs + "]");
  L.push("  print " + q + "Ξ(添付分布) = " + q + " + str(Mani.invariant(ps))");
  L.push("  print " + q + "H = " + st.h.toFixed(4) + " bits / N = " + st.n + " tokens / Ξ = " + st.xi.toFixed(4) + q);
  L.push("  print " + q + "完了: 添付ファイルから生成したアプリが実行されました" + q);
  L.push("end");
  L.push("");
  L.push("main()");
  return L.join("\n");
}

// ===== offline practical engine (works with NO API key) =====
// A real on-device assistant: calculator, summarizer, keyword/counts,
// entropy/Ξ, a small Bada/math knowledge base, and app generation.

// --- safe math evaluator (recursive descent; no eval) ---
function mathEval(input){
  let s = input
    .replace(/Γ/g,"gamma").replace(/π/g,"pi").replace(/√/g,"sqrt")
    .replace(/[×]/g,"*").replace(/[÷]/g,"/")
    .replace(/[−–—]/g,"-").replace(/[（]/g,"(").replace(/[）]/g,")")
    .replace(/[，]/g,",");
  let i = 0;
  const FUNC = {
    sqrt:Math.sqrt, cbrt:Math.cbrt, abs:Math.abs, exp:Math.exp,
    ln:Math.log, log:Math.log10, log2:Math.log2, log10:Math.log10,
    sin:Math.sin, cos:Math.cos, tan:Math.tan, asin:Math.asin, acos:Math.acos, atan:Math.atan,
    floor:Math.floor, ceil:Math.ceil, round:Math.round, sign:Math.sign,
    gamma:gamma, fact:x=>gamma(x+1), factorial:x=>gamma(x+1),
    beta:beta, pow:Math.pow, atan2:Math.atan2, max:Math.max, min:Math.min, hypot:Math.hypot
  };
  const CONST = { pi:Math.PI, e:Math.E, euler:Math.E, tau:2*Math.PI };
  const ws = ()=>{ while(i<s.length && /\s/.test(s[i])) i++; };
  const pk = ()=>{ ws(); return s[i]; };
  function expr(){ let v=term(); for(;;){ const c=pk(); if(c==="+"){i++; v+=term();} else if(c==="-"){i++; v-=term();} else break; } return v; }
  function term(){ let v=unary(); for(;;){ const c=pk(); if(c==="*"){i++; v*=unary();} else if(c==="/"){i++; v/=unary();} else if(c==="%"){i++; v%=unary();} else break; } return v; }
  function unary(){ const c=pk(); if(c==="-"){i++; return -unary();} if(c==="+"){i++; return unary();} return pow(); }
  function pow(){ let b=postfix(); if(pk()==="^"){ i++; return Math.pow(b, unary()); } return b; }
  function postfix(){ let v=atom(); while(pk()==="!"){ i++; v=gamma(v+1); } return v; }
  function atom(){
    ws();
    if(s[i]==="("){ i++; const v=expr(); ws(); if(s[i]!==")") throw new Error("paren"); i++; return v; }
    const num = /^\d*\.?\d+([eE][+\-]?\d+)?/.exec(s.slice(i));
    if(num){ i+=num[0].length; return parseFloat(num[0]); }
    const nm = /^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i));
    if(nm){
      const name = nm[0].toLowerCase(); i+=nm[0].length; ws();
      if(s[i]==="("){ i++; const args=[expr()]; ws(); while(s[i]===","){ i++; args.push(expr()); ws(); }
        if(s[i]!==")") throw new Error("paren"); i++;
        if(FUNC[name]) return FUNC[name](...args);
        throw new Error("unknown function "+name);
      }
      if(name in CONST) return CONST[name];
      if(FUNC[name]) throw new Error(name+" needs ( )");
      throw new Error("unknown name "+name);
    }
    throw new Error("unexpected '"+(s[i]||"end")+"'");
  }
  const v = expr(); ws();
  if(i < s.length) throw new Error("trailing '"+s.slice(i)+"'");
  return v;
}
function fmtNum(v){
  if(!isFinite(v)) return String(v);
  if(Number.isInteger(v)) return String(v);
  return String(Math.round(v*1e10)/1e10);
}
// Convert a Japanese/plain math question into an expression, or null.
function asMath(q){
  let s = q.replace(/[？?＝]/g,"").replace(/(は|を計算|を求めて|計算して|the value of|value of)/gi,"").trim();
  s = s.replace(/([0-9.]+)\s*の\s*階乗/g,"factorial($1)")
       .replace(/([0-9.]+)\s*の\s*平方根/g,"sqrt($1)")
       .replace(/([0-9.]+)\s*の\s*二乗/g,"($1)^2")
       .replace(/([0-9.]+)\s*の\s*三乗/g,"($1)^3")
       .replace(/たす/g,"+").replace(/ひく/g,"-").replace(/かける/g,"*").replace(/わる/g,"/");
  if(!/[0-9]/.test(s)) return null;
  if(!/^[\s0-9+\-*/^%().!,A-Za-z_Γπ×÷√（），]+$/.test(s)) return null;
  return s;
}
// Strip a leading command word so the rest is the operand text.
function stripCmd(q){
  return q.replace(/^(要約して?|まとめて?|要約|キーワード(抽出)?|文字数|単語数|トークン数|カウント|エントロピー|不変量|summarize|summary|keywords?|count|entropy)\s*[:：]?\s*/i,"").trim();
}
function splitSentences(t){ return t.split(/[。．.!?！？\n]+/).map(x=>x.trim()).filter(x=>x.length>1); }
function summarize(text, k){
  k = k||3;
  const sents = splitSentences(text);
  if(sents.length <= k) return text.trim();
  const freq = {}; tokenize(text).forEach(w=> freq[w]=(freq[w]||0)+1);
  const scored = sents.map((sen,idx)=>{ const tk=tokenize(sen); const sc=tk.reduce((a,w)=>a+(freq[w]||0),0)/(tk.length||1); return {sen,idx,sc}; });
  const top = scored.slice().sort((a,b)=>b.sc-a.sc).slice(0,k).sort((a,b)=>a.idx-b.idx);
  return top.map(x=>x.sen).join("。 ") + "。";
}
const STOP = new Set("の に は を が と で て た し も へ や か な this that the a an of to and is in for on at it です ます する いる ある こと これ それ".split(" "));
function keywords(text, k){
  k=k||8; const freq={};
  tokenize(text).forEach(w=>{ if(STOP.has(w)) return; freq[w]=(freq[w]||0)+1; });
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,k);
}
function counts(text){
  return { chars:[...text].length, tokens:tokenize(text).length, lines:(text.split(/\n/).length) };
}
function capabilities(){
  return "【Bada XP — 鍵なしでも使える実用機能】\n"+
  "・計算機: 「2+2」「sqrt(2)」「Γ(7)」「5!」「log2(8)」「beta(2,3)」「(3^4-1)/5」\n"+
  "・要約: 「要約 <文章>」 または 📎添付して「要約」\n"+
  "・キーワード: 「キーワード <文章/添付>」\n"+
  "・文字数/トークン数: 「文字数 <文章/添付>」\n"+
  "・エントロピー/不変量Ξ: 「エントロピー <文章/添付>」\n"+
  "・アプリ生成: 「⚙ アプリ生成」で実行可能な Bada コードを生成・ダウンロード\n"+
  "・本物のAI: 「設定」でAPIキーを入れると Claude/ChatGPT に切替";
}
const KB = [
  { k:["ξ","不変量","invariant"], a:"Ξ は大域的部分積分多様体のエントロピー不変量で、Ξ = β(H+1, M+1) / log(N+1)。H はシャノンエントロピー、M は多様体線素 1/(x·log x)² の積分、N はトークン数です。" },
  { k:["エントロピー","entropy","シャノン","shannon"], a:"シャノンのエントロピー H = −Σ p·log₂ p（bit）。テキストを送ると実際に計算します。例: 「エントロピー こんにちは世界」" },
  { k:["ガンマ","gamma","Γ","階乗","factorial"], a:"ガンマ関数 Γ(n)=(n−1)!（自然数で）。「Γ(5)」「gamma(5)」「5!」で実計算できます。" },
  { k:["bada","バダ","ばだ","ばーだ"], a:"Bada は大域的部分積分多様体理論とシャノン不変量に基づく言語/エンジン。このアプリ Bada XP はその ChatGPT 分派で、鍵なしでも計算・要約・解析・アプリ生成ができます。" },
  { k:["円周率","pi","π"], a:"π ≒ 3.141592653589793。「pi*2」などで計算に使えます。" }
];
function attachedText(){ return attachments.length ? attachments.map(a=>a.text).join("\n") : ""; }
// The offline assistant entry point (used whenever no real LLM is active).
function offlineAnswer(question){
  const q = (question||"").trim();
  if(!q && !attachments.length) return capabilities();
  if(/help|ヘルプ|使い方|つかいかた|何ができ|できること/i.test(q)) return capabilities();

  // 1) calculator
  const expr = asMath(q);
  if(expr !== null){ try{ const v = mathEval(expr); if(isFinite(v)) return `${q}\n= ${fmtNum(v)}`; }catch(e){} }

  // operand: attachment(s), else the text after the command word (ignoring
  // bare definitional particles like 「とは」「何」so "Ξとは" reaches the KB).
  const after = stripCmd(q);
  const realOperand = (after && after !== q && !/^(とは|って|何|の意味|を教え|\?|？)/.test(after)) ? after : "";
  const src = attachments.length ? attachedText() : realOperand;
  const hasOperand = attachments.length > 0 || !!realOperand;
  const hasCmd = after !== q; // a leading command word was present

  // 2) summarize
  if(/要約|まとめ|summary|summarize/i.test(q) && (hasCmd || attachments.length)){
    return src ? "【要約】\n"+summarize(src,3) : "要約する文章を「要約 …」の形で送るか、📎でファイルを添付してください。";
  }
  // 3) keywords
  if(/キーワード|keyword|頻出/i.test(q) && (hasCmd || attachments.length)){
    return src ? "【キーワード】\n"+keywords(src).map(([w,c])=>`${w}(${c})`).join(", ")
               : "キーワードを抽出する文章を送るか、📎で添付してください。";
  }
  // 4) counts
  if(/文字数|何文字|単語数|トークン数|カウント|count|word count/i.test(q) && (hasCmd || attachments.length)){
    const c = counts(src || q);
    return `文字数 ${c.chars} / トークン ${c.tokens} / 行 ${c.lines}`;
  }
  // 5) entropy / invariant — only when an operand is given (else KB explains it)
  if(/エントロピー|entropy|不変量|Ξ|ξ|\bxi\b/i.test(q) && hasOperand){
    const t = src;
    return `H = ${ofEntropy(t).toFixed(4)} bits / Ξ = ${xi(t).toFixed(4)} / N = ${tokenize(t).length} tokens`;
  }
  // 6) knowledge base
  const ql = q.toLowerCase();
  for(const e of KB){ if(e.k.some(kk=> ql.includes(kk.toLowerCase()))) return e.a; }

  // 7) attachment present but no explicit command → analyze + offer actions
  if(attachments.length){
    const st = fileStats(attachedText());
    return `添付 ${attachments.length} 件を解析: N=${st.n} トークン, H=${st.h.toFixed(3)} bits, Ξ=${st.xi.toFixed(4)}。\n`+
           `「要約」「キーワード」「文字数」で詳しく、または「⚙ アプリ生成」でコード化できます。`;
  }
  // 8) helpful default (not a canned template): show what it can do + indices
  return `『${q}』への登録知識はありませんが、オフラインで次ができます。\n`+capabilities()+
         `\n\n参考指標 → H=${ofEntropy(q).toFixed(3)} bits / Ξ=${xi(q).toFixed(4)}`;
}

// ===== version ladder (mirrors lib/bada/lang/llm.rb) =====
const CODENAME = "Bada XP";
const LADDER = [
  {id:"claude-fable-5",   label:"Fable 5",       model:"claude-fable-5",   note:"最上位（最も高性能）"},
  {id:"mythos",           label:"ムートス",       model:"claude-opus-4-8",  note:"既定・Opus 4.8 と同等"},
  {id:"claude-opus-4-7",  label:"Opus 4.7",      model:"claude-opus-4-7",  note:"前世代"},
  {id:"claude-opus-4-6",  label:"Opus 4.6",      model:"claude-opus-4-6",  note:"前々世代"},
  {id:"claude-sonnet-4-6",label:"Sonnet 4.6",    model:"claude-sonnet-4-6",note:"軽量・高速"},
  {id:"claude-haiku-4-5", label:"Haiku 4.5",     model:"claude-haiku-4-5", note:"最小・最速"},
  {id:"local",            label:"OmegaChat 分派", model:null,               note:"ローカル（鍵不要）"}
];
const DEFAULT_INDEX = LADDER.findIndex(e=>e.id==="mythos");
let selIndex = (function(){
  const s = localStorage.getItem("bada_xp_version");
  const i = s ? LADDER.findIndex(e=>e.id===s) : -1;
  return i>=0 ? i : DEFAULT_INDEX;
})();
const cur = () => LADDER[selIndex];
function setVersion(i){ selIndex = Math.max(0,Math.min(LADDER.length-1,i));
  localStorage.setItem("bada_xp_version", cur().id); renderVersion(); }
// ===== real-LLM configuration (kept on-device only) =====
const apiKey   = () => (localStorage.getItem("bada_xp_key") || "").trim();
const provider = () => localStorage.getItem("bada_xp_provider") || "anthropic";
const openaiBase = () => (localStorage.getItem("bada_xp_openai_base") || "https://api.openai.com/v1").trim();
// model actually sent: explicit override > ladder model (Anthropic) / default (OpenAI)
function activeModel(){
  const ov = (localStorage.getItem("bada_xp_model") || "").trim();
  if (ov) return ov;
  if (provider() === "openai") return "gpt-4o-mini";
  return cur().model || "claude-opus-4-8";
}
// A real LLM answers when a key is set AND we're not pinned to the local rung.
const isLive = () => !!apiKey() && cur().id !== "local";

// ===== real LLM call (returns {ok, text} or {ok:false, error}) =====
async function callLLM(prompt){
  if (!apiKey()) return { ok:false, error:"API キー未設定（設定で入力してください）" };
  try {
    if (provider() === "openai") {
      const r = await fetch(openaiBase() + "/chat/completions", {
        method:"POST",
        headers:{ "content-type":"application/json", "authorization":"Bearer " + apiKey() },
        body:JSON.stringify({ model:activeModel(), max_tokens:1024,
                              messages:[{role:"user",content:prompt}] })
      });
      if (!r.ok) return { ok:false, error:`HTTP ${r.status} ${(await r.text()).slice(0,160)}` };
      const j = await r.json();
      const t = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      return t ? { ok:true, text:t } : { ok:false, error:"空の応答" };
    } else {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "content-type":"application/json", "x-api-key":apiKey(),
                  "anthropic-version":"2023-06-01",
                  "anthropic-dangerous-direct-browser-access":"true" },
        body:JSON.stringify({ model:activeModel(), max_tokens:1024,
                              messages:[{role:"user",content:prompt}] })
      });
      if (!r.ok) return { ok:false, error:`HTTP ${r.status} ${(await r.text()).slice(0,160)}` };
      const j = await r.json();
      if (j.stop_reason === "refusal") return { ok:false, error:"安全分類器による拒否 (refusal)" };
      const t = (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
      return t ? { ok:true, text:t } : { ok:false, error:"空の応答" };
    }
  } catch(e) {
    return { ok:false, error:"通信エラー（ネットワーク/CORS）: " + (e && e.message ? e.message : e) };
  }
}
// ===== uploaded files (OneDrive / Drive / device via the system picker) =====
const MAX_CHARS = 20000; // per-file cap for the LLM prompt
let attachments = []; // { name, size, text, stats }
function contextBlock(){
  if(!attachments.length) return "";
  return "【添付ファイル】\n" + attachments.map(a=>{
    const body = a.text.length > MAX_CHARS ? a.text.slice(0,MAX_CHARS) + "\n…(truncated)" : a.text;
    return `--- ${a.name} (${a.size} bytes, N=${a.stats.n}, H=${a.stats.h.toFixed(3)}bits, Ξ=${a.stats.xi.toFixed(4)}) ---\n${body}`;
  }).join("\n\n");
}
function localAnswer(question){
  // The offline practical engine (calculator / summary / keywords / counts /
  // entropy / KB / file analysis). Genuinely useful with no API key.
  return offlineAnswer(question);
}
async function answer(question){
  const prompt = attachments.length ? (contextBlock() + "\n\n質問: " + question) : question;
  if(isLive()){
    const r = await callLLM(prompt);
    if(r.ok) return { text:r.text, engine: activeModel() };
    // Don't silently fall back to templates — tell the user WHY, then offer the demo.
    return { text:`⚠ 本物のAIに接続できませんでした（${r.error}）\n設定でキー・提供元・モデルをご確認ください。\n\n— 以下はオフラインのデモ応答（定型）—\n` + localAnswer(question), engine:"error" };
  }
  return { text: localAnswer(question), engine:"demo" };
}

// ===== UI =====
const $ = s => document.querySelector(s);
const log = $("#log");
function bubble(text, who, meta){
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  if(meta){ const m=document.createElement("span"); m.className="meta"; m.textContent=meta; d.appendChild(m); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function renderVersion(){
  $("#verName").textContent = cur().label;
  $("#engName").textContent = isLive() ? ("本物:" + activeModel()) : "オフライン(計算/解析)";
}
function renderLadder(){
  const ul = $("#ladderUl"); ul.innerHTML = "";
  LADDER.forEach((e,i)=>{
    const li = document.createElement("li"); if(i===selIndex) li.className="cur";
    const left = document.createElement("div");
    left.innerHTML = `<div>${e.label}${i===selIndex?" ・現在":""}</div><div class="note">${e.id} — ${e.note}</div>`;
    const b = document.createElement("button"); b.className="small"; b.textContent="選択";
    b.onclick = ()=>{ setVersion(i); renderLadder(); };
    li.append(left,b); ul.appendChild(li);
  });
}
async function send(){
  const q = $("#q").value.trim(); if(!q) return;
  $("#q").value=""; $("#q").style.height="auto";
  bubble(q,"me");
  const typing = bubble("…","bot");
  const res = await answer(q);
  typing.firstChild.textContent = res.text;
  const m=document.createElement("span"); m.className="meta";
  const tag = res.engine==="demo" ? "オフライン" : res.engine==="error" ? "接続失敗→オフライン" : "本物のAI:"+res.engine;
  m.textContent = `${cur().label} · ${tag}`;
  typing.appendChild(m); log.scrollTop=log.scrollHeight;
}

// add a bot bubble containing generated source + a download button
function codeBubble(text, filename, meta){
  const d = document.createElement("div"); d.className="msg bot";
  d.textContent = meta ? "" : "";
  const head = document.createElement("div"); head.textContent = `生成: ${filename}`;
  const pre = document.createElement("pre"); pre.textContent = text;
  const dl = document.createElement("button"); dl.className="dl"; dl.textContent="⬇ ダウンロード";
  dl.onclick = ()=> download(filename, text);
  d.append(head, pre, dl);
  if(meta){ const m=document.createElement("span"); m.className="meta"; m.textContent=meta; d.appendChild(m); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function download(filename, text){
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function renderChips(){
  const c = $("#chips"); c.innerHTML = "";
  attachments.forEach((a,i)=>{
    const f = document.createElement("div"); f.className="f";
    const s = document.createElement("span"); s.textContent = `📄 ${a.name} (${a.size}B)`;
    const x = document.createElement("span"); x.className="x"; x.textContent="×";
    x.onclick = ()=>{ attachments.splice(i,1); renderChips(); };
    f.append(s,x); c.appendChild(f);
  });
  $("#attachHint").textContent = attachments.length ? `添付 ${attachments.length} 件を文脈に使用` : "📎 で OneDrive/任意ファイルを添付";
}
async function addFiles(fileList){
  for(const f of fileList){
    let text = "";
    try { text = await f.text(); } catch(e){ text = ""; }
    attachments.push({ name: f.name, size: f.size, text, stats: fileStats(text) });
  }
  renderChips();
}
// generate an app from the request + attachments (real LLM if live, else local)
async function generate(){
  const q = $("#q").value.trim() || "添付ファイルからアプリを生成して";
  const kind = classifyReq(q);
  bubble(q + (attachments.length ? ` 〔添付 ${attachments.length} 件〕` : ""), "me");
  const typing = bubble("…","bot");
  if(isLive()){
    const r = await callLLM(contextBlock() + "\n\n要求: " + q +
      "\n\n上記の添付があれば踏まえて、実行可能な小さなアプリのソースコードを1つだけ生成してください。コードのみ。");
    if(r.ok){ typing.remove(); codeBubble(r.text, "bada_xp_app.txt", `本物のAI:${activeModel()} · ${kind}`); $("#q").value=""; return; }
    typing.firstChild.textContent = `⚠ 接続失敗（${r.error}）。デモ生成にフォールバックします。`;
  }
  typing.remove();
  codeBubble(generateApp(q, attachments), "bada_xp_app.bada", `デモ生成 · ${kind}`);
  $("#q").value="";
}

$("#send").onclick = send;
$("#gen").onclick = generate;
$("#attach").onclick = ()=> $("#file").click();
$("#file").addEventListener("change", e=>{ addFiles(e.target.files); e.target.value=""; });
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
$("#q").addEventListener("input", e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(120,e.target.scrollHeight)+"px"; });
$("#btnDown").onclick = ()=>{ setVersion(selIndex+1); };
$("#btnUp").onclick   = ()=>{ setVersion(selIndex-1); };
$("#btnVer").onclick  = ()=>{ renderLadder(); $("#verDlg").showModal(); };
$("#verClose").onclick= ()=> $("#verDlg").close();
$("#btnReset").onclick= ()=>{ setVersion(DEFAULT_INDEX); renderLadder(); };
function loadSettingsForm(){
  $("#provider").value = provider();
  $("#apiKey").value = apiKey();
  $("#modelOverride").value = localStorage.getItem("bada_xp_model") || "";
  $("#openaiBase").value = localStorage.getItem("bada_xp_openai_base") || "";
  toggleOpenaiBase();
  $("#setResult").textContent = "";
}
function saveSettingsForm(){
  localStorage.setItem("bada_xp_provider", $("#provider").value);
  localStorage.setItem("bada_xp_key", $("#apiKey").value.trim());
  const mo = $("#modelOverride").value.trim();
  mo ? localStorage.setItem("bada_xp_model", mo) : localStorage.removeItem("bada_xp_model");
  const ob = $("#openaiBase").value.trim();
  ob ? localStorage.setItem("bada_xp_openai_base", ob) : localStorage.removeItem("bada_xp_openai_base");
}
function toggleOpenaiBase(){
  const on = $("#provider").value === "openai";
  $("#baseLabel").style.display = on ? "block" : "none";
  $("#openaiBase").style.display = on ? "block" : "none";
}
$("#provider").addEventListener("change", toggleOpenaiBase);
$("#btnSet").onclick  = ()=>{ loadSettingsForm(); $("#setDlg").showModal(); };
$("#setSave").onclick = ()=>{ saveSettingsForm(); renderVersion(); $("#setDlg").close(); };
$("#setClear").onclick= ()=>{ localStorage.removeItem("bada_xp_key"); $("#apiKey").value=""; renderVersion(); };
$("#setTest").onclick = async ()=>{
  saveSettingsForm();
  $("#setResult").textContent = "接続中…";
  const r = await callLLM("接続テストです。日本語で『接続OK』とだけ短く返答してください。");
  $("#setResult").textContent = r.ok ? ("✓ 成功: " + r.text.slice(0,40)) : ("✗ " + r.error);
  renderVersion();
};

renderVersion();
renderChips();
if(!isLive()){
  bubble(`こんにちは。Bada XP です（鍵なしで動くオフライン実用モード）。\n\n`+capabilities()+
    `\n\n例:「Γ(7)」「(3^4-1)/5」「要約 …」「キーワード …」。📎でファイルも解析できます。\n`+
    `本物の Claude/ChatGPT にしたい時は右上「設定」で API キーを入れてください。`,
    "bot", "オフラインでも計算・要約・解析ができます");
}else{
  bubble(`こんにちは。Bada XP です。本物の AI（${activeModel()}）に接続済みです。`+
    `\n📎 で OneDrive・任意ファイルを添付して質問やアプリ生成ができます。`, "bot", `本物のAI:${activeModel()}`);
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}
