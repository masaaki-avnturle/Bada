<title>BadaGPT 道場 — 応答でアプリを作る技・伝授</title>
<!--
  BadaGPT 道場 (BadaTeach)
  ========================
  ChatGPT が行っている「応答してアプリケーションを作る技」を、
  量子プログラミング言語 Bada を題材にユーザーへ伝授する教習アプリ。

  ・完全自己完結 (依存ゼロ・単一 HTML・オフライン動作)
  ・ミニ Bada インタープリタ内蔵 (量子コア: qubit / H / CNOT / Measure,
    max-entropy prior / softmax / entropy / append-only 台帳 tuplespace)
  ・「BadaGPT 先生」チャット: 要件抽出 → 仕様化 → コード生成 → 実行&反復
    の 4 つの技を、実際に動くコード生成でデモしながら教える
  ・8 章カリキュラム + 自動判定つき演習 + 進捗保存 (localStorage)

  ラッパー: Android APK (Cordova) / Windows 10・11 EXE (Electron+NSIS) /
  Ubuntu AppImage・deb (Electron) — .github/workflows/badateach-app-build.yml
-->
<style>

  --bg:#0b0e14; --bg2:#11151f; --bg3:#171c29; --line:#252b3b;

}

html,body{height:100%}

nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:1px solid var(--line);color:var(--dim);

<header>
  <span class="mark">🥋</span>
  <div><h1>BadaGPT 道場</h1>

<main>
  <section id="pane-lessons">
    <div id="lesson-list"></div>
    <div id="lesson-view"></div>
  </section>

      <input id="chat-input" placeholder="作りたいアプリを日本語で頼んでください (例: サイコロアプリを作って)"/>

    </div>

<script>
"use strict";
/* ================================================================
 * 1. ミニ Bada インタープリタ (量子コア内蔵)
 * ================================================================ */
function softmax(z){
  var m=-Infinity,i; for(i=0;i<z.length;i++) if(z[i]>m) m=z[i];
  var s=0,e=[]; for(i=0;i<z.length;i++){ e[i]=Math.exp(z[i]-m); s+=e[i]; }
  for(i=0;i<e.length;i++) e[i]/=s; return e;
}
function entropy(p){
  var h=0,i; for(i=0;i<p.length;i++) if(p[i]>0) h-=p[i]*Math.log(p[i]);
  return h;
}
function unknownPrior(n){
  var a=[],i; for(i=0;i<n;i++) a.push(1/n); return a;
}
function updateDist(prior,ev){
  var q=[],s=0,i;
  for(i=0;i<prior.length;i++){ q[i]=prior[i]*(ev[i]||0); s+=q[i]; }
  if(s<=0) throw new Error("update: 事後確率がすべて 0 になりました");
  for(i=0;i<q.length;i++) q[i]/=s; return q;
}
/* --- 量子レジスタ: 複素振幅 (re, im) --- */
function qubitReg(n){
  var N=1<<n, re=new Array(N).fill(0), im=new Array(N).fill(0);
  re[0]=1;
  return {__qreg:true,nq:n,re:re,im:im};
}
function applyH(reg,t){
  var N=reg.re.length, s=Math.SQRT1_2;
  var re=reg.re.slice(), im=reg.im.slice(), b,p,ar,ai,br,bi;
  for(b=0;b<N;b++){
    if(((b>>t)&1)===0){
      p=b|(1<<t);
      ar=reg.re[b]; ai=reg.im[b]; br=reg.re[p]; bi=reg.im[p];
      re[b]=s*(ar+br); im[b]=s*(ai+bi);
      re[p]=s*(ar-br); im[p]=s*(ai-bi);
    }
  }
  return {__qreg:true,nq:reg.nq,re:re,im:im};
}
function applyX(reg,t){
  var N=reg.re.length, re=reg.re.slice(), im=reg.im.slice(), b,p;
  for(b=0;b<N;b++){
    if(((b>>t)&1)===0){
      p=b|(1<<t);
      re[b]=reg.re[p]; im[b]=reg.im[p]; re[p]=reg.re[b]; im[p]=reg.im[b];
    }
  }
  return {__qreg:true,nq:reg.nq,re:re,im:im};
}
function applyCNOT(reg,c,t){
  var N=reg.re.length, re=reg.re.slice(), im=reg.im.slice(), b,p;
  for(b=0;b<N;b++){
    if(((b>>c)&1)===1 && ((b>>t)&1)===0){
      p=b|(1<<t);
      re[b]=reg.re[p]; im[b]=reg.im[p]; re[p]=reg.re[b]; im[p]=reg.im[b];
    }
  }
  return {__qreg:true,nq:reg.nq,re:re,im:im};
}
function measureProbs(reg){
  var out=[],i,v;
  for(i=0;i<reg.re.length;i++){
    v=reg.re[i]*reg.re[i]+reg.im[i]*reg.im[i];
    out.push(Math.abs(v)<1e-12?0:Math.round(v*1e10)/1e10);
  }
  return out;
}
function mulberry32(seed){
  var a=seed>>>0;
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    var t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
/* --- 字句解析 --- */
function badaTokenize(src){
  var toks=[],i=0,n=src.length,line=1,c,j,q,s,two;
  while(i<n){
    c=src[i];
    if(c==="#"){ while(i<n&&src[i]!=="\n")i++; continue; }
    if(c==="\n"){ toks.push({t:"nl",line:line}); line++; i++; continue; }
    if(c===" "||c==="\t"||c==="\r"){ i++; continue; }
    if(c==='"'||c==="'"){
      q=c; s=""; i++;
      while(i<n&&src[i]!==q){
        if(src[i]==="\\"){
          var esc={n:"\n",t:"\t","\\":"\\",'"':'"',"'":"'"}[src[i+1]];
          s+=(esc!==undefined?esc:src[i+1]); i+=2;
        } else s+=src[i++];
      }
      if(i>=n) throw new Error(line+"行目: 文字列が閉じていません");
      i++; toks.push({t:"str",v:s,line:line}); continue;
    }
    if(/[0-9]/.test(c)||(c==="."&&/[0-9]/.test(src[i+1]||""))){
      j=i;
      while(j<n&&/[0-9.]/.test(src[j]))j++;
      toks.push({t:"num",v:parseFloat(src.slice(i,j)),line:line}); i=j; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      j=i; while(j<n&&/[A-Za-z0-9_]/.test(src[j]))j++;
      toks.push({t:"id",v:src.slice(i,j),line:line}); i=j; continue;
    }
    two=src.slice(i,i+2);
    if(two===":="||two===">>"||two==="=="||two==="!="||two==="<="||two===">="){
      toks.push({t:"op",v:two,line:line}); i+=2; continue;
    }
    if("+-*/%(),[]{}<>|".indexOf(c)>=0){
      toks.push({t:"op",v:c,line:line}); i++; continue;
    }
    throw new Error(line+"行目: 解釈できない文字「"+c+"」");
  }
  toks.push({t:"eof",line:line});
  return toks;
}
/* --- 構文解析 --- */
function badaParse(toks){
  var pos=0;
  function peek(){ return toks[pos]; }
  function next(){ return toks[pos++]; }
  function skipNl(){ while(peek().t==="nl") pos++; }
  function expectOp(v){
    var tk=next();
    if(tk.t!=="op"||tk.v!==v) throw new Error((tk.line||"?")+"行目: 「"+v+"」が必要です");
    return tk;
  }
  function parseBlock(){
    var stmts=[];
    skipNl();
    while(peek().t!=="eof"&&!(peek().t==="op"&&peek().v==="}")){
      stmts.push(parseStmt());
      skipNl();
    }
    return stmts;
  }
  function parseBraced(){
    skipNl(); expectOp("{");
    var body=parseBlock();
    expectOp("}");
    return body;
  }
  function parseStmt(){
    var tk=peek(),name,params,body,cond,thenB,elseB,e;
    if(tk.t==="id"&&tk.v==="repeat"){
      next(); e=parseExpr(); body=parseBraced();
      return {k:"repeat",count:e,body:body,line:tk.line};
    }
    if(tk.t==="id"&&tk.v==="for"){
      next();
      name=next();
      if(name.t!=="id") throw new Error(tk.line+"行目: for の後には変数名が必要です");
      var inTok=next();
      if(inTok.t!=="id"||inTok.v!=="in") throw new Error(tk.line+"行目: for には in が必要です");
      e=parseExpr(); body=parseBraced();
      return {k:"for",name:name.v,list:e,body:body,line:tk.line};
    }
    if(tk.t==="id"&&tk.v==="if"){
      next(); cond=parseExpr(); thenB=parseBraced(); elseB=null;
      skipNl();
      if(peek().t==="id"&&peek().v==="else"){ next(); elseB=parseBraced(); }
      return {k:"if",cond:cond,then:thenB,els:elseB,line:tk.line};
    }
    if(tk.t==="id"&&tk.v==="fun"){
      next(); name=next();
      if(name.t!=="id") throw new Error(tk.line+"行目: fun の後には関数名が必要です");
      expectOp("|"); params=[];
      while(!(peek().t==="op"&&peek().v==="|")){
        var p=next();
        if(p.t!=="id") throw new Error(tk.line+"行目: 引数名が不正です");
        params.push(p.v);
        if(peek().t==="op"&&peek().v===",") next();
      }
      expectOp("|"); body=parseBraced();
      return {k:"fun",name:name.v,params:params,body:body,line:tk.line};
    }
    if(tk.t==="id"&&tk.v==="return"){
      next();
      if(peek().t==="nl"||peek().t==="eof") return {k:"return",expr:null,line:tk.line};
      return {k:"return",expr:parseExpr(),line:tk.line};
    }
    if(tk.t==="id"&&toks[pos+1]&&toks[pos+1].t==="op"&&toks[pos+1].v===":="){
      next(); next();
      return {k:"assign",name:tk.v,expr:parseExpr(),line:tk.line};
    }
    e=parseExpr();
    if(peek().t==="op"&&peek().v===">>"){
      next();
      var tgt=next();
      if(tgt.t!=="id"||tgt.v!=="tuplespace")
        throw new Error(tk.line+"行目: >> の右辺は tuplespace のみです");
      return {k:"ledger",expr:e,line:tk.line};
    }
    return {k:"expr",expr:e,line:tk.line};
  }
  function parseExpr(){ return parseCmp(); }
  function parseCmp(){
    var l=parseAdd(),tk;
    while(peek().t==="op"&&["==","!=","<",">","<=",">="].indexOf(peek().v)>=0){
      tk=next(); l={k:"bin",op:tk.v,l:l,r:parseAdd(),line:tk.line};
    }
    return l;
  }
  function parseAdd(){
    var l=parseMul(),tk;
    while(peek().t==="op"&&(peek().v==="+"||peek().v==="-")){
      tk=next(); l={k:"bin",op:tk.v,l:l,r:parseMul(),line:tk.line};
    }
    return l;
  }
  function parseMul(){
    var l=parseUnary(),tk;
    while(peek().t==="op"&&(peek().v==="*"||peek().v==="/"||peek().v==="%")){
      tk=next(); l={k:"bin",op:tk.v,l:l,r:parseUnary(),line:tk.line};
    }
    return l;
  }
  function parseUnary(){
    if(peek().t==="op"&&peek().v==="-"){
      var tk=next();
      return {k:"un",op:"-",e:parseUnary(),line:tk.line};
    }
    return parsePostfix();
  }
  function parsePostfix(){
    var e=parsePrimary(),args,idx;
    for(;;){
      if(peek().t==="op"&&peek().v==="("&&e.k==="var"){
        next(); args=[];
        while(!(peek().t==="op"&&peek().v===")")){
          skipNl();
          args.push(parseExpr());
          skipNl();
          if(peek().t==="op"&&peek().v===",") next();
        }
        next();
        e={k:"call",name:e.name,args:args,line:e.line};
      } else if(peek().t==="op"&&peek().v==="["){
        next(); idx=parseExpr(); expectOp("]");
        e={k:"index",obj:e,idx:idx,line:e.line};
      } else break;
    }
    return e;
  }
  function parsePrimary(){
    var tk=next(),items,e;
    if(tk.t==="num") return {k:"num",v:tk.v,line:tk.line};
    if(tk.t==="str") return {k:"str",v:tk.v,line:tk.line};
    if(tk.t==="id")  return {k:"var",name:tk.v,line:tk.line};
    if(tk.t==="op"&&tk.v==="("){
      e=parseExpr(); expectOp(")"); return e;
    }
    if(tk.t==="op"&&tk.v==="["){
      items=[]; skipNl();
      while(!(peek().t==="op"&&peek().v==="]")){
        items.push(parseExpr());
        skipNl();
        if(peek().t==="op"&&peek().v===",") next();
        skipNl();
      }
      next();
      return {k:"list",items:items,line:tk.line};
    }
    throw new Error((tk.line||"?")+"行目: 式を解釈できません");
  }
  var prog=parseBlock();
  if(peek().t!=="eof") throw new Error(peek().line+"行目: 予期しない「}」");
  return prog;
}
/* --- 値の表示形式 --- */
function badaFmt(v){
  var s;
  if(typeof v==="number"){
    if(!isFinite(v)) return String(v);
    if(Number.isInteger(v)) return String(v);
    s=v.toFixed(5).replace(/0+$/,"").replace(/\.$/,"");
    return s;
  }
  if(typeof v==="string") return v;
  if(typeof v==="boolean") return v?"true":"false";
  if(Array.isArray(v)){
    var parts=[],i;
    for(i=0;i<v.length;i++) parts.push(badaFmt(v[i]));
    return "["+parts.join(", ")+"]";
  }
  if(v&&v.__qreg) return "qubit("+v.nq+")";
  if(v===null||v===undefined) return "nil";
  return String(v);
}
/* --- 実行 --- */
function badaRun(src,opts){
  opts=opts||{};
  var rng=(typeof opts.seed==="number")?mulberry32(opts.seed):Math.random;
  var out=[],ledger=[],funcs={},steps=0,MAX=200000;
  function tick(line){
    if(++steps>MAX) throw new Error((line||"?")+"行目: 実行ステップ数が上限を超えました (無限ループ?)");
  }
  function truthy(v){
    if(typeof v==="number") return v!==0;
    if(typeof v==="boolean") return v;
    if(typeof v==="string") return v.length>0;
    if(Array.isArray(v)) return v.length>0;
    return v!=null;
  }

        case "expr": evalExpr(s.expr,env); break;
        case "fun": funcs[s.name]={params:s.params,body:s.body}; break;
        case "return": throw {__ret:s.expr?evalExpr(s.expr,env):null};
        case "repeat":

          for(j=0;j<cnt;j++) execBlock(s.body,{vars:{},parent:env});

        case "for":
          list=evalExpr(s.list,env);

          for(j=0;j<list.length;j++){

function checkExercise(lessonId,code,opts){
  var l=null,i,ex,outText;
  for(i=0;i<LESSONS.length;i++) if(LESSONS[i].id===lessonId){ l=LESSONS[i]; break; }
  if(!l||!l.exercise) return {pass:false,message:"演習が見つかりません"};
  ex=l.exercise;
  try{ outText=badaRun(code,opts||{}); }
  catch(e){ return {pass:false,message:"実行エラー: "+(e&&e.message?e.message:e)}; }
  if(ex.mustCode)
    for(i=0;i<ex.mustCode.length;i++)
      if(code.indexOf(ex.mustCode[i])<0)
        return {pass:false,message:"コードに「"+ex.mustCode[i]+"」を使ってください"};
  if(ex.mustCodeAny){
    var hit=false;
    for(i=0;i<ex.mustCodeAny.length;i++)
      if(code.indexOf(ex.mustCodeAny[i])>=0){ hit=true; break; }
    if(!hit) return {pass:false,message:"量子コア ("+ex.mustCodeAny.join(" / ")+" のどれか) を使ってください"};
  }
  if(ex.mustOutput)
    for(i=0;i<ex.mustOutput.length;i++)
      if(outText.indexOf(ex.mustOutput[i])<0)
        return {pass:false,message:"出力に「"+ex.mustOutput[i]+"」が見つかりません"};
  if(ex.minLines){
    var lines=outText.split("\n").filter(function(s){return s.trim().length>0;});
    if(lines.length<ex.minLines)
      return {pass:false,message:"出力が "+ex.minLines+" 行以上になるようにしてください"};
  }
  if(ex.minOutLines){
    var lines2=outText.split("\n").filter(function(s){return s.trim().length>0;});
    if(lines2.length<ex.minOutLines)
      return {pass:false,message:"出力を "+ex.minOutLines+" 行以上にしてください (print を増やす)"};
  }
  return {pass:true,message:"合格! 次の章へ進みましょう。",output:outText};
}

    var k;

      panes[k].style.display=(k===name)?(k==="lessons"?"flex":(k==="dojo"?"flex":"block")):"none";
      tabs[k].classList.toggle("on",k===name);
    }

  var listEl=byId("lesson-list"), viewEl=byId("lesson-view"), current=0;

    listEl.innerHTML="";

      var d=document.createElement("div");
      d.className="item"+(i===current?" on":"");
      d.innerHTML=escapeHtml(l.title)+(progress[l.id]?'<span class="done">✔</span>':"");
      d.onclick=function(){ current=i; renderList(); renderLesson(); };

  function makeEditor(container,starter,runLabel,onRun){
    var box=document.createElement("div"); box.className="editor-box";

    var reset=document.createElement("button"); reset.className="act ghost"; reset.textContent="元に戻す";

    var ta=document.createElement("textarea"); ta.value=starter||"";
    ta.spellcheck=false;
    var out=document.createElement("div"); out.className="out";
    box.appendChild(bar); box.appendChild(ta); box.appendChild(out);
    container.appendChild(box);
    run.onclick=function(){
      out.classList.remove("err");
      try{
        var res=badaRun(ta.value);
        out.textContent=res||"(出力なし)";
        if(onRun) onRun(ta.value,res,null);
      }catch(e){
        out.classList.add("err");

        if(onRun) onRun(ta.value,null,e);

    }
    if(l.exercise){
      var xh=document.createElement("h3"); xh.textContent="✍️ 演習 (自動判定)"; viewEl.appendChild(xh);
      var xp=document.createElement("p"); xp.textContent=l.exercise.text; viewEl.appendChild(xp);
      var verdict=document.createElement("div"); verdict.className="verdict";
      var ed=makeEditor(viewEl,l.exercise.starter,"実行して判定",function(code){
        var r=checkExercise(l.id,code);
        verdict.className="verdict "+(r.pass?"ok":"ng");
        verdict.textContent=(r.pass?"🎖 ":"✖ ")+r.message;
        if(r.pass){ progress[l.id]=true; saveProgress(); renderList(); }
      });
      ed.box.after(verdict);
    }
    var navRow=document.createElement("div"); navRow.className="lesson-nav";
    if(current>0){
      var prev=document.createElement("button"); prev.className="act ghost"; prev.textContent="← 前の章";
      prev.onclick=function(){ current--; renderList(); renderLesson(); };
      navRow.appendChild(prev);
    }
    if(current<LESSONS.length-1){
      var nx=document.createElement("button"); nx.className="act"; nx.textContent="次の章 →";
      nx.onclick=function(){ current++; renderList(); renderLesson(); };
      navRow.appendChild(nx);
    }
    viewEl.appendChild(navRow);
  }
  renderList(); renderLesson();
  /* ---- 道場 (チャット) ---- */
  var log=byId("chat-log"), input=byId("chat-input"), send=byId("chat-send"),
      hint=byId("chat-hint"), dojoCtx={lastCode:null,lastAppName:null};
  function addMsg(cls,html){
    var d=document.createElement("div");
    d.className="msg "+cls; d.innerHTML=html;
    log.appendChild(d); log.scrollTop=log.scrollHeight;
    return d;
  }
  function renderHints(list){
    hint.innerHTML="";
    (list||[]).forEach(function(s){
      var sp=document.createElement("span"); sp.textContent=s;
      sp.onclick=function(){ input.value=s; doSend(); };
      hint.appendChild(sp);
    });
  }
  function addCodeMsg(code,appName){
    var d=addMsg("bot","");
    var wrap=document.createElement("div"); wrap.className="codewrap";
    var pre=document.createElement("pre"); pre.className="code"; pre.textContent=code;
    var row=document.createElement("div");
    var run=document.createElement("button"); run.className="act"; run.textContent="▶ 実行";
    var toEd=document.createElement("button"); toEd.className="act ghost"; toEd.textContent="📋 エディタへ (卒業試験)";
    var out=document.createElement("div"); out.className="out"; out.style.marginTop="6px";
    row.appendChild(run); row.appendChild(document.createTextNode(" ")); row.appendChild(toEd);
    wrap.appendChild(pre); wrap.appendChild(row); wrap.appendChild(out);
    var title=document.createElement("div"); title.className="step-title";
    title.textContent="📦 生成コード — "+(appName||"アプリ");
    d.appendChild(title); d.appendChild(wrap);
    run.onclick=function(){
      out.classList.remove("err");
      try{ out.textContent=badaRun(code)||"(出力なし)"; }
      catch(e){ out.classList.add("err"); out.textContent="✖ "+(e&&e.message?e.message:e); }
      log.scrollTop=log.scrollHeight;
    };
    toEd.onclick=function(){
      current=LESSONS.length-1;
      renderList(); renderLesson(); showPane("lessons");
      var tas=viewEl.querySelectorAll("textarea");
      if(tas.length) tas[tas.length-1].value=code;
    };
  }
  function doSend(){
    var msg=input.value.trim();
    if(!msg) return;
    input.value="";
    addMsg("user",escapeHtml(msg));
    var r=tutorReply(msg,dojoCtx);
    var delay=200;
    r.steps.forEach(function(st){
      setTimeout(function(){
        addMsg("bot",'<div class="step-title">'+st.icon+" "+escapeHtml(st.title)+"</div>"+st.html);
      },delay);
      delay+=350;
    });
    if(r.code){
      setTimeout(function(){ addCodeMsg(r.code,r.appName); },delay);
      dojoCtx.lastCode=r.code; dojoCtx.lastAppName=r.appName;
    }
    renderHints(r.followups);
  }
  send.onclick=doSend;
  input.addEventListener("keydown",function(e){ if(e.key==="Enter") doSend(); });
  addMsg("bot",'<div class="step-title">🥋 BadaGPT 先生</div>'+
    "ようこそ、道場へ。私は ChatGPT が使っている<b>応答でアプリを作る 4 つの技</b> — "+
    "①要件抽出 ②仕様化 ③コード生成 ④実行と反復 — を、実演しながら伝授します。<br>"+
    "作りたいアプリを日本語でどうぞ。生成の途中経過 (技の使いどころ) を全部見せます。");
  renderHints(["サイコロアプリを作って","ToDo アプリを作って","おみくじアプリを作って","ベル状態のデモを見せて"]);
  /* ---- リファレンス ---- */
  byId("pane-ref").innerHTML=[
    "<h2>📖 Bada 言語ミニリファレンス (道場サブセット)</h2>",
    "<h3>文</h3><table>",
    "<tr><th><code>x := 式</code></th><td>代入</td></tr>",
    "<tr><th><code>print(a, b, …)</code></th><td>空白区切りで 1 行表示</td></tr>",
    "<tr><th><code>値 &gt;&gt; tuplespace</code></th><td>append-only 台帳へ追記 (削除・上書き不可)</td></tr>",
    "<tr><th><code>repeat n { … }</code></th><td>n 回繰り返し</td></tr>",
    "<tr><th><code>for x in リスト { … }</code></th><td>要素を順に処理 (<code>tuplespace</code> も走査可)</td></tr>",
    "<tr><th><code>if 条件 { … } else { … }</code></th><td>条件分岐 (== != &lt; &gt; &lt;= &gt;=)</td></tr>",
    "<tr><th><code>fun 名 |a, b| { … return 式 }</code></th><td>関数定義</td></tr>",
    "<tr><th><code># コメント</code></th><td>行末までコメント</td></tr>",
    "</table>",
    "<h3>確率・情報</h3><table>",
    "<tr><th><code>unknown_prior(n)</code></th><td>n 状態の最大エントロピー一様分布</td></tr>",
    "<tr><th><code>softmax(リスト)</code></th><td>ロジット → 確率分布</td></tr>",
    "<tr><th><code>update(prior, ev)</code></th><td>ベイズ更新 (要素積を正規化) — エントロピーは必ず下がる</td></tr>",
    "<tr><th><code>entropy(p)</code></th><td>シャノンエントロピー (自然対数)</td></tr>",
    "<tr><th><code>zeros_of(p)</code></th><td>確率 0 (禁止状態) の添字一覧</td></tr>",
    "</table>",
    "<h3>量子コア</h3><table>",
    "<tr><th><code>qubit(n)</code></th><td>n 量子ビットのレジスタ (|0…0⟩, n ≤ 10)</td></tr>",
    "<tr><th><code>H(reg, i)</code> / <code>Had(reg)</code></th><td>アダマール — 重ね合わせ</td></tr>",
    "<tr><th><code>X(reg, i)</code></th><td>ビット反転 (NOT)</td></tr>",
    "<tr><th><code>CNOT(reg, c, t)</code></th><td>制御 NOT — もつれ</td></tr>",
    "<tr><th><code>Measure(reg)</code></th><td>各基底状態の確率 |ψ|² のリスト</td></tr>",
    "<tr><th><code>sample(p)</code></th><td>分布 p から添字を 1 つ抽選 (量子乱数)</td></tr>",
    "</table>",
    "<h3>ユーティリティ</h3><table>",
    "<tr><th><code>len(x)</code></th><td>リスト・文字列・台帳の長さ</td></tr>",
    "<tr><th><code>range(n)</code></th><td>[0, 1, …, n−1]</td></tr>",
    "<tr><th><code>push(リスト, v)</code></th><td>リスト末尾に追加</td></tr>",
    "<tr><th><code>pick(リスト)</code></th><td>ランダムに 1 要素</td></tr>",
    "<tr><th><code>f5(x)</code></th><td>小数 5 桁の文字列</td></tr>",
    "<tr><th><code>sqrt abs floor round str num</code></th><td>数学・変換</td></tr>",
    "</table>",
    "<h3>4 つの技 (おさらい)</h3>",
    "<p>① 依頼を箇条書きの要件に → ② 入力・処理・出力・状態の仕様表に → "+
    "③ 言語の型 (テンプレート) に流し込んでコードに → ④ 実行して出力を読み、差分だけ応答で直す。</p>"
  ].join("");
}
/* テスト用エクスポート (Node) と UI 起動 (ブラウザ) */
if(typeof globalThis!=="undefined"){
  globalThis.BadaTeach={
    badaRun:badaRun, tutorReply:tutorReply, checkExercise:checkExercise,
    softmax:softmax, entropy:entropy, unknownPrior:unknownPrior,
    applyH:applyH, applyCNOT:applyCNOT, qubitReg:qubitReg,
    measureProbs:measureProbs, LESSONS:LESSONS, APP_TEMPLATES:APP_TEMPLATES
  };
}
if(typeof document!=="undefined"&&document.getElementById){
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",initUI);
  else initUI();
}
</script>
</body>
</html>
