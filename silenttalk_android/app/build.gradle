plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bada.silenttalk'
    compileSdk 34

    defaultConfig {
        applicationId "com.bada.silenttalk"
        minSdk 24          // Android 7.0+; gesture dispatch + CameraX + ML Kit
        targetSdk 31       // Android 12 runtime behaviour
        versionCode 1
        versionName "1.0"
    }

    // Stable, committed debug key so every CI build is signed identically
    // (otherwise updating a previously-installed build fails to install).
    signingConfigs {
        debug {
            storeFile file("bada-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Camera pipeline for gaze / facial-expression tracking
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"

    // Lets a Service act as a LifecycleOwner for CameraX
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    // On-device face detection (head pose, eye-open, smile)
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
