[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-mobius-drive"
version = "0.1.0"
description = "擬似量子VM × メビウス回路HDD × 反ダランベルシアン場の内部統制シミュレーション（反重力の実機ではなく研究/アート用）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Masaaki Yamaguchi" }]
keywords = ["mobius", "dalembertian", "pseudo-quantum", "simulation", "bada", "omega"]
dependencies = []

[project.scripts]
omega-mobius-drive = "omega_mobius_drive.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["omega_mobius_drive"]
