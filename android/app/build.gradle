plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bada.hologram'
    compileSdk 34

    defaultConfig {
        applicationId "com.bada.hologram"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // built unsigned in CI; the debug APK is the downloadable artifact
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // intentionally dependency-free: a plain Activity + WebView, no AppCompat
}
