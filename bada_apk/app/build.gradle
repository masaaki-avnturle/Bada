plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yamaguchi.bada'
    compileSdk 34

    defaultConfig {
        // Public app identity — renamed off "com.yamaguchi.bada" to avoid the
        // Samsung Bada OS codename conflict. (The internal source/library
        // namespace stays com.yamaguchi.bada — that is the Bada framework.)
        applicationId "com.yamaguchi.noema"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.2.0"
    }

    signingConfigs {
        // A FIXED debug keystore checked into the repo, so every build (local
        // and CI) is signed with the SAME key. Without this, GitHub Actions
        // generates a fresh random debug key each run, and installing a new
        // build over an old one fails with "package conflicts with an existing
        // package" (signature mismatch). Standard debug credentials.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'com.google.android.material:material:1.12.0'
}
