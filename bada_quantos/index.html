<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Bada QuantOS — 擬似量子オペレーティングシステム</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#111623; --panel:#151b2c; --line:#26304a;
    --tx:#dbe4ff; --dim:#8b97b8; --acc:#7c5cff; --acc2:#2dd4bf; --warn:#f59e0b; --err:#f87171;
    --ket:#a78bfa;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(1200px 700px at 70% -10%, #1a2340 0%, var(--bg) 55%);
    color:var(--tx); font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ── ステータスバー ── */
  #statusbar{
    display:flex; align-items:center; gap:10px; padding:8px 14px; font-size:12px; color:var(--dim);
    border-bottom:1px solid var(--line); background:rgba(11,14,20,.8); backdrop-filter:blur(6px);
  }
  #statusbar b{ color:var(--tx); font-weight:600; }
  #sbKet{ margin-left:auto; color:var(--ket); font-family:ui-monospace,Consolas,monospace; }
  #sbDev{ color:var(--acc2); }
  /* ── ホーム画面 ── */
  #screen{ flex:1; overflow:auto; position:relative; }
  #home{ padding:18px 14px 28px; }
  #homeHead{ text-align:center; margin:10px 0 16px; }
  #homeHead h1{ font-size:22px; letter-spacing:.06em; }
  #homeHead h1 span{ color:var(--acc); }
  #homeHead p{ font-size:11.5px; color:var(--dim); margin-top:6px; line-height:1.7; }
  #grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
    gap:14px; max-width:640px; margin:0 auto;
  }
  .app{
    background:linear-gradient(160deg,var(--panel),var(--bg2)); border:1px solid var(--line);
    border-radius:18px; padding:12px 6px 9px; text-align:center; cursor:pointer; user-select:none;
    transition:transform .08s, border-color .15s;
  }
  .app:active{ transform:scale(.94); }
  .app:hover{ border-color:var(--acc); }
  .app .ic{ font-size:30px; line-height:1.2; }
  .app .nm{ font-size:11.5px; margin-top:6px; }
  .app .kt{ font-size:9.5px; color:var(--ket); font-family:ui-monospace,Consolas,monospace; margin-top:3px; }
  /* ── アプリパネル ── */
  #panel{ display:none; position:absolute; inset:0; background:var(--bg); overflow:auto; padding-bottom:24px; }
  #panelBar{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:rgba(11,14,20,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(6px);
  }
  #panelBar button{ font-size:13px; }
  #panelTitle{ font-size:15px; font-weight:600; }
  #panelKet{ margin-left:auto; font-size:11px; color:var(--ket); font-family:ui-monospace,Consolas,monospace; }
  #panelBody{ padding:16px 14px; max-width:760px; margin:0 auto; }
  /* ── 部品 ── */
  button{
    background:linear-gradient(160deg,#232c48,#1a2136); color:var(--tx); border:1px solid var(--line);
    border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer; font-family:inherit;
  }
  button:active{ transform:scale(.96); }
  button.acc{ background:linear-gradient(160deg,var(--acc),#5a3fd8); border-color:transparent; }
  button.grn{ background:linear-gradient(160deg,#0f9d84,#0b7a67); border-color:transparent; }
  input,textarea,select{
    background:var(--bg2); color:var(--tx); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; font-size:14px; font-family:inherit; width:100%;
  }
  textarea{ font-family:ui-monospace,Consolas,monospace; min-height:110px; }
  pre{
    background:#0a0d16; border:1px solid var(--line); border-radius:10px; padding:11px;
    font-size:12.5px; line-height:1.6; overflow:auto; font-family:ui-monospace,Consolas,monospace;
    white-space:pre-wrap; word-break:break-all;
  }
  .row{ display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; align-items:center; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px; margin:10px 0; }
  .hint{ font-size:11.5px; color:var(--dim); line-height:1.8; }
  .tag{ display:inline-block; font-size:10.5px; color:var(--acc2); border:1px solid var(--line); border-radius:99px; padding:1px 9px; margin:2px 3px 2px 0; }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th,td{ border-bottom:1px solid var(--line); padding:6px 5px; text-align:left; }
  th{ color:var(--dim); font-weight:500; }
  td.mono, .mono{ font-family:ui-monospace,Consolas,monospace; color:var(--ket); }
  /* ── ダイヤルパッド ── */
  #dialNum{ font-size:26px; text-align:center; letter-spacing:.08em; font-family:ui-monospace,Consolas,monospace; min-height:40px; padding:6px; }
  #pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; max-width:300px; margin:12px auto; }
  #pad button{ font-size:20px; padding:14px 0; border-radius:14px; }
  /* ── 電卓 ── */
  #calcDisp{ font-size:24px; text-align:right; font-family:ui-monospace,Consolas,monospace; padding:10px; }
  #calcPad{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:340px; margin:12px auto; }
  #calcPad button{ font-size:18px; padding:13px 0; }
  /* ── AI ログ ── */
  .msgU,.msgA{ border-radius:14px; padding:10px 13px; margin:8px 0; max-width:92%; font-size:13.5px; line-height:1.75; white-space:pre-wrap; word-break:break-word; }
  .msgU{ background:#233054; margin-left:auto; }
  .msgA{ background:var(--panel); border:1px solid var(--line); }
  details{ margin-top:7px; font-size:11.5px; color:var(--dim); }
  details pre{ margin-top:6px; }
  /* ── コマンドバー ── */
  /* 下部は フロー配置で「タスクバー → コマンドバー」の順に積む
     (固定配置にすると フリーフォームのタスクバーを覆ってしまう) */
  #cmdbar{
    flex:none; display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(13,17,28,.95); border-top:1px solid var(--line); backdrop-filter:blur(8px); z-index:20;
  }
  #cmdbar input{ flex:1; border-radius:99px; padding:10px 16px; }
  #cmdbar button{ border-radius:99px; }
  .gitem{ display:inline-block; margin:5px; }
  .gitem img{ max-width:150px; border-radius:10px; border:1px solid var(--line); display:block; }
  video,canvas{ max-width:100%; border-radius:12px; border:1px solid var(--line); }
  /* ── フリーフォーム / マルチウィンドウ (Samsung DeX 風) ── */
  #sbMode{ cursor:pointer; border:1px solid var(--line); border-radius:99px; padding:2px 10px; font-size:11px; }
  #sbMode:hover{ border-color:var(--acc); color:var(--tx); }
  /* デスクトップ層は素通し。窓とツールバーだけが操作を受ける
     → 背後のホーム(アイコン)からいつでも次のアプリを開ける */
  #desktop{ display:none; position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  /* フリーフォーム中のホームは、タスクバーの「⊞ アプリ」で呼び出す
     ランチャー(アプリ一覧)として窓の上に重ねる */
  #home.launcher{
    position:absolute; inset:0; z-index:9000; overflow:auto;
    background:rgba(11,14,20,.96); padding-top:60px;
  }
  #tbApps{ border-color:var(--acc); color:var(--tx); font-weight:600; }
  #wmBar{
    pointer-events:auto;   /* 窓より前面 — 整列ボタンが窓に隠れないこと */
    position:absolute; left:0; right:0; top:0; z-index:8000; display:flex; gap:6px; flex-wrap:wrap;
    align-items:center; padding:7px 12px; background:rgba(13,17,28,.82); border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px); font-size:11.5px; color:var(--dim);
  }
  #wmBar button{ font-size:11.5px; padding:4px 10px; border-radius:8px; }
  #wmBraid{ margin-left:auto; color:var(--ket); font-family:ui-monospace,Consolas,monospace; }
  .win{
    pointer-events:auto;
    position:absolute; display:flex; flex-direction:column; background:var(--bg);
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    box-shadow:0 18px 44px rgba(0,0,0,.55);
  }
  .win.focus{ border-color:var(--acc); box-shadow:0 22px 52px rgba(0,0,0,.65), 0 0 0 1px var(--acc); }
  .winbar{
    display:flex; align-items:center; gap:8px; padding:7px 9px; cursor:move; user-select:none;
    background:linear-gradient(180deg,#1b2338,#151b2c); border-bottom:1px solid var(--line); font-size:12.5px;
  }
  .winbar .wt{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .winbar .wk{ color:var(--ket); font-family:ui-monospace,Consolas,monospace; font-size:10px; margin-left:auto; }
  .winbar button{ padding:1px 7px; font-size:12px; border-radius:6px; line-height:1.5; }
  .winbody{ flex:1; overflow:auto; padding:10px 12px; }
  .grip{ position:absolute; right:0; bottom:0; width:20px; height:20px; cursor:nwse-resize;
         background:linear-gradient(135deg,transparent 48%,var(--line) 50%,transparent 58%,var(--line) 62%,transparent 70%); }
  #snapHint{ position:absolute; display:none; border:2px dashed var(--acc); border-radius:12px;
             background:rgba(124,92,255,.14); pointer-events:none; z-index:9999; }
  #taskbar{
    flex:none; display:none; gap:7px; align-items:center; overflow-x:auto; padding:7px 12px;
    background:rgba(13,17,28,.95); border-top:1px solid var(--line); font-size:11.5px;
  }
  #taskbar .tb{ display:flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:9px;
                padding:4px 10px; cursor:pointer; white-space:nowrap; background:var(--bg2); }
  #taskbar .tb.on{ border-color:var(--acc); color:var(--tx); }
  #taskbar .tb.mini{ opacity:.55; }
</style>
</head>
<body>
  <div id="statusbar">
    <b>⚛ QuantOS</b>
    <span id="sbDev"></span>
    <span id="sbTime"></span>
    <span id="sbMode" onclick="wmToggleMode()" title="全画面 ⇄ フリーフォーム (マルチウィンドウ)">🗖 全画面</span>
    <span id="sbKet">Ψ = |0000⟩</span>
  </div>

  <div id="screen">
    <div id="home">
      <div id="homeHead">
        <h1>Bada <span>QuantOS</span></h1>
        <p>擬似量子コンピュータ(集大成)のオペレーティングシステム — カーネルは生成AI。<br/>
        タブレット・スマートフォンの全機能を<b>トポロジーの写像機構</b>(結び目不変量 ↦ 量子レジスタ基底)で移植。<br/>
        通信と保管は <b>BB84 量子鍵配送 + ワンタイムパッド</b>の量子暗号方式で保護。<br/>
        <b>インストール済みアプリの起動と Play ストア</b>にも対応(market: インテント)。<br/>
        <b>Samsung フリーフォーム / マルチウィンドウ</b>対応 — 窓の重なりは組み紐として不変量を計算。</p>
      </div>
      <div id="grid"></div>
    </div>
    <div id="panel">
      <div id="panelBar">
        <button onclick="closeApp()">◀ ホーム</button>
        <span id="panelTitle"></span>
        <span id="panelKet"></span>
      </div>
      <div id="panelBody"></div>
    </div>
    <div id="desktop">
      <div id="wmBar">
        <b style="color:var(--tx)">🗔 フリーフォーム</b>
        <button onclick="wmDo('split2')">▥ 左右2分割</button>
        <button onclick="wmDo('vsplit2')">▤ 上下2分割</button>
        <button onclick="wmDo('split3')">⬒ 3分割</button>
        <button onclick="wmDo('grid4')">▦ 格子4</button>
        <button onclick="wmDo('cascade')">🗗 カスケード</button>
        <button onclick="wmDo('max')">⛶ 最大化</button>
        <button onclick="wmCloseAll()">✕ すべて閉じる</button>
        <span id="wmBraid"></span>
      </div>
      <div id="snapHint"></div>
    </div>
  </div>

  <div id="taskbar"></div>

  <div id="cmdbar">
    <input id="cmdInput" placeholder="AIカーネルへ — 例:「090-1234-5678 に電話」「写真を撮って」「1+2*3」"
           onkeydown="if(event.key==='Enter')cmdSend()"/>
    <button class="acc" onclick="cmdSend()">実行</button>
  </div>

<script>
"use strict";
/* =====================================================================
 * Bada QuantOS — 擬似量子オペレーティングシステム
 *
 *  今までの集大成である擬似量子コンピュータ (量子 Bada 実行系) を核に、
 *  タブレット・スマートフォンの機能 (電話回線 / SMS / メール / カメラ /
 *  時計 / 電卓 / メモ / ファイル / 連絡先) を、トポロジーの写像機構
 *  (各機能に結び目=カール列を割り当て、Kauffman ブラケット不変量
 *   (−A³)^w で分類し、量子レジスタの基底状態へ単射に写像) によって
 *  「生成 AI がカーネルである OS」へ移植したアプリケーション。
 *
 *  依存ゼロ・単一 HTML・オフライン動作。電話・SMS・メールの発信は
 *  端末 OS の回線機能へ tel: / sms: / mailto: インテントとして委譲します
 *  (Android APK では Cordova の allow-intent 経由で実際の電話アプリが
 *   起動します。デスクトップでは発行内容を表示します)。
 *
 *  エンジン構成 (純ロジック — tools/engine-test.js が Node で検証):
 *   1. qkInterpret     — 擬似量子カーネル (qubit/H/X/Z/CNOT/measure/state/let/print)
 *   2. topoInvariant   — 結び目 (カール列) の不変量: 交点数 c, ライズ w, ⟨K⟩=(−A³)^w
 *   3. topoMap         — 機能 ↦ 量子レジスタ基底 |b₀b₁b₂b₃⟩ の単射写像 φ
 *   4. topoRoute       — 機能間の連続変形 (ハイパーキューブ辺に沿う X ゲート列)
 *   5. deviceProfile   — 端末判定 (スマートフォン / タブレット / デスクトップ)
 *   6. calcEval        — 電卓 (再帰下降パーサ。eval 不使用)
 *   7. intentDetect    — 意図解析 (自然言語 → OS 機能)
 *   8. aiKernel        — 生成AIカーネル: トークン化→意図→写像→計画→生成→検証
 *   9. osDispatch      — 実行系: tel:/sms:/mailto: 発行・アプリ起動
 * ===================================================================== */

/* ── 環境ガード (Node テスト環境では DOM / navigator が無い) ── */
var UA      = (typeof navigator !== "undefined" && navigator.userAgent) ? navigator.userAgent : "";
var SCREENW = (typeof window !== "undefined" && window.innerWidth) ? window.innerWidth : 1280;
function store(k, v){ try{ localStorage.setItem("quantos:" + k, JSON.stringify(v)); }catch(e){} }
function load(k, d){ try{ var s = localStorage.getItem("quantos:" + k); return s === null || s === undefined ? d : JSON.parse(s); }catch(e){ return d; } }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ════════════════════════════════════════════════════════════════════
 * 1. 擬似量子カーネル — 量子 Bada インタープリタ
 *    H/X/Z/CNOT は実振幅で閉じるため複素数は不要 (集大成の実行系)
 * ════════════════════════════════════════════════════════════════════ */
function qkInterpret(src){
  var out = [];
  var names = [];                 // 量子ビット名 → 添字
  var state = null;               // 実振幅の状態ベクトル (長さ 2^n)
  var vars = {};                  // let 変数
  function qi(name){
    var i = names.indexOf(name);
    if (i < 0) throw new Error("未宣言の量子ビット: " + name + " (先に qubit 宣言)");
    return i;
  }
  function bitOf(k, i){ return (k >> (names.length - 1 - i)) & 1; }
  function ketStr(k){
    var s = "";
    for (var i = 0; i < names.length; i++) s += bitOf(k, i);
    return "|" + s + "⟩";
  }
  function applyH(t){
    var n = names.length, ns = new Float64Array(1 << n), r = Math.SQRT1_2;
    for (var k = 0; k < state.length; k++){
      if (!state[k]) continue;
      var flip = k ^ (1 << (n - 1 - t));
      if (bitOf(k, t) === 0){ ns[k] += r * state[k]; ns[flip] += r * state[k]; }
      else                  { ns[flip] += r * state[k]; ns[k] -= r * state[k]; }
    }
    state = ns;
  }
  function applyX(t){
    var n = names.length, ns = new Float64Array(1 << n);
    for (var k = 0; k < state.length; k++){ if (state[k]) ns[k ^ (1 << (n - 1 - t))] += state[k]; }
    state = ns;
  }
  function applyZ(t){
    for (var k = 0; k < state.length; k++){ if (bitOf(k, t) === 1) state[k] = -state[k]; }
  }
  function applyCNOT(c, t){
    if (c === t) throw new Error("CNOT の制御と標的が同じです");
    var n = names.length, ns = new Float64Array(1 << n);
    for (var k = 0; k < state.length; k++){
      if (!state[k]) continue;
      ns[bitOf(k, c) === 1 ? (k ^ (1 << (n - 1 - t))) : k] += state[k];
    }
    state = ns;
  }
  function stateLines(){
    var lines = [];
    for (var k = 0; k < state.length; k++){
      if (Math.abs(state[k]) > 1e-9) lines.push("  " + ketStr(k) + " " + state[k].toFixed(3));
    }
    return lines.length ? lines : ["  (零ベクトル)"];
  }
  function evalExpr(e){
    var toks = e.match(/\d+\.?\d*|[A-Za-z_]\w*|[+\-*/()]/g) || [];
    var pos = 0;
    function peek(){ return toks[pos]; }
    function factor(){
      var t = toks[pos++];
      if (t === "(") { var v = addsub(); if (toks[pos++] !== ")") throw new Error("括弧が閉じていません"); return v; }
      if (t === "-") return -factor();
      if (/^\d/.test(t)) return parseFloat(t);
      if (t in vars) return vars[t];
      throw new Error("未定義の変数: " + t);
    }
    function muldiv(){
      var v = factor();
      while (peek() === "*" || peek() === "/"){ var op = toks[pos++]; var r = factor(); v = op === "*" ? v * r : v / r; }
      return v;
    }
    function addsub(){
      var v = muldiv();
      while (peek() === "+" || peek() === "-"){ var op = toks[pos++]; var r = muldiv(); v = op === "+" ? v + r : v - r; }
      return v;
    }
    var res = addsub();
    if (pos < toks.length) throw new Error("式を解釈できません: " + e);
    return res;
  }
  var lines = String(src).split(/\n/);
  try{
    for (var li = 0; li < lines.length; li++){
      var line = lines[li].trim();
      if (!line || line.charAt(0) === "#") continue;
      var m;
      if ((m = line.match(/^qubit\s+(.+)$/i))){
        names = m[1].trim().split(/\s+/);
        if (names.length > 8) throw new Error("量子ビットは 8 個まで");
        state = new Float64Array(1 << names.length); state[0] = 1;
        out.push("qubit " + names.join(" ") + " (" + names.length + "量子ビット)");
      }
      else if ((m = line.match(/^H\s+(\S+)$/i))){ if(!state) throw new Error("先に qubit 宣言"); applyH(qi(m[1])); out.push("H " + m[1]); }
      else if ((m = line.match(/^X\s+(\S+)$/i))){ if(!state) throw new Error("先に qubit 宣言"); applyX(qi(m[1])); out.push("X " + m[1]); }
      else if ((m = line.match(/^Z\s+(\S+)$/i))){ if(!state) throw new Error("先に qubit 宣言"); applyZ(qi(m[1])); out.push("Z " + m[1]); }
      else if ((m = line.match(/^CNOT\s+(\S+)\s+(\S+)$/i))){ if(!state) throw new Error("先に qubit 宣言"); applyCNOT(qi(m[1]), qi(m[2])); out.push("CNOT " + m[1] + "→" + m[2]); }
      else if (/^state$/i.test(line)){ if(!state) throw new Error("先に qubit 宣言"); out.push.apply(out, stateLines()); }
      else if (/^measure$/i.test(line)){
        if(!state) throw new Error("先に qubit 宣言");
        var r = Math.random(), acc = 0, hit = 0;
        for (var k = 0; k < state.length; k++){ acc += state[k] * state[k]; if (r <= acc + 1e-12){ hit = k; break; } }
        state = new Float64Array(state.length); state[hit] = 1;
        out.push("measure → " + ketStr(hit));
      }
      else if ((m = line.match(/^let\s+([A-Za-z_]\w*)\s*=\s*(.+)$/i))){ vars[m[1]] = evalExpr(m[2]); }
      else if ((m = line.match(/^print\s+(.+)$/i))){ out.push("print → " + evalExpr(m[1])); }
      else throw new Error("解釈できない行: " + line);
    }
  }catch(e){
    out.push("!! " + e.message);
  }
  return out.join("\n");
}

/* ════════════════════════════════════════════════════════════════════
 * 2–4. トポロジー写像機構
 *   各 OS 機能に結び目 (Reidemeister I カール列 = ±1 の交点符号列) を
 *   割り当てる。カール列の Kauffman ブラケットは ⟨K⟩ = (−A³)^w
 *   (w = ライズ = 符号和) で、(交点数 c, ライズ w) の組が機能ごとに
 *   すべて異なるため、写像 φ: 機能 → 基底状態 |b₀b₁b₂b₃⟩ は単射。
 *   機能間の遷移はハイパーキューブの辺 (X ゲート 1 発 = ビット 1 反転)
 *   に沿った連続変形として表す。
 * ════════════════════════════════════════════════════════════════════ */
var OS_APPS = [
  { id:"ai",       name:"AIカーネル", icon:"🧠", knot:[],                 desc:"生成AIのOSシェル (核 = 自明結び目)" },
  { id:"phone",    name:"電話",       icon:"📞", knot:[1,1,1],            desc:"電話回線 — tel: インテントで発信" },
  { id:"contacts", name:"連絡先",     icon:"👥", knot:[-1,-1,-1],         desc:"連絡先帳 (端末内保存)" },
  { id:"sms",      name:"メッセージ", icon:"💬", knot:[1,1],              desc:"SMS — sms: インテントで送信" },
  { id:"mail",     name:"メール",     icon:"✉️", knot:[-1,-1],            desc:"メール — mailto: で作成" },
  { id:"camera",   name:"カメラ",     icon:"📷", knot:[1,1,1,1],          desc:"カメラ撮影 → ギャラリーへ" },
  { id:"gallery",  name:"ギャラリー", icon:"🖼", knot:[1,1,-1,-1],        desc:"撮影した写真" },
  { id:"clock",    name:"時計",       icon:"⏰", knot:[1],                desc:"時計・アラーム" },
  { id:"calc",     name:"電卓",       icon:"🧮", knot:[-1],               desc:"四則演算 (パーサ内蔵)" },
  { id:"notes",    name:"メモ",       icon:"📝", knot:[1,-1],             desc:"メモ帳 (自動保存)" },
  { id:"files",    name:"ファイル",   icon:"📁", knot:[1,1,1,-1],         desc:"仮想ファイルシステム" },
  { id:"qlab",     name:"量子ラボ",   icon:"⚛️", knot:[1,1,1,1,1],        desc:"量子 Bada コンソール" },
  { id:"topo",     name:"写像室",     icon:"🪢", knot:[-1,-1,-1,-1],      desc:"トポロジー写像の観測室" },
  { id:"settings", name:"設定",       icon:"⚙️", knot:[-1,-1,-1,-1,-1],   desc:"端末プロファイル・データ" },
  { id:"qcrypt",   name:"量子暗号",   icon:"🔐", knot:[1,1,-1,1,1],       desc:"BB84 量子鍵配送 + ワンタイムパッド + 量子金庫" },
  { id:"apps",     name:"アプリ",     icon:"🛒", knot:[1,1,1,-1,-1,-1],   desc:"インストール済みアプリの起動 + Play ストア" }
];
var TOPO_QUBITS = 4;   /* 2^4 = 16 基底 ≥ 機能数 14 → 単射写像が張れる */

function topoInvariant(knot){
  var w = 0;
  for (var i = 0; i < knot.length; i++) w += knot[i];
  var c = knot.length;
  /* カール列の Kauffman ブラケット: 各カールが (−A^{±3}) を掛ける */
  var bracket = (w === 0) ? "1" : "(−A" + (w > 0 ? "³" : "⁻³") + ")^" + Math.abs(w);
  return { crossings: c, writhe: w, bracket: bracket, aExp: 3 * w, key: c + ":" + w };
}

function topoMap(appId){
  var idx = -1, app = null;
  for (var i = 0; i < OS_APPS.length; i++){ if (OS_APPS[i].id === appId){ idx = i; app = OS_APPS[i]; break; } }
  if (!app) return null;
  var bits = "";
  for (var b = TOPO_QUBITS - 1; b >= 0; b--) bits += ((idx >> b) & 1);
  var prog = "qubit q0 q1 q2 q3";
  for (var j = 0; j < TOPO_QUBITS; j++){ if (bits.charAt(j) === "1") prog += "\nX q" + j; }
  prog += "\nstate";
  return {
    id: app.id, name: app.name, icon: app.icon, index: idx,
    ket: "|" + bits + "⟩",
    invariant: topoInvariant(app.knot),
    program: prog
  };
}

function topoRoute(fromId, toId){
  var a = topoMap(fromId), b = topoMap(toId);
  if (!a || !b) return null;
  var x = a.index ^ b.index, steps = [];
  for (var j = 0; j < TOPO_QUBITS; j++){
    if ((x >> (TOPO_QUBITS - 1 - j)) & 1) steps.push("X q" + j);
  }
  return {
    from: a, to: b, steps: steps, hamming: steps.length,
    note: "ハイパーキューブの辺に沿う連続変形 (" + steps.length + " ステップ)。" +
          "各機能の結び目不変量 (c, w) は変形の間も保存されます。"
  };
}

/* ════════════════════════════════════════════════════════════════════
 * 5. 端末プロファイル — このタブレット / スマートフォンを判定
 * ════════════════════════════════════════════════════════════════════ */
function deviceProfile(ua, width){
  ua = ua || ""; width = width || 1280;
  var kind;
  if (/Android/i.test(ua))            kind = /Mobile/i.test(ua) ? "smartphone" : "tablet";
  else if (/iPhone|iPod/i.test(ua))   kind = "smartphone";
  else if (/iPad/i.test(ua))          kind = "tablet";
  else                                kind = "desktop";
  var label = kind === "smartphone" ? "スマートフォン" : kind === "tablet" ? "タブレット" : "デスクトップ";
  var tel = kind !== "desktop";
  var android = /Android/i.test(ua);
  /* Samsung 端末判定 (Galaxy の型番 SM-xxxx / SamsungBrowser / Samsung)。
     DeX は Android でありながら Mobile を名乗らないデスクトップ相当の
     UA になるため、Samsung かつ Android かつ非 Mobile を DeX とみなす。 */
  var samsung = /Samsung|SM-[A-Z]\d|SamsungBrowser|SAMSUNG/i.test(ua);
  var dex = samsung && android && !/Mobile/i.test(ua);
  return {
    kind: kind, label: label, width: width,
    tel: tel, sms: tel, android: android,
    samsung: samsung, dex: dex,
    /* Android 7 (API 24) 以降はマルチウィンドウ (分割画面) が標準。
       Samsung One UI / DeX はさらにフリーフォーム (自由配置ウィンドウ) に対応。 */
    multiWindow: android, freeform: samsung && android,
    note: tel
      ? "電話回線・SMS は端末 OS へ tel:/sms: インテントとして委譲します"
      : "この端末には電話回線がないため、発信内容の表示のみ行います"
  };
}

/* ════════════════════════════════════════════════════════════════════
 * 5b. アプリランチャー + Play ストア
 *   端末にインストールされているアプリケーションを URL スキーム /
 *   market: インテントで起動し、Play ストア (com.android.vending) を
 *   market://details?id= (アプリページ) / market://search?q= (検索) で
 *   開く。Android APK では Cordova の allow-intent により端末 OS が
 *   対応アプリへディスパッチする (未インストールなら Play ストアの
 *   アプリページが開き、そこからインストールできる)。
 * ════════════════════════════════════════════════════════════════════ */
var APP_CATALOG = [
  { id:"playstore", name:"Play ストア", icon:"🛒", pkg:"com.android.vending",          scheme:"https://play.google.com/store",            alias:["play","プレイストア","playストア"] },
  { id:"youtube",   name:"YouTube",     icon:"▶️", pkg:"com.google.android.youtube",   scheme:"vnd.youtube://www.youtube.com",            alias:["youtube","ユーチューブ"] },
  { id:"line",      name:"LINE",        icon:"🟢", pkg:"jp.naver.line.android",        scheme:"line://",                                  alias:["line","ライン"] },
  { id:"maps",      name:"マップ",      icon:"🗺", pkg:"com.google.android.apps.maps", scheme:"geo:35.6812,139.7671",                     alias:["マップ","地図","maps"] },
  { id:"gmail",     name:"Gmail",       icon:"📮", pkg:"com.google.android.gm",        scheme:"googlegmail://",                           alias:["gmail","ジーメール"] },
  { id:"chrome",    name:"Chrome",      icon:"🌐", pkg:"com.android.chrome",           scheme:"googlechrome://navigate?url=https://www.google.com", alias:["chrome","クローム","ブラウザ"] },
  { id:"twitter",   name:"X (Twitter)", icon:"🐦", pkg:"com.twitter.android",          scheme:"twitter://timeline",                       alias:["twitter","ツイッター","エックス"] },
  { id:"instagram", name:"Instagram",   icon:"📸", pkg:"com.instagram.android",        scheme:"instagram://app",                          alias:["instagram","インスタ"] },
  { id:"facebook",  name:"Facebook",    icon:"📘", pkg:"com.facebook.katana",          scheme:"fb://feed",                                alias:["facebook","フェイスブック"] },
  { id:"whatsapp",  name:"WhatsApp",    icon:"💚", pkg:"com.whatsapp",                 scheme:"whatsapp://send",                          alias:["whatsapp","ワッツアップ"] },
  { id:"spotify",   name:"Spotify",     icon:"🎵", pkg:"com.spotify.music",            scheme:"spotify://",                               alias:["spotify","スポティファイ"] },
  { id:"tiktok",    name:"TikTok",      icon:"🎬", pkg:"com.zhiliaoapp.musically",     scheme:null,                                       alias:["tiktok","ティックトック"] }
];
function appCatalogFind(text){
  var t = String(text || "").toLowerCase();
  for (var i = 0; i < APP_CATALOG.length; i++){
    var c = APP_CATALOG[i];
    var names = [c.name.toLowerCase()].concat(c.alias);
    for (var j = 0; j < names.length; j++){
      if (names[j] && t.indexOf(String(names[j]).toLowerCase()) >= 0) return c;
    }
  }
  return null;
}
/* 隣接ウィンドウ起動 — Samsung マルチウィンドウ / DeX で「もう一方の窓」に開く。
   FLAG_ACTIVITY_LAUNCH_ADJACENT (0x00001000) + FLAG_ACTIVITY_NEW_TASK (0x10000000) を
   intent: URI の launchFlags に載せると、端末 OS が分割画面の隣に起動する。 */
function appAdjacentIntent(pkg){
  if (!pkg) return null;
  return "intent:#Intent;action=android.intent.action.MAIN;" +
         "category=android.intent.category.LAUNCHER;package=" + pkg +
         ";launchFlags=0x10001000;end";
}
function appLaunch(query){
  var q = String(query || "").trim();
  if (!q){
    var ps = APP_CATALOG[0];
    return { found: true, app: ps, launch: ps.scheme, store: ps.scheme, adjacent: appAdjacentIntent(ps.pkg) };
  }
  var hit = appCatalogFind(q);
  if (hit){
    var store = "market://details?id=" + hit.pkg;
    return { found: true, app: hit, launch: hit.scheme || store, store: store, adjacent: appAdjacentIntent(hit.pkg) };
  }
  var search = "market://search?q=" + encodeURIComponent(q);
  return { found: false, query: q, launch: search, store: search, adjacent: null };
}

/* ════════════════════════════════════════════════════════════════════
 * 5c. ウィンドウマネージャ — フリーフォーム / マルチウィンドウ
 *
 *   Samsung DeX・One UI のフリーフォーム (自由配置ウィンドウ) と
 *   マルチウィンドウ (分割画面) を QuantOS 自身のシェルとして実装する。
 *   重なり合うウィンドウは「組み紐 (braid)」として扱う: x 座標順に
 *   並べたストランドを重なり順 (z) へ並べ替える隣接互換の列が組み紐語
 *   σ₁σ₂… であり、上を通る窓が正の交差を作る。交差数は置換の転倒数に
 *   等しく一意に定まるので、その閉包の Kauffman ブラケット (−A³)^w を
 *   トポロジー写像機構と同じ不変量で計算できる。
 * ════════════════════════════════════════════════════════════════════ */
var WM_MIN_W = 260, WM_MIN_H = 180;

function wmNewState(vw, vh){
  return { mode: "fullscreen", wins: [], seq: 0, zTop: 0, focus: null,
           vw: vw || 1280, vh: vh || 800 };
}
function wmGet(st, id){
  for (var i = 0; i < st.wins.length; i++) if (st.wins[i].id === id) return st.wins[i];
  return null;
}
function wmFindApp(st, appId){
  for (var i = 0; i < st.wins.length; i++) if (st.wins[i].appId === appId) return st.wins[i];
  return null;
}
function wmVisible(st){
  var v = [];
  for (var i = 0; i < st.wins.length; i++) if (!st.wins[i].min) v.push(st.wins[i]);
  return v;
}
function wmDefaultRect(st, n){
  var w = Math.max(WM_MIN_W, Math.min(st.vw, Math.round(st.vw * 0.56)));
  var h = Math.max(WM_MIN_H, Math.min(st.vh, Math.round(st.vh * 0.64)));
  var x = 18 + (n % 6) * 26, y = 44 + (n % 6) * 24;
  if (x + w > st.vw) x = Math.max(0, st.vw - w);
  if (y + h > st.vh) y = Math.max(0, st.vh - h);
  return { x: x, y: y, w: w, h: h };
}
function wmFocus(st, id){
  var w = wmGet(st, id);
  if (!w) return st;
  st.zTop++; w.z = st.zTop; w.min = false; st.focus = id;
  return st;
}
function wmOpen(st, appId){
  var ex = wmFindApp(st, appId);
  if (ex) return wmFocus(st, ex.id);          /* 同じアプリは二重に開かない */
  var r = wmDefaultRect(st, st.seq);
  st.seq++; st.zTop++;
  var id = "w" + st.seq;
  st.wins.push({ id: id, appId: appId, x: r.x, y: r.y, w: r.w, h: r.h, z: st.zTop, min: false });
  st.focus = id;
  return st;
}
function wmClose(st, id){
  var rest = [];
  for (var i = 0; i < st.wins.length; i++) if (st.wins[i].id !== id) rest.push(st.wins[i]);
  st.wins = rest;
  if (st.focus === id){
    var top = null;
    for (var j = 0; j < st.wins.length; j++) if (!st.wins[j].min && (!top || st.wins[j].z > top.z)) top = st.wins[j];
    st.focus = top ? top.id : null;
  }
  return st;
}
function wmMinimize(st, id){
  var w = wmGet(st, id);
  if (!w) return st;
  w.min = true;
  if (st.focus === id){
    var top = null;
    for (var j = 0; j < st.wins.length; j++) if (!st.wins[j].min && (!top || st.wins[j].z > top.z)) top = st.wins[j];
    st.focus = top ? top.id : null;
  }
  return st;
}
function wmMove(st, id, x, y){
  var w = wmGet(st, id);
  if (!w) return st;
  w.x = Math.max(0, Math.min(x, st.vw - 40));
  w.y = Math.max(0, Math.min(y, st.vh - 32));
  return st;
}
function wmResize(st, id, width, height){
  var w = wmGet(st, id);
  if (!w) return st;
  w.w = Math.max(WM_MIN_W, Math.min(width, st.vw));
  w.h = Math.max(WM_MIN_H, Math.min(height, st.vh));
  return st;
}
/* 画面端へのスナップ (Samsung の分割画面ドロップと同じ操作感) */
function wmSnap(st, id, edge){
  var w = wmGet(st, id);
  if (!w) return st;
  var W = st.vw, H = st.vh, half2 = Math.round(W / 2), halfV = Math.round(H / 2);
  if (edge === "left")       { w.x = 0;      w.y = 0;     w.w = half2;     w.h = H; }
  else if (edge === "right") { w.x = half2;  w.y = 0;     w.w = W - half2; w.h = H; }
  else if (edge === "top")   { w.x = 0;      w.y = 0;     w.w = W;         w.h = halfV; }
  else if (edge === "bottom"){ w.x = 0;      w.y = halfV; w.w = W;         w.h = H - halfV; }
  else if (edge === "max")   { w.x = 0;      w.y = 0;     w.w = W;         w.h = H; }
  return st;
}
/* 分割レイアウト (Samsung マルチウィンドウ相当) */
var WM_LAYOUTS = {
  split2:  [[0,0,.5,1],[.5,0,.5,1]],
  vsplit2: [[0,0,1,.5],[0,.5,1,.5]],
  split3:  [[0,0,.5,1],[.5,0,.5,.5],[.5,.5,.5,.5]],
  grid4:   [[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]]
};
function wmTile(st, layout){
  var vis = wmVisible(st);
  vis.sort(function(a, b){ return a.z - b.z; });
  if (layout === "max"){
    var f = (st.focus && wmGet(st, st.focus)) || vis[vis.length - 1];
    if (f) wmSnap(st, f.id, "max");
    return st;
  }
  if (layout === "cascade"){
    for (var c = 0; c < vis.length; c++){
      var r = wmDefaultRect(st, c);
      vis[c].x = r.x; vis[c].y = r.y; vis[c].w = r.w; vis[c].h = r.h;
    }
    return st;
  }
  var cells = WM_LAYOUTS[layout];
  if (!cells) return st;
  for (var i = 0; i < vis.length && i < cells.length; i++){
    var cel = cells[i];
    vis[i].x = Math.round(cel[0] * st.vw); vis[i].y = Math.round(cel[1] * st.vh);
    vis[i].w = Math.round(cel[2] * st.vw); vis[i].h = Math.round(cel[3] * st.vh);
  }
  return st;
}
/* 重なり (z 順) を組み紐語にする。交差数 = 置換の転倒数 (一意)。 */
function wmBraidWord(st){
  var vis = wmVisible(st);
  vis.sort(function(a, b){ return (a.x - b.x) || (a.z - b.z); });
  var order = [], i;
  for (i = 0; i < vis.length; i++) order.push(vis[i].z);
  var word = [], sub = ["₀","₁","₂","₃","₄","₅","₆","₇","₈","₉"];
  for (i = 0; i < order.length; i++){
    for (var j = 0; j < order.length - 1 - i; j++){
      if (order[j] > order[j + 1]){
        var t = order[j]; order[j] = order[j + 1]; order[j + 1] = t;
        word.push("σ" + (String(j + 1).replace(/\d/g, function(d){ return sub[+d]; })));
      }
    }
  }
  var signs = [];
  for (i = 0; i < word.length; i++) signs.push(1);
  return {
    strands: vis.length, word: word, crossings: word.length,
    text: word.length ? word.join("") : "e (自明な組み紐 — 左右の並びと重なり順が一致)",
    invariant: topoInvariant(signs)
  };
}

/* 端末側マルチウィンドウの可否 (Android 7+ / Samsung フリーフォーム) */
function wmDeviceSupport(prof){
  if (!prof.android)
    return { multiWindow: false, freeform: false,
             note: prof.label + " では QuantOS 内蔵のフリーフォームで複数アプリを同時表示します" };
  if (prof.dex)
    return { multiWindow: true, freeform: true,
             note: "Samsung DeX を検出 — 端末側でも自由配置ウィンドウとして扱えます" };
  if (prof.samsung)
    return { multiWindow: true, freeform: true,
             note: "Samsung 端末 — 分割画面/ポップアップ表示 (フリーフォーム) に対応しています" };
  return { multiWindow: true, freeform: false,
           note: "Android のマルチウィンドウ (分割画面) に対応しています" };
}

/* ════════════════════════════════════════════════════════════════════
 * 6. 電卓 — 再帰下降パーサ (eval 不使用)
 * ════════════════════════════════════════════════════════════════════ */
function calcEval(expr){
  var toks = String(expr).match(/\d+\.?\d*|[+\-*/()%]/g);
  if (!toks || !toks.length) throw new Error("式が空です");
  var pos = 0;
  function peek(){ return toks[pos]; }
  function factor(){
    var t = toks[pos++];
    if (t === "(") { var v = addsub(); if (toks[pos++] !== ")") throw new Error("括弧が閉じていません"); return v; }
    if (t === "-") return -factor();
    if (t === "+") return factor();
    if (/^\d/.test(t)) return parseFloat(t);
    throw new Error("解釈できません: " + t);
  }
  function muldiv(){
    var v = factor();
    while (peek() === "*" || peek() === "/" || peek() === "%"){
      var op = toks[pos++], r = factor();
      if (op === "*") v = v * r; else if (op === "/") v = v / r; else v = v % r;
    }
    return v;
  }
  function addsub(){
    var v = muldiv();
    while (peek() === "+" || peek() === "-"){ var op = toks[pos++], r = muldiv(); v = op === "+" ? v + r : v - r; }
    return v;
  }
  var res = addsub();
  if (pos < toks.length) throw new Error("式の途中で終わりました");
  if (!isFinite(res)) throw new Error("結果が発散しました (0 除算など)");
  return res;
}

/* ════════════════════════════════════════════════════════════════════
 * 6b. 量子暗号方式 — BB84 量子鍵配送 + ワンタイムパッド (Vernam)
 *
 *   BB84: Alice が乱数ビットを乱択基底 (Z=+ / X=×) で量子ビットとして
 *   送出し、Bob も乱択基底で測定する。基底が一致した位置だけを残し
 *   (ふるい)、その一部を照合して量子ビット誤り率 QBER を推定する。
 *   盗聴者 Eve が途中で測定 (intercept-resend) すると、量子力学の
 *   複製不可能定理により基底一致位置にも約 25% の誤りが混入するため、
 *   QBER > 10% で盗聴を検出して鍵を破棄する。
 *   残りのビットが共有秘密鍵となり、ワンタイムパッド (XOR) で
 *   メッセージ・保存データ (量子金庫) を暗号化する。
 * ════════════════════════════════════════════════════════════════════ */
function qcBB84(n, eavesdrop){
  n = n || 64;
  var log = [];
  var sifted = [];          /* {a: Aliceのビット, b: Bobのビット} 基底一致位置のみ */
  for (var i = 0; i < n; i++){
    var aBit   = Math.random() < 0.5 ? 0 : 1;
    var aBase  = Math.random() < 0.5 ? 0 : 1;      /* 0 = Z(+), 1 = X(×) */
    var phBit  = aBit, phBase = aBase;             /* 送出中の光子の状態 */
    var eBase  = null, eBit = null;
    if (eavesdrop){
      /* Eve の intercept-resend: 乱択基底で測定 → 測った状態で再送出 */
      eBase = Math.random() < 0.5 ? 0 : 1;
      eBit  = (eBase === phBase) ? phBit : (Math.random() < 0.5 ? 0 : 1);
      phBit = eBit; phBase = eBase;
    }
    var bBase = Math.random() < 0.5 ? 0 : 1;
    var bBit  = (bBase === phBase) ? phBit : (Math.random() < 0.5 ? 0 : 1);
    var match = (bBase === aBase);
    if (match) sifted.push({ a: aBit, b: bBit });
    if (log.length < 12)
      log.push({ i: i, aBit: aBit, aBase: aBase ? "×" : "+", eve: eavesdrop ? (eBase ? "×" : "+") : "—",
                 bBase: bBase ? "×" : "+", bBit: bBit, keep: match });
  }
  /* ふるい後の前半を照合に消費して QBER を推定、後半が鍵になる */
  var check = Math.floor(sifted.length / 2), errors = 0;
  for (var c = 0; c < check; c++){ if (sifted[c].a !== sifted[c].b) errors++; }
  var qber = check ? errors / check : 0;
  var eveDetected = qber > 0.1;
  var key = [];
  if (!eveDetected){ for (var k = check; k < sifted.length; k++) key.push(sifted[k].a); }
  var keyHex = "";
  for (var h = 0; h + 4 <= key.length; h += 4)
    keyHex += (key[h] * 8 + key[h+1] * 4 + key[h+2] * 2 + key[h+3]).toString(16);
  return { n: n, sifted: sifted.length, checked: check, errors: errors,
           qber: qber, eveDetected: eveDetected, key: key, keyHex: keyHex, log: log };
}

/* ── ワンタイムパッド (XOR ストリーム)。鍵長 ≥ 本文長のとき情報理論的に安全 ── */
function qcTextBytes(s){
  var out = [], enc = encodeURIComponent(String(s));
  for (var i = 0; i < enc.length; i++){
    if (enc.charAt(i) === "%"){ out.push(parseInt(enc.substr(i + 1, 2), 16)); i += 2; }
    else out.push(enc.charCodeAt(i));
  }
  return out;
}
function qcBytesText(bytes){
  var s = "";
  for (var i = 0; i < bytes.length; i++) s += "%" + (bytes[i] < 16 ? "0" : "") + bytes[i].toString(16);
  return decodeURIComponent(s);
}
function qcKeystream(keyBits, nBytes){
  if (!keyBits || !keyBits.length) throw new Error("鍵がありません — 先に BB84 で鍵配送してください");
  var out = [], pos = 0;
  for (var i = 0; i < nBytes; i++){
    var v = 0;
    for (var j = 0; j < 8; j++){ v = (v << 1) | keyBits[pos % keyBits.length]; pos++; }
    out.push(v);
  }
  return out;
}
function qcEncrypt(text, keyBits){
  var pt = qcTextBytes(text), ks = qcKeystream(keyBits, pt.length), hex = "";
  for (var i = 0; i < pt.length; i++){
    var b = pt[i] ^ ks[i];
    hex += (b < 16 ? "0" : "") + b.toString(16);
  }
  return hex;
}
function qcDecrypt(hex, keyBits){
  hex = String(hex).replace(/\s+/g, "");
  if (!/^[0-9a-fA-F]*$/.test(hex) || hex.length % 2) throw new Error("暗号文 (16進) が不正です");
  var ct = [];
  for (var i = 0; i < hex.length; i += 2) ct.push(parseInt(hex.substr(i, 2), 16));
  var ks = qcKeystream(keyBits, ct.length), pt = [];
  for (var j = 0; j < ct.length; j++) pt.push(ct[j] ^ ks[j]);
  return qcBytesText(pt);
}

/* ════════════════════════════════════════════════════════════════════
 * 7. 意図解析 — 自然言語 → OS 機能
 * ════════════════════════════════════════════════════════════════════ */
function qTokenize(text){
  return String(text).match(/[A-Za-z0-9_.\-⟩|]+|[぀-ヿ一-鿿]+|[^\s]/g) || [];
}
function extractNumber(text){
  var m = String(text).match(/(\+?\d[\d\-()]{5,}\d)/);
  return m ? m[1].replace(/[()]/g, "") : null;
}
function intentDetect(text){
  var t = String(text).trim();
  var num = extractNumber(t);
  if (/^(qubit|H\s|X\s|Z\s|CNOT|measure|state|let\s|print\s)/m.test(t))
    return { intent: "quantum_code", code: t, why: "量子 Bada の予約語で始まるコード" };
  if (/暗号|BB84|鍵配送|盗聴|金庫|復号/i.test(t))
    return { intent: "qcrypt", eve: /盗聴|Eve/i.test(t), why: "量子暗号 (BB84 鍵配送・暗号化) の依頼" };
  if (/フリーフォーム|マルチウィンドウ|分割画面|ウィンドウ|窓|並べて|タイル|DeX|デックス/i.test(t)){
    var lay = /上下|縦/.test(t) ? "vsplit2" : /3\s*分割|三分割/.test(t) ? "split3"
            : /4|格子|田/.test(t) ? "grid4" : /カスケード|重ね/.test(t) ? "cascade"
            : /最大/.test(t) ? "max" : /分割|左右|並べ|タイル/.test(t) ? "split2" : null;
    return { intent: "window", layout: lay, why: "フリーフォーム / マルチウィンドウの依頼" +
             (lay ? " (レイアウト: " + lay + ")" : "") };
  }
  var capp = appCatalogFind(t);
  if (/インストール|プレイストア|playストア|play\s*store|ストア/i.test(t))
    return { intent: "store", query: capp ? capp.name
             : t.replace(/(を|の|で)?(プレイストア|playストア|play\s*store|ストア|インストール|検索|開いて|開く|使いたい|使う)(して|する)?(ください)?/gi, "").trim(),
             why: "Play ストアの依頼" };
  if (capp && /開|起動|使|見|聴|再生/.test(t))
    return { intent: "launch", query: capp.name, why: "インストール済みアプリの起動依頼 (" + capp.name + ")" };
  if (/アラーム|時計|何時|時刻|起こして/i.test(t))
    return { intent: "clock", hour: (t.match(/(\d{1,2})\s*時/) || [])[1] || null, why: "時計・アラームの依頼" };
  if (/電話|かけて|発信|call/i.test(t))
    return { intent: "phone", number: num, why: "発信の依頼" + (num ? " (番号抽出: " + num + ")" : "") };
  if (/SMS|メッセージ|ショートメール/i.test(t))
    return { intent: "sms", number: num, body: t.replace(/.*[「『]([^」』]*)[」』].*/, "$1"), why: "SMS 送信の依頼" };
  if (/メール|mail/i.test(t))
    return { intent: "mail", why: "メール作成の依頼" };
  if (/写真|カメラ|撮っ|撮影/i.test(t))
    return { intent: "camera", why: "撮影の依頼" };
  if (/ギャラリー|アルバム|画像を見/i.test(t))
    return { intent: "gallery", why: "写真閲覧の依頼" };
  if (/^[\d\s+\-*/().%]+$/.test(t) && /\d/.test(t) && /[+\-*/%]/.test(t))
    return { intent: "calc", expr: t, why: "数式そのもの" };
  if (/計算|電卓/i.test(t))
    return { intent: "calc", expr: (t.match(/[\d+\-*/().%\s]{3,}/) || [""])[0].trim() || null, why: "計算の依頼" };
  if (/メモ|note/i.test(t))
    return { intent: "notes", why: "メモの依頼" };
  if (/連絡先|アドレス帳/i.test(t))
    return { intent: "contacts", why: "連絡先の依頼" };
  if (/ファイル/i.test(t))
    return { intent: "files", why: "ファイル操作の依頼" };
  if (/トポロジー|写像|結び目|不変量/i.test(t))
    return { intent: "topo", why: "トポロジー写像の観測依頼" };
  if (/量子|ベル状態|もつれ|qubit/i.test(t))
    return { intent: "qlab", why: "量子計算の依頼" };
  if (/設定|プロファイル|端末情報/i.test(t))
    return { intent: "settings", why: "設定の依頼" };
  if (/アプリ/.test(t))
    return { intent: "apps", why: "アプリ一覧の依頼" };
  if (/ホーム|home/i.test(t))
    return { intent: "home", why: "ホームへ戻る" };
  return { intent: "chat", why: "対話 (機能語なし) — 生成応答" };
}

var INTENT_APP = {
  phone:"phone", sms:"sms", mail:"mail", camera:"camera", gallery:"gallery",
  clock:"clock", calc:"calc", notes:"notes", contacts:"contacts", files:"files",
  quantum_code:"qlab", qlab:"qlab", topo:"topo", settings:"settings", qcrypt:"qcrypt",
  apps:"apps", launch:"apps", store:"apps", window:"ai", chat:"ai", home:"ai"

  "了解しました。現在のレジスタは {ket}、端末は {dev} です。機能名を言えばトポロジー写像 φ に沿って遷移します。",

  var action = { type: "open", app: appId }, reply = "", plan = "", verify = "OK";
  if (it.intent === "phone"){
    if (it.number){
      action = { type: "tel", app: "phone", number: it.number };
      plan = "番号を検証 → tel: インテントを端末回線へ発行";

      verify = /^\+?\d[\d\-]{5,}\d$/.test(it.number) ? "番号形式 OK" : "番号形式が不正です";

    plan = "sms: インテントを構成";

  }
  else if (it.intent === "mail"){ plan = "mailto: を構成"; reply = "✉️ メール作成画面を開きます。"; }
  else if (it.intent === "calc" && it.expr){
    plan = "再帰下降パーサで式を評価";
    try { var v = calcEval(it.expr); reply = "🧮 " + it.expr + " = " + v; verify = "パーサ検算 OK"; }
    catch(e){ reply = "🧮 式を解釈できません: " + e.message; verify = "検証で棄却"; }
  }
  else if (it.intent === "quantum_code"){
    plan = "擬似量子カーネル qkInterpret で実行";
    reply = "⚛️ 量子 Bada を実行しました:\n" + qkInterpret(it.code);
    verify = reply.indexOf("!!") < 0 ? "実行 OK" : "実行系がエラーを報告";
  }
  else if (it.intent === "clock" && it.hour){
    action = { type: "open", app: "clock", hour: it.hour };
    plan = "時計を開いてアラーム時刻を提案";
    reply = "⏰ " + it.hour + " 時のアラームですね。時計を開きます。";
  }
  else if (it.intent === "window"){
    var sup = wmDeviceSupport(deviceProfile(UA, SCREENW));
    action = { type: "window", app: "ai", layout: it.layout };
    plan = "シェルをフリーフォームに切り替え" + (it.layout ? " → " + it.layout + " で整列" : "");
    reply = "🗔 フリーフォーム (マルチウィンドウ) に切り替えます。" +
            (it.layout ? "ウィンドウを " +
              (it.layout === "split2" ? "左右2分割" : it.layout === "vsplit2" ? "上下2分割" :
               it.layout === "split3" ? "3分割" : it.layout === "grid4" ? "格子4分割" :
               it.layout === "max" ? "最大化" : "カスケード") + "で並べます。" : "") +
            "\n" + sup.note;
    verify = sup.freeform ? "端末側もフリーフォーム対応" : (sup.multiWindow ? "端末側は分割画面に対応" : "QuantOS 内蔵のフリーフォームで動作");
  }
  else if (it.intent === "launch"){
    var la = appLaunch(it.query);
    action = { type: "launch", app: "apps", launch: la };
    plan = "カタログ照合 → URL スキーム / market: インテントを端末 OS へ発行";

  else if (it.intent === "qcrypt"){
    plan = "BB84 で鍵配送 → QBER を検査" + (it.eve ? " (盗聴者 Eve を挿入)" : "");

            (bb.eveDetected
              ? "⚠ 盗聴を検出しました — 鍵を破棄します (複製不可能定理により盗聴は必ず誤りを残します)。"

    verify = "QBER " + (bb.qber * 100).toFixed(1) + "% " + (bb.eveDetected ? "> 10% → 破棄" : "≤ 10% → 採用");
  }
  else if (it.intent === "chat"){
    plan = "テンプレート選択 + 状態の埋め込み (決定論的生成)";
    var h = 0; for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    var prof = deviceProfile(UA, SCREENW);
    reply = CHAT_TEMPLATES[h % CHAT_TEMPLATES.length]
      .replace("{n}", String(OS_APPS.length)).replace("{ket}", tm.ket).replace("{dev}", prof.label);
  }
  else {
    plan = "対応アプリ「" + tm.name + "」を開く";
    reply = tm.icon + " " + tm.name + " を開きます。";
  }
  stages.push({ name: "④ 計画", detail: plan || "—" });

  stages.push({ name: "⑥ 検証", detail: verify });
  return { stages: stages, intent: it.intent, action: action, reply: reply, map: tm };
}
/* ════════════════════════════════════════════════════════════════════
 * 9. 実行系 — tel:/sms:/mailto: の発行、アプリ起動
 * ════════════════════════════════════════════════════════════════════ */
function osDispatch(k){
  var a = (k && k.action) || { type: "none" };
  var prof = deviceProfile(UA, SCREENW);
  if (a.type === "tel" || a.type === "sms"){
    var href = a.type + ":" + a.number + (a.type === "sms" && a.body ? "?body=" + encodeURIComponent(a.body) : "");
    if (!prof.tel)
      return { performed: false, how: "この端末 (" + prof.label + ") には電話回線がありません。発行予定だったインテント: " + href };
    if (typeof location === "undefined")
      return { performed: false, how: "(テスト環境) " + href };
    location.href = href;
    return { performed: true, how: href + " を端末 OS へ発行しました" };
  }
  if (a.type === "mail"){
    var mh = "mailto:" + (a.to || "");
    if (typeof location === "undefined") return { performed: false, how: "(テスト環境) " + mh };
    location.href = mh;
    return { performed: true, how: mh + " を発行しました" };
  }
  if (a.type === "launch" || a.type === "market" || a.type === "adjacent"){
    var la = a.launch || {};
    var lhref = (a.type === "market") ? la.store
              : (a.type === "adjacent") ? (la.adjacent || la.launch) : la.launch;
    if (!prof.android)
      return { performed: false, how: "インストール済みアプリの起動 / Play ストアは Android 端末 (" + prof.label + " は対象外) で動作します。発行予定のインテント: " + lhref };
    if (typeof location === "undefined")
      return { performed: false, how: "(テスト環境) " + lhref };
    location.href = lhref;
    return { performed: true, how: lhref + " を端末 OS へ発行しました (未インストールなら Play ストアが開きます)" };
  }
  if (a.type === "window"){
    if (typeof document === "undefined" || typeof wmToggleMode !== "function")
      return { performed: false, how: "(テスト環境) フリーフォーム切替" + (a.layout ? " + " + a.layout : "") };
    if (WMS.mode !== "freeform") wmToggleMode();
    if (a.layout) wmDo(a.layout);
    return { performed: true, how: "フリーフォーム (マルチウィンドウ) へ切替" + (a.layout ? " → " + a.layout + " で整列" : "") };
  }
  if (a.type === "open"){
    if (typeof document !== "undefined" && typeof openApp === "function") openApp(a.app);
    return { performed: true, how: "アプリ「" + a.app + "」へ写像遷移" };
  }
  return { performed: false, how: "表示のみ" };
}

function wmBarH(){
  var b = el("wmBar");
  var h = (b && b.offsetHeight) || 0;
  return (typeof h === "number" && h > 0 && h < 200) ? h : 38;
}
function wmViewport(){
  var d = el("desktop");
  var w = d.clientWidth || SCREENW, h = d.clientHeight || 700;
  if (typeof w === "number" && w > 40) WMS.vw = w;
  if (typeof h === "number" && h > 40) WMS.vh = Math.max(200, h - wmBarH());
}
function wmToggleMode(){
  if (WMS.mode === "fullscreen"){
    WMS.mode = "freeform";
    var was = currentApp;
    closeApp();
    el("desktop").style.display = "block";
    el("taskbar").style.display = "flex";
    el("sbMode").textContent = "🗔 フリーフォーム";
    wmViewport();
    if (was) wmOpenWindow(was);
    wmLauncher(!was);              /* 窓がまだ無ければアプリ一覧を出す */
    wmRender();
  } else {
    var keep = WMS.focus ? (wmGet(WMS, WMS.focus) || {}).appId : null;
    wmCloseAll();
    WMS.mode = "fullscreen";
    el("home").className = "";
    el("desktop").style.display = "none";
    el("taskbar").style.display = "none";
    el("sbMode").textContent = "🗖 全画面";
    el("home").style.display = "block";
    if (keep) openApp(keep);
  }
}
/* ランチャー (アプリ一覧) の開閉 — DeX のアプリボタン相当 */
function wmLauncher(show){
  var h = el("home");
  if (show){ h.className = "launcher"; h.style.display = "block"; }
  else { h.className = ""; h.style.display = "none"; }
  var b = el("tbApps");
  if (b) b.textContent = show ? "⊞ アプリ一覧を閉じる" : "⊞ アプリ";
}
function wmLauncherToggle(){ wmLauncher(el("home").className !== "launcher"); }
function wmOpenWindow(appId){
  wmViewport();
  var before = WMS.wins.length;
  wmOpen(WMS, appId);
  el("desktop").style.display = "block";
  el("taskbar").style.display = "flex";
  wmLauncher(false);              /* 起動したらランチャーは畳む */
  wmRender();
  if (WMS.wins.length > before){
    var w = wmFindApp(WMS, appId);
    if (w) wmRenderContent(w);
  }
}
function wmDo(layout){ wmViewport(); wmTile(WMS, layout); wmRender(); }
function wmCloseAll(){
  for (var i = 0; i < WMS.wins.length; i++){
    if (WMS.wins[i].appId === "camera") stopCamera();
  }
  WMS.wins = []; WMS.focus = null;
  wmRender();
}
function wmCloseWin(id){
  var w = wmGet(WMS, id);
  if (w && w.appId === "camera") stopCamera();
  wmClose(WMS, id);
  wmRender();
}
function wmMinWin(id){ wmMinimize(WMS, id); wmRender(); }
function wmMaxWin(id){ wmFocus(WMS, id); wmSnap(WMS, id, "max"); wmRender(); }
function wmFocusWin(id){
  var w = wmGet(WMS, id);
  if (!w) return;
  var wasMin = w.min;
  wmFocus(WMS, id);
  wmRender();
  if (wasMin) wmRenderContent(w);
}
function wmRenderContent(w){
  var elem = wmEls[w.id];
  if (!elem) return;
  var body = elem.querySelector(".winbody");
  if (!body) return;
  body.innerHTML = "";
  var tm = topoMap(w.appId), r = RENDER[w.appId];
  if (r) r(body, tm);
}
function wmCreateEl(w){
  var tm = topoMap(w.appId), app = appById(w.appId);
  var d = document.createElement("div");
  d.className = "win";
  d.id = "win-" + w.id;
  d.innerHTML =
    "<div class='winbar'><span class='wt'>" + (app.icon || "") + " " + esc(tm ? tm.name : w.appId) + "</span>" +
    "<span class='wk'>" + (tm ? tm.ket : "") + "</span>" +
    "<button title='最小化' onclick=\"event.stopPropagation();wmMinWin('" + w.id + "')\">—</button>" +
    "<button title='最大化' onclick=\"event.stopPropagation();wmMaxWin('" + w.id + "')\">▣</button>" +
    "<button title='閉じる' onclick=\"event.stopPropagation();wmCloseWin('" + w.id + "')\">✕</button></div>" +
    "<div class='winbody'></div><div class='grip'></div>";
  d.addEventListener("pointerdown", function(){ wmFocusWin(w.id); });
  var bar = d.querySelector(".winbar");
  if (bar && bar.addEventListener)
    bar.addEventListener("pointerdown", function(e){ wmDragStart(e, w.id, "move"); });
  var grip = d.querySelector(".grip");
  if (grip && grip.addEventListener)
    grip.addEventListener("pointerdown", function(e){ wmDragStart(e, w.id, "resize"); });
  el("desktop").appendChild(d);
  wmEls[w.id] = d;
  return d;
}
function wmDragStart(e, id, kind){
  var w = wmGet(WMS, id);
  if (!w) return;
  if (e.preventDefault) e.preventDefault();
  wmFocusWin(id);
  wmDrag = { id: id, kind: kind, px: e.clientX, py: e.clientY, x: w.x, y: w.y, w: w.w, h: w.h };
  if (e.target && e.target.setPointerCapture && e.pointerId !== undefined){
    try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
  }
}
function wmDragMove(e){
  if (!wmDrag) return;
  if (e.preventDefault) e.preventDefault();
  var dx = e.clientX - wmDrag.px, dy = e.clientY - wmDrag.py;
  if (wmDrag.kind === "move"){
    wmMove(WMS, wmDrag.id, wmDrag.x + dx, wmDrag.y + dy);
    wmShowSnapHint(e);
  } else {
    wmResize(WMS, wmDrag.id, wmDrag.w + dx, wmDrag.h + dy);
  }
  wmSyncGeom();
}
function wmDragEnd(e){
  if (!wmDrag) return;
  var edge = (wmDrag.kind === "move") ? wmEdgeAt(e) : null;
  var id = wmDrag.id;
  wmDrag = null;
  el("snapHint").style.display = "none";
  if (edge) wmSnap(WMS, id, edge);
  wmRender();
}
/* ドラッグ先が画面端なら分割スナップ (Samsung の分割画面ドロップ相当) */
function wmEdgeAt(e){
  var d = el("desktop");
  var rect = (d.getBoundingClientRect && d.getBoundingClientRect()) || { left:0, top:0, width: WMS.vw, height: WMS.vh };
  var x = e.clientX - rect.left, y = e.clientY - rect.top - wmBarH();
  var m = 28;
  if (x < m) return "left";
  if (x > rect.width - m) return "right";
  if (y > WMS.vh - m) return "bottom";
  if (y < m) return "top";
  return null;
}
function wmShowSnapHint(e){
  var edge = wmEdgeAt(e), hint = el("snapHint");
  if (!edge){ hint.style.display = "none"; return; }
  var W = WMS.vw, H = WMS.vh, h2 = Math.round(W / 2), v2 = Math.round(H / 2);
  var r = edge === "left"  ? [0, 0, h2, H] : edge === "right" ? [h2, 0, W - h2, H]
        : edge === "top"   ? [0, 0, W, v2] : [0, v2, W, H - v2];
  hint.style.display = "block";
  hint.style.left = r[0] + "px"; hint.style.top = (r[1] + wmBarH()) + "px";
  hint.style.width = r[2] + "px"; hint.style.height = r[3] + "px";
}
function wmSyncGeom(){
  var off = wmBarH();
  for (var i = 0; i < WMS.wins.length; i++){
    var w = WMS.wins[i], d = wmEls[w.id];
    if (!d) continue;
    d.style.display = w.min ? "none" : "flex";
    d.style.left = w.x + "px"; d.style.top = (w.y + off) + "px";
    d.style.width = w.w + "px"; d.style.height = w.h + "px";
    d.style.zIndex = String(10 + w.z);
    d.className = "win" + (WMS.focus === w.id ? " focus" : "");
  }
}
function wmRender(){
  var desk = el("desktop");
  /* 閉じたウィンドウの DOM を破棄 */
  for (var id in wmEls){
    if (!wmGet(WMS, id)){
      try{ desk.removeChild(wmEls[id]); }catch(e){}
      delete wmEls[id];
    }
  }
  /* 新規ウィンドウの DOM を生成 */
  for (var i = 0; i < WMS.wins.length; i++){
    if (!wmEls[WMS.wins[i].id]) wmCreateEl(WMS.wins[i]);
  }
  wmSyncGeom();
  /* タスクバー (DeX 風) — 先頭はアプリ一覧ボタン */
  var tb = "<div class='tb' id='tbApps' onclick='wmLauncherToggle()'>⊞ アプリ</div>";
  for (var j = 0; j < WMS.wins.length; j++){
    var w2 = WMS.wins[j], a = appById(w2.appId), t2 = topoMap(w2.appId);
    tb += "<div class='tb" + (WMS.focus === w2.id ? " on" : "") + (w2.min ? " mini" : "") +
          "' onclick=\"wmFocusWin('" + w2.id + "')\">" + (a.icon || "") + " " + esc(t2 ? t2.name : w2.appId) +
          " <span class='mono' style='font-size:9.5px'>" + (t2 ? t2.ket : "") + "</span></div>";
  }
  if (!WMS.wins.length)
    tb += "<span class='hint'>「⊞ アプリ」からアプリを選ぶとフリーフォームの窓で開きます（複数同時に開けます）</span>";
  el("taskbar").innerHTML = tb;
  var ab = el("tbApps");
  if (ab) ab.textContent = (el("home").className === "launcher") ? "⊞ アプリ一覧を閉じる" : "⊞ アプリ";
  /* 組み紐 (重なり) の表示 */
  var b = wmBraidWord(WMS);
  el("wmBraid").textContent = "組み紐 " + b.text + " · " + b.strands + " 本 / 交差 " +
                              b.crossings + " · ⟨K⟩=" + b.invariant.bracket;
}
function wmInit(){
  if (typeof document === "undefined" || !document.addEventListener) return;
  document.addEventListener("pointermove", wmDragMove);
  document.addEventListener("pointerup", wmDragEnd);
  document.addEventListener("pointercancel", wmDragEnd);
  if (typeof window !== "undefined" && window.addEventListener){
    window.addEventListener("resize", function(){
      wmViewport();
      if (WMS.mode === "freeform"){
        /* 端末側で分割画面に入りウィンドウが縮んでも窓が画面外に出ないよう戻す */
        for (var i = 0; i < WMS.wins.length; i++){
          var w = WMS.wins[i];
          wmResize(WMS, w.id, w.w, w.h);
          wmMove(WMS, w.id, w.x, w.y);
        }
        wmRender();
      }
    });
  }
}

var dialBuf = "";
function dialKey(k){
  if (k === "⌫") dialBuf = dialBuf.slice(0, -1); else dialBuf += k;
  el("dialNum").textContent = dialBuf || "​";
}
function dialCall(){
  if (!dialBuf) return;
  var calls = load("calls", []);
  calls.unshift({ n: dialBuf, t: new Date().toLocaleString("ja-JP") });
  store("calls", calls.slice(0, 30));
  var res = osDispatch({ action: { type: "tel", number: dialBuf } });
  el("dialMsg").textContent = res.how;
  renderCallLog();
}

  for (var i = 0; i < calls.length; i++)
    h += "<tr><td class='mono'>" + esc(calls[i].n) + "</td><td>" + esc(calls[i].t) + "</td>" +
         "<td><button onclick=\"dialBuf='" + esc(calls[i].n) + "';dialKey('')\">再入力</button></td></tr>";
  el("callLog").innerHTML = h || "<tr><td colspan='3' class='hint'>発信履歴はまだありません</td></tr>";
}

/* カメラ */
function stopCamera(){
  if (camStream){
    try{ var ts = camStream.getTracks(); for (var i = 0; i < ts.length; i++) ts[i].stop(); }catch(e){}
    camStream = null;
  }
}
function cameraStart(){
  if (typeof navigator === "undefined" || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    el("camMsg").textContent = "この環境ではカメラ API を利用できません (権限または非対応)。";
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
    .then(function(s){ camStream = s; el("camVideo").srcObject = s; el("camVideo").play(); el("camMsg").textContent = "カメラ起動中 — 「撮影」で ギャラリーへ保存"; })
    .catch(function(e){ el("camMsg").textContent = "カメラを起動できません: " + e.message; });
}
function cameraShot(){
  var v = el("camVideo");
  if (!camStream || !v.videoWidth){ el("camMsg").textContent = "先に「カメラ起動」を押してください。"; return; }
  var c = el("camCanvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  var url = c.toDataURL("image/jpeg", 0.85);
  var g = load("gallery", []);
  g.unshift({ url: url, t: new Date().toLocaleString("ja-JP") });
  store("gallery", g.slice(0, 20));
  el("camMsg").textContent = "📸 撮影しました → ギャラリーに保存 (" + g.length + " 枚)";
}
RENDER.camera = function(body){
  body.innerHTML =
    "<div class='card'><video id='camVideo' playsinline muted></video>" +
    "<canvas id='camCanvas' style='display:none'></canvas>" +
    "<div class='row'><button class='acc' onclick='cameraStart()'>▶ カメラ起動</button>" +
    "<button class='grn' onclick='cameraShot()'>📸 撮影</button></div>" +
    "<p class='hint' id='camMsg'>撮影した写真は端末内 (localStorage) のギャラリーに保存されます。</p></div>";
};

/* 時計・アラーム */
var alarms = [];
function alarmSet(){
  var t = el("almTime").value;
  if (!t) return;
  var parts = t.split(":");
  var now = new Date(), tgt = new Date();
  tgt.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
  if (tgt <= now) tgt.setDate(tgt.getDate() + 1);
  var ms = tgt - now;
  var idx = alarms.length;
  alarms.push({ t: t, at: tgt.toLocaleString("ja-JP") });
  setTimeout(function(){ alert("⏰ QuantOS アラーム: " + t + " になりました"); }, ms);
  renderAlarms();
  el("almMsg").textContent = "アラームを " + tgt.toLocaleString("ja-JP") + " に設定しました (アプリ起動中に鳴ります)";
}
function renderAlarms(){
  var h = "";
  for (var i = 0; i < alarms.length; i++) h += "<tr><td>⏰ " + esc(alarms[i].t) + "</td><td>" + esc(alarms[i].at) + "</td></tr>";
  el("almList").innerHTML = h || "<tr><td class='hint'>アラームはありません</td></tr>";
}
RENDER.clock = function(body, tm){
  body.innerHTML =
    "<div class='card' style='text-align:center'><div id='clockBig' style='font-size:42px;font-family:ui-monospace,Consolas,monospace'></div>" +
    "<div class='hint' id='clockDate'></div></div>" +
    "<div class='card'><div class='row'><input id='almTime' type='time' style='max-width:160px'/>" +
    "<button class='acc' onclick='alarmSet()'>アラーム設定</button></div>" +
    "<table><tbody id='almList'></tbody></table><p class='hint' id='almMsg'></p></div>";
  updateClock(); renderAlarms();
};
function updateClock(){
  var d = new Date();
  var pad2 = function(x){ return (x < 10 ? "0" : "") + x; };
  var t = pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  el("sbTime").textContent = t.slice(0, 5);
  if (currentApp === "clock"){
    el("clockBig").textContent = t;
    el("clockDate").textContent = d.toLocaleDateString("ja-JP", { year:"numeric", month:"long", day:"numeric", weekday:"long" });
  }
}

/* 電卓 */
var calcBuf = "";
function calcKey(k){
  if (k === "C") calcBuf = "";
  else if (k === "⌫") calcBuf = calcBuf.slice(0, -1);
  else if (k === "="){
    try{ calcBuf = String(calcEval(calcBuf)); }catch(e){ calcBuf = ""; el("calcDisp").textContent = "エラー: " + e.message; return; }
  }
  else calcBuf += k;
  el("calcDisp").textContent = calcBuf || "0";
}
RENDER.calc = function(body){
  calcBuf = "";
  var keys = ["7","8","9","/","4","5","6","*","1","2","3","-","0",".","%","+","(",")","⌫","C"];
  var pad = "";
  for (var i = 0; i < keys.length; i++) pad += "<button onclick=\"calcKey('" + keys[i] + "')\">" + keys[i] + "</button>";
  body.innerHTML =
    "<div class='card'><div id='calcDisp'>0</div><div id='calcPad'>" + pad +
    "<button class='acc' style='grid-column:span 4' onclick=\"calcKey('=')\">=</button></div>" +
    "<p class='hint'>eval を使わない再帰下降パーサ (calcEval) で計算します。</p></div>";
};

/* 量子暗号 (BB84 鍵配送 + ワンタイムパッド + 量子金庫) */
var qcKey = [];      /* 現在の共有鍵ビット列 — メモリ内のみ (保存しない) */
function qcRun(){
  var n = parseInt(el("qcN").value, 10) || 64;
  var eve = !!el("qcEve").checked;
  var bb = qcBB84(n, eve);
  var rows = "";
  for (var i = 0; i < bb.log.length; i++){
    var L = bb.log[i];
    rows += "<tr><td>" + L.i + "</td><td>" + L.aBit + "</td><td>" + L.aBase + "</td><td>" + L.eve +
            "</td><td>" + L.bBase + "</td><td>" + L.bBit + "</td><td>" + (L.keep ? "✔" : "—") + "</td></tr>";
  }
  el("qcLog").innerHTML = rows;
  var verdict;
  if (bb.eveDetected){
    qcKey = [];
    verdict = "⚠ QBER " + (bb.qber * 100).toFixed(1) + "% > 10% — 盗聴を検出。鍵を破棄しました。" +
              "(intercept-resend 盗聴は複製不可能定理により基底一致位置に約 25% の誤りを残します)";
  } else {
    qcKey = bb.key;
    verdict = "✅ QBER " + (bb.qber * 100).toFixed(1) + "% — 盗聴なし。共有鍵 " + bb.key.length +
              " ビットを確立 (鍵 16進: " + (bb.keyHex || "—") + ")。鍵はメモリ内のみに保持します。";
  }
  el("qcVerdict").textContent =
    bb.n + " 量子ビット送出 → 基底一致 (ふるい) " + bb.sifted + " ビット → 照合 " + bb.checked +
    " ビット中 誤り " + bb.errors + "。 " + verdict;
}
function qcEnc(){
  try{ el("qcCipher").value = qcEncrypt(el("qcPlain").value, qcKey); el("qcMsg2").textContent = "暗号化しました (XOR ワンタイムパッド)。鍵長 ≥ 本文長なら情報理論的に安全です。"; }
  catch(e){ el("qcMsg2").textContent = "エラー: " + e.message; }
}
function qcDec(){
  try{ el("qcPlain").value = qcDecrypt(el("qcCipher").value, qcKey); el("qcMsg2").textContent = "復号しました。"; }
  catch(e){ el("qcMsg2").textContent = "復号できません (鍵違いまたは暗号文不正): " + e.message; }
}
function vaultAdd(){
  var t = el("vaultIn").value;
  if (!t) return;
  try{
    var v = load("vault", []);
    v.unshift({ hex: qcEncrypt(t, qcKey), t: new Date().toLocaleString("ja-JP") });
    store("vault", v.slice(0, 30));
    el("vaultIn").value = "";
    el("vaultMsg").textContent = "暗号化して保管しました。端末内には暗号文 (16進) だけが保存されます。";
    renderVault();
  }catch(e){ el("vaultMsg").textContent = "エラー: " + e.message; }
}
function vaultOpen(i){
  var v = load("vault", []) || [];
  try{ el("vaultMsg").textContent = "復号: " + qcDecrypt(v[i].hex, qcKey); }
  catch(e){ el("vaultMsg").textContent = "復号できません — 保管時と同じ鍵が必要です (" + e.message + ")"; }
}
function vaultDel(i){ var v = load("vault", []) || []; v.splice(i, 1); store("vault", v); renderVault(); }
function renderVault(){
  var v = load("vault", []) || [], h = "";
  for (var i = 0; i < v.length; i++)
    h += "<tr><td class='mono' style='word-break:break-all'>" + esc(v[i].hex.slice(0, 24)) + "…</td><td>" + esc(v[i].t) + "</td>" +
         "<td><button onclick='vaultOpen(" + i + ")'>🔓</button> <button onclick='vaultDel(" + i + ")'>🗑</button></td></tr>";
  el("vaultList").innerHTML = h || "<tr><td colspan='3' class='hint'>金庫は空です</td></tr>";
}

    "<div class='card'><b>① BB84 量子鍵配送</b>" +
    "<p class='hint'>Alice が乱択基底 (+/×) で量子ビットを送出し、Bob が乱択基底で測定。基底一致分をふるい、" +
    "前半を照合して QBER を推定 — 盗聴 (intercept-resend) は必ず誤りを残すため QBER &gt; 10% で検出・破棄します。</p>" +
    "<div class='row'><select id='qcN' style='max-width:130px'><option value='64'>64 qubit</option>" +

  renderVault();

/* ── コマンドバー (生成AIカーネルへの入口) ── */
function cmdSend(){
  var t = el("cmdInput").value.trim();
  if (!t) return;
  el("cmdInput").value = "";
  var k = aiKernel(t);
  var log = load("ailog", []) || [];
  log.push({ u: t, a: k.reply });
  store("ailog", log.slice(-50));
  /* AI 画面にいなければ写像遷移してから表示 */
  if (currentApp !== "ai") openApp("ai");
  var lg = el("aiLog");
  var stagesHtml = "";
  for (var i = 0; i < k.stages.length; i++)
    stagesHtml += esc(k.stages[i].name) + " — " + esc(k.stages[i].detail) + "\n";
  lg.innerHTML +=
    "<div class='msgU'>" + esc(t) + "</div>" +
    "<div class='msgA'>" + esc(k.reply) +
    "<details><summary>🧠 カーネル・パイプライン開示</summary><pre>" + stagesHtml + "</pre></details></div>";
  var res = osDispatch(k);
  if (k.action.type !== "open" && res && res.how){
    lg.innerHTML += "<div class='msgA'>⚙ " + esc(res.how) + "</div>";
  }
  if (typeof lg.scrollIntoView === "function"){ try{ window.scrollTo && window.scrollTo(0, 999999); }catch(e){} }
}
