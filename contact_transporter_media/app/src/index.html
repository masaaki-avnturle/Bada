<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: gap: file:; img-src 'self' data: blob:; media-src 'self' blob:;">
<title>Blueprint Studio</title>
<style>
@font-face { font-family: "BPGothic"; src: url("fonts/ipag.ttf") format("truetype"); font-display: block; }
:root { --bg:#0b2447; --panel:#0f2c55; --line:#2b4a7a; --fg:#e8f1ff; --hud:#9fe8ff; --warn:#ffd166; --err:#ff8a80; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:"BPGothic","Yu Gothic UI","Meiryo","Noto Sans CJK JP",sans-serif; }
body { padding: max(12px, env(safe-area-inset-top)) 16px 16px; }
header h1 { margin:0; font-size:22px; letter-spacing:.02em; }
header p { margin:4px 0 12px; color:var(--hud); font-size:13px; }
.wrap { display:grid; grid-template-columns: minmax(0, 1fr) 320px; gap:16px; }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
.stage { background:#000; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
canvas#preview { display:block; width:100%; height:auto; aspect-ratio:16/9; }
.bar { display:flex; gap:8px; align-items:center; padding:8px; background:var(--panel); flex-wrap:wrap; }
.bar input[type=range] { flex:1; min-width:140px; }
#time { font-size:12px; color:var(--hud); min-width:92px; text-align:right; }
#chips { display:flex; flex-wrap:wrap; gap:6px; padding:8px; background:var(--panel); border-top:1px solid var(--line); }
.chip { font-size:12px; padding:4px 10px; border-radius:14px; }
button, select { font:inherit; font-size:14px; color:var(--fg); background:#163a6e; border:1px solid var(--line); border-radius:6px; padding:8px 12px; cursor:pointer; }
button:hover:not(:disabled) { background:#1d4a8a; }
button:disabled { opacity:.45; cursor:default; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.panel h2 { font-size:15px; margin:0; color:var(--hud); }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row > button { flex:1; }
label { font-size:13px; }
.prog { height:8px; background:#07182f; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
#bar { height:100%; width:0; background:var(--hud); transition: width .15s; }
#prog { font-size:11px; color:var(--hud); min-height:1.2em; }
.msg { font-size:13px; min-height:1.3em; }
.msg.err { color:var(--err); }
#about { font-size:12px; line-height:1.6; color:#c6d6f0; }
</style>
</head>
<body>
<header>
  <h1 id="appTitle">Blueprint Studio</h1>
  <p id="appSub"></p>
</header>
<div class="wrap">
  <div class="stage">
    <canvas id="preview" width="1280" height="720"></canvas>
    <div class="bar">
      <button id="play">⏸ 一時停止</button>
      <input id="seek" type="range" min="0" max="100" step="0.05" value="0">
      <span id="time">0.0 s</span>
    </div>
    <div id="chips"></div>
  </div>
  <div class="panel">
    <h2>設計図 PDF</h2>
    <div class="row"><button id="mkpdf">📐 設計図 PDF を作成</button></div>
    <div class="row"><button id="savepdf" disabled>💾 PDF を保存</button></div>
    <h2>動画 mp4</h2>
    <label>画質
      <select id="quality">
        <option value="1280x720x30">1280×720 / 30fps (標準)</option>
        <option value="1920x1080x30">1920×1080 / 30fps (高画質)</option>
        <option value="854x480x24">854×480 / 24fps (軽量)</option>
      </select>
    </label>
    <div class="row"><button id="mkmp4">🎬 動画 mp4 を作成</button></div>
    <div class="row"><button id="savemp4" disabled>💾 動画を保存</button></div>
    <div class="prog"><div id="bar"></div></div>
    <div id="prog"></div>
    <div id="msg" class="msg"></div>
    <h2>このソフトについて</h2>
    <div id="about"></div>
  </div>
</div>
<!--SCRIPTS-->
<script>
(function () {
  function go() { window.BP.boot(window.BP_APP); }
  if (document.fonts && document.fonts.load) {
    document.fonts.load('20px "BPGothic"').then(go, go);
  } else { go(); }
})();
</script>
</body>
</html>
