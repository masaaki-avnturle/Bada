plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.masaaki_avnturle.multiwindow'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.masaaki_avnturle.multiwindow'
        minSdk 24          // Android 7.0 — <layout> マニフェスト要素 (freeform 既定サイズ) の最低 API
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 依存ゼロ: フレームワーク API のみで実装 (WebView も未使用)。
dependencies {
}
