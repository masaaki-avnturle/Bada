// Debug assembly for the Node / Office add-in application.
// `gradle assembleDebug` installs dependencies and runs the build script
// (development / debug mode) if one is defined.
plugins { id 'base' }

tasks.register('assembleDebug', Exec) {
    group = 'build'
    description = 'Assembles a debug build of the Node project (npm install + build).'
    workingDir = projectDir
    commandLine 'sh', '-c', 'npm install && (npm run build --if-present || true)'
    ignoreExitValue = true
}

tasks.named('assemble') { dependsOn 'assembleDebug' }
