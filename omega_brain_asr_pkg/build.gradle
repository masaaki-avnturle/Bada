// Debug assembly for a Makefile-based application.
// `gradle assembleDebug` runs make with debug flags (gcc -g -O0).
plugins { id 'base' }

tasks.register('assembleDebug', Exec) {
    group = 'build'
    description = 'Assembles a debug build via make (CFLAGS="-g -O0").'
    workingDir = projectDir
    commandLine 'make', 'CFLAGS=-g -O0 -Wall -Iinclude'
    ignoreExitValue = true
}

tasks.named('assemble') { dependsOn 'assembleDebug' }
