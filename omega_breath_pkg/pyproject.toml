[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-breath"
version = "0.1.0"
description = "呼吸ガイドと、心拍変動(RSA)・圧受容器反射の共鳴を再現する教育用シミュレータ"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Masaaki Yamaguchi" }]
keywords = ["breathing", "hrv", "rsa", "baroreflex", "relaxation", "bada", "omega"]
dependencies = []

[project.scripts]
omega-breath = "omega_breath.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["omega_breath"]
