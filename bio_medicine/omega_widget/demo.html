<!DOCTYPE html>
<!--
  demo.html — 「任意のアプリ」の代表(メモ/フォーム)。omega-attach.js を1行読むだけで付加される。
  これ自体は Ω を一切知らない普通のアプリ。<script src="omega-attach.js"> だけで機能拡張される。
-->
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>サンプル業務アプリ (Ωを知らない普通のアプリ)</title>
<style>
  body{margin:0;font-family:-apple-system,"Segoe UI",Meiryo,sans-serif;background:#f4f5f7;color:#222}
  header{background:#2b3a55;color:#fff;padding:14px 20px}
  h1{margin:0;font-size:18px}main{max-width:680px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #dde;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
  label{display:block;font-size:13px;color:#567;margin:10px 0 4px}
  input[type=text],textarea{width:100%;padding:9px;border:1px solid #ccd;border-radius:7px;font-size:14px;font-family:inherit}
  textarea{height:120px;resize:vertical}
  .note{font-size:12px;color:#789;margin-top:6px}
</style>
</head>
<body>
<header><h1>📋 サンプル業務アプリ（このアプリ自体は Ω を知りません）</h1></header>
<main>
  <div class="card">
    <h2 style="font-size:15px;margin:0 0 4px">案件メモ</h2>
    <div class="note">下の入力欄に英単語を打つと、付加された Ω-Apriori が単語補完を出します（<b>Tab</b>で採用）。例: <code>con / man / gen / app / over</code></div>
    <label>タイトル</label>
    <input type="text" id="title" placeholder="例: gamma manifold project"/>
    <label>本文</label>
    <textarea id="body" placeholder="the application can complete words automatically…"></textarea>
    <label>数値タグ (0-63, パターンマッチ用)</label>
    <input type="text" id="tag" placeholder="42"/>
  </div>
  <div class="card">
    <div class="note">右下の <b>Ω</b> ボタンから 俯瞰/系列補完/一意ID/自己進化/FPGAソース などの付加機能を起動できます。
    付加は次の1行だけ:<br><code>&lt;script src="omega-attach.js"&gt;&lt;/script&gt;</code></div>
  </div>
</main>

<!-- ↓↓↓ これ1行を任意アプリに足すだけで付加される ↓↓↓ -->
<script src="omega-attach.js"></script>
</body>
</html>
