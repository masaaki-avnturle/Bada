[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mayu"
version = "0.1.0"
description = "窓使いの憂鬱 — クロスプラットフォームなキー再割り当てエンジン (.mayu 設定互換)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "masaaki-avnturle" }]
keywords = ["keyboard", "remap", "mayu", "窓使いの憂鬱", "evdev", "uinput"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# Linux で実キーフックを行う場合のみ必要
linux = ["evdev>=1.6"]
dev = ["pytest>=7"]

[project.scripts]
mayu = "mayu.cli:main"

[project.urls]
Homepage = "https://github.com/masaaki-avnturle/bada"

[tool.setuptools]
packages = ["mayu", "mayu.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
