name: Build Bada apps (APK + Windows + Linux)

# Builds the downloadable native apps from apps/ (Space Telegraph + Pseudo QC):
#   * Android       -> BadaTelegraph.apk            (installable, debug-signed)
#   * Windows 10/11 -> BadaTelegraph.exe + zip       (jpackage installer + portable)
#   * Ubuntu Linux  -> BadaTelegraph_*.deb + tar.gz  (jpackage .deb + portable)
#
# Triggers:
#   * push a tag  vX.Y.Z   -> builds AND publishes them to a GitHub Release
#   * manual "Run workflow" -> builds and uploads them as workflow artifacts
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Android
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/BadaTelegraph.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadaTelegraph-apk
          path: dist/BadaTelegraph.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BadaTelegraph.apk

  # ------------------------------------------------------------------ Windows
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile core + desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/classes, build/jar | Out-Null
          $src = Get-ChildItem -Recurse -Path apps/core/src, apps/desktop/src -Filter *.java | ForEach-Object { $_.FullName }
          & javac -encoding UTF-8 -d build/classes $src
          & jar --create --file build/jar/BadaTelegraph.jar --main-class bada.desktop.DesktopApp -C build/classes .

      - name: Build portable app-image (contains BadaTelegraph.exe)
        shell: pwsh
        run: |
          & jpackage --type app-image --name BadaTelegraph `
            --input build/jar --main-jar BadaTelegraph.jar --main-class bada.desktop.DesktopApp `
            --dest build/dist --java-options "-Dfile.encoding=UTF-8"
          Compress-Archive -Path build/dist/BadaTelegraph -DestinationPath BadaTelegraph-windows-x64.zip -Force

      - name: Build .exe installer (WiX)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install wixtoolset -y --no-progress
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          if ($wix) { $env:PATH = "$($wix.FullName)\bin;$env:PATH" }
          & jpackage --type exe --name BadaTelegraph `
            --input build/jar --main-jar BadaTelegraph.jar --main-class bada.desktop.DesktopApp `
            --dest build/installer --app-version 1.0 `
            --win-shortcut --win-menu --win-dir-chooser `
            --java-options "-Dfile.encoding=UTF-8"
          Get-ChildItem build/installer

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BadaTelegraph-windows
          path: |
            BadaTelegraph-windows-x64.zip
            build/installer/*.exe

      - name: Attach Windows apps to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BadaTelegraph-windows-x64.zip
            build/installer/*.exe

  # -------------------------------------------------------------------- Linux
  linux-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Compile core + desktop
        run: |
          mkdir -p build/classes build/jar
          find apps/core/src apps/desktop/src -name '*.java' > sources.txt
          javac -encoding UTF-8 -d build/classes @sources.txt
          jar --create --file build/jar/BadaTelegraph.jar --main-class bada.desktop.DesktopApp -C build/classes .

      - name: Build portable app-image (Linux)
        run: |
          jpackage --type app-image --name BadaTelegraph \
            --input build/jar --main-jar BadaTelegraph.jar --main-class bada.desktop.DesktopApp \
            --dest build/dist --java-options "-Dfile.encoding=UTF-8"
          tar -C build/dist -czf BadaTelegraph-linux-x64.tar.gz BadaTelegraph

      - name: Build .deb (Ubuntu)
        continue-on-error: true
        run: |
          jpackage --type deb --name BadaTelegraph \
            --input build/jar --main-jar BadaTelegraph.jar --main-class bada.desktop.DesktopApp \
            --dest build/deb --app-version 1.0 --linux-shortcut \
            --java-options "-Dfile.encoding=UTF-8"
          ls -l build/deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BadaTelegraph-linux
          path: |
            BadaTelegraph-linux-x64.tar.gz
            build/deb/*.deb

      - name: Attach Linux apps to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BadaTelegraph-linux-x64.tar.gz
            build/deb/*.deb
