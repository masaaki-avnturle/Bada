name: Release HHKB APK

# Pushing a tag like `hhkb-v1` builds the app and publishes a GitHub Release
# with the raw app-debug.apk attached, so it can be downloaded and installed
# directly (NOT wrapped in the Actions artifact .zip).
on:
  push:
    tags:
      - "hhkb-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hhkb_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BadaHHKB.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Bada HHKB Keyboard
          body: |
            Bada HHKB ホログラム・キーボード（デバッグ署名）。
            下の **BadaHHKB.apk** を直接ダウンロードしてインストールしてください。
            ※ Actions の Artifacts と違い ZIP ではありません。
            ※ 初回のみ：旧バージョンが入っている場合は先にアンインストールしてください
              （署名が変わったため）。
          files: hhkb_android/app/build/outputs/apk/debug/BadaHHKB.apk
