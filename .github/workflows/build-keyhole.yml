name: Build Bada Keyhole (APK + Windows EXE)

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'claude/touch-sensitivity-app-packaging-ep1xmm'
    tags:
      - 'keyhole-v*'
    paths:
      - 'bada_keyhole/**'
      - '.github/workflows/build-keyhole.yml'

defaults:
  run:
    working-directory: bada_keyhole

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build Windows EXE (electron-builder)
        run: npm run dist:win
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp dist/*.exe out/ 2>/dev/null || true
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyhole-windows-exe
          path: bada_keyhole/out/*.exe
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bada_keyhole/out/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Add camera/mic permissions to AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          fi
          echo "--- manifest permissions ---"; grep -n "uses-permission" "$M" || true
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/BadaKeyhole-${VER}-debug.apk"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyhole-android-apk
          path: bada_keyhole/out/*.apk
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bada_keyhole/out/*.apk
