name: Build omega_quantum_decrypt (exe + apk)

# Produces a downloadable Windows .exe and Android .apk.
#
# * Push a tag like  v0.1.0   -> builds both AND publishes a GitHub Release
#   with the .exe and .apk attached (download from the repo's Releases page).
# * Run manually (Actions -> "Run workflow") or push to the branch -> builds
#   both and uploads them as workflow artifacts (Actions run -> Artifacts).

on:
  push:
    tags: ['v*']
    branches: ['claude/quantum-crypto-decryption-app-55ks91']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the Release

defaults:
  run:
    working-directory: omega_quantum_decrypt_pkg

jobs:
  # ---------------------------------------------------------------- Windows
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install pyinstaller
      - name: Sanity-check core logic
        run: |
          python tests/test_all.py
          python tests/test_app.py
      - name: Build .exe (Tkinter, no OpenGL needed)
        run: pyinstaller --noconfirm packaging/omega_qdecrypt.spec
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega_quantum_decrypt-windows-exe
          path: omega_quantum_decrypt_pkg/dist/omega_quantum_decrypt.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  # Buildozer is installed and run directly (the third-party buildozer-action
  # image has bit-rotted: its openjdk PPA 404s on newer Ubuntu).  Buildozer
  # downloads the Android SDK/NDK itself, so the first run takes 20-40 min.
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system + buildozer deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev
          pip install --upgrade "cython<3.0" buildozer
      - name: Sanity-check core logic
        run: |
          python tests/test_all.py
          python tests/test_app.py
      - name: Build .apk with Buildozer
        run: buildozer android debug
        env:
          ANDROID_ACCEPT_SDK_LICENSE: '1'
      - name: Collect apk
        run: |
          mkdir -p out
          cp bin/*.apk out/omega_quantum_decrypt.apk
      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega_quantum_decrypt-android-apk
          path: omega_quantum_decrypt_pkg/out/omega_quantum_decrypt.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  # Publishes a downloadable GitHub Release with the .exe and .apk attached.
  # The tag is created server-side by action-gh-release using GITHUB_TOKEN, so
  # no local tag push is required.  Fires on a v* tag, on this feature branch,
  # or on a manual dispatch.
  release:
    needs: [windows-exe, android-apk]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref_name == 'claude/quantum-crypto-decryption-app-55ks91' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release with exe + apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.5.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'omega_quantum_decrypt v0.5.0' }}
          body: |
            **omega_quantum_decrypt** — Jones × Burau × Shor decryption demo,
            now with a **defensive virus-removal** module.

            ### Downloads
            - `omega_quantum_decrypt.exe` — Windows 10/11 (64-bit). Double-click to run.
            - `omega_quantum_decrypt.apk` — Android 12+ (arm64-v8a). Allow "install
              from unknown sources", then install.

            ### Features
            - **Decrypt** tab: knot-theory (Jones/Kauffman) key + Shor factorization
              breaks a toy-RSA target end-to-end.
            - **Virus scan** tab: scan a folder, detect known-bad files (SHA-256
              signatures + industry-standard EICAR test + heuristics + a Jones
              structural fingerprint), and **quarantine** them by encrypting them
              inert (restore = decrypt).

            ### Honest scope
            This is an educational/defensive demo. It only detects what its
            signature DB + heuristics cover and is **not** a replacement for a real
            antivirus (Defender, ClamAV, …). It never creates or spreads malware.
            The Shor factorization is a classical simulation that breaks only
            **toy** RSA, not real 2048-bit RSA/AES.
          files: |
            artifacts/omega_quantum_decrypt-windows-exe/omega_quantum_decrypt.exe
            artifacts/omega_quantum_decrypt-android-apk/omega_quantum_decrypt.apk
