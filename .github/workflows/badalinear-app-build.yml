name: BadaLinear app build (Windows EXE + Ubuntu + Android APK)

# 反重力リニア BadaLinear (bada_linear_os/linear-app) を Windows EXE / Ubuntu AppImage・deb /
# Android APK としてビルド。本体 www/index.html は bada_linear_os/tools/build-linear-www.js が
# Artifact 版 HTML から生成するオフライン自己完結ページ (同梱 three.min.js)。
# Actions アーティファクト、および (badalinear-v* タグ / release_tag 指定時) GitHub Release に添付。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: badalinear-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'badalinear-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - name: Build www + self-check + Ruby tests
        working-directory: bada_linear_os
        run: |
          set -e
          node tools/build-linear-www.js
          test -f linear-app/www/index.html && test -f linear-app/www/three.min.js
          grep -q 'src="./three.min.js"' linear-app/www/index.html
          ! grep -q 'cdnjs.cloudflare.com' linear-app/www/index.html
          ruby -Ilib test/test_linear.rb

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generate www
        working-directory: bada_linear_os
        run: node tools/build-linear-www.js
      - name: Build Windows EXE (Electron)
        working-directory: bada_linear_os/linear-app/electron
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: badalinear-windows, path: bada_linear_os/linear-app/electron/dist/*.exe }
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_linear_os/linear-app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generate www
        working-directory: bada_linear_os
        run: node tools/build-linear-www.js
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_linear_os/linear-app/electron
        run: |
          npm install
          npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: badalinear-linux
          path: |
            bada_linear_os/linear-app/electron/dist/*.AppImage
            bada_linear_os/linear-app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_linear_os/linear-app/electron/dist/*.AppImage
            bada_linear_os/linear-app/electron/dist/*.deb

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Generate www
        working-directory: bada_linear_os
        run: node tools/build-linear-www.js
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g cordova@12.0.0
          APP="bada_linear_os/linear-app"
          cordova create cordova-build io.github.masaaki_avnturle.badalinear BadaLinear
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/badalinear-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: badalinear-android, path: out/*.apk }
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk
