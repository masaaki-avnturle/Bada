name: Build Yamaguchi Generator (APK + Windows EXE)

# 実行方法:
#   1) 手動:  Actions タブ → "Build Yamaguchi Generator" → Run workflow
#   2) 自動:  タグ  yamaguchi-v1.0.0  等を push すると Release に成果物を添付
on:
  workflow_dispatch:
  push:
    tags:
      - 'yamaguchi-v*'

defaults:
  run:
    working-directory: yamaguchi_generator

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Windows 10 / 11 用 EXE (インストーラ + ポータブル)
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE (electron-builder)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp dist/*.exe out/ 2>/dev/null || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: yamaguchi_generator/out/*.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yamaguchi_generator/out/*.exe

  # ─────────────────────────────────────────────
  # Android 用 APK (Capacitor + Gradle, debug 署名で即インストール可)
  # ─────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/YamaguchiGenerator-${VER}-debug.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: yamaguchi_generator/out/*.apk

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yamaguchi_generator/out/*.apk
