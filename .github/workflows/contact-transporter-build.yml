name: Bada 4 apps build (ContactGPT / 輸送機 3D CAD / UFO 設計図面 / BadaClaude — Android APK + Windows 10/11 EXE + Linux)

# contact_transporter/ の 4 つのアプリ — すべて量子プログラミング言語 Bada で書かれている
# (contact_transporter/bada/apps/*.bada、アプリ内 Bada IDE 付き):
#   - ContactGPT        (contactgpt)  : 設計図書の方程式 2111 本で学習した Transformer + 量子測定サンプリング
#   - Transporter CAD   (transporter) : 異次元輸送機の 3D CAD (STL / OBJ / DXF / 図面)
#   - UFO Designer      (ufo)         : UFO 設計図面作成ソフト (三面図 + 等角図 + 寸法 + 部材表)
#   - BadaClaude        (badaclaude)  : Claude / ChatGPT の対話の仕組み (字句化 → 意図推定 → 論文 10 本 + 方程式 2111 本の検索
#                                       → 道具 → 回答 → Ω 台帳) を Bada で書いた対話エンジン (Claude API モードは任意)
#   - Contact Transporter Studio (studio): 3 アプリの統合版
# を、それぞれ
#   - Android 向け APK
#   - Windows 10 / 11 向け EXE (NSIS インストーラ + ポータブル)
#   - Linux 向け AppImage / deb
# としてビルドし、Actions の成果物 (Artifacts) からダウンロードできるようにします。
# 同じファイルを Release「contact-transporter-latest」(タグ ct-v* の push 時はそのタグ) にも添付します。
# アプリの定義 (名前・ID・含めるタブ) は contact_transporter/apps.json。
#
# 論文 PDF → アプリ: 4 アプリとも「📄 論文→アプリ」タブで論文 PDF を投稿すると、Bada でアプリを書き、
# 作ったアプリ (.bada / 単体 HTML)・Windows 10 / 11 EXE・APK・Linux .deb・設計書 PDF・論文 PDF をダウンロード フォルダへ保存できる。
# その APK は runner-apk ジョブが作る「ランナー APK」を差し替え・署名して、EXE は win-launcher ジョブが作る
# ランチャー (app/windows/launcher.c、Windows 実機で動作確認) の末尾にアプリ一式を付けて作る。
# また contact_transporter/papers/ に置いた PDF からは paper-apps ジョブが同じ一式を作り、Artifacts「PaperApps」に置く。

on:
  push:
    branches: ["**"]
    paths:
      - "contact_transporter/**"
      - "bada_silent_vim/bada/**"
      - "contact_transporter/papers/**"
      - ".github/workflows/contact-transporter-build.yml"
    tags:
      - "ct-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "添付先の GitHub Release タグ (空欄なら contact-transporter-latest)"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'contact-transporter-latest' }}

jobs:
  win-launcher:
    # 論文から作ったアプリの Windows 10 / 11 EXE の「入れ物」(ランチャー)。アプリ一式を末尾に付けて配る
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher (MinGW-w64, x86_64, GUI)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc -O2 -municode -mwindows -s contact_transporter/app/windows/launcher.c -o bada-launcher.exe -lshell32
          file bada-launcher.exe
      - uses: actions/upload-artifact@v4
        with:
          name: win-launcher
          path: bada-launcher.exe
          retention-days: 3

  win-launcher-test:
    # Windows 実機 (windows-latest) で、ランチャー + アプリ一式の EXE が展開・起動準備できることを確認
    needs: win-launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: win-launcher
          path: launcher
      - name: Make a test app EXE and run it (--extract)
        shell: pwsh
        run: |
          node contact_transporter/tools/make-test-exe.js launcher/bada-launcher.exe test-app.exe
          $dir = Join-Path $env:RUNNER_TEMP "bada-extract"
          $p = Start-Process -FilePath ".\test-app.exe" -ArgumentList @("--extract", $dir) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "launcher exit code $($p.ExitCode)" }
          Get-ChildItem $dir | Format-Table Name, Length
          $html = Get-Content -Raw -Encoding UTF8 (Join-Path $dir "index.html")
          if ($html -notmatch "Windows テスト") { throw "index.html の内容が違います" }
          if (-not (Test-Path (Join-Path $dir "test.bada"))) { throw "test.bada がありません" }
          if (-not (Test-Path (Join-Path $dir "paper.pdf"))) { throw "paper.pdf がありません" }
          $edge = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "Edge: $edge"
          Write-Host "OK: Windows で展開できました"

  runner-apk:
    # 論文から作ったアプリの APK の「入れ物」(ランナー)。アプリ内で index.html を差し替えて JAR 署名し直す
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Pin Gradle 7.6.4
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Bundle runner (dist/runner/www) + Cordova config
        run: |
          node contact_transporter/tools/build.js runner
          node contact_transporter/tools/package-app.js runner
      - name: Build runner APK (Cordova, targetSdk 29)
        run: |
          set -e
          npm install -g cordova@12.0.0
          cordova create runner-build app.placeholder Placeholder
          rm -rf runner-build/www
          cp -r contact_transporter/dist/runner/www runner-build/www
          sed -i 's#</head>#<script src="cordova.js"></script>\n</head>#' runner-build/www/index.html
          cp contact_transporter/dist/runner/cordova/config.xml runner-build/config.xml
          cd runner-build
          cordova platform add android@12.0.1
          cordova plugin add cordova-plugin-file@8.0.1
          # ファイルの取り込み (フォルダを開いて選ぶ) とダウンロード フォルダへの保存
          cordova plugin add ../contact_transporter/dist/runner/cordova/bada-files
          cordova build android
          cp platforms/android/app/build/outputs/apk/debug/*.apk ../runner.apk
      - name: Verify — repack a paper app into the runner and check the signature (apksigner)
        run: |
          node contact_transporter/tools/verify-apk.js runner.apk repacked.apk
          "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner" verify --verbose --min-sdk-version 24 repacked.apk
          jarsigner -verify repacked.apk
      - uses: actions/upload-artifact@v4
        with:
          name: runner-apk
          path: runner.apk
          retention-days: 3

  test-and-bundle:
    needs: [runner-apk, win-launcher-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: runner-apk
          path: contact_transporter/data
      - uses: actions/download-artifact@v4
        with:
          name: win-launcher
          path: contact_transporter/data
      - name: Install build tools (pdf.js)
        working-directory: contact_transporter
        run: npm ci --no-audit --no-fund
      - name: Bundle self-contained apps (dist/<app>/www/index.html)
        run: node contact_transporter/tools/build.js all
      - name: Bada conformance (JS 移植 ↔ Python 本家 bada_silent_vim、リポジトリ内の全 .bada)
        run: python3 contact_transporter/tools/conformance.py
      - name: Engine tests (Bada アプリ 4 本 / 設計図書の数値再現 / GPT 勾配 / CAD / 図面)
        run: node contact_transporter/tools/test.js
      - name: Prepare native wrappers (Electron / Cordova) per app
        run: |
          for app in contactgpt transporter ufo badaclaude studio runner; do
            node contact_transporter/tools/package-app.js "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: contact_transporter/dist
          retention-days: 3

  paper-apps:
    # contact_transporter/papers/*.pdf (なければ同梱の設計図書) → 論文ごとの Bada アプリ一式
    needs: test-and-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: contact_transporter/dist
      - uses: actions/download-artifact@v4
        with:
          name: runner-apk
          path: contact_transporter/data
      - uses: actions/download-artifact@v4
        with:
          name: win-launcher
          path: contact_transporter/data
      - name: Install build tools (pdf.js)
        working-directory: contact_transporter
        run: npm ci --no-audit --no-fund
      - name: Paper PDF → Bada app (.bada / .html / .apk / .deb / drawing / PDF)
        run: |
          set -e
          shopt -s nullglob
          pdfs=(contact_transporter/papers/*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then pdfs=(contact_transporter/contact_blueprint.pdf); fi
          for f in "${pdfs[@]}"; do
            name=$(basename "$f" .pdf); name=${name//[^A-Za-z0-9_.-]/_}
            node contact_transporter/tools/paper2app.js "$f" "paper-apps/$name"
            jarsigner -verify paper-apps/$name/*.apk
            file paper-apps/$name/*.exe
            dpkg-deb -I paper-apps/$name/*.deb | head -3
          done
          ls -laR paper-apps
      - uses: actions/upload-artifact@v4
        with:
          name: PaperApps
          path: paper-apps

  android-apk:
    needs: test-and-bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: contactgpt,  file: ContactGPT }
          - { app: transporter, file: TransporterCAD }
          - { app: ufo,         file: UFODesigner }
          - { app: badaclaude,  file: BadaClaude }
          - { app: studio,      file: ContactTransporterStudio }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定パッケージ 'tools' は廃止済みなので空にして明示導入する
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # cordova-android 12 は Gradle 7.x が必要
      - name: Pin Gradle 7.6.4
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Build debug APK (Cordova) — ${{ matrix.file }}
        run: |
          set -e
          npm install -g cordova@12.0.0
          cordova create cordova-build app.placeholder Placeholder
          rm -rf cordova-build/www
          cp -r "dist/${{ matrix.app }}/www" cordova-build/www
          # プラグイン (ファイル保存) を使うため cordova.js を読み込む
          sed -i 's#</head>#<script src="cordova.js"></script>\n</head>#' cordova-build/www/index.html
          cp "dist/${{ matrix.app }}/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova plugin add cordova-plugin-file@8.0.1
          # ファイルの取り込み (フォルダを開いて選ぶ) とダウンロード フォルダへの保存
          cordova plugin add "../dist/${{ matrix.app }}/cordova/bada-files"
          cordova build android
          grep -q "BadaFiles" platforms/android/app/src/main/res/xml/config.xml
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/${{ matrix.file }}-android.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-android-apk
          path: out/*.apk

  windows-exe:
    needs: test-and-bundle
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: contactgpt,  file: ContactGPT }
          - { app: transporter, file: TransporterCAD }
          - { app: ufo,         file: UFODesigner }
          - { app: badaclaude,  file: BadaClaude }
          - { app: studio,      file: ContactTransporterStudio }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows 10/11 EXE (Electron — NSIS installer + portable) — ${{ matrix.file }}
        working-directory: dist/${{ matrix.app }}/electron
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-windows-exe
          path: dist/${{ matrix.app }}/electron/dist/*.exe

  linux-app:
    needs: test-and-bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: contactgpt,  file: ContactGPT }
          - { app: transporter, file: TransporterCAD }
          - { app: ufo,         file: UFODesigner }
          - { app: badaclaude,  file: BadaClaude }
          - { app: studio,      file: ContactTransporterStudio }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Linux AppImage + deb (Electron) — ${{ matrix.file }}
        working-directory: dist/${{ matrix.app }}/electron
        run: |
          npm install --no-audit --no-fund
          npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-linux
          path: |
            dist/${{ matrix.app }}/electron/dist/*.AppImage
            dist/${{ matrix.app }}/electron/dist/*.deb

  release:
    runs-on: ubuntu-latest
    needs: [android-apk, windows-exe, linux-app, paper-apps]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: PaperApps
          path: release/paper-apps
      - name: List files
        run: ls -laR release
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Bada 4 apps — ContactGPT / 輸送機 3D CAD / UFO 設計図面 / BadaClaude (${{ env.RELEASE_TAG }})
          prerelease: true
          body: |
            量子プログラミング言語 Bada で書かれた 4 つのアプリ (アプリ内 Bada IDE 付き)。

            | アプリ | Android | Windows 10 / 11 | Linux |
            |:--|:--|:--|:--|
            | **ContactGPT** | `ContactGPT-android.apk` | `ContactGPT-*-x64.exe` / `*-portable.exe` | `ContactGPT-*.AppImage` / `*.deb` |
            | **輸送機 3D CAD** | `TransporterCAD-android.apk` | `TransporterCAD-*-x64.exe` / `*-portable.exe` | `TransporterCAD-*.AppImage` / `*.deb` |
            | **UFO 設計図面** | `UFODesigner-android.apk` | `UFODesigner-*-x64.exe` / `*-portable.exe` | `UFODesigner-*.AppImage` / `*.deb` |
            | **BadaClaude** | `BadaClaude-android.apk` | `BadaClaude-*-x64.exe` / `*-portable.exe` | `BadaClaude-*.AppImage` / `*.deb` |
            | 統合版 (3 アプリ) | `ContactTransporterStudio-android.apk` | `ContactTransporterStudio-*.exe` | `ContactTransporterStudio-*.AppImage` / `*.deb` |

            - Android: 提供元不明のアプリのインストールを許可して APK を開く
            - Windows: `*-x64.exe` はインストーラ、`*-portable.exe` はインストール不要
            - Linux: `chmod +x *.AppImage` で実行、または `sudo apt install ./xxx.deb`

            **論文 PDF → アプリ**: 各アプリの「📄 論文→アプリ」タブで PDF を投稿すると、Bada でアプリを書き、
            作ったアプリ (.bada / .html)・Windows 10 / 11 EXE・APK・Linux .deb・設計書 PDF・論文 PDF をダウンロード フォルダへ保存できます。
            `contact_transporter/papers/` に置いた PDF から作った一式 (`paper_*.exe` / `paper_*.apk` / `bada-paper-*.deb` / `paper_*.html`) も添付しています。

            ※ 設計図書 (contact_blueprint.pdf) の方程式に基づく思索的・フィクションの設計図 (幾何的な可視化) です。
          files: |
            release/*.apk
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/paper-apps/*/*.apk
            release/paper-apps/*/*.exe
            release/paper-apps/*/*.deb
            release/paper-apps/*/*.html
