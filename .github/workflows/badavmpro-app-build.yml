name: Bada VM Pro app build (Android APK + Windows EXE + Ubuntu)

# bada_vm_pro/ の「Bada VM Pro」— 量子 Bada 言語 OS (デスクトップは w9wm
# window manager / ベースは BadaGPT / Ubuntu 風ユーザーランド:
# bash・apt・vim・emacs・ssh・xinetd・texlive-full・screen・fcitx-mozc を
# 事前インストール / 日本語入力対応ターミナル xterm・x-terminal-emulator・
# terminal / Bada on Rails / 合い言葉コマンド / トランスフォーマー補完) を
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。OS 本体は bada_vm_pro/index.html の自己完結 HTML で、
# これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (badavmpro-v* タグ / release_tag 指定時)
# GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: badavmpro-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'badavmpro-v*'
    branches:
      - main
      - 'claude/quantum-crypto-multiplatform-303qm2'
    paths:
      - 'bada_vm_pro/**'
      - '.github/workflows/badavmpro-app-build.yml'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check OS HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bada_vm_pro/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bada_vm_pro/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/vm.js", m[1]);
            for (const marker of ["function badaInterpret", "function transformerPredict",
                                  "function railsScaffold", "function badaGPTReply",
                                  "function osUpdate", "function matchPassphrase",
                                  "function renderPage"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/vm.js
          echo "Bada VM Pro self-check OK"
      - name: Engine tests (quantum / transformer / rails / passphrase / os-update / iso-mount)
        run: |
          set -e
          node bada_vm_pro/tools/engine-test.js
      - name: ISO 9660 builder/parser tests
        run: |
          set -e
          node bada_vm_pro/tools/iso-test.js | tee /tmp/iso.out
          grep -q "ALL ISO TESTS PASSED" /tmp/iso.out

  live-iso:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Bada VM Pro live ISO (ハイブリッド ISO 9660 + El Torito + MBR, 依存ゼロ)
        run: |
          set -e
          node bada_vm_pro/tools/build-iso.js
          file bada_vm_pro/dist/BadaVMPro-live.iso
          # ISO 9660 かつ Rufus 対応のハイブリッド MBR (DOS/MBR boot sector) であること
          file bada_vm_pro/dist/BadaVMPro-live.iso | grep -q "ISO 9660"
          file bada_vm_pro/dist/BadaVMPro-live.iso | grep -q "bootable"
          file bada_vm_pro/dist/BadaVMPro-live.iso | grep -q "MBR boot sector"
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: badavmpro-iso
          path: bada_vm_pro/dist/BadaVMPro-live.iso
      - name: Attach ISO to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_vm_pro/dist/BadaVMPro-live.iso

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained OS)
        run: |
          mkdir -p bada_vm_pro/app/www
          cp bada_vm_pro/index.html bada_vm_pro/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_vm_pro/app"
          cordova create cordova-build io.github.masaaki_avnturle.badavmpro BadaVMPro
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-vm-pro-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badavmpro-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained OS)
        shell: bash
        run: |
          mkdir -p bada_vm_pro/app/www
          cp bada_vm_pro/index.html bada_vm_pro/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bada_vm_pro/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: badavmpro-windows
          path: bada_vm_pro/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_vm_pro/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained OS)
        run: |
          mkdir -p bada_vm_pro/app/www
          cp bada_vm_pro/index.html bada_vm_pro/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_vm_pro/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: badavmpro-linux
          path: |
            bada_vm_pro/app/electron/dist/*.AppImage
            bada_vm_pro/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_vm_pro/app/electron/dist/*.AppImage
            bada_vm_pro/app/electron/dist/*.deb
