name: Bada MultiWindow app build (Android APK)

# multiwindow/ の Samsung フリーフォーム対応マルチウィンドウ アプリを
# Android APK としてビルドします。純ネイティブ (Java + フレームワーク API のみ、
# 依存ライブラリ・WebView なし) なので APK は極小で、ストレージ空き容量の
# 少ないタブレットにもインストールできます。
# Actions アーティファクト、および (multiwindow-v* タグ / release_tag 指定時)
# GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: multiwindow-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'multiwindow-v*'

permissions:
  contents: write

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify freeform / multi-window declarations
        run: |
          set -e
          M=multiwindow/app-android/app/src/main/AndroidManifest.xml
          test -f "$M"
          grep -q 'android.software.freeform_window_management' "$M"
          grep -q 'android:resizeableActivity="true"' "$M"
          grep -q 'com.samsung.android.sdk.multiwindow.enable' "$M"
          grep -q 'android:documentLaunchMode="always"' "$M"
          SRC=multiwindow/app-android/app/src/main/java/io/github/masaaki_avnturle/multiwindow
          for f in LauncherActivity MemoActivity CalcActivity ClockActivity MonitorActivity; do
            test -f "$SRC/$f.java"
          done
          grep -q 'setLaunchBounds' "$SRC/LauncherActivity.java"
          grep -q 'FLAG_ACTIVITY_MULTIPLE_TASK' "$SRC/LauncherActivity.java"
          echo "self-check OK"

  android-apk:
    runs-on: ubuntu-latest
    needs: self-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      # ランナー標準の Gradle は AGP 8.5 と非互換の場合があるため 8.9 を明示。
      - name: Pin Gradle 8.9
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: multiwindow/app-android
        run: |
          gradle --version
          gradle --no-daemon assembleDebug
      - name: Collect APK
        run: |
          mkdir -p out
          cp multiwindow/app-android/app/build/outputs/apk/debug/app-debug.apk out/bada-multiwindow-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiwindow-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk
