name: Build HHKB APK

on:
  push:
    branches:
      - "claude/happy-hacking-android12-guiap5"
      - "main"
    paths:
      - "hhkb_android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:        # allow manual runs from the Actions tab
  release:
    types: [created]

permissions:
  contents: write           # needed to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hhkb_android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadaHHKB-debug-apk
          path: hhkb_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Commit the raw .apk back to the branch so it can be downloaded directly
      # (one tap, no ZIP) from raw.githubusercontent.com — see dist/BadaHHKB.apk.
      - name: Publish raw APK into the repo
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist
          cp hhkb_android/app/build/outputs/apk/debug/app-debug.apk dist/BadaHHKB.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/BadaHHKB.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish BadaHHKB.apk [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish Release with the raw APK (on tag / release)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Bada HHKB Keyboard
          body: |
            Bada HHKB ホログラム・キーボード（デバッグ署名）。
            下の `app-debug.apk` を直接ダウンロードしてインストールしてください
            （Actions の Artifacts と違い ZIP ではありません）。
            初回のみ：旧バージョンが入っている場合はアンインストールしてからどうぞ。
          files: hhkb_android/app/build/outputs/apk/debug/*.apk
