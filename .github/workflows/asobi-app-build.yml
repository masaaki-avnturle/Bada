name: Bada Asobi app build (Android APK + Windows EXE + Ubuntu)

# bada_asobi/ の「Bada 遊」— 量子プログラミング言語 Bada の上に築いた
# 「遊び」の概念と、その円環の中でだけ働く違反思考変異アルゴリズム。
#   遊び   = 規則の固有状態から外れて持てる振幅 sin²(θ/2)
#   考え   = 違反生成子 V の部分回転 exp(−iθV/2) (0 < θ ≤ θmax < π)
#   円環   = ユニタリ共役。帰還 C† で状態は巻き戻り、記録だけが外へ出る
#   不可侵 = 違反生成子が可換であることを要求され、回転でも観測でも保存される
# これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は bada_asobi/index.html の自己完結 HTML で、
# これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (asobi-v* タグ / release_tag 指定時)
# GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: asobi-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'asobi-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bada_asobi/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bada_asobi/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/asobi.js", m[1]);
            for (const marker of ["function asobiRng", "function qsNew", "function qsMeasure",
                                  "function pauliApply", "function pauliExpect", "function pauliAnticommute",
                                  "function rotApply", "function violationGens", "function violationGen",
                                  "function nkLandscape", "function trapLandscape", "function defaultRules",
                                  "function constrainedRules", "function ruleConform", "function popEntropy",
                                  "function ttmInit", "function ttmStep", "function ttmRun",
                                  "function gaClassicRun", "function asobiInterpret", "function aiCompose",
                                  "function boot"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
            if (!m[1].includes("THETA_MAX = 0.85 * Math.PI")) {
              console.error("missing the theta bound that keeps a thought from becoming an act");
              process.exit(1);
            }
          '
          node --check /tmp/asobi.js
          echo "Bada Asobi self-check OK"
      - name: Engine tests (quantum core / invariants / TTM vs classic mutation / interpreter / AI kernel)
        run: |
          set -e
          node bada_asobi/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_asobi/app/www
          cp bada_asobi/index.html bada_asobi/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_asobi/app"
          cordova create cordova-build io.github.masaaki_avnturle.badaasobi BadaAsobi
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-asobi-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asobi-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p bada_asobi/app/www
          cp bada_asobi/index.html bada_asobi/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bada_asobi/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: asobi-windows
          path: bada_asobi/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_asobi/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_asobi/app/www
          cp bada_asobi/index.html bada_asobi/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_asobi/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asobi-linux
          path: |
            bada_asobi/app/electron/dist/*.AppImage
            bada_asobi/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_asobi/app/electron/dist/*.AppImage
            bada_asobi/app/electron/dist/*.deb
