name: Build Noema Apps (APK + Windows EXE)

# Builds both downloadable packages of the 未知事前予知エンジン / NoemaKey predictive
# keyboard on GitHub's runners:
#   * android-apk   — bada_apk     -> app-debug.apk       (ubuntu-latest)
#   * windows-exe   — bada_desktop -> NoemaKey.exe (+ .msi) (windows-latest)
# Both are uploaded as workflow artifacts. On a pushed tag `v*` (or a Release),
# both are attached to the GitHub Release for stable download URLs.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  release:
    types: [created, published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bada_apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/noema-precog.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noema-precog-apk
          path: bada_apk/out/noema-precog.apk
          if-no-files-found: error

      - name: Attach APK to Release (on tag or release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bada_apk/out/noema-precog.apk
          generate_release_notes: true

  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: bada_desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./gradlew --no-daemon installDist

      - name: Package Windows app-image (.exe) with jpackage
        run: |
          jpackage --type app-image \
            --input build/install/NoemaKey/lib \
            --main-jar NoemaKey.jar \
            --main-class com.yamaguchi.bada.desktop.MainKt \
            --name NoemaKey \
            --app-version 0.2.0 \
            --dest build/jpackage

      - name: Package Windows installer (.msi) with jpackage
        continue-on-error: true
        run: |
          jpackage --type msi \
            --input build/install/NoemaKey/lib \
            --main-jar NoemaKey.jar \
            --main-class com.yamaguchi.bada.desktop.MainKt \
            --name NoemaKey \
            --app-version 0.2.0 \
            --win-menu --win-shortcut --win-dir-chooser \
            --dest build/installer

      - name: Zip the portable app-image (contains NoemaKey.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path build/jpackage/NoemaKey -DestinationPath out/noemakey-windows.zip -Force
          if (Test-Path build/installer) { Copy-Item build/installer/*.msi out/ -ErrorAction SilentlyContinue }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noemakey-windows-exe
          path: |
            bada_desktop/out/noemakey-windows.zip
            bada_desktop/out/*.msi
          if-no-files-found: error

      - name: Attach Windows packages to Release (on tag or release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bada_desktop/out/noemakey-windows.zip
            bada_desktop/out/*.msi
          generate_release_notes: true
