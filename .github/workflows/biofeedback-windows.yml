name: Build Bada Biofeedback (Windows exe)

# Windows 10/11 用 .exe を mingw-w64 でクロスビルドし、成果物を
#  - Actions の Artifacts (どのブランチでも: Actions 画面からダウンロード)
#  - タグ push 時は Release にも添付 (Releases からダウンロード)
# として公開する。
#
# ⚠️ このアプリは音響トーン発生器 + センサー可視化 + 娯楽オラクルです。
#    未来予知やアカシックレコード等の主張はしません。

on:
  push:
    branches: [ "**" ]
    paths:
      - "bio_medicine/biofeedback_audio/**"
      - ".github/workflows/biofeedback-windows.yml"
    tags:
      - "v*"
  workflow_dispatch:      # 手動実行も可能

permissions:
  contents: write         # Release 作成に必要

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 make

      - name: Build Windows exes (x64 + x86)
        working-directory: bio_medicine/biofeedback_audio
        run: |
          make windows
          ls -l *.exe

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp bio_medicine/biofeedback_audio/BadaBiofeedback-x64.exe dist/
          cp bio_medicine/biofeedback_audio/BadaBiofeedback-x86.exe dist/
          cp bio_medicine/biofeedback_audio/README.md dist/README-biofeedback.md

      - name: Upload build artifacts (download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: BadaBiofeedback-windows
          path: dist/*

      - name: Attach to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BadaBiofeedback-x64.exe
            dist/BadaBiofeedback-x86.exe
