name: Build Bada Biofeedback (Windows exe)

# Windows 10/11 用 .exe を mingw-w64 でクロスビルドし、成果物を
#  - Actions の Artifacts (どのブランチでも: Actions 画面からダウンロード)
#  - タグ push 時は Release にも添付 (Releases からダウンロード)
# として公開する。
#
# ⚠️ このアプリは音響トーン発生器 + センサー可視化 + 娯楽オラクルです。
#    未来予知やアカシックレコード等の主張はしません。

on:
  push:
    branches:
      - "claude/biofeedback-audio-app-c-naFdR"
    tags:
      - "biofeedback-v*"     # このタグを打つと Release に exe を添付
  workflow_dispatch:         # 手動実行(release_tag を指定すると Release も作成)
    inputs:
      release_tag:
        description: "Release を作成する場合のタグ名(例: biofeedback-v1.0.0)。空なら Actions 成果物のみ。"
        required: false
        default: ""

permissions:
  contents: write         # Release 作成に必要

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 make

      - name: Build Windows exes (x64 + x86)
        working-directory: bio_medicine/biofeedback_audio
        run: |
          make windows
          ls -l *.exe

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp bio_medicine/biofeedback_audio/BadaBiofeedback-x64.exe dist/
          cp bio_medicine/biofeedback_audio/BadaBiofeedback-x86.exe dist/
          cp bio_medicine/biofeedback_audio/README.md dist/README-biofeedback.md

      - name: Upload build artifacts (download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: BadaBiofeedback-windows
          path: dist/*

      - name: Attach to Release (on tag push, or manual dispatch with release_tag)
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # tag push 時は ref_name、手動実行時は入力タグ名(タグが無ければ作成される)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: "Bada Biofeedback ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}"
          body: |
            Windows 10/11 用の単体 exe（インストール不要）。

            - `BadaBiofeedback-x64.exe` … 64bit（推奨）
            - `BadaBiofeedback-x86.exe` … 32bit

            機能: プリセット選択・センサー/EEG/ECG のライブ表示・波形・音再生・
            娯楽オラクル・脳波/心電フィードバック。

            ⚠️ 本アプリは音響トーン発生器 + センサー可視化 + 娯楽オラクルです。
            未来予知・アカシックレコード・医療診断などの主張はしません。
            署名なしのため初回起動時に SmartScreen 警告が出る場合があります。
          files: |
            dist/BadaBiofeedback-x64.exe
            dist/BadaBiofeedback-x86.exe
