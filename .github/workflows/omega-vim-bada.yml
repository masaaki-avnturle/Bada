name: Ω-Vim (Bada-language editor · Ubuntu .deb + tar.gz)

# Builds Ω-Vim — the Vim editor written in the Bada language — and publishes a
# downloadable .deb and portable .tar.gz.
#   - always: uploads build artifacts (downloadable from the Actions run)
#   - on tag 'ovim-v*': also attaches them to a GitHub Release
# Pure Ruby (stdlib only); the Bada host library is vendored into the packages.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'omega_vim_bada/**'
      - 'bada_ruby/**'
      - '.github/workflows/omega-vim-bada.yml'
    tags:
      - 'ovim-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omega_vim_bada
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Syntax check
        run: make check

      - name: Test (20 checks — CodeFix, editor, .bada program)
        run: make test

      - name: Package (.deb + .tar.gz)
        run: VERSION=1.0.0 sh packaging/build-deb.sh

      - name: Smoke-test the built .deb (self-contained, vendored Bada)
        run: |
          DEB=$(ls dist/*.deb | head -1)
          dpkg-deb -x "$DEB" /tmp/ovroot
          ruby /tmp/ovroot/usr/share/omega-vim/bin/omega-vim version
          ruby /tmp/ovroot/usr/share/omega-vim/bin/omega-vim analyze \
               /tmp/ovroot/usr/share/omega-vim/examples/buggy.c

      - name: List artifacts
        run: ls -la dist/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-vim-deb
          path: omega_vim_bada/dist/*.deb

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-vim-tarball
          path: omega_vim_bada/dist/*.tar.gz

      - name: Attach to GitHub Release (on ovim-v* tag)
        if: startsWith(github.ref, 'refs/tags/ovim-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omega_vim_bada/dist/*.deb
            omega_vim_bada/dist/*.tar.gz
