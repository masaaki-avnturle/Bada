name: Bada Relativity Lens app build (Android APK + Windows EXE + Ubuntu)

# relativity_lens/ の「Bada Relativity Lens (相対論レンズ)」— 任意の画像を
# 特殊相対性理論の光学に通し、そこで生じる見た目のズレを厳密な逆変換で
# 打ち消すアプリ。
#   - 相対論的光行差  cosθ' = (cosθ+β)/(1+β cosθ)
#   - 相対論的ドップラー D = γ(1+β cosθ)、観測波長 λ' = λ/D
#   - ビーミング       I' = D⁴ I
#   - テレル回転       tanθ_now = γ tanθ との差
# 光行差は β → −β がそのまま逆写像になるため、幾何のズレ防止は数値誤差
# (1e-13 px) まで厳密です。中核の光時計は原図のスケッチ (鏡のバーと交差する
# 2 本の光線) をそのまま実装しています。これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は relativity_lens/index.html の自己完結
# HTML で、これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (relativitylens-v* タグ / release_tag
# 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: relativitylens-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'relativitylens-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f relativity_lens/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("relativity_lens/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/lens.js", m[1]);
            for (const marker of ["function gammaOf", "function aberrateDir",
                                  "function contractDir", "function correctDir",
                                  "function dopplerFactor", "function terrellAngle",
                                  "function aberratedFov", "function makeCam",
                                  "function pixelToDir", "function dirToPixel",
                                  "function spectralBasis", "function dopplerMatrix",
                                  "function dopplerUnshiftMatrix", "function warpImage",
                                  "function zureField", "function zureReport",
                                  "function lightClock", "function sketchGeometry",
                                  "function sampleImage", "function lensIntent",
                                  "function lensReply"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/lens.js
          echo "Bada Relativity Lens self-check OK"
      - name: Engine tests (aberration / Doppler / beaming / Terrell / misalignment cancellation / light clock / intents)
        run: |
          set -e
          node relativity_lens/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p relativity_lens/app/www
          cp relativity_lens/index.html relativity_lens/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="relativity_lens/app"
          cordova create cordova-build io.github.masaaki_avnturle.badarelativitylens BadaRelativityLens
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-relativity-lens-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relativitylens-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p relativity_lens/app/www
          cp relativity_lens/index.html relativity_lens/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: relativity_lens/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: relativitylens-windows
          path: relativity_lens/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: relativity_lens/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p relativity_lens/app/www
          cp relativity_lens/index.html relativity_lens/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: relativity_lens/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relativitylens-linux
          path: |
            relativity_lens/app/electron/dist/*.AppImage
            relativity_lens/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            relativity_lens/app/electron/dist/*.AppImage
            relativity_lens/app/electron/dist/*.deb
