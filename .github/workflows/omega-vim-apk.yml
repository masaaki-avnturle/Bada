name: Ω-Vim Android APK

# Dedicated, reproducible Android APK build for the Ω-Vim GUI (Bada-language
# editor: grammar checker, parser completion, indent completion, spinning-top
# code fix). Builds from www/ + cordova/config.xml with pinned versions:
#   JDK 17 · cordova 12.0.0 · cordova-android 12.0.1 · platform 33 · build-tools 33.0.2
#
# The APK is downloadable from the Actions run (artifact "omega-vim-apk"), and
# attached to a GitHub Release either on an 'ovim-apk-v*' / 'ovim-gui-v*' tag,
# or on a manual (workflow_dispatch) run when a 'release_tag' input is given —
# the run then creates that tag at the built commit and publishes the Release.
#
# Run it manually from the Actions tab (workflow_dispatch), or it runs on any
# push that touches the GUI app.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag and attach the APK (e.g. ovim-apk-v1.0.0). Leave empty to only build the downloadable artifact."
        required: false
        default: ""
  push:
    branches:
      - 'claude/**'
    paths:
      - 'omega_vim_gui/www/**'
      - 'omega_vim_gui/cordova/**'
      - '.github/workflows/omega-vim-apk.yml'
    tags:
      - 'ovim-apk-v*'
      - 'ovim-gui-v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CORDOVA_VERSION: "12.0.0"
      CORDOVA_ANDROID: "12.0.1"
      ANDROID_PLATFORM: "android-33"
      ANDROID_BUILDTOOLS: "33.0.2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (required by cordova-android 12)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILDTOOLS}"

      # The ubuntu-latest runner now ships Gradle 9 (Groovy 4), whose default
      # imports dropped the unqualified XmlParser that cordova-android 12's
      # cordova.gradle relies on — so `cordova build` fails while bootstrapping
      # the wrapper. Provision Gradle 8.x (Groovy 3) and put it on PATH so
      # Cordova uses a compatible version. (setup-gradle also caches Gradle.)
      - name: Provision compatible Gradle 8.x
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Confirm gradle version on PATH
        run: gradle --version | grep -E '^Gradle' || true

      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g "cordova@${CORDOVA_VERSION}"
          cordova create cordova-build io.github.masaaki_avnturle.omega_vim OmegaVim
          rm -rf cordova-build/www
          cp -r omega_vim_gui/www cordova-build/www
          cp omega_vim_gui/cordova/config.xml cordova-build/config.xml
          cd cordova-build
          cordova platform add "android@${CORDOVA_ANDROID}"
          cordova build android --verbose

      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/omega-vim-debug.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-vim-apk
          path: out/omega-vim-debug.apk

      # Publish a GitHub Release with the APK attached. Fires when the build was
      # triggered by an 'ovim-apk-v*' / 'ovim-gui-v*' tag, or from a manual run
      # that supplied a 'release_tag' input (the action then creates that tag at
      # the built commit). Uses the runner's GITHUB_TOKEN (contents: write).
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          body: |
            **Ω-Vim** — Android debug APK.

            Bada-language modal editor (grammar checker · parser/indent completion ·
            spinning-top code fix), packaged with Cordova.

            - File: `omega-vim-debug.apk`
            - Build: pinned JDK 17 · cordova ${{ env.CORDOVA_VERSION }} · cordova-android ${{ env.CORDOVA_ANDROID }} · ${{ env.ANDROID_PLATFORM }} · build-tools ${{ env.ANDROID_BUILDTOOLS }}
            - This is a debug-signed APK: enable "install from unknown sources" on the device to install.
          files: out/omega-vim-debug.apk
