name: Kozuchi Kakeibo app build (Android APK)

# kozuchi_kakeibo/ の「小槌の家計簿」— レシートをカメラで撮影すると
# OCR (Tesseract.js・端末内実行) が日付・品目・金額を読み取り、勘定科目を
# 自動判定して複式簿記 (仕訳帳・総勘定元帳・試算表・損益計算書・貸借対照表)
# に自動登録する家計簿 — を Android 向け APK としてビルドします。
# アプリ本体は kozuchi_kakeibo/index.html の自己完結 HTML で、
# これをそのまま www として Cordova ラッパーに同梱します。
# Actions アーティファクト、および (kozuchi-v* タグ / release_tag 指定時)
# GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: kozuchi-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'kozuchi-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f kozuchi_kakeibo/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("kozuchi_kakeibo/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/kz.js", m[1]);
            for (const marker of ["function parseReceipt", "function guessCategory",
                                  "function accountBalance", "function addEntry",
                                  "function renderTrial", "function renderReports",
                                  "function parseAmount", "function z2h",
                                  "const ACCOUNTS", "const ITEM_RULES", "const STORE_RULES"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/kz.js
          echo "Kozuchi Kakeibo self-check OK"
      - name: Engine tests (receipt parser + double-entry bookkeeping)
        run: |
          set -e
          node kozuchi_kakeibo/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p kozuchi_kakeibo/app/www
          cp kozuchi_kakeibo/index.html kozuchi_kakeibo/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="kozuchi_kakeibo/app"
          cordova create cordova-build io.github.masaaki_avnturle.kozuchi KozuchiKakeibo
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/kozuchi-kakeibo-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kozuchi-kakeibo-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk
