name: Bada UltraNetwork app build (Android APK + Windows EXE + Ubuntu)

# ultra_network/ の「Bada UltraNetwork」— Panasonic HD-PLC の技術で家の
# 電力線 (コンセント) を物理層にして PC をインターネットへつなぎ、その
# フレームを NTT の加入者線へ写像し、そこに zone://url.or.jp ウルトラ
# ネットワーク WWW を通し、LINE / Instagram のメッセージ機能を取り込む
# 通信システム。層の組み方は AT&T ベル研究所の STREAMS (Dennis Ritchie
# の Streams I/O) と同じで、driver (HD-PLC) の上に ntt / zone / jones /
# msgmux を push し、各モジュールは wput (下り) と rput (上り) の対だけ
# を持ちます。通信は Jones 多項式量子暗号 (結び目の Kauffman ブラケット
# から導く長期鍵 + Bell 対 QKD + AEAD) で保護します。これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は ultra_network/index.html の自己完結
# HTML で、これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (ultranet-v* タグ / release_tag
# 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: ultranet-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    # 開発ブランチへの push でもビルドする。これにより main へ入れる前から
    # Actions の「アーティファクト」から APK / EXE / AppImage・deb を
    # ダウンロードできる (workflow_dispatch の実行ボタンは、ワークフローが
    # 既定ブランチに入るまで Actions の画面に現れないため)。
    branches:
      - 'claude/ultra-network-system-**'
    # 文書だけの変更ではビルドし直さない
    paths-ignore:
      - '**.md'
    tags:
      - 'ultranet-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f ultra_network/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("ultra_network/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/ultranet.js", m[1]);
            for (const marker of ["function sha256", "function hmacSha256",
                                  "function kauffman", "function jonesKey",
                                  "function zoneSeal", "function zoneOpen",
                                  "function qkdSession", "function zoneParse",
                                  "function dhtRoute", "function plcChannel",
                                  "function plcToneMap", "function dwtAnalyze",
                                  "function dwtSynthesize", "function plcModulate",
                                  "function plcDemodulate", "function plcFrame",
                                  "function plcDeframe", "function plcCsma",
                                  "function nttMap", "function nttUnmap",
                                  "function nttModulate", "function nttDemodulate",
                                  "function muLawEncode", "function rtpPacketize",
                                  "function lineVerify", "function igVerify",
                                  "function msgIngestLine", "function msgIngestInstagram",
                                  "function streamWrite", "function streamRead",
                                  "function ultraNew", "function ultraSend"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/ultranet.js
          echo "Bada UltraNetwork self-check OK"
      - name: Engine tests (HD-PLC / NTT 写像 / zone DHT / Jones 量子暗号 / LINE・Instagram 署名 / STREAMS 全層往復)
        run: |
          set -e
          node ultra_network/tools/engine-test.js
      - name: Bada reference source runs (ultra.bada, 既定のステップ上限で)
        run: |
          set -e
          node bada_gui_ide/cli/bada-cli.js run ultra_network/ultra.bada > /tmp/ultra-bada.out
          cat /tmp/ultra-bada.out
          grep -q "round-trip identical: true" /tmp/ultra-bada.out
          grep -q "STATUS 409 zone-guard-reject"  /tmp/ultra-bada.out
          grep -q "STATUS 503 plc-check-failed"   /tmp/ultra-bada.out
          grep -q "inverse ok: true"              /tmp/ultra-bada.out
          echo "ultra.bada OK"
      # ultra_network/bada/ の全モジュール (全層を Bada 言語で書いたもの) を
      # 連結して実際に走らせ、デモ本体と 107 項目の自己診断が通ることを確かめる。
      # 通らなければ dist/*.bada は書き出されず、ここで落ちる。
      - name: Bada full source build + self-test (ultra_network/bada/)
        run: |
          set -e
          node ultra_network/tools/build-bada.js
          test -f ultra_network/dist/ultra-full.bada
          test -f ultra_network/dist/ultra-selftest.bada
          grep -q "SELFTEST-RESULT 107 107" ultra_network/dist/ultra-selftest.out.txt
          echo "Bada full source OK"
      # 生成物がコミット済みのものと一致するか (ソースだけ直して dist を
      # 作り直し忘れる、の取りこぼしを防ぐ)
      - name: dist/*.bada is up to date
        run: |
          set -e
          git diff --exit-code -- ultra_network/dist/ultra-full.bada ultra_network/dist/ultra-selftest.bada \
            || { echo "ultra_network/dist/*.bada が古い。node ultra_network/tools/build-bada.js を実行してコミットしてください。"; exit 1; }

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p ultra_network/app/www
          cp ultra_network/index.html ultra_network/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="ultra_network/app"
          cordova create cordova-build io.github.masaaki_avnturle.ultranetwork BadaUltraNetwork
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-ultranetwork-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultranet-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p ultra_network/app/www
          cp ultra_network/index.html ultra_network/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: ultra_network/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultranet-windows
          path: ultra_network/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: ultra_network/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p ultra_network/app/www
          cp ultra_network/index.html ultra_network/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: ultra_network/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ultranet-linux
          path: |
            ultra_network/app/electron/dist/*.AppImage
            ultra_network/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            ultra_network/app/electron/dist/*.AppImage
            ultra_network/app/electron/dist/*.deb
