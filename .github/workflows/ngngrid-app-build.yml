name: NGN Quantum Grid app build (Windows EXE + Ubuntu + Android APK)

# ngngrid-app/ から NGN Quantum Grid (zone:// を NTT NGN に投射) を
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
#   - Android 向け APK
# としてビルドします。本体 (www/index.html) は tools/build-ngngrid.js が
# 生成する自己完結 HTML です。Actions アーティファクト、および
# (ngngrid-v* タグ / release_tag 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: ngngrid-v1.1.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    branches:
      - claude/zone-url-scheme-ibrc5y
      - main
    paths:
      - 'bada_gui_ide/ngngrid-app/**'
      - 'bada_gui_ide/ngngrid/**'
      - 'bada_gui_ide/browser/zone-lib.bada'
      - 'bada_gui_ide/tools/build-ngngrid.js'
      - '.github/workflows/ngngrid-app-build.yml'
    tags:
      - 'ngngrid-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build NGN www + self-check
        working-directory: bada_gui_ide
        run: |
          set -e
          node tools/build-ngngrid.js
          test -f ngngrid-app/www/index.html
          node cli/bada-cli.js run examples/ngn-quantum.bada | grep -q "quorum 4/4"

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate NGN www
        working-directory: bada_gui_ide
        run: node tools/build-ngngrid.js
      - name: Build Windows EXE (Electron)
        working-directory: bada_gui_ide/ngngrid-app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngngrid-windows
          path: bada_gui_ide/ngngrid-app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_gui_ide/ngngrid-app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate NGN www
        working-directory: bada_gui_ide
        run: node tools/build-ngngrid.js
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_gui_ide/ngngrid-app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ngngrid-linux
          path: |
            bada_gui_ide/ngngrid-app/electron/dist/*.AppImage
            bada_gui_ide/ngngrid-app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_gui_ide/ngngrid-app/electron/dist/*.AppImage
            bada_gui_ide/ngngrid-app/electron/dist/*.deb

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Generate NGN www
        working-directory: bada_gui_ide
        run: node tools/build-ngngrid.js
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_gui_ide/ngngrid-app"
          cordova create cordova-build io.github.masaaki_avnturle.ngnquantumgrid NGNQuantumGrid
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/ngn-quantum-grid-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngngrid-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk
