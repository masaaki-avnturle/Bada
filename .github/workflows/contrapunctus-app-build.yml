name: Bada Contrapunctus app build (Android APK + Windows EXE + Ubuntu)

# bach_monet_film/ の「Bada Contrapunctus」— 未完のフーガ × 祈るカミーユ 動画工房。
# どの拡張子の楽曲ファイルでも取り込み (ブラウザ復号 → WAV/AIFF 自前解析 →
# MIDI は音符として)、調性を解析して D 短調 / F 長調へ移調、大聖堂残響と
# J.S. バッハ「コントラプンクトゥス XIV」の 3 主題による 4 声オルガン対位法を
# 重ね、コード進行に沿った 11 行の平行トラック (弦楽 / 合唱 / フルート /
# チェンバロ / コントラバス / ティンパニ …) で作曲・編集、モネ風の筆致で
# 描いた「祈るカミーユ」の動画に MediaRecorder で録画します。これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は bach_monet_film/index.html の自己完結
# HTML で、これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (contrapunctus-v* タグ / release_tag
# 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: contrapunctus-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'contrapunctus-v*'
    branches:
      - main
    paths:
      - 'bach_monet_film/**'
      - '.github/workflows/contrapunctus-app-build.yml'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bach_monet_film/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bach_monet_film/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/contrapunctus.js", m[1]);
            for (const marker of ["function fft", "function detectKey", "function chooseTransposition",
                                  "function timeStretch", "function pitchShift", "function makeCathedralIR",
                                  "function planScore", "function energyEnvelope", "function encodeWav",
                                  "function decodeWav", "function decodeAiff", "function decodeMidi",
                                  "function parseChord", "function parseProgression", "function generateRoleNotes",
                                  "function playNote", "function arrangeTrack", "function encodeMidi",
                                  "function buildPainting", "function drawFrame", "function boot"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/contrapunctus.js
          echo "Bada Contrapunctus self-check OK"
      - name: Engine tests (FFT / key / phase vocoder / IR / score / chords / roles / MIDI / WAV / AIFF)
        run: |
          set -e
          node bach_monet_film/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bach_monet_film/app/www
          cp bach_monet_film/index.html bach_monet_film/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bach_monet_film/app"
          cordova create cordova-build io.github.masaaki_avnturle.badacontrapunctus BadaContrapunctus
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          # WebView は <a download href="blob:"> を処理しないため、
          # SAF (ACTION_CREATE_DOCUMENT) の保存ダイアログで動画 / WAV / MIDI を保存する。
          cordova plugin add cordova-plugin-save-dialog
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-contrapunctus-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: contrapunctus-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p bach_monet_film/app/www
          cp bach_monet_film/index.html bach_monet_film/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bach_monet_film/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: contrapunctus-windows
          path: bach_monet_film/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bach_monet_film/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bach_monet_film/app/www
          cp bach_monet_film/index.html bach_monet_film/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bach_monet_film/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contrapunctus-linux
          path: |
            bach_monet_film/app/electron/dist/*.AppImage
            bach_monet_film/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bach_monet_film/app/electron/dist/*.AppImage
            bach_monet_film/app/electron/dist/*.deb
