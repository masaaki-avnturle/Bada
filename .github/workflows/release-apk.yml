name: Release Bada IQ APK

# Build omega_iq_telomere_pkg into dist/bada_iq.apk and publish it as a
# downloadable GitHub Release asset. Triggers on a bada-iq-* tag push, and can
# also be run manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - 'bada-iq-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. bada-iq-v0.1.0)'
        required: true
        default: 'bada-iq-v0.1.0'

permissions:
  contents: write   # required to create the release and upload the asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run tests
        run: ruby omega_iq_telomere_pkg/test/test_iq.rb

      - name: Build APK
        run: bash omega_iq_telomere_pkg/build_apk.sh

      - name: Verify APK
        run: |
          file omega_iq_telomere_pkg/dist/bada_iq.apk
          unzip -l omega_iq_telomere_pkg/dist/bada_iq.apk

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # create the tag if this was a manual dispatch (tag pushes already have it)
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            omega_iq_telomere_pkg/dist/bada_iq.apk \
            --title "Bada 赤外線IQ・テロメア分裂測定 $TAG" \
            --notes "絵の方程式化 → Jones多項式 → テロメア分裂 → 赤外線カメラ/温度計 → IQ測定 (順 + 真逆) を行う Bada 言語アプリの APK パッケージ。下の Assets から **bada_iq.apk** をダウンロードできます。" \
            || gh release upload "$TAG" omega_iq_telomere_pkg/dist/bada_iq.apk --clobber
