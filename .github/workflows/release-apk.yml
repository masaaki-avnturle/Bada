name: Release Bada IQ APK

# Build omega_iq_telomere_pkg into dist/bada_iq.apk and make it downloadable two
# ways: as a workflow ARTIFACT (from the run page) and as a GitHub RELEASE asset.
# Runs on pushes to the dev branch that touch the package, on a bada-iq-* tag, or
# manually from the Actions tab.
on:
  push:
    branches:
      - 'claude/jones-polynomial-telomere-py9vra'
    paths:
      - 'omega_iq_telomere_pkg/**'
      - '.github/workflows/release-apk.yml'
    tags:
      - 'bada-iq-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. bada-iq-v0.1.0)'
        required: true
        default: 'bada-iq-v0.1.0'

permissions:
  contents: write   # required to push the tag and create the release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run tests
        run: ruby omega_iq_telomere_pkg/test/test_iq.rb

      - name: Build APK
        run: bash omega_iq_telomere_pkg/build_apk.sh

      - name: Verify APK
        run: |
          file omega_iq_telomere_pkg/dist/bada_iq.apk
          unzip -l omega_iq_telomere_pkg/dist/bada_iq.apk

      # Always-available download: the run page's Artifacts section.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada_iq_apk
          path: omega_iq_telomere_pkg/dist/bada_iq.apk
          if-no-files-found: error

      # Proper Releases-page download (best effort; needs contents:write).
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=bada-iq-v0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" omega_iq_telomere_pkg/dist/bada_iq.apk --clobber
          else
            gh release create "$TAG" \
              omega_iq_telomere_pkg/dist/bada_iq.apk \
              --title "Bada 赤外線IQ・テロメア分裂測定 $TAG" \
              --notes "絵の方程式化 → Jones多項式 → テロメア分裂 → 赤外線カメラ/温度計 → IQ測定 (順 + 真逆) を行う Bada 言語アプリの APK パッケージ。下の Assets から **bada_iq.apk** をダウンロードできます。"
          fi
