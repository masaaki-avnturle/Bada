name: BADA Compose app build (Android APK + Windows EXE + Ubuntu)

# bada_compose/ の「BADA Compose — 作曲スタジオ」。
# Piano Concerto BADA (bada_fuga/compose_pconcerto.py) のコード進行と対位法エンジンを
# JavaScript に移植し、小節ごとに和音・役割・テンポ・主題を編集して作曲するアプリ。
# 4 声を規則ベースで生成し、Web Audio のピアノ + 管弦楽で再生、
# WAV / MIDI / 動画 (MP4・WebM) / score.json に書き出します。これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は bada_compose/index.html の自己完結 HTML で、
# これをそのまま www として各ラッパーに同梱します。
# bada_compose/ を変更した push では Actions アーティファクトとしてビルドし、
# compose-v* タグ / release_tag 指定時は GitHub Release にも添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: compose-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    branches:
      - '**'
    tags:
      - 'compose-v*'
    # paths はブランチへの push にだけ効く (タグの push では評価されない)
    paths:
      - 'bada_compose/**'
      - '.github/workflows/compose-app-build.yml'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bada_compose/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bada_compose/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/bada-compose.js", m[1]);
            for (const marker of ["function chord", "function generate", "function realize", "function check",
                                  "function buildFugue", "function buildPConcerto", "function compose",
                                  "function arrangeLayers", "function makeEngine", "function midiFile",
                                  "function wavFile", "function scoreJson", "function saveBlob", "function boot"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/bada-compose.js
          echo "BADA Compose self-check OK"
      - name: Engine tests (chords / Piano Concerto BADA vs Python / counterpoint / editing / MIDI・WAV・score.json)
        run: node bada_compose/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_compose/app/www
          cp bada_compose/index.html bada_compose/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_compose/app"
          cordova create cordova-build io.github.masaaki_avnturle.badacompose BadaCompose
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          # WebView は <a download href="blob:"> を処理しないため、
          # SAF (ACTION_CREATE_DOCUMENT) の保存ダイアログで WAV / MIDI / 動画を保存する。
          cordova plugin add cordova-plugin-save-dialog
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-compose-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p bada_compose/app/www
          cp bada_compose/index.html bada_compose/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bada_compose/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-windows
          path: bada_compose/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_compose/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_compose/app/www
          cp bada_compose/index.html bada_compose/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_compose/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compose-linux
          path: |
            bada_compose/app/electron/dist/*.AppImage
            bada_compose/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_compose/app/electron/dist/*.AppImage
            bada_compose/app/electron/dist/*.deb
