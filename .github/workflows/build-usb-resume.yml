name: Build Ω-USB Resume (APK + Windows EXE)

# Ω-USB Resume (omega_usb_resume) を Windows 10/11 EXE と Android APK にビルドし、
# Actions アーティファクト、および usb-resume-v* タグ時は GitHub Release に添付します。
#
#   手動:   Actions → このワークフロー → Run workflow  (アーティファクトが取得可能)
#   公開:   git tag usb-resume-v1.0.0 && git push origin usb-resume-v1.0.0
#           → EXE と APK を付けた Release を自動作成
#
# ⚠ GUI は概念シミュレーションで、ホスト/端末の実USBには触れません。

on:
  workflow_dispatch:
  push:
    tags:
      - 'usb-resume-v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE (Electron)
        working-directory: omega_usb_resume/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega_usb_resume-windows
          path: omega_usb_resume/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Ω-USB Resume ${{ github.ref_name }}
          files: omega_usb_resume/electron/dist/*.exe
          body: |
            **Ω-USB Resume** — 死んだUSBポートを Bada の複素回転体・可積分系の n進数ズレ訂正で蘇生する概念シミュレーション。

            - `*.exe` … Windows 10 / 11 (NSIS インストーラ + portable)
            - `*.apk` … Android (下の android ジョブが添付)

            GUI はホスト/端末の実USBには触れません。実機の再認可・再列挙は Linux 版 CLI `bin/bada usb --apply`。

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Pin Gradle 8.7 (cordova-android 12 is incompatible with Gradle 9's XmlParser)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g cordova@12.0.0
          APP="omega_usb_resume"
          cordova create cordova-build com.bada.omega TmpApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/omega_usb_resume-debug.apk"
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega_usb_resume-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Ω-USB Resume ${{ github.ref_name }}
          files: out/*.apk
