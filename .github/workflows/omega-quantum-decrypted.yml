name: Ω Quantum Decrypted (Ubuntu .deb + tar.gz)

# Builds the omega_quantum_decrypted Linux/Ubuntu application and publishes a
# downloadable .deb package and portable .tar.gz.
#   - always: uploads build artifacts (downloadable from the Actions run)
#   - on tag 'oqd-v*': also attaches them to a GitHub Release
#
# The app is self-contained (only a C compiler + libc + libm needed).

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'omega_quantum_decrypted/**'
      - '.github/workflows/omega-quantum-decrypted.yml'
    tags:
      - 'oqd-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omega_quantum_decrypted
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: cc --version && dpkg-deb --version

      - name: Build
        run: make all

      - name: Test (selftest + round-trip + tamper detection)
        run: make test

      - name: Package (.deb + .tar.gz)
        run: VERSION=1.0.0 sh packaging/build-deb.sh

      - name: List artifacts
        run: ls -la dist/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-quantum-decrypted-deb
          path: omega_quantum_decrypted/dist/*.deb

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-quantum-decrypted-tarball
          path: omega_quantum_decrypted/dist/*.tar.gz

      - name: Attach to GitHub Release (on oqd-v* tag)
        if: startsWith(github.ref, 'refs/tags/oqd-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omega_quantum_decrypted/dist/*.deb
            omega_quantum_decrypted/dist/*.tar.gz
