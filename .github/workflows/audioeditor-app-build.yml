name: Bada AudioForge app build (Android APK + Windows EXE + Ubuntu)

# audio_editor/ の「Bada AudioForge」— 波形編集ができるオーディオエディタ。
# MP3 / WAV / OGG / M4A / FLAC を読み込み、波形を描画して範囲選択し、
# 切り取り / コピー / 貼り付け(挿入・ミックス)/ 削除 / 切り抜き / 無音化 /
# 繰り返し / 無音挿入、音量 (dB) / ノーマライズ / フェード / 逆再生 /
# 速度変更 / エコー / ローパス・ハイパス / DC 除去 / パン / モノラル化 を適用し、
# 自前エンコーダで WAV (16bit・24bit PCM / 32bit float) へ書き出します。これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は audio_editor/index.html の自己完結
# HTML で、これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (audioforge-v* タグ / release_tag
# 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: audioforge-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  # デフォルトブランチ以外でも Actions からダウンロードできるよう、
  # 作業ブランチへの push でもビルドを走らせます
  # (workflow_dispatch のボタンは main に入ってから表示されます)。
  push:
    branches:
      - 'claude/audio-editor-**'
    tags:
      - 'audioforge-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f audio_editor/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("audio_editor/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/audioforge.js", m[1]);
            for (const marker of ["function fmtTime", "function fmtBytes", "function fmtDb",
                                  "function sanitizeName", "function dbToLin", "function linToDb",
                                  "function makeClip", "function cloneClip", "function normRange",
                                  "function sliceClip", "function deleteRange", "function insertClip",
                                  "function mixClip", "function repeatRange", "function matchChannels",
                                  "function resampleChannel", "function resampleTo", "function changeSpeed",
                                  "function peakOf", "function rmsOf", "function applyGainRange",
                                  "function normalizeRange", "function fadeGain", "function fadeRange",
                                  "function silenceRange", "function reverseRange", "function removeDcOffset",
                                  "function panRange", "function toMono", "function filterRange",
                                  "function echoRange", "function trimSilenceRange", "function findZeroCrossing",
                                  "function channelPeaks", "function niceTimeStep",
                                  "function encodeWav", "function parseWav", "function boot"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/audioforge.js
          echo "Bada AudioForge self-check OK"
      - name: Engine tests (edit ops / effects / filters / analysis / WAV codec)
        run: |
          set -e
          node audio_editor/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p audio_editor/app/www
          cp audio_editor/index.html audio_editor/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="audio_editor/app"
          cordova create cordova-build io.github.masaaki_avnturle.badaaudioforge BadaAudioForge
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-audioforge-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioforge-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p audio_editor/app/www
          cp audio_editor/index.html audio_editor/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: audio_editor/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioforge-windows
          path: audio_editor/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: audio_editor/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p audio_editor/app/www
          cp audio_editor/index.html audio_editor/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: audio_editor/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audioforge-linux
          path: |
            audio_editor/app/electron/dist/*.AppImage
            audio_editor/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            audio_editor/app/electron/dist/*.AppImage
            audio_editor/app/electron/dist/*.deb
