name: AirShuttle Goggle app build (Android APK + Windows EXE + Linux)

# airshuttle_goggle/ の「エアシャトル・ゴーグル (AirShuttle Goggle)」—
#   ゴーグル型コンピュータ風の HUD で実写映像を再生し、
#   カメラに写った手を空中で “かき分ける” 動作だけで
#   巻き戻し (REW) / 早送り (FF) / フリック跳躍 / ホールドを行うスクラブ卓
#   (YCbCr 肌色クロマ + 動きエネルギーによるハンド抽出 → 連結成分ラベリング →
#    One Euro Filter → 編集卓デテント付きシャトル則 → トランスポート状態機械。
#    カメラ映像は端末内で処理し外部送信なし・完全オフライン) を
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Linux 向け AppImage / deb
# としてビルドします。アプリ本体は airshuttle_goggle/index.html の自己完結 HTML で、
# これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (airshuttle-v* タグ / release_tag 指定時)
# GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: airshuttle-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'airshuttle-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f airshuttle_goggle/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("airshuttle_goggle/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/airshuttle.js", m[1]);
            for (const marker of ["function rgbToYCbCr", "function isSkinPixel",
                                  "function segmentHand", "function labelBlobs",
                                  "function handFromBlob", "function classifyPose",
                                  "function oneEuroFilter", "function shuttleRate",
                                  "function snapRate", "function precisionScale",
                                  "function detectSwipe", "function flickJumpSeconds",
                                  "function nextTransport", "function advanceTime",
                                  "function effectiveRate", "function videoDriveMode",
                                  "function formatTimecode", "function partOffset"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
            // 完全オフライン (依存ゼロ) の保証: 外部スクリプト/スタイルを含まないこと
            if (/<script[^>]+src=/i.test(src) || /<link[^>]+href=/i.test(src)) {
              console.error("app must stay self-contained (no external script/stylesheet)");
              process.exit(1);
            }
          '
          node --check /tmp/airshuttle.js
          echo "AirShuttle self-check OK"
      - name: Engine tests (hand segmentation / One Euro / shuttle law / flick / transport)
        run: |
          set -e
          node airshuttle_goggle/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p airshuttle_goggle/app/www
          cp airshuttle_goggle/index.html airshuttle_goggle/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="airshuttle_goggle/app"
          cordova create cordova-build io.github.masaaki_avnturle.airshuttle AirShuttleGoggle
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          # インカメラを使うため Android の実行時パーミッションを要求するプラグイン
          # (アプリ側は plugin が無い環境でも動くようフォールバックします)
          cordova plugin add cordova-plugin-android-permissions@1.1.5
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/airshuttle-goggle-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airshuttle-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p airshuttle_goggle/app/www
          cp airshuttle_goggle/index.html airshuttle_goggle/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: airshuttle_goggle/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: airshuttle-windows
          path: airshuttle_goggle/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: airshuttle_goggle/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p airshuttle_goggle/app/www
          cp airshuttle_goggle/index.html airshuttle_goggle/app/www/index.html
      - name: Build Linux AppImage + deb (Electron)
        working-directory: airshuttle_goggle/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airshuttle-linux
          path: |
            airshuttle_goggle/app/electron/dist/*.AppImage
            airshuttle_goggle/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            airshuttle_goggle/app/electron/dist/*.AppImage
            airshuttle_goggle/app/electron/dist/*.deb
