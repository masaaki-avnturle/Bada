name: Build Bada IQ APK

# Builds the Android IQ app and makes the APK downloadable:
#   • every run uploads the APK as a workflow artifact, and
#   • pushes to main / the dev branch (and version tags) publish it to a
#     GitHub Release so anyone can download it directly from the repo.

on:
  push:
    branches:
      - main
      - "claude/iq-stats-bada-apps-vf4bce"
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bada-iq.apk
          ls -la bada-iq.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada-iq-apk
          path: bada-iq.apk

      # Rolling "latest" release so the APK is always downloadable from the repo.
      - name: Publish rolling APK release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bada IQ APK (latest)
          prerelease: true
          body: |
            最新の Bada IQ 判定器 Android アプリ（デバッグ署名 APK）。
            端末で「提供元不明のアプリ」を許可して `bada-iq.apk` をインストールしてください。
            ※ 教育的モデルであり医療診断ではありません。
          files: bada-iq.apk

      # Versioned release when a v* tag is pushed.
      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bada-iq.apk
