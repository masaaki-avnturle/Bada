name: Build Android APK

# Builds the Bada CodeFix Android app and publishes the APK so it can be
# downloaded from the repo:
#   * every build          -> as a workflow "Artifacts" download
#   * a v* tag              -> attached to a GitHub Release (Assets)
#   * manual "Run workflow" -> creates/updates a Release (tag published
#                              server-side by GITHUB_TOKEN) with the APK
#
# The manual path exists because tag pushes may be blocked by the hosting
# proxy; softprops/action-gh-release creates the tag on the server side.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a Release with this tag and attach the APK (leave blank to only build the artifact)"
        required: false
        default: "v0.1.0"
