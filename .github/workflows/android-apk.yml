name: Build Android APK

# Builds the Bada CodeFix Android app and publishes the APK so it can be
# downloaded from the repo:
#   * every build          -> as a workflow "Artifacts" download
#   * a v* tag              -> attached to a GitHub Release (Assets)
#   * manual "Run workflow" -> creates/updates a Release (tag published
#                              server-side by GITHUB_TOKEN) with the APK
#
# The manual path exists because tag pushes may be blocked by the hosting
# proxy; softprops/action-gh-release creates the tag on the server side.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a Release with this tag and attach the APK (leave blank to only build the artifact)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bada-codefix-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada-codefix-apk
          path: android/bada-codefix-debug.apk
          if-no-files-found: error

      - name: Publish Release with APK (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bada-codefix-debug.apk

      - name: Publish Release with APK (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Bada CodeFix ${{ inputs.release_tag }}
          body: |
            Bada CodeFix — 複素回転体・特殊相対性の可積分コマ幾何による
            ソースコード・エラー修正 Android アプリ（複数投稿対応）。

            `bada-codefix-debug.apk` をダウンロードして端末にインストールしてください
            （デバッグ署名。提供元不明アプリの許可が必要）。
          files: android/bada-codefix-debug.apk
          make_latest: "true"
