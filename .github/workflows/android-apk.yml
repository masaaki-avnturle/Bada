name: Build Bada Hologram APK

# Builds the WebView APK that bundles the hologram apps (display, HHKB keyboard,
# mirror, spatial / Vision-Pro-equivalent) and publishes it as a downloadable
# release asset.  Runs on pushes that touch the app, and on demand.

on:
  push:
    branches: [ "claude/bada-compiler-interpreter-DKQys" ]
    paths:
      - "android/**"
      - "bada_webos/hologram/**"
      - "bada_webos/apps/hologram/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate hologram HTML assets (computed in Bada)
        run: python3 android/generate_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/bada-hologram.apk
          ls -la dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada-hologram-apk
          path: dist/bada-hologram.apk

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hologram-apk
          name: Bada Hologram APK
          body: |
            The Bada Hologram Android app (WebView) bundling:
            - Hologram Display (reflection pyramid / free view)
            - Float-up Hologram (Jones relief + conductive-plastic power)
            - Holographic Happy Hacking Keyboard
            - Mirror App (aerial display / aerial HHKB)
            - Spatial Hologram (Vision-Pro-equivalent passthrough)

            Download **bada-hologram.apk** below and install it
            (enable "install from unknown sources").
          prerelease: true
          files: dist/bada-hologram.apk
