name: Restore apps build (APK + Windows + Ubuntu)

# 音色リストア (voice_restore) と 動画リストア (video_restore) を
#   - Android APK               (Cordova)
#   - Windows 10/11 EXE         (Electron: NSIS インストーラ + ポータブル)
#   - Ubuntu AppImage / deb     (Electron)
# としてビルドし、Actions アーティファクト、および
# (restore-v* タグ / release_tag 指定時) GitHub Release に添付します。
#
# ⚠ いずれも「変調/編集を逆補正して近づける」近似ツールで、完全復元を保証しません。
#    すべて端末内処理・非送信です。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: restore-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'restore-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run DSP / VFX unit tests
        run: |
          set -e
          node voice_restore/test/dsp.test.mjs
          node video_restore/test/vfx.test.mjs

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        app: [voice_restore, video_restore]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE (Electron)
        working-directory: ${{ matrix.app }}/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: ${{ matrix.app }}/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: ${{ matrix.app }}/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        app: [voice_restore, video_restore]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: ${{ matrix.app }}/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: |
            ${{ matrix.app }}/electron/dist/*.AppImage
            ${{ matrix.app }}/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            ${{ matrix.app }}/electron/dist/*.AppImage
            ${{ matrix.app }}/electron/dist/*.deb

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: voice_restore
            id: io.github.masaaki_avnturle.sound_restore
            artifact: sound-restore
          - app: video_restore
            id: io.github.masaaki_avnturle.video_restore
            artifact: video-restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="${{ matrix.app }}"
          cordova create cordova-build "${{ matrix.id }}" RestoreApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/${{ matrix.artifact }}-debug.apk"
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk
