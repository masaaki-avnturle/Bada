name: Restore apps build (APK)

# 音色リストア (voice_restore) と 動画リストア (video_restore) の www + cordova から
# Android APK をビルドし、Actions アーティファクト、および (restore-v* タグ時) Release へ添付します。
#
# ⚠ いずれも「変調/編集を逆補正して近づける」近似ツールで、完全復元を保証しません。
#    すべて端末内処理・非送信です。

on:
  workflow_dispatch:
  push:
    tags:
      - 'restore-v*'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: voice_restore
            id: io.github.masaaki_avnturle.sound_restore
            artifact: sound-restore
          - app: video_restore
            id: io.github.masaaki_avnturle.video_restore
            artifact: video-restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g cordova@12.0.0
          APP="${{ matrix.app }}"
          cordova create cordova-build "${{ matrix.id }}" RestoreApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/${{ matrix.artifact }}-debug.apk"
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
