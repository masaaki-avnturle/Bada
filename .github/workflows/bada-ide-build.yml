name: Bada GUI IDE build (Windows EXE + Ubuntu + Android APK + CLI)

# bada_gui_ide/ (www + electron + cordova + cli) から
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
#   - Android 向け APK
#   - コマンドライン アプリ (Node SEA 単一実行ファイル: bada-cli.exe / bada-cli-linux-x64)
# をビルドし、Actions アーティファクト、および (bada-ide-v* タグ時)
# GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: bada-ide-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'bada-ide-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Interpreter + transpiler smoke test
        run: |
          set -e
          cd bada_gui_ide
          node cli/bada-cli.js run examples/hello.bada
          node cli/bada-cli.js run examples/engine.bada | tee /tmp/engine.out
          grep -q "base zeros     = \[3, 6\]" /tmp/engine.out
          grep -q "5.55e-17" /tmp/engine.out
          node cli/bada-cli.js run examples/quantum.bada | tee /tmp/quantum.out
          grep -q "0.50000 0.50000" /tmp/quantum.out
          node cli/bada-cli.js build examples/core.bada -o /tmp/core
          /tmp/core | grep -q "compiled engine: V        = 8"

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE (Electron)
        working-directory: bada_gui_ide/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada-gui-ide-windows
          path: bada_gui_ide/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: bada_gui_ide/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_gui_ide/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bada-gui-ide-linux
          path: |
            bada_gui_ide/electron/dist/*.AppImage
            bada_gui_ide/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: |
            bada_gui_ide/electron/dist/*.AppImage
            bada_gui_ide/electron/dist/*.deb

  # ---- コマンドライン アプリ (単一実行ファイル, Node SEA) ----
  # cli/bada-cli.js を esbuild で 1 ファイルにバンドルし、Node SEA
  # (Single Executable Application) で node 本体へ注入して、依存なしで
  # 実行できる単体バイナリを作る。run/build/emit/tokens/ast/repl/examples。
  cli-linux:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build single-binary CLI (Node SEA)
        working-directory: bada_gui_ide
        run: |
          set -e
          mkdir -p dist-cli
          npx --yes esbuild cli/bada-cli.js --bundle --platform=node --format=cjs --outfile=dist-cli/bada-bundle.cjs
          cat > dist-cli/sea-config.json <<'EOF'
          { "main": "dist-cli/bada-bundle.cjs", "output": "dist-cli/sea-prep.blob", "disableExperimentalSEAWarning": true }
          EOF
          node --experimental-sea-config dist-cli/sea-config.json
          node -e "require('fs').copyFileSync(process.execPath,'dist-cli/bada-cli-linux-x64')"
          npx --yes postject dist-cli/bada-cli-linux-x64 NODE_SEA_BLOB dist-cli/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x dist-cli/bada-cli-linux-x64
      - name: Smoke test CLI binary
        working-directory: bada_gui_ide
        run: |
          set -e
          ./dist-cli/bada-cli-linux-x64 version
          ./dist-cli/bada-cli-linux-x64 run examples/engine.bada | grep -q "5.55e-17"
          ./dist-cli/bada-cli-linux-x64 run examples/quantum.bada | grep -q "0.50000 0.50000"
          ./dist-cli/bada-cli-linux-x64 build examples/core.bada -o /tmp/core
          /tmp/core | grep -q "compiled engine: V        = 8"
          ./dist-cli/bada-cli-linux-x64 examples all -o /tmp/ex && ls /tmp/ex
          printf 'Measure(H(qubit(1)))\nexit\n' | ./dist-cli/bada-cli-linux-x64 repl | grep -q "0.50000, 0.50000"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada-cli-linux
          path: bada_gui_ide/dist-cli/bada-cli-linux-x64
      - name: Attach CLI to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: bada_gui_ide/dist-cli/bada-cli-linux-x64

  cli-windows:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build single-binary CLI (Node SEA)
        working-directory: bada_gui_ide
        shell: bash
        run: |
          set -e
          mkdir -p dist-cli
          npx --yes esbuild cli/bada-cli.js --bundle --platform=node --format=cjs --outfile=dist-cli/bada-bundle.cjs
          cat > dist-cli/sea-config.json <<'EOF'
          { "main": "dist-cli/bada-bundle.cjs", "output": "dist-cli/sea-prep.blob", "disableExperimentalSEAWarning": true }
          EOF
          node --experimental-sea-config dist-cli/sea-config.json
          node -e "require('fs').copyFileSync(process.execPath,'dist-cli/bada-cli.exe')"
          npx --yes postject dist-cli/bada-cli.exe NODE_SEA_BLOB dist-cli/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - name: Smoke test CLI binary
        working-directory: bada_gui_ide
        shell: bash
        run: |
          set -e
          ./dist-cli/bada-cli.exe version
          ./dist-cli/bada-cli.exe run examples/engine.bada | grep -q "5.55e-17"
          ./dist-cli/bada-cli.exe run examples/quantum.bada | grep -q "0.50000 0.50000"
          ./dist-cli/bada-cli.exe emit examples/core.bada -o core.gen.c
          test -s core.gen.c
          printf 'Measure(H(qubit(1)))\nexit\n' | ./dist-cli/bada-cli.exe repl | grep -q "0.50000, 0.50000"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada-cli-windows
          path: bada_gui_ide/dist-cli/bada-cli.exe
      - name: Attach CLI to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: bada_gui_ide/dist-cli/bada-cli.exe

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換
      # (CordovaLib/cordova.gradle が Gradle 9 で削除された XmlParser を使用)。
      # Gradle 7.6.4 を明示的に入れて PATH 先頭に置く。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_gui_ide"
          cordova create cordova-build io.github.masaaki_avnturle.bada_gui_ide TmpApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-gui-ide-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada-gui-ide-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: out/*.apk
