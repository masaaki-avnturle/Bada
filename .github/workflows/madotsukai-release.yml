name: Build madotsukai keybindings (Windows 10/11)

# Produces a downloadable, WORKING 窓使いの憂鬱 (mayu) keyboard remapper for
# Windows 10 / 11:
#   * mayu.exe                - the resident remapper (double-click, no Python).
#                               Installs a low-level keyboard hook and rewrites
#                               Emacs/vim chords into real keystrokes live.
#   * madotsukai_windows.zip  - installer + editable config + .reg files + tool.
#
# Push the feature branch, run manually, or push a tag like mayu-v0.1.0 ->
# builds everything AND publishes a GitHub Release with the files attached.

on:
  push:
    tags: ['mayu-v*']
    branches: ['claude/bada-compiler-interpreter-zGQ9S']
    paths:
      - 'bada_lang/**'
      - '.github/workflows/madotsukai-release.yml'
  workflow_dispatch:

permissions:
  contents: write        # needed to create the Release

jobs:
  # --------------------------------------------------------------- Windows .exe
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bada_lang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the remapper's config parsing / translation
        run: python download/mayu_agent.py --selftest
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build mayu.exe (standalone keyboard remapper)
        run: pyinstaller --onefile --name mayu --console download/mayu_agent.py
      - name: Upload mayu.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mayu-exe
          path: bada_lang/dist/mayu.exe
          if-no-files-found: error

  # ------------------------------------------------------------- package (.zip)
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bada_lang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the Bada test suite
        run: python tests/run_tests.py
      - name: Verify the remapper's config parsing / translation
        run: python download/mayu_agent.py --selftest
      - name: Build the downloadable keybinding package
        run: |
          python tools/build_exe.py
          python tools/build_download.py
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            bada_lang/dist/madotsukai_windows.zip
            bada_lang/download/
          if-no-files-found: error

  # ------------------------------------------------------------------- Release
  release:
    needs: [windows-exe, package]
    if: >-
      startsWith(github.ref, 'refs/tags/mayu-v') ||
      github.ref_name == 'claude/bada-compiler-interpreter-zGQ9S' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/mayu-exe/mayu.exe release/
          cp artifacts/package/dist/madotsukai_windows.zip release/
          cp artifacts/package/download/keybindings.mayu release/
          cp artifacts/package/download/emacs.mayu release/
          cp artifacts/package/download/vim.mayu release/
          cp artifacts/package/download/apps.mayu release/
          cp artifacts/package/download/windows11.reg release/
          cp artifacts/package/download/windows10.reg release/
          cp artifacts/package/download/scancode-capslock-ctrl.reg release/
          cp artifacts/package/download/uninstall.reg release/
          ls -l release
      - name: Repack the zip so it includes mayu.exe
        run: |
          cd artifacts/package/download
          cp ../../mayu-exe/mayu.exe .
          zip -j ../../../release/madotsukai_windows.zip mayu.exe
      - name: Publish Release with the working remapper
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/mayu-v') && github.ref_name || 'mayu-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/mayu-v') && github.ref_name || '窓使いの憂鬱 mayu — Windows 10/11 keybindings (latest)' }}
          body: |
            # 窓使いの憂鬱 (mayu) — a WORKING Emacs + vim remapper for Windows 10 / 11

            Written in the **Bada** language + a pure-`ctypes` keyboard hook.
            **`mayu.exe` is the resident program that actually makes the keys
            work.** When you run it, it reads the `.mayu` config files, **detects
            Windows 10 vs 11 and registers every key binding into the Windows
            registry** (`HKCU\Software\Mayu\<os>`), then hooks the keyboard and
            rewrites Emacs/vim chords into real keystrokes in every application.
            No Python, no admin needed.

            ## Quick start
            1. Download **`mayu.exe`**, **`keybindings.mayu`**, **`emacs.mayu`**,
               **`vim.mayu`**, **`apps.mayu`** into one folder (or just the zip).
            2. Double-click **`mayu.exe`**. It prints *"registered N values into
               HKEY_CURRENT_USER\Software\Mayu\win11"* and *"mayu is running"*.
            3. Open Notepad and try it: **C-a**=line start, **C-e**=line end,
               **C-f/C-b/C-n/C-p**=arrows, **C-k**=kill line, **C-y**=yank,
               **C-x C-s**=save. Close the console window to stop.
            4. vim instead: run **`mayu.exe --vim`**. Only register (no remap):
               **`mayu.exe --register`**.

            Prefer the bundle? Download **`madotsukai_windows.zip`**, unzip, and run
            **`install.bat`** — it registers the `.reg` bindings, starts `mayu.exe`,
            and offers to auto-start it at sign-in.

            ## What each file is
            - **`mayu.exe`** — the working remapper (double-click). *This is the one you run.*
            - `keybindings.mayu` — the **editable** Emacs/vim config. Edit and restart mayu.
            - `madotsukai_windows.zip` — everything (exe + installer + config + .reg).
            - `windows11.reg` / `windows10.reg` — store the bindings in the registry.
            - `scancode-capslock-ctrl.reg` — genuine physical **CapsLock → Ctrl**
              remap applied by Windows itself (import + sign out; needs admin).
            - `uninstall.reg` — removes the registry entries.

            Educational tool built with the Bada language (a custom compiler + VM).
          files: |
            release/mayu.exe
            release/madotsukai_windows.zip
            release/keybindings.mayu
            release/emacs.mayu
            release/vim.mayu
            release/apps.mayu
            release/windows11.reg
            release/windows10.reg
            release/scancode-capslock-ctrl.reg
            release/uninstall.reg
