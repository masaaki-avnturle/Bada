name: Build madotsukai keybindings (Windows 10/11)

# Produces a downloadable package for the 窓使いの憂鬱 (mayu) Emacs + vim
# keybinding tool: the editable .mayu config, the Windows 10/11 registry
# .reg files, the genuine CapsLock->Ctrl Scancode Map remap, and the portable
# mayu tool.
#
# * Push the feature branch, run manually (Actions -> "Run workflow"), or push
#   a tag like  mayu-v0.1.0  -> builds the package AND publishes a GitHub
#   Release with the .zip + .reg files attached (download from the repo's
#   Releases page).

on:
  push:
    tags: ['mayu-v*']
    branches: ['claude/bada-compiler-interpreter-zGQ9S']
    paths:
      - 'bada_lang/**'
      - '.github/workflows/madotsukai-release.yml'
  workflow_dispatch:

permissions:
  contents: write        # needed to create the Release

defaults:
  run:
    working-directory: bada_lang

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the Bada test suite
        run: python tests/run_tests.py

      - name: Build the downloadable keybinding package
        run: |
          python tools/build_exe.py
          python tools/build_download.py

      - name: Upload package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: madotsukai-windows-keybindings
          path: |
            bada_lang/dist/madotsukai_windows.zip
            bada_lang/download/
          if-no-files-found: error

      # Publishes a downloadable GitHub Release. The tag is created server-side
      # by action-gh-release using GITHUB_TOKEN, so no local tag push is needed.
      # Fires on a mayu-v* tag, on this feature branch, or on a manual dispatch.
      - name: Publish Release with the keybinding package
        if: >-
          startsWith(github.ref, 'refs/tags/mayu-v') ||
          github.ref_name == 'claude/bada-compiler-interpreter-zGQ9S' ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/mayu-v') && github.ref_name || 'mayu-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/mayu-v') && github.ref_name || '窓使いの憂鬱 mayu — Windows 10/11 keybindings (latest)' }}
          body: |
            # 窓使いの憂鬱 (mayu) — Emacs + vim keybindings for Windows 10 / 11

            Written in the **Bada** language. Registers key combinations into the
            **Windows Registry**, with Emacs and vim key bindings, editable by you.

            ## Download
            - **`madotsukai_windows.zip`** — the whole package (installer + config + tool).

            Unzip, then double-click **`install.bat`** (Windows 11) or run
            `install.bat win10` (Windows 10). Right-click → *Run as administrator*
            to also apply the genuine **CapsLock → Ctrl** physical remap
            (`Scancode Map`); sign out and back in for it to take effect.

            ## What it registers
            - `HKCU\Software\Mayu\<os>` — the Emacs/vim chord map (`C-k → kill-line`,
              `dd → delete-line`, per-application bindings, …). Edit
              `keybindings.mayu` and re-run to change them.
            - `HKLM\...\Keyboard Layout` → `Scancode Map` — a real physical remap
              that **Windows itself** applies at the driver level, no program running.

            ## Also attached (individually downloadable)
            - `keybindings.mayu` — the editable config (Emacs + vim + per-app)
            - `windows11.reg` / `windows10.reg` — the registry key bindings
            - `scancode-capslock-ctrl.reg` — the physical remap
            - `uninstall.reg` — removes everything

            Built with the Bada language (a custom compiler + VM). Educational tool.
          files: |
            bada_lang/dist/madotsukai_windows.zip
            bada_lang/download/keybindings.mayu
            bada_lang/download/windows11.reg
            bada_lang/download/windows10.reg
            bada_lang/download/scancode-capslock-ctrl.reg
            bada_lang/download/uninstall.reg
