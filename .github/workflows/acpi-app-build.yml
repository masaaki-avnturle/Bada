name: ACPI app build (Windows EXE + Ubuntu + Android APK)

# acpi-app/ から「原子の臨界期の強度シミュレータ (ACPI)」を
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
#   - Android 向け APK
# としてビルドします。ACPI 本体 (www/index.html) は
# tools/build-atom-critical.js が生成する自己完結 HTML です。
#
# ダウンロード方法 (2 通り):
#   1) Actions から  — ACPI 関連ブランチ / main への push で自動実行され、
#      実行ページ下部の Artifacts から zip でダウンロードできます
#      (acpi-android-apk / acpi-windows-exe / acpi-ubuntu-appimage-deb、
#       および 3 プラットフォームをまとめた acpi-all-platforms)。
#      GitHub にログインしていれば誰でも取得できます。保存期間 90 日。
#   2) Releases から — acpi-app-v* タグの push、または workflow_dispatch の
#      release_tag 入力で、同じ成果物が Release に添付されます (期限なし)。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: acpi-app-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    branches:
      - main
      - '**acpi**'
      - '**atomic-critical**'
    tags:
      - 'acpi-app-v*'

permissions:
  contents: write

# 同一ブランチで新しい push があれば古いビルドは打ち切る。
# ただし Release 作成 (release_tag 付きの workflow_dispatch) は別グループにして、
# 途中でブランチに push しても取り消されないようにする。
concurrency:
  group: acpi-app-${{ github.ref }}-${{ github.event.inputs.release_tag || 'ci' }}
  cancel-in-progress: true

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: モデルコアのセルフテスト (既知の物理値との照合)
        working-directory: bada_gui_ide
        run: node cli/atom-critical-cli.js selftest
      - name: ACPI www をビルド + 生成物を確認
        working-directory: bada_gui_ide
        run: |
          set -e
          node tools/build-atom-critical.js
          test -f acpi-app/www/index.html
          test -f dist/atom-critical.html
          grep -q "AtomCritical" acpi-app/www/index.html
      - name: Bada リファレンス実装のスモークテスト
        working-directory: bada_gui_ide
        run: |
          set -e
          node cli/bada-cli.js run examples/atom_critical.bada | tee /tmp/acpi.out
          grep -q "臨界期" /tmp/acpi.out
          grep -q "臨界期なし (亜臨界)" /tmp/acpi.out
          # Pd (4d, l=2) と Pu (7s, l=0) が最後まで走り切ること
          grep -q "^---- Pd " /tmp/acpi.out
          grep -q "^---- Pu " /tmp/acpi.out
          grep -q "^Pu : 臨界期" /tmp/acpi.out

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate ACPI www
        working-directory: bada_gui_ide
        run: node tools/build-atom-critical.js
      - name: Build Windows EXE (Electron)
        working-directory: bada_gui_ide/acpi-app/electron
        run: |
          npm install
          npm run dist
      # nsis と portable が同名で衝突すると片方が上書きされて消えるため、
      # 2 本そろっていることを明示的に確認する。
      - name: 生成物を確認 (インストーラ + ポータブルの 2 本)
        working-directory: bada_gui_ide/acpi-app/electron
        shell: bash
        run: |
          set -e
          ls -la dist
          ls dist/*-x64-setup.exe
          ls dist/*-x64-portable.exe
          n=$(ls dist/*.exe | wc -l)
          test "$n" -eq 2 || { echo "EXE が $n 本しかありません (2 本必要)"; exit 1; }
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: acpi-windows-exe
          retention-days: 90
          if-no-files-found: error
          path: bada_gui_ide/acpi-app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate ACPI www
        working-directory: bada_gui_ide
        run: node tools/build-atom-critical.js
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_gui_ide/acpi-app/electron
        run: |
          npm install
          npm run dist:linux
      - name: 生成物を確認 (AppImage + deb)
        working-directory: bada_gui_ide/acpi-app/electron
        run: |
          set -e
          ls -la dist
          ls dist/*.AppImage
          ls dist/*.deb
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acpi-ubuntu-appimage-deb
          retention-days: 90
          if-no-files-found: error
          path: |
            bada_gui_ide/acpi-app/electron/dist/*.AppImage
            bada_gui_ide/acpi-app/electron/dist/*.deb

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Generate ACPI www
        working-directory: bada_gui_ide
        run: node tools/build-atom-critical.js
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_gui_ide/acpi-app"
          cordova create cordova-build io.github.masaaki_avnturle.acpi ACPI
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/acpi-debug.apk
          ls -la out
          # APK は zip。中に ACPI 本体 (assets/www/index.html) が入っていることを確認する。
          unzip -l out/acpi-debug.apk | grep -q 'assets/www/index.html'
          unzip -p out/acpi-debug.apk assets/www/index.html | grep -q 'AtomCritical'
          echo "APK に ACPI 本体が含まれていることを確認しました"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acpi-android-apk
          retention-days: 90
          if-no-files-found: error
          path: out/*.apk

  # 3 プラットフォームを 1 つの zip にまとめ、Actions から一括ダウンロード
  # できるようにする。実行ページのサマリにダウンロード手順も書き出す。
  bundle:
    runs-on: ubuntu-latest
    needs: [windows-exe, linux-app, android-apk]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 単一 HTML 版も同梱するため生成
        working-directory: bada_gui_ide
        run: node tools/build-atom-critical.js

      - name: 各プラットフォームの成果物を回収
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: acpi-*
          merge-multiple: true

      - name: まとめる
        run: |
          set -e
          mkdir -p bundle
          find incoming -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} bundle/ \;
          cp bada_gui_ide/dist/atom-critical.html bundle/
          cp bada_gui_ide/dist/ACPI-README.txt bundle/
          cp bada_gui_ide/cli/atom-critical-cli.js bundle/
          cp bada_gui_ide/www/atom_critical.js bundle/
          cp bada_gui_ide/examples/atom_critical.bada bundle/
          ls -la bundle

      - name: 一括ダウンロード用アーティファクト
        uses: actions/upload-artifact@v4
        with:
          name: acpi-all-platforms
          retention-days: 90
          if-no-files-found: warn
          path: bundle/*

      - name: 実行ページにダウンロード手順を書き出す
        run: |
          {
            echo "## ACPI — 原子の臨界期の強度シミュレータ"
            echo ""
            echo "この実行ページの下部 **Artifacts** から zip でダウンロードできます"
            echo "(GitHub にログインが必要。保存期間 90 日)。"
            echo ""
            echo "| Artifact | 中身 | 使い方 |"
            echo "|---|---|---|"
            echo "| \`acpi-android-apk\` | \`acpi-debug.apk\` | 「提供元不明のアプリ」を許可してインストール |"
            echo "| \`acpi-windows-exe\` | \`ACPI-*-x64-setup.exe\` / \`ACPI-*-x64-portable.exe\` | インストーラ / インストール不要のポータブル |"
            echo "| \`acpi-ubuntu-appimage-deb\` | \`ACPI-*-x86_64.AppImage\` / \`ACPI-*-amd64.deb\` | \`chmod +x\` して実行 / \`sudo dpkg -i\` |"
            echo "| \`acpi-all-platforms\` | 上記すべて + 単一 HTML + CLI + Bada 実装 | 一括で欲しいときはこれ |"
            echo ""
            echo "### ビルド結果"
            echo ""
            echo "| ジョブ | 結果 |"
            echo "|---|---|"
            echo "| Windows EXE | ${{ needs.windows-exe.result }} |"
            echo "| Ubuntu AppImage / deb | ${{ needs.linux-app.result }} |"
            echo "| Android APK | ${{ needs.android-apk.result }} |"
            echo ""
            echo "同梱ファイル:"
            echo ""
            echo '```'
            ls -la bundle | sed 's/^/  /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Release への添付は bundle ジョブだけが行う (3 ジョブが同時に同じ
      # Release を作りに行くと競合するため)。bundle/ には 4 つのバイナリと
      # 単一 HTML・CLI・モデルコア・Bada 実装がすべて揃っている。
      - name: Release へ添付
        if: (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != '') && needs.windows-exe.result == 'success' && needs.linux-app.result == 'success' && needs.android-apk.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ACPI 原子の臨界期の強度シミュレータ ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            **ACPI — 原子の臨界期の強度シミュレータ (Atomic Critical-Period Intensity)**

            強レーザー場のなかで原子のクーロン障壁が完全に抑制される時間窓
            (= 臨界期) と、その窓での強度 I(t) を計算します。

            ### インストールなしで使う

            | ファイル | 使い方 |
            |---|---|
            | `atom-critical.html` | ダウンロードしてブラウザで開くだけ (依存なし・オフライン可) |

            ### ネイティブ アプリ

            | プラットフォーム | ファイル | インストール |
            |---|---|---|
            | Android | `acpi-debug.apk` | 「提供元不明のアプリ」を許可してタップ |
            | Windows 10 / 11 | `ACPI-*-x64-setup.exe` | インストーラ (インストール先を選べます) |
            | Windows 10 / 11 | `ACPI-*-x64-portable.exe` | インストール不要・ダブルクリックで起動 |
            | Ubuntu | `ACPI-*-x86_64.AppImage` | `chmod +x` して実行 |
            | Ubuntu | `ACPI-*-amd64.deb` | `sudo dpkg -i` |

            ### コマンドライン / Bada 言語版

            | ファイル | 使い方 |
            |---|---|
            | `atom-critical-cli.js` + `atom_critical.js` | `node atom-critical-cli.js run -e Ar -I 6e14` |
            | `atom_critical.bada` | 同じモデルの Bada 言語リファレンス実装 |

            ### モデル

            **対応元素 (14)** — H · He · Li · Be · C · N · O · Ne · Na · Ar · Kr ·
            **Pd** · Xe · **Pu** (各 1–5 電離段)。Pd は `[Kr]4d¹⁰` で 5s 電子を持たない
            唯一の元素 (最外殻 4d, `l=2`)、Pu は `[Rn]5f⁶7s²` (最外殻 7s, `l=0`) で
            第一 `I_p = 6.03 eV`・臨界強度 `5.27×10¹² W/cm²` はいずれも本表で最小。
            ADK は水素様 n* と単一活性電子を仮定するため、閉殻 d¹⁰ の Pd と開殻 5f の
            Pu では近似が粗くなります (アプリが該当元素で注意書きを表示)。

            **物理層** — 障壁抑制場 `F_cr = I_p²/(4 Z_c)` [a.u.]、`I_cr = F_cr²·I_a`
            (`I_a = 3.5094×10¹⁶ W/cm²`)。ADK トンネル電離率 (水素で厳密解
            `(4/F)e^{−2/3F}` に一致)、Keldysh γ、ポンデロモーティブ U_p。
            水素で `I_cr = 1.37×10¹⁴ W/cm²` という既知の障壁抑制強度を再現します。

            **Ω 層 (山口フレームワーク)** — `ζ(s)=β(p,q)/log x` · `ζ_n=(x log x)ⁿ` ·
            Γ-deprivation `e^{−x log x}` · Dalanversian `Λ=cos(ix log x)−i sin(ix log x)` ·
            均衡余裕 `2e^{−x log x}` (臨界期で 0 へ潰れる) · Euler 極均衡
            `x^n+y^n−nxyz=0` · Kauffman ⟨D⟩(A) · 臨界強度指数
            **`E(σ) = K(σ)×H(σ)/4(π_n,e_n)`**。

            ---
            タグを打たずに最新ビルドが欲しい場合は
            [Actions](https://github.com/masaaki-avnturle/Bada/actions/workflows/acpi-app-build.yml)
            の実行ページ下部 Artifacts からも取得できます (要ログイン・90 日)。
          files: bundle/*

      - name: いずれかのビルドが失敗していたら落とす
        if: needs.windows-exe.result != 'success' || needs.linux-app.result != 'success' || needs.android-apk.result != 'success'
        run: |
          echo "windows-exe = ${{ needs.windows-exe.result }}"
          echo "linux-app   = ${{ needs.linux-app.result }}"
          echo "android-apk = ${{ needs.android-apk.result }}"
          exit 1
