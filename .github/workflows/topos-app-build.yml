name: Bada Topos app build (Android APK + Windows EXE + Ubuntu)

# bada_topos/ の「Bada 位相」— 数学のトポロジー(位相幾何学)を、
# 人間の思考中枢の量子回路として作り換えた処理系。
#   思考中枢 = 単体的複体 (頂点=要素, 辺=連想, 面=理解)
#   思考     = 鎖 (単体ひとつ = 量子ビットひとつ)
#   ∂       = CNOT 回路   |c⟩|0⟩ ↦ |c⟩|∂c⟩
#   観念     = ker ∂ / im ∂  (閉じているのに導かれない思考 = ベッチ数)
#   動力学   = exp(−iΔ_k t) (ホッジ・ラプラシアン。観念成分は時間で不変)
# これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は bada_topos/index.html の自己完結 HTML で、
# これをそのまま www として各ラッパーに同梱します。
# bada_topos/ への push ごとに Actions アーティファクトとして保存し、
# (topos-v* タグ / release_tag 指定時) GitHub Release にも添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: topos-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    # bada_topos/ (またはこのワークフロー) に変更が push されるたびにビルドし、
    # APK / EXE / AppImage・deb を Actions アーティファクトとして残す。
    # Release への添付はタグ (topos-v*) または release_tag 指定時のみ。
    branches:
      - '**'
    paths:
      - 'bada_topos/**'
      - '.github/workflows/topos-app-build.yml'
    tags:
      - 'topos-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bada_topos/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bada_topos/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/topos.js", m[1]);
            for (const marker of ["function toposRng", "function qsNew", "function gateH", "function gateCNOT",
                                  "function gatePhase", "function qsSubProb", "function qsProject",
                                  "function cxNew", "function cxAdd", "function cxRemove", "function cxBoundary",
                                  "function z2Rank", "function cxBetti", "function cxEuler", "function cxDDZero",
                                  "function cxClassify", "function boundaryCircuit", "function cycleFilter",
                                  "function cxHodge", "function symEig", "function hodgeDecompose",
                                  "function walkEvolve", "function harmonicNorm", "function presetComplex",
                                  "function toposInterpret", "function aiCompose", "function boot"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
            if (!m[1].includes("ker ∂")) {
              console.error("missing the definition of an idea as ker ∂ / im ∂");
              process.exit(1);
            }
          '
          node --check /tmp/topos.js
          echo "Bada Topos self-check OK"
      - name: Engine tests (quantum core / ∂∂=0 / Betti & Euler–Poincaré / boundary circuit / cycle filter / Hodge / walk / interpreter / AI kernel)
        run: |
          set -e
          node bada_topos/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_topos/app/www
          cp bada_topos/index.html bada_topos/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_topos/app"
          cordova create cordova-build io.github.masaaki_avnturle.badatopos BadaTopos
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-topos-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: topos-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p bada_topos/app/www
          cp bada_topos/index.html bada_topos/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bada_topos/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: topos-windows
          path: bada_topos/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_topos/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_topos/app/www
          cp bada_topos/index.html bada_topos/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_topos/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topos-linux
          path: |
            bada_topos/app/electron/dist/*.AppImage
            bada_topos/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_topos/app/electron/dist/*.AppImage
            bada_topos/app/electron/dist/*.deb
