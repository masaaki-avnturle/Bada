name: Build Silent Talk APK

# silent_talk_app/ への push でビルドし、APK を GitHub Release (固定タグ
# silent-talk-latest) として公開する。手動実行(workflow_dispatch)も可能。
on:
  push:
    branches:
      - "**"
    paths:
      - "silent_talk_app/**"
      - ".github/workflows/silent-talk-android.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: silent_talk_app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ランナーには Android SDK がプリインストールされている。
      # 外部アクションの ZIP 取得失敗(不安定)を避け、プリインストール SDK を使う。
      # 必要パッケージはリトライ付きで sdkmanager から取得する。
      - name: Prepare Android SDK (preinstalled + retry)
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          install_pkg() {
            for attempt in 1 2 3 4 5; do
              echo "Installing '$1' (attempt $attempt)"
              if yes | "$SDKMANAGER" "$1"; then return 0; fi
              echo "retry in $((attempt*10))s"; sleep $((attempt*10))
            done
            return 1
          }
          install_pkg "platform-tools"
          install_pkg "platforms;android-34"
          install_pkg "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias silenttalk \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass silenttalk -keypass silenttalk \
            -dname "CN=Silent Talk, OU=omega, O=omega, L=., ST=., C=JP"

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password=silenttalk \
            -Pandroid.injected.signing.key.alias=silenttalk \
            -Pandroid.injected.signing.key.password=silenttalk \
            --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          path=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $path"
          cp "$path" "$GITHUB_WORKSPACE/SilentTalk.apk"
          echo "apk=$GITHUB_WORKSPACE/SilentTalk.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentTalk-APK
          path: ${{ steps.apk.outputs.apk }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: silent-talk-latest
          name: Silent Talk (latest)
          files: ${{ steps.apk.outputs.apk }}
          body: |
            **Silent Talk** — neurothermal ベースの無音通信アプリ (APK)

            ガンマ熱多様体 `T' = ∫ Γ(γ)' dx_m` を搬送波に、テキストを
            熱・神経パルス列へ符号化して “言葉を使わず信号で伝える” Android アプリ。
            画面上部に赤外線センサー + 温度計の常設ライブバーを備えます。

            下の `SilentTalk.apk` をスマホにダウンロードし、提供元不明アプリの
            インストールを許可してインストールしてください。

            ※ 教育・可視化シミュレーションです。医療機器ではありません。
