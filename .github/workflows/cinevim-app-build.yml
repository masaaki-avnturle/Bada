name: Bada CineVim app build (Android APK + Windows EXE + Ubuntu)

# bada_cinevim/ の「Bada CineVim」— 量子プログラミング言語 Bada の
# 映画的 VIM エディタ。
#   ・本物のモーダル編集 (hjkl / w b e / f t % { } / d c y / レジスタ /
#     u / Ctrl-R / . リピート / ビジュアル / :%s/// などの Ex コマンド)
#   ・Bada シンタックスハイライト (<- / -< / >- / Ω:: / qubit / |0⟩)
#   ・🎬 シネマフォーカス — カーソル行を「どアップ」に拡大し、離れた行ほど
#     ガウス減衰で縮小・ぼかし・減光する被写界深度表現
#   ・💥 クラッシュ効果 — ポイントされた行が 3D で浮き上がり、画面が揺れ、
#     色収差が割れ、衝撃波リングと破片が飛ぶ
#   ・⏱ 映画のカウントダウン — アカデミー・リーダーの掃引 + フィルムグレイン
#   ・⚛ 量子 Bada 実行系 — 状態ベクトルシミュレータと β(p,q) / Γ(s)
# これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は bada_cinevim/index.html の自己完結
# HTML で、これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (cinevim-v* タグ / release_tag
# 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: cinevim-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'cinevim-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bada_cinevim/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bada_cinevim/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/cinevim.js", m[1]);
            for (const marker of ["function badaTokenize", "function badaTokenizeAll",
                                  "function gammaFn", "function betaFn", "function zetaBeta",
                                  "function badaLeft", "function badaMani", "function badaRight",
                                  "function qnew", "function qgate1", "function qcnot",
                                  "function qmeasure", "function qprobs", "function mulberry32",
                                  "function badaEval", "function quantumRun",
                                  "function vimNew", "function evalMotion", "function applyOp",
                                  "function execEx", "function runNormal", "function feedKey",
                                  "function focusStyle", "function docLayout",
                                  "function crashFrame", "function shardField",
                                  "function countdownState", "function boot"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/cinevim.js
          echo "Bada CineVim self-check OK"
      - name: Engine tests (tokenizer / Γ β ζ / quantum sim / VIM / Ex / cinema math)
        run: |
          set -e
          node bada_cinevim/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_cinevim/app/www
          cp bada_cinevim/index.html bada_cinevim/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_cinevim/app"
          cordova create cordova-build io.github.masaaki_avnturle.badacinevim BadaCineVim
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-cinevim-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinevim-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p bada_cinevim/app/www
          cp bada_cinevim/index.html bada_cinevim/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bada_cinevim/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinevim-windows
          path: bada_cinevim/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_cinevim/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_cinevim/app/www
          cp bada_cinevim/index.html bada_cinevim/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_cinevim/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinevim-linux
          path: |
            bada_cinevim/app/electron/dist/*.AppImage
            bada_cinevim/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_cinevim/app/electron/dist/*.AppImage
            bada_cinevim/app/electron/dist/*.deb
