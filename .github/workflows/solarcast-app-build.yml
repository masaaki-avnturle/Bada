name: Bada SolarCast app build (Android APK + Windows EXE + Ubuntu)

# solar_climate/ の「Bada SolarCast」— 太陽フレア × 気象 × 気候予測アプリ
#   - NOAA SWPC の実測 (GOES X 線フレア / Kp / 日別太陽指数 / 27 日見通し)
#   - 世界各地の 16 日予報 (Open-Meteo, ECMWF アンサンブル) と
#     ERA5 気候値 (1991 年〜) を混ぜた任意日付の確率予報 (予報のスコトーマ = 約 16 日)
#   - イギリスのクリスマス (12/25) の天気
#   - 太陽活動と気温のラグ相関 (0〜14 日) をブロック置換検定で確かめる検証ラボ
#   - Γ 関数 (Lanczos, Γ(z+1)=zΓ(z) の自己検証) × Jones 多項式の熱感知指数
# を
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は solar_climate/index.html の自己完結 HTML で、
# これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (solarcast-v* タグ / release_tag 指定時)
# GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: solarcast-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    branches:
      - 'claude/solar-flare-climate-app-*'
    paths:
      - 'solar_climate/**'
      - '.github/workflows/solarcast-app-build.yml'
    tags:
      - 'solarcast-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine tests (Γ / Jones heat / flare parsers / statistics / scotoma / climatology / ensemble)
        run: node solar_climate/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p solar_climate/app/www
          cp solar_climate/index.html solar_climate/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="solar_climate/app"
          cordova create cordova-build io.github.masaaki_avnturle.solarcast BadaSolarCast
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-solarcast-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarcast-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p solar_climate/app/www
          cp solar_climate/index.html solar_climate/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: solar_climate/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarcast-windows
          path: solar_climate/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: solar_climate/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p solar_climate/app/www
          cp solar_climate/index.html solar_climate/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: solar_climate/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solarcast-linux
          path: |
            solar_climate/app/electron/dist/*.AppImage
            solar_climate/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            solar_climate/app/electron/dist/*.AppImage
            solar_climate/app/electron/dist/*.deb
