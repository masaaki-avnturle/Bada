name: Bada Sokudoku app build (Android APK + Windows EXE + Ubuntu)

# bada_sokudoku/ の「Bada 瞬読」— 速読スタジオ。
#   ・対象者の本の頁を取り込み、画像処理トランスフォーマー
#     (Swin 型の窓自己注意 + ずらし窓 + 注意ロールアウト) で版面を解析し、
#     文字の固まり → 行 → ブロック → 読み順を復元する (文字認識は行わない)
#   ・復元したブロックを、視野幅と目標速度から決めた滞留時間で順に照らす
#   ・同じエンジンをカメラの向こうの読み手 (対象者) にも向け、肌色・暗さ・動きの
#     パッチ特徴から顔・目・視線指標を掴んで画面に映し出し、停留・サッカード・
#     逆行・瞬き・追従率を数える (像も測定値も端末から出ない)
#   ・速読画面と読み手の像は 1 枚の canvas に合成されるので captureStream +
#     MediaRecorder でそのまま WebM 動画として録画できる
# これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は bada_sokudoku/index.html の自己完結 HTML で、
# これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (sokudoku-v* タグ / release_tag 指定時)
# GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: sokudoku-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'sokudoku-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bada_sokudoku/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bada_sokudoku/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/sokudoku.js", m[1]);
            for (const marker of ["function srand", "function matOrtho", "function softmaxInto",
                                  "function layerNorm", "function integralImage", "function boxStats",
                                  "function sauvola", "function rlsa", "function projection",
                                  "function profileGapRatio", "function detectDirection",
                                  "function patchFeatures", "function posEnc2D", "function embedPatches",
                                  "function windowPartition", "function windowAttention", "function swinEncode",
                                  "function rolloutHat", "function attentionRollout", "function blocksFromAttention",
                                  "function splitLines", "function splitChunks", "function xyCut",
                                  "function groupChunks", "function analyzePage",
                                  "function textChunks", "function stripLatex", "function scrambleInner",
                                  "function buildSchedule", "function stepAt", "function profileFrom",
                                  "function skinMask", "function motionMap", "function readerPatchFeatures",
                                  "function locateEyes", "function gazeFrom", "function analyzeReaderFrame",
                                  "function trackerNew", "function trackerPush", "function trackerStats",
                                  "function renderFrame", "function drawReaderView", "function startCam",
                                  "function startRec", "function boot"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
            if (!m[1].includes("captureStream")) {
              console.error("missing the canvas capture path that turns the reading into a video");
              process.exit(1);
            }
          '
          node --check /tmp/sokudoku.js
          echo "Bada Sokudoku self-check OK"
      - name: Engine tests (binarization / attention / layout / chunker / schedule / reader capture / gaze)
        run: |
          set -e
          node bada_sokudoku/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_sokudoku/app/www
          cp bada_sokudoku/index.html bada_sokudoku/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_sokudoku/app"
          cordova create cordova-build io.github.masaaki_avnturle.badasokudoku BadaSokudoku
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          # 読み手を捉えるカメラの実行時権限 (Android 6+)。入らなくてもアプリは動く
          # (カメラなしで速読と録画は使える) ので、失敗してもビルドは止めない。
          cordova plugin add cordova-plugin-android-permissions@1.1.5 || \
            echo "permissions plugin unavailable — camera will rely on the WebView prompt"
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-sokudoku-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sokudoku-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p bada_sokudoku/app/www
          cp bada_sokudoku/index.html bada_sokudoku/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bada_sokudoku/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: sokudoku-windows
          path: bada_sokudoku/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_sokudoku/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_sokudoku/app/www
          cp bada_sokudoku/index.html bada_sokudoku/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_sokudoku/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sokudoku-linux
          path: |
            bada_sokudoku/app/electron/dist/*.AppImage
            bada_sokudoku/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_sokudoku/app/electron/dist/*.AppImage
            bada_sokudoku/app/electron/dist/*.deb
