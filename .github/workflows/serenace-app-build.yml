name: Bada Serenace app build (Android APK + Windows EXE + Ubuntu)

# bada_serenace/ の「Bada Serenace」— 病気予防機構の解明アプリ。
#   積み木の真逆 = 組み上げ Φ(語 ↦ 不変量) の逆像 Φ⁻¹(不変量 ↦ 語の束)。
#                  崩すこと (語の反転) は逆写像ではない、という区別が要。
#   Γ 熱感知    = ∫Γ(γ)′dx_m = 2e^{−x log x} を伝導率 k(r) へ渡し、
#                  ∂T/∂t = ∇·(k∇T)+S を解いて熱流束の極大を感知する。
#   Jones 多項式 = Kauffman ブラケットの状態和 (Union-Find で輪を数える)。
#                  三葉 t+t³−t⁴、8の字 t⁻²−t⁻¹+1−t+t² を文献値として検証。
#   DNA 暗号    = 塩基 ↦ 組み紐生成子。鍵つき置換で覆われた配列を、
#                  不変量とモチーフを手掛かりに逆像探索で解読する。
#   病識 / 漏洩 = 自己監視写像の不動点に病いの成分が残るかで病識を測り、
#                  内心の漏洩を二元対称通信路 I(X;Y)=1−H₂(p) として測る。
#   RNA 干渉    = 21 nt 窓の siRNA 設計 (GC・4 連続・非対称性・シード off-target)。
#   セレネース  = D2 占有 C/(C+Kd) と上流ノックダウンを残存シグナルで比較。
# これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は bada_serenace/index.html の自己完結 HTML で、
# これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (serenace-v* タグ / release_tag 指定時)
# GitHub Release に添付します。
#
# ⚠ 概念シミュレーション・非医療。診断・治療・投薬の判断には使えません。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: serenace-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'serenace-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bada_serenace/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bada_serenace/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/serenace.js", m[1]);
            for (const marker of ["function gammaManifold", "function gammaMeasure", "function gammaKernel",
                                  "function thermalSolve", "function thermalSense",
                                  "function kauffmanBracket", "function jonesPolynomial", "function jonesKey",
                                  "function blockAssemble", "function blockDemolish", "function blockInverse",
                                  "function dnaToBraid", "function dnaInvariant",
                                  "function cipherEncode", "function cipherDecode", "function cipherCrack",
                                  "function insightModel", "function leakChannel", "function leakSurvey",
                                  "function revComp", "function rnaiDesign", "function rnaiKnockdown",
                                  "function d2Occupancy", "function serenaceWindow", "function serenaceCompare",
                                  "function preventionPipeline", "function funcCatalog",
                                  "function intentDetect", "function aiShell"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/serenace.js
          echo "Bada Serenace self-check OK"
      - name: Engine tests (Γ manifold / thermal sensing / Jones polynomial / true inverse of blocks / DNA cipher / insight / thought leakage / RNAi design / receptor occupancy / prevention pipeline)
        run: |
          set -e
          node bada_serenace/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_serenace/app/www
          cp bada_serenace/index.html bada_serenace/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_serenace/app"
          cordova create cordova-build io.github.masaaki_avnturle.badaserenace BadaSerenace
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-serenace-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: serenace-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p bada_serenace/app/www
          cp bada_serenace/index.html bada_serenace/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bada_serenace/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: serenace-windows
          path: bada_serenace/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_serenace/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_serenace/app/www
          cp bada_serenace/index.html bada_serenace/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_serenace/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serenace-linux
          path: |
            bada_serenace/app/electron/dist/*.AppImage
            bada_serenace/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_serenace/app/electron/dist/*.AppImage
            bada_serenace/app/electron/dist/*.deb
