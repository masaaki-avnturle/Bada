name: Ω apps build (APK + Windows EXE + Linux)

# bio_medicine 配下の各アプリ(www + electron + cordova)から Android APK・Windows EXE・
# Linux (AppImage / deb) をビルドし、
# Actions アーティファクト、および (apps-v* タグ時) GitHub Release に添付します。
#
# ⚠ いずれのアプリも 概念シミュレーション/アート・非医療 です。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: apps-v1.6.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'apps-v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [omega_biofeedback, omega_thermal_trace, omega_telepathy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE (Electron)
        working-directory: bio_medicine/${{ matrix.app }}/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 90
          name: ${{ matrix.app }}-windows
          path: bio_medicine/${{ matrix.app }}/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        # action-gh-release は既存 Release の PATCH で 403 になることがある
        # (apps-v1.6.0 で再現)。gh でアップロードだけ行う (Release が無ければ作る)。
        run: |
          set -e
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Ω apps $TAG" || true
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber bio_medicine/${{ matrix.app }}/electron/dist/*.exe
  linux-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [omega_biofeedback, omega_thermal_trace, omega_telepathy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Linux AppImage + deb (Electron)
        working-directory: bio_medicine/${{ matrix.app }}/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 90
          name: ${{ matrix.app }}-linux
          path: |
            bio_medicine/${{ matrix.app }}/electron/dist/*.AppImage
            bio_medicine/${{ matrix.app }}/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        # action-gh-release は既存 Release の PATCH で 403 になることがある
        # (apps-v1.6.0 で再現)。gh でアップロードだけ行う (Release が無ければ作る)。
        run: |
          set -e
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Ω apps $TAG" || true
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber bio_medicine/${{ matrix.app }}/electron/dist/*.AppImage bio_medicine/${{ matrix.app }}/electron/dist/*.deb
  android-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [omega_biofeedback, omega_thermal_trace, omega_telepathy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 (Groovy 4) では cordova-android 12 の
      # cordova.gradle が "unable to resolve class XmlParser" で落ちるため
      # 7.6.4 を明示する (他の Android ワークフローと同じ対処)。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g cordova@12.0.0
          APP="bio_medicine/${{ matrix.app }}"
          cordova create cordova-build com.bada.omega TmpApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/${{ matrix.app }}-debug.apk"
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 90
          name: ${{ matrix.app }}-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        # action-gh-release は既存 Release の PATCH で 403 になることがある
        # (apps-v1.6.0 で再現)。gh でアップロードだけ行う (Release が無ければ作る)。
        run: |
          set -e
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Ω apps $TAG" || true
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber out/*.apk
