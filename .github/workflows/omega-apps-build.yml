name: Ω apps build (APK + Windows EXE + Linux deb/AppImage)

# bio_medicine 配下の各アプリ(www + electron + cordova)から
#   - Android APK
#   - Windows 10/11 EXE (NSIS インストーラ + portable)
#   - Linux(Ubuntu) .deb / .AppImage
#   - 単一ファイル HTML と ZIP
# をビルドし、**Actions の Artifacts** としてダウンロードできるようにします。
# 手動実行で「publish_release」を有効にした場合、およびタグ apps-v* を push した場合
# (omega-apps-release.yml がこのワークフローを呼び出します)は
# GitHub Release にも添付します(Release はログイン不要で誰でもダウンロードできます)。
#
# 実行される条件:
#   - bio_medicine/** かこのワークフローを push したとき (既定: omega_whispered のみビルド)
#   - Actions タブから手動実行したとき (対象アプリと Release 公開を選択可能)
#   - タグ apps-v* を push したとき (omega-apps-release.yml 経由で全アプリ + Release)
#
# ⚠ いずれのアプリも 概念シミュレーション/アート・非医療、学習・娯楽目的です。

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'ビルド対象'
        type: choice
        default: omega_whispered
        options:
          - omega_whispered
          - all
      publish_release:
        description: '成果物を GitHub Release として公開する(ログイン不要でDLできるようになる)'
        type: boolean
        default: false
      release_tag:
        description: 'Release のタグ名 (publish_release を有効にした場合)'
        type: string
        default: apps-v1.0.0
  workflow_call:
    inputs:
      apps:
        type: string
        default: omega_whispered
      publish_release:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
  push:
    branches: ['**']
    paths:
      - 'bio_medicine/**'
      - '.github/workflows/omega-apps-build.yml'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # ビルド対象アプリを決める
  #   push(通常)          → omega_whispered のみ (CI 時間の節約)
  #   手動実行で all      → 全アプリ
  #   タグ apps-v*        → 全アプリ
  # ------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - id: pick
        run: |
          ALL='["omega_biofeedback","omega_thermal_trace","omega_telepathy","omega_whispered"]'
          ONE='["omega_whispered"]'
          if [ "${{ inputs.apps }}" = "all" ]; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$ONE" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Windows 10 / 11 — NSIS インストーラ + portable EXE
  # ------------------------------------------------------------------
  windows-exe:
    needs: setup
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE (Electron)
        working-directory: bio_medicine/${{ matrix.app }}/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: bio_medicine/${{ matrix.app }}/electron/dist/*.exe
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------
  # Android — デバッグ署名 APK (Cordova)
  # ------------------------------------------------------------------
  android-apk:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー既定の Gradle 9 は Groovy 4 系のため、cordova-android 12 の
      # cordova.gradle が使う groovy.util.XmlParser を解決できずビルドが落ちる。
      # (unable to resolve class XmlParser) → Gradle 8 系を明示的に使う。
      - name: Pin Gradle 8.x (cordova-android 12 is incompatible with Gradle 9)
        run: |
          set -e
          GRADLE_VER=8.13
          curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          sudo unzip -q -d /opt /tmp/gradle.zip
          echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          # cordova が生成する wrapper も同じ版を使うように固定する
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip" >> "$GITHUB_ENV"
      - name: Show Gradle version in use
        run: gradle --version
      # ランナーには ~/.android/debug.keystore が無く、AGP がビルドごとにランダムな鍵を
      # 生成してしまう。署名証明書が毎回変わると、同じパッケージ名でも端末の旧版へ
      # 上書きインストールできない(署名不一致)。固定の鍵を配置して常に同じ署名にする。
      - name: Install fixed signing key (so updates can be installed over old builds)
        run: |
          set -e
          mkdir -p "$HOME/.android"
          cp .github/keystore/omega-debug.keystore "$HOME/.android/debug.keystore"
          ls -la "$HOME/.android/debug.keystore"
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g cordova@12.0.0
          APP="bio_medicine/${{ matrix.app }}"
          cordova create cordova-build com.bada.omega TmpApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          # アプリアイコン(あるアプリのみ)
          if [ -f "$APP/build/icons/512x512.png" ]; then cp "$APP/build/icons/512x512.png" cordova-build/icon.png; fi
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/${{ matrix.app }}-debug.apk"
          ls -la out
      # 署名が固定鍵のものであることを確認する(ずれていたら上書き更新できなくなるので落とす)
      - name: Verify APK signature is the fixed key
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "out/${{ matrix.app }}-debug.apk" | tee /tmp/certs.txt
          GOT=$(grep -i "certificate SHA-256 digest" /tmp/certs.txt | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')
          WANT=$(tr -d '[:space:]' < .github/keystore/FINGERPRINT.txt | tr 'A-Z' 'a-z')
          echo "signer SHA-256: $GOT"
          echo "expected      : $WANT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::APK の署名が固定鍵と一致しません。旧版へ上書きインストールできなくなります。"
            exit 1
          fi
          echo "✓ 固定鍵で署名されています(旧版へ上書き更新できます)"
          {
            echo "### Android 署名"
            echo ""
            echo "APK は固定鍵で署名されています（SHA-256: \`$GOT\`）。"
            echo "同じ鍵で署名された版どうしは**上書きインストール**できます。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------
  # Linux (Ubuntu) — .deb と .AppImage
  #   .deb     … sudo apt install ./Omega-Whispered-*.deb でインストール
  #   .AppImage… chmod +x して実行するだけ(インストール不要)
  # ------------------------------------------------------------------
  linux-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [omega_whispered]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg
      - name: Build .deb and .AppImage (electron-builder)
        working-directory: bio_medicine/${{ matrix.app }}/electron
        run: |
          npm install
          npm run dist:linux
      - name: List artifacts
        run: ls -la bio_medicine/${{ matrix.app }}/electron/dist
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: |
            bio_medicine/${{ matrix.app }}/electron/dist/*.deb
            bio_medicine/${{ matrix.app }}/electron/dist/*.AppImage
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------
  # Ω-Whispered: 単一ファイル HTML と ZIP
  # ------------------------------------------------------------------
  whispered-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build single-file HTML
        working-directory: bio_medicine/omega_whispered
        run: node build_single.js
      - name: Verify committed single-file is up to date
        working-directory: bio_medicine/omega_whispered
        run: node build_single.js --check
      - name: Package ZIP
        run: |
          set -e
          APP=bio_medicine/omega_whispered
          mkdir -p out/omega_whispered
          cp -r "$APP/www" out/omega_whispered/www
          cp "$APP/README.md" out/omega_whispered/
          cp "$APP/build_single.js" out/omega_whispered/
          cp "$APP/download/omega-whispered.html" out/omega_whispered/
          cp "$APP/download/omega-whispered.html" out/
          (cd out && zip -qr omega_whispered-app.zip omega_whispered)
          ls -la out
      - name: Upload download bundle
        uses: actions/upload-artifact@v4
        with:
          name: omega_whispered-download
          path: |
            out/omega_whispered-app.zip
            out/omega-whispered.html
          if-no-files-found: error
          retention-days: 90

  # ------------------------------------------------------------------
  # 成果物の一覧を Actions の実行ページ(Summary)に表示する
  # ------------------------------------------------------------------
  summary:
    needs: [setup, windows-exe, android-apk, linux-app, whispered-bundle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true
      - name: Write download summary
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ⬇ ダウンロード (Artifacts)"
            echo ""
            echo "このページ下部の **Artifacts** から各ファイルをダウンロードできます。"
            echo "（Artifacts のダウンロードには GitHub へのログインが必要です。"
            echo "  ログイン不要で配布したい場合は、手動実行時に \`publish_release\` を有効にするか、"
            echo "  タグ \`apps-v*\` を push して Release を作成してください。）"
            echo ""
            echo "実行ページ: $RUN"
            echo ""
            echo "| 成果物 | ファイル | サイズ |"
            echo "|:--|:--|--:|"
            if [ -d artifacts ]; then
              find artifacts -type f | sort | while read -r f; do
                NAME=$(echo "$f" | cut -d/ -f2)
                BASE=$(basename "$f")
                SIZE=$(du -h "$f" | cut -f1)
                echo "| \`$NAME\` | $BASE | $SIZE |"
              done
            else
              echo "| (成果物なし) | — | — |"
            fi
            echo ""
            echo "### 導入方法"
            echo "- **Android**: \`*-debug.apk\` を端末に転送して開く（提供元不明のアプリの許可が必要）"
            echo "- **Windows 10/11**: \`*-win-x64.exe\`（NSIS インストーラ / portable）を実行"
            echo "- **Ubuntu**: \`sudo apt install ./*-linux-amd64.deb\` または \`chmod +x *.AppImage && ./*.AppImage\`"
            echo "- **任意のOS**: \`omega-whispered.html\` をブラウザで開くだけ（インストール不要・オフライン動作）"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 手動実行で publish_release を有効にしたとき、Release として公開する
  # (Release の添付ファイルはログイン不要で誰でもダウンロードできる)
  # ------------------------------------------------------------------
  publish-release:
    if: inputs.publish_release
    needs: [windows-exe, android-apk, linux-app, whispered-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: Ω apps ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          body: |
            Ω-Whispered ほか bio_medicine アプリのビルド成果物です。

            - Android: `*-debug.apk`（デバッグ署名。提供元不明のアプリの許可が必要）
            - Windows 10/11: `*-win-x64.exe`（NSIS インストーラ / portable）
            - Ubuntu: `*-linux-amd64.deb` / `*-linux-x86_64.AppImage`
            - 任意のOS: `omega-whispered.html`（単一ファイル・オフライン動作） / `omega_whispered-app.zip`

            ⚠ 非公式ファン・オマージュ / 学習・娯楽目的です。
          files: release/*
