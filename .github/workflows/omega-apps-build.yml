name: Ω apps build (APK + Windows EXE + Ubuntu)

# 各アプリ(www + electron + cordova)から Android APK / Windows 10・11 EXE /
# Ubuntu (AppImage + deb + ネイティブ CLI tar.gz) をビルドし、
# Actions アーティファクト、および (apps-v* タグ時) GitHub Release に添付します。
#
# ⚠ いずれのアプリも 概念シミュレーション/アート・非医療 です。

on:
  workflow_dispatch:
  push:
    tags:
      - 'apps-v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: omega_biofeedback
            dir: bio_medicine/omega_biofeedback
          - app: omega_thermal_trace
            dir: bio_medicine/omega_thermal_trace
          - app: omega_telepathy
            dir: bio_medicine/omega_telepathy
          - app: omega_silent_talk
            dir: omega_silent_talk_pkg
          - app: omega_badagpt
            dir: bio_medicine/omega_badagpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE (Electron)
        working-directory: ${{ matrix.dir }}/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: ${{ matrix.dir }}/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.dir }}/electron/dist/*.exe

  android-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: omega_biofeedback
            dir: bio_medicine/omega_biofeedback
          - app: omega_thermal_trace
            dir: bio_medicine/omega_thermal_trace
          - app: omega_telepathy
            dir: bio_medicine/omega_telepathy
          - app: omega_silent_talk
            dir: omega_silent_talk_pkg
          - app: omega_badagpt
            dir: bio_medicine/omega_badagpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー既定の Gradle 9 は Groovy 4 系のため、cordova-android 12 の
      # cordova.gradle が使う groovy.util.XmlParser を解決できずビルドが落ちる。
      # (unable to resolve class XmlParser) → Gradle 8 系を明示的に使う。
      - name: Pin Gradle 8.x (cordova-android 12 is incompatible with Gradle 9)
        run: |
          set -e
          GRADLE_VER=8.13
          curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          sudo unzip -q -d /opt /tmp/gradle.zip
          echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          # cordova が生成する wrapper も同じ版を使うように固定する
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip" >> "$GITHUB_ENV"
      - name: Show Gradle version in use
        run: gradle --version
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g cordova@12.0.0
          APP="${{ matrix.dir }}"
          cordova create cordova-build com.bada.omega TmpApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          # 生成成果物のネイティブ保存用 (Android WebView は <a download> を無視する)
          cordova plugin add cordova-plugin-file@8.1.3
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/${{ matrix.app }}-debug.apk"
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

  ubuntu-app:
    # Ubuntu 向け GUI アプリ (Electron → AppImage + deb)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: omega_silent_talk
            dir: omega_silent_talk_pkg
          - app: omega_badagpt
            dir: bio_medicine/omega_badagpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: ${{ matrix.dir }}/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ubuntu
          path: |
            ${{ matrix.dir }}/electron/dist/*.AppImage
            ${{ matrix.dir }}/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.dir }}/electron/dist/*.AppImage
            ${{ matrix.dir }}/electron/dist/*.deb

  ubuntu-cli:
    # Ubuntu 向けネイティブ CLI (C 実装 bin/silent_talk) の tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native CLI (gcc)
        working-directory: omega_silent_talk_pkg
        run: |
          make
          ./bin/silent_talk --demo
      - name: Package tar.gz
        run: |
          set -e
          PKG=omega_silent_talk-cli-ubuntu-x64
          mkdir -p "dist/$PKG"
          cp omega_silent_talk_pkg/bin/silent_talk "dist/$PKG/"
          cp -r omega_silent_talk_pkg/examples "dist/$PKG/examples"
          cp omega_silent_talk_pkg/README.md omega_silent_talk_pkg/NOTE.txt "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          ls -la dist
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega_silent_talk-cli-ubuntu
          path: dist/*.tar.gz
      - name: Attach CLI to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
