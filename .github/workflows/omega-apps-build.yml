name: Ω apps build (APK + Windows EXE)

# 各アプリ(www + electron + cordova)から Android APK・Windows EXE・Ubuntu/Linux
# (AppImage + deb) をビルドし、Actions アーティファクトに保存、release_tag を持つ
# アプリは rolling GitHub Release に添付します(タグはワークフローが GITHUB_TOKEN で生成)。
#
# アプリ本体の場所が bio_medicine/ 配下と リポジトリ直下 の両方にあるため、
# matrix は {app, dir, [release_tag, release_name]} の include 形式でパスを明示します。

on:
  workflow_dispatch:
  push:
    tags:
      - 'apps-v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: omega_biofeedback,   dir: bio_medicine/omega_biofeedback }
          - { app: omega_thermal_trace, dir: bio_medicine/omega_thermal_trace }
          - { app: omega_telepathy,     dir: bio_medicine/omega_telepathy }
          - { app: omega_usb_resume,    dir: omega_usb_resume, release_tag: usb-resume-latest, release_name: "Ω-USB Resume (latest — Windows EXE + Ubuntu AppImage/deb + Android 12 APK)" }
          - { app: omega_bada_lang,     dir: omega_bada_lang,  release_tag: bada-lang-latest,  release_name: "Ω-Bada Studio (latest — Bada compiler+interpreter+quantum · Windows EXE + Ubuntu AppImage/deb + Android 12 APK)" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE (Electron)
        working-directory: ${{ matrix.dir }}/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: ${{ matrix.dir }}/electron/dist/*.exe
      - name: Attach EXE to Release (apps-v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.dir }}/electron/dist/*.exe
      # Rolling Release so the EXE is permanently downloadable from the repo's
      # Releases page (the Action creates the tag server-side via GITHUB_TOKEN).
      - name: Publish EXE to rolling Release
        if: ${{ matrix.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release_tag }}
          name: ${{ matrix.release_name }}
          files: ${{ matrix.dir }}/electron/dist/*.exe
          body: |
            **${{ matrix.release_name }}**

            - `*.exe` … **Windows 10 / 11**（NSIS インストーラ + portable）
            - `*.AppImage` / `*.deb` … **Ubuntu / Linux**（AppImage は `chmod +x` して実行、deb は `sudo dpkg -i`）
            - `*.apk` … **Android 12+**（minSdk 24 / target 33）

            概念/教育用シミュレーションを含みます。詳細は各アプリの README を参照。

  linux-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: omega_usb_resume, dir: omega_usb_resume, release_tag: usb-resume-latest, release_name: "Ω-USB Resume (latest — Windows EXE + Ubuntu AppImage/deb + Android 12 APK)" }
          - { app: omega_bada_lang,  dir: omega_bada_lang,  release_tag: bada-lang-latest,  release_name: "Ω-Bada Studio (latest — Bada compiler+interpreter+quantum · Windows EXE + Ubuntu AppImage/deb + Android 12 APK)" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Ubuntu/Linux app (Electron — AppImage + deb)
        working-directory: ${{ matrix.dir }}/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: |
            ${{ matrix.dir }}/electron/dist/*.AppImage
            ${{ matrix.dir }}/electron/dist/*.deb
      - name: Attach Linux app to Release (apps-v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.dir }}/electron/dist/*.AppImage
            ${{ matrix.dir }}/electron/dist/*.deb
      # Rolling Release so the Ubuntu app (AppImage + deb) is permanently
      # downloadable from the repo's Releases page (same tag as EXE/APK).
      - name: Publish Linux app to rolling Release
        if: ${{ matrix.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release_tag }}
          name: ${{ matrix.release_name }}
          files: |
            ${{ matrix.dir }}/electron/dist/*.AppImage
            ${{ matrix.dir }}/electron/dist/*.deb

  android-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: omega_biofeedback,   dir: bio_medicine/omega_biofeedback }
          - { app: omega_thermal_trace, dir: bio_medicine/omega_thermal_trace }
          - { app: omega_telepathy,     dir: bio_medicine/omega_telepathy }
          - { app: omega_usb_resume,    dir: omega_usb_resume, release_tag: usb-resume-latest, release_name: "Ω-USB Resume (latest — Windows EXE + Ubuntu AppImage/deb + Android 12 APK)" }
          - { app: omega_bada_lang,     dir: omega_bada_lang,  release_tag: bada-lang-latest,  release_name: "Ω-Bada Studio (latest — Bada compiler+interpreter+quantum · Windows EXE + Ubuntu AppImage/deb + Android 12 APK)" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Pin Gradle 8.7 (cordova-android 12 is incompatible with Gradle 9's XmlParser)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g cordova@12.0.0
          APP="${{ matrix.dir }}"
          cordova create cordova-build com.bada.omega TmpApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/${{ matrix.app }}-debug.apk"
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android
          path: out/*.apk
      - name: Attach APK to Release (apps-v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
      # Rolling Release so the APK is permanently downloadable from the repo's
      # Releases page (attaches to the same tag as the EXE job).
      - name: Publish APK to rolling Release
        if: ${{ matrix.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release_tag }}
          name: ${{ matrix.release_name }}
          files: out/*.apk
