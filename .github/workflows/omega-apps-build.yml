name: Ω apps build (APK + Windows EXE)

# 各アプリ(www + electron + cordova)から Windows EXE・Android APK・Ubuntu 版を
# ビルドし、Actions アーティファクトに保存、release_tag を持つアプリは rolling
# GitHub Release に添付します(タグはワークフローが GITHUB_TOKEN で生成)。
#
# Ubuntu 版の形態はアプリごとに異なります:
#   - omega_usb_resume : Electron GUI (AppImage + deb)  … linux-app ジョブ
#   - omega_bada_lang  : CLI コンパイラ/インタープリタ (Node SEA 単体バイナリ + deb) … linux-cli ジョブ

on:
  workflow_dispatch:
  push:
    tags:
      - 'apps-v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: omega_biofeedback,   dir: bio_medicine/omega_biofeedback }
          - { app: omega_thermal_trace, dir: bio_medicine/omega_thermal_trace }
          - { app: omega_telepathy,     dir: bio_medicine/omega_telepathy }
          - { app: omega_usb_resume,    dir: omega_usb_resume, release_tag: usb-resume-latest, release_name: "Ω-USB Resume (latest — Windows EXE + Ubuntu AppImage/deb + Android 12 APK)", release_body: "Ω-USB Resume — 概念シミュレーション。`*.exe`=Windows 10/11、`*.AppImage`/`*.deb`=Ubuntu、`*.apk`=Android 12+。" }
          - { app: omega_bada_lang,     dir: omega_bada_lang,  release_tag: bada-lang-latest,  release_name: "Ω-Bada Studio (latest — Bada compiler+interpreter+quantum · Windows EXE + Ubuntu CLI + Android 12 APK)", release_body: "Ω-Bada Studio — Bada 言語のコンパイラ＋インタープリタ＋量子。`*.exe`=Windows 10/11 GUI、`bada-cli-linux-x64` ＋ `bada-cli_*_amd64.deb`(→ `/usr/bin/bada`)=Ubuntu CLI (`bada run|vm|dis|qasm|check`)、`*.apk`=Android 12+ GUI。量子は状態ベクトルシミュレータ。" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows EXE (Electron)
        working-directory: ${{ matrix.dir }}/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: ${{ matrix.dir }}/electron/dist/*.exe
      - name: Attach EXE to Release (apps-v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.dir }}/electron/dist/*.exe
      - name: Publish EXE to rolling Release
        if: ${{ matrix.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release_tag }}
          name: ${{ matrix.release_name }}
          body: ${{ matrix.release_body }}
          files: ${{ matrix.dir }}/electron/dist/*.exe

  # Ubuntu/Linux GUI (Electron AppImage + deb) — omega_usb_resume only.
  linux-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: omega_usb_resume, dir: omega_usb_resume, release_tag: usb-resume-latest, release_name: "Ω-USB Resume (latest — Windows EXE + Ubuntu AppImage/deb + Android 12 APK)" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Ubuntu/Linux app (Electron — AppImage + deb)
        working-directory: ${{ matrix.dir }}/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: |
            ${{ matrix.dir }}/electron/dist/*.AppImage
            ${{ matrix.dir }}/electron/dist/*.deb
      - name: Publish Linux app to rolling Release
        if: ${{ matrix.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release_tag }}
          name: ${{ matrix.release_name }}
          files: |
            ${{ matrix.dir }}/electron/dist/*.AppImage
            ${{ matrix.dir }}/electron/dist/*.deb

  # Ubuntu/Linux CLI (Node SEA standalone binary + deb) — omega_bada_lang.
  # This REPLACES the Electron GUI for the Bada language on Ubuntu with a
  # command-line compiler + interpreter (+ quantum). No Node needed to run it.
  linux-cli:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Ubuntu CLI (Node SEA standalone binary + deb)
        run: bash omega_bada_lang/cli/build-linux-cli.sh
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omega_bada_lang-linux-cli
          path: |
            omega_bada_lang/cli/build/bada-cli-linux-x64
            omega_bada_lang/cli/build/bada-cli_*_amd64.deb
      - name: Remove stale Bada GUI Linux assets from the rolling Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          gh release delete-asset bada-lang-latest Omega-Bada-Studio-1.0.0-x86_64.AppImage -y || true
          gh release delete-asset bada-lang-latest Omega-Bada-Studio-1.0.0-amd64.deb -y || true
      - name: Publish CLI to rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bada-lang-latest
          name: "Ω-Bada Studio (latest — Bada compiler+interpreter+quantum · Windows EXE + Ubuntu CLI + Android 12 APK)"
          files: |
            omega_bada_lang/cli/build/bada-cli-linux-x64
            omega_bada_lang/cli/build/bada-cli_*_amd64.deb

  android-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: omega_biofeedback,   dir: bio_medicine/omega_biofeedback }
          - { app: omega_thermal_trace, dir: bio_medicine/omega_thermal_trace }
          - { app: omega_telepathy,     dir: bio_medicine/omega_telepathy }
          - { app: omega_usb_resume,    dir: omega_usb_resume, release_tag: usb-resume-latest, release_name: "Ω-USB Resume (latest — Windows EXE + Ubuntu AppImage/deb + Android 12 APK)", release_body: "Ω-USB Resume — 概念シミュレーション。`*.exe`=Windows 10/11、`*.AppImage`/`*.deb`=Ubuntu、`*.apk`=Android 12+。" }
          - { app: omega_bada_lang,     dir: omega_bada_lang,  release_tag: bada-lang-latest,  release_name: "Ω-Bada Studio (latest — Bada compiler+interpreter+quantum · Windows EXE + Ubuntu CLI + Android 12 APK)", release_body: "Ω-Bada Studio — Bada 言語のコンパイラ＋インタープリタ＋量子。`*.exe`=Windows 10/11 GUI、`bada-cli-linux-x64` ＋ `bada-cli_*_amd64.deb`(→ `/usr/bin/bada`)=Ubuntu CLI (`bada run|vm|dis|qasm|check`)、`*.apk`=Android 12+ GUI。量子は状態ベクトルシミュレータ。" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Pin Gradle 8.7 (cordova-android 12 is incompatible with Gradle 9's XmlParser)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          npm install -g cordova@12.0.0
          APP="${{ matrix.dir }}"
          cordova create cordova-build com.bada.omega TmpApp
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk "out/${{ matrix.app }}-debug.apk"
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android
          path: out/*.apk
      - name: Attach APK to Release (apps-v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
      - name: Publish APK to rolling Release
        if: ${{ matrix.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release_tag }}
          name: ${{ matrix.release_name }}
          body: ${{ matrix.release_body }}
          files: out/*.apk
