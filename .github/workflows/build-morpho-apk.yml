name: Build Bada Morphogenesis APK

on:
  push:
    branches:
      - "claude/brain-imaging-biofeedback-app-a5CGb"
    paths:
      - "bada_morphogenesis_app/**"
      - ".github/workflows/build-morpho-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bada_morphogenesis_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bada-morphogenesis-debug-apk
          path: bada_morphogenesis_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
