name: AntiGravity OS app build (Windows EXE + Ubuntu + Android APK)

# antigravity_os/ の反重力OS風生成AI (量子 Bada 言語) を
#   - Windows 10/11 向け zip (bada.exe + ランチャー, インストール不要)
#   - Ubuntu 向け .deb / tar.gz
#   - Android 向け APK (NDK で C インタープリタを同梱)
# としてビルドします。まずデスクトップ版で 4 不変量 (G1-G4) を認証してから
# 各パッケージを作り、Actions アーティファクト、および
# (agos-v* タグ / release_tag 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: agos-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'agos-v*'

permissions:
  contents: write

env:
  AGOS_VERSION: 1.0.0

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + certify the four OS invariants (G1-G4)
        working-directory: antigravity_os
        run: ./build.sh

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux binary
        working-directory: antigravity_os
        run: |
          set -e
          gcc -O2 -std=c11 -Wno-alloc-size-larger-than -o bada src/bada.c -lm
          ./bada run agos.bada | grep -q "invariants upheld"
      - name: Package tar.gz
        run: |
          set -e
          mkdir -p out stage/antigravity-os
          cp -r antigravity_os/src antigravity_os/sys antigravity_os/lib stage/antigravity-os/
          cp antigravity_os/bada antigravity_os/agos.bada antigravity_os/build.sh \
             antigravity_os/README.md antigravity_os/packaging/linux/README-linux.txt \
             stage/antigravity-os/
          tar -C stage -czf "out/AntiGravityOS-${AGOS_VERSION}-linux-x64.tar.gz" antigravity-os
      - name: Package .deb
        run: |
          set -e
          ROOT=debroot
          mkdir -p $ROOT/DEBIAN $ROOT/usr/lib/antigravity-os $ROOT/usr/bin \
                   $ROOT/usr/share/applications $ROOT/usr/share/doc/antigravity-os
          cp -r antigravity_os/sys antigravity_os/lib $ROOT/usr/lib/antigravity-os/
          cp antigravity_os/bada antigravity_os/agos.bada $ROOT/usr/lib/antigravity-os/
          cp antigravity_os/packaging/linux/antigravity-os $ROOT/usr/bin/antigravity-os
          chmod 755 $ROOT/usr/bin/antigravity-os $ROOT/usr/lib/antigravity-os/bada
          cp antigravity_os/packaging/linux/antigravity-os.desktop $ROOT/usr/share/applications/
          cp antigravity_os/README.md $ROOT/usr/share/doc/antigravity-os/
          SIZE=$(du -sk $ROOT/usr | cut -f1)
          {
            echo "Package: antigravity-os"
            echo "Version: ${AGOS_VERSION}"
            echo "Section: science"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Installed-Size: ${SIZE}"
            echo "Maintainer: masaaki-avnturle <masaaki.tabu4@gmail.com>"
            echo "Depends: libc6"
            echo "Description: AntiGravity OS - generative-AI OS on the quantum Bada phase core"
            echo " A generative-AI operating system styled after an anti-gravity"
            echo " generator, written in the quantum Bada language. Computational"
            echo " simulation / thought experiment; certifies its four invariants"
            echo " (lift conservation, mode isolation, scram safety, auditable"
            echo " telemetry) at runtime. Run with: antigravity-os"
          } > $ROOT/DEBIAN/control
          dpkg-deb --build --root-owner-group $ROOT "out/AntiGravityOS-${AGOS_VERSION}-amd64.deb"
          dpkg-deb --info "out/AntiGravityOS-${AGOS_VERSION}-amd64.deb"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-os-linux
          path: out/*
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: AntiGravity OS ${{ env.AGOS_VERSION }}
          files: out/*

  windows-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Cross-compile bada.exe for Windows 10/11 (x64)
        working-directory: antigravity_os
        run: |
          set -e
          x86_64-w64-mingw32-gcc -O2 -std=c11 -D__USE_MINGW_ANSI_STDIO=1 -static \
            -Wno-alloc-size-larger-than -o bada.exe src/bada.c -lm
          file bada.exe
      - name: Package Windows zip
        run: |
          set -e
          mkdir -p out stage/AntiGravityOS
          cp -r antigravity_os/sys antigravity_os/lib stage/AntiGravityOS/
          cp antigravity_os/bada.exe antigravity_os/agos.bada stage/AntiGravityOS/
          cp antigravity_os/packaging/windows/AntiGravityOS.bat stage/AntiGravityOS/
          cp antigravity_os/packaging/windows/README-windows.txt stage/AntiGravityOS/
          cp antigravity_os/README.md stage/AntiGravityOS/
          (cd stage && zip -r "../out/AntiGravityOS-${AGOS_VERSION}-windows-x64.zip" AntiGravityOS)
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-os-windows
          path: out/*.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: AntiGravity OS ${{ env.AGOS_VERSION }}
          files: out/*.zip

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build APK (NDK-compiled interpreter + agos.bada asset)
        run: gradle -p antigravity_os/android assembleDebug --no-daemon
      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          cp antigravity_os/android/app/build/outputs/apk/debug/app-debug.apk \
             "out/AntiGravityOS-${AGOS_VERSION}-android.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-os-android
          path: out/*.apk
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: AntiGravity OS ${{ env.AGOS_VERSION }}
          body: |
            反重力発生器OS風の生成AI (量子プログラミング Bada 言語) — 3 プラットフォーム版

            - `AntiGravityOS-1.0.0-android.apk` … Android 7.0+ (サイドロード用 debug 署名)
            - `AntiGravityOS-1.0.0-windows-x64.zip` … Windows 10/11 (展開して AntiGravityOS.bat を実行)
            - `AntiGravityOS-1.0.0-amd64.deb` … Ubuntu 22.04/24.04 (`sudo apt install ./…deb` → `antigravity-os`)
            - `AntiGravityOS-1.0.0-linux-x64.tar.gz` … Linux 汎用 (展開して `./bada run agos.bada`)

            すべて同一の stage-0 Bada インタープリタと agos.bada (PID 1) を同梱し、
            起動時に G1 揚力保存 / G2 モード隔離 / G3 緊急停止安全 / G4 監査可能テレメトリを再導出します。
            計算的シミュレーションであり、実際の反重力装置ではありません。
          files: out/*.apk
