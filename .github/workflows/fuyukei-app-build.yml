name: Bada Fuyukei app build (Android APK + Windows EXE + Ubuntu)

# winter_math_art/ の「Bada 冬景」— 冬景色と数学を融合させた抽象画で楽曲を
# 映像化するアプリ。楽曲 (MP3 / WAV / M4A / 動画の音声) を解析して
# 音符・コード・調・テンポを求め、β–ζ 論文の方程式群
#   定理1  ζ(s) = 2^s π^{s−1} sin(πs/2) · β(s,1−s)/Γ(s) · ζ(1−s)  → 上辺の霜
#   系1    ζ(−2n) = 0                                            → 氷柱
#   系2    ξ(s) = ξ(1−s), 臨界線 Re s = ½                          → 凍った湖 (鏡映)
#   定理3  x(s) = e^{W(ζ(s))}                                      → 降雪量
#   定理4  p(s) = arcsin(π/ζ(s))/π  (s ≤ s*)                       → オーロラ
#   定理5  x(p,q) = e^{W(β(p,q))}  (音名 → 素数対)                  → 雪の結晶
#   定理6  β(p(s),1−p(s)) = ζ(s) = x log x                          → オーロラの曲線
#   Ξ      β(H+1, M+1)  (多様体エントロピー不変量)                  → 色相
# で冬景色を描き、ピアノロールと合成して MediaRecorder で動画へ録画
# します (対応環境では MP4、それ以外は WebM)。これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は winter_math_art/index.html の自己完結
# HTML で、これをそのまま www として各ラッパーに同梱します。
# winter_math_art/ への push ごとに Actions アーティファクト (fuyukei-android /
# fuyukei-windows / fuyukei-linux) として、また (fuyukei-v* タグ / release_tag
# 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: fuyukei-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'fuyukei-v*'
    # winter_math_art/ への push でも自動ビルド (Actions アーティファクトとしてダウンロード可)
    branches:
      - main
      - 'claude/winter-math-abstract-art-app-*'
    paths:
      - 'winter_math_art/**'
      - '.github/workflows/fuyukei-app-build.yml'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f winter_math_art/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("winter_math_art/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/fuyukei.js", m[1]);
            for (const marker of ["function gammaR", "function betaR", "function betaDiag",
                                  "function zetaR", "function zetaFE", "function theorem1RHS",
                                  "function hardyZ", "function lambertW", "function entropyX",
                                  "function pOfS", "function solveSStar", "function xOfPQ",
                                  "function commonCoordinate", "function manifoldInvariant",
                                  "function fftInPlace", "function detectChord", "function estimateKey",
                                  "function estimateTempo", "function createAnalyzer", "function mathState",
                                  "function Renderer", "function pickRecorderMime", "function boot"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/fuyukei.js
          echo "Bada Fuyukei self-check OK"
      - name: Engine tests (beta–zeta equations vs. paper tables / Ξ / music analysis / recorder)
        run: |
          set -e
          node winter_math_art/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # setup-android の既定インストール対象 'tools' は SDK リポジトリから
      # 廃止済みで、そのままだと "Failed to find package 'tools'" で落ちる。
      # packages を空にして既定の導入を止め、必要な物は次のステップで明示的に入れる。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p winter_math_art/app/www
          cp winter_math_art/index.html winter_math_art/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="winter_math_art/app"
          cordova create cordova-build io.github.masaaki_avnturle.badafuyukei BadaFuyukei
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          # WebView は <a download href="blob:"> を処理しないため、
          # SAF (ACTION_CREATE_DOCUMENT) の保存ダイアログで動画を保存する。
          cordova plugin add cordova-plugin-save-dialog
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-fuyukei-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuyukei-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p winter_math_art/app/www
          cp winter_math_art/index.html winter_math_art/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: winter_math_art/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuyukei-windows
          path: winter_math_art/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: winter_math_art/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p winter_math_art/app/www
          cp winter_math_art/index.html winter_math_art/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: winter_math_art/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuyukei-linux
          path: |
            winter_math_art/app/electron/dist/*.AppImage
            winter_math_art/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            winter_math_art/app/electron/dist/*.AppImage
            winter_math_art/app/electron/dist/*.deb
