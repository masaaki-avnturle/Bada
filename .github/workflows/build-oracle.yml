name: Build Bada Oracle (APK + Windows EXE)

on:
  push:
    branches:
      - "claude/brain-imaging-biofeedback-app-a5CGb"
    paths:
      - "bada_oracle_app/**"
      - "bada_oracle_desktop/**"
      - ".github/workflows/build-oracle.yml"
    tags:
      - "oracle-v*"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bada_oracle_app
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bada-oracle-apk
          path: bada_oracle_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bada_oracle_desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install -r requirements.txt
      - name: Build Windows EXE
        run: pyinstaller --onefile --windowed --name BadaOracle bada_oracle.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: bada-oracle-exe
          path: bada_oracle_desktop/dist/BadaOracle.exe
          if-no-files-found: error

  release:
    needs: [build-apk, build-exe]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: bada-oracle-apk
          path: dist-apk
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: bada-oracle-exe
          path: dist-exe
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'oracle-latest' }}
          name: Bada Oracle ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          body: |
            Bada Oracle — 娯楽・内省用の生成アート（予知ではありません / not a prediction).
            - Android: BadaOracle APK (app-debug.apk)
            - Windows 10/11: BadaOracle.exe
          files: |
            dist-apk/*.apk
            dist-exe/BadaOracle.exe
