name: Bada QCrypt app build (Android APK + Windows EXE + Ubuntu)

# bada_qcrypt/ の「Bada QCrypt」— 量子暗号ソフト。
# これまでの量子暗号アプリ (Bada QuantOS の暗号アプリ / ZoneShield) を、
# 暗号処理そのものを量子プログラミング言語 Bada のプログラムとして書き直した版。
#   - BB84 量子鍵配送: 光子 1 個ずつを Bada のゲート列 (X/H/測定) に通し、
#     量子乱数も H|0⟩ の測定で得る。intercept-resend 盗聴を QBER で検出。
#   - ワンタイムパッド / 検疫タグ (鍵付き FNV-1a) も Bada プログラム。
#   - 量子検疫室: テキスト・ファイルを量子封印し、ウイルス感染を含む
#     あらゆる改変をバイト単位で検出して封印時の状態へ復元する。
# これを
#   - Android 向け APK
#   - Windows 10/11 向け EXE (NSIS インストーラ + ポータブル)
#   - Ubuntu 向け AppImage / deb
# としてビルドします。アプリ本体は bada_qcrypt/index.html の自己完結
# HTML で、これをそのまま www として各ラッパーに同梱します。
# Actions アーティファクト、および (qcrypt-v* タグ / release_tag
# 指定時) GitHub Release に添付します。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release に添付するタグ名 (例: qcrypt-v1.0.0)。空欄なら Actions アーティファクトのみ。'
        required: false
        default: ''
  push:
    tags:
      - 'qcrypt-v*'

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check app HTML (inline JS syntax + engine markers)
        run: |
          set -e
          test -f bada_qcrypt/index.html
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("bada_qcrypt/index.html", "utf8");
            const m = src.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found"); process.exit(1); }
            fs.writeFileSync("/tmp/qcrypt.js", m[1]);
            for (const marker of ["function badaParse", "function badaRun",
                                  "function qcRunBB84", "function qcRunOTPBytes",
                                  "function qcRunTag", "function qcEncrypt", "function qcDecrypt",
                                  "function qcSealMakeBytes", "function qcSealDiff",
                                  "function qcSealRestoreBytes", "BADA_SRC_DEFAULT"]) {
              if (!m[1].includes(marker)) { console.error("missing: " + marker); process.exit(1); }
            }
          '
          node --check /tmp/qcrypt.js
          echo "Bada QCrypt self-check OK"
      - name: Engine tests (Bada interpreter / BB84 / one-time pad / quarantine tag / quantum seal)
        run: |
          set -e
          node bada_qcrypt/tools/engine-test.js

  android-apk:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (+ accept licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      # ランナー標準の Gradle 9 は cordova-android 12 と非互換のため 7.6.4 を明示。
      - name: Pin Gradle 7.6.4 (cordova-android 12 requires Gradle 7.x)
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$HOME/gradle.zip"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.6.4/bin" >> "$GITHUB_PATH"
          echo "CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-7.6.4-bin.zip" >> "$GITHUB_ENV"
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_qcrypt/app/www
          cp bada_qcrypt/index.html bada_qcrypt/app/www/index.html
      - name: Build debug APK (Cordova, pinned versions)
        run: |
          set -e
          gradle --version
          npm install -g cordova@12.0.0
          APP="bada_qcrypt/app"
          cordova create cordova-build io.github.masaaki_avnturle.badaqcrypt BadaQCrypt
          rm -rf cordova-build/www
          cp -r "$APP/www" cordova-build/www
          cp "$APP/cordova/config.xml" cordova-build/config.xml
          cd cordova-build
          cordova platform add android@12.0.1
          cordova build android --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          cp cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk out/bada-qcrypt-debug.apk
          ls -la out
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcrypt-android
          path: out/*.apk
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: out/*.apk

  windows-exe:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        shell: bash
        run: |
          mkdir -p bada_qcrypt/app/www
          cp bada_qcrypt/index.html bada_qcrypt/app/www/index.html
      - name: Build Windows EXE (Electron)
        working-directory: bada_qcrypt/app/electron
        run: |
          npm install
          npm run dist
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcrypt-windows
          path: bada_qcrypt/app/electron/dist/*.exe
      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bada_qcrypt/app/electron/dist/*.exe

  linux-app:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare www (self-contained app)
        run: |
          mkdir -p bada_qcrypt/app/www
          cp bada_qcrypt/index.html bada_qcrypt/app/www/index.html
      - name: Build Ubuntu AppImage + deb (Electron)
        working-directory: bada_qcrypt/app/electron
        run: |
          npm install
          npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcrypt-linux
          path: |
            bada_qcrypt/app/electron/dist/*.AppImage
            bada_qcrypt/app/electron/dist/*.deb
      - name: Attach Linux builds to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            bada_qcrypt/app/electron/dist/*.AppImage
            bada_qcrypt/app/electron/dist/*.deb
