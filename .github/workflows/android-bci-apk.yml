name: Build BadaBCI APK

# Builds the BadaBCI on/off switch app and publishes the APK so it can be
# downloaded from this repository (Actions Artifact every build; attached to a
# GitHub Release on v* tags).

on:
  push:
    branches: [ "main", "claude/biomedical-monitoring-app-SNqVR" ]
    paths:
      - "bada_bci/**"
      - ".github/workflows/android-bci-apk.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bada_bci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BadaBCI-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadaBCI-apk
          path: bada_bci/BadaBCI-debug.apk
          if-no-files-found: error

      - name: Attach APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bada_bci/BadaBCI-debug.apk
