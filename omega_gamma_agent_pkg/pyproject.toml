[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-gamma-agent"
version = "0.1.0"
description = "ガンマ関数の大域的部分積分多様体(Γ(s+1)=s·Γ(s))を注意重みに使うローカル・エージェント（AGIではない研究用骨組み）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Masaaki Yamaguchi" }]
keywords = ["gamma-function", "integration-by-parts", "manifold", "agent", "bada", "omega"]
dependencies = []

[project.scripts]
omega-gamma-agent = "omega_gamma_agent.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["omega_gamma_agent"]
