<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bada CineVim — 映画カウントダウンの VIM エディタ</title>
<!--
  Bada CineVim — 量子プログラミング言語 Bada 用の映画的 VIM エディタ
  (依存ゼロ・単一 HTML・オフライン動作)

  ・本物のモーダル編集 (ノーマル / 挿入 / ビジュアル / ビジュアル行 /
    コマンドライン / 置換) — hjkl w b e 0 ^ $ gg G { } % f t F T、
    オペレータ d c y > <、カウント、レジスタ、u / Ctrl-R、. リピート、
    / 検索、:%s/// 置換、:w :q :set などの Ex コマンド
  ・Bada 言語シンタックスハイライト (<- / -< / >- / Ω:: / qubit / gate …)
  ・🎬 シネマフォーカス — カーソル行を「どアップ」に拡大し、
    離れた行ほどガウス減衰で縮小・ぼかし・減光する被写界深度表現
  ・💥 クラッシュ効果 — ポイントされた行が 3D で浮き上がり、
    画面が揺れ、色収差が割れ、衝撃波リングと破片が飛ぶ
  ・⏱ 映画のカウントダウン — アカデミー・リーダー (5→4→3→2→1) の
    スイープ + 走査線 + フィルムグレイン。T-0 で最大クラッシュ
  ・⚛ 量子 Bada 実行系 — 状態ベクトルシミュレータ (H X Y Z S T CNOT
    CZ SWAP / measure)、β(p,q)・Γ(s) の実装、<- -< >- の数値意味論
-->
<style>
  :root{
    --bg:#05070c; --panel:#0c111c; --panel2:#111827; --line:#1e2740;
    --tx:#e6ecf7; --tx2:#7f8aa3; --gold:#e8c76a; --cyan:#5ad7e8;
    --mag:#ff4d7e; --ok:#5fd68a; --err:#ff6b6b; --amber:#ffb454;
    --base-h:30px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(1200px 700px at 50% 38%, #101a2c 0%, #05070c 68%),
      var(--bg);
    color:var(--tx);
    font-family:"Segoe UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  /* ── ヘッダ ── */
  header{
    flex:0 0 auto; padding:9px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:linear-gradient(180deg,#0d1421,#080c15); z-index:40;
  }
  header h1{ margin:0; font-size:16px; letter-spacing:1.2px; white-space:nowrap; }
  header h1 .gold{ color:var(--gold); }
  header h1 .cy{ color:var(--cyan); }
  header .sub{ color:var(--tx2); font-size:11.5px; }
  .spacer{ flex:1 1 auto; }
  button.tb{
    background:var(--panel2); color:var(--tx); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; font-size:12.5px; cursor:pointer;
    font-family:inherit; white-space:nowrap;
  }
  button.tb:hover{ border-color:var(--cyan); color:#fff; }
  button.tb.on{ border-color:var(--gold); color:var(--gold); box-shadow:0 0 12px rgba(232,199,106,.22) inset; }
  button.tb:active{ transform:translateY(1px); }

  /* ── ステージ (どアップの舞台) ── */
  /* position:relative — 狭い画面で重ねる出力パネル (#side.force) を
     ヘッダの下、この領域の中だけに収めるための基準にする */
  #wrap{ flex:1 1 auto; display:flex; min-height:0; position:relative; }
  #stage{
    flex:1 1 auto; position:relative; overflow:hidden;
    perspective:1000px; perspective-origin:50% 50%;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.017) 0 1px, transparent 1px 3px),
      radial-gradient(900px 520px at 50% 50%, rgba(90,215,232,.07), transparent 70%);
  }
  /* ビネット (映画的な周辺減光) */
  #stage::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:12;
    background:radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,.62) 100%);
  }
  #shaker{ position:absolute; inset:0; will-change:transform; }
  #doc{
    position:absolute; left:0; right:0; top:0;
    /* flex-column にするのは見た目のためではなく、隣接する .ln の上下
       マージンが相殺(margin collapsing)されるのを防ぐため。相殺されると
       docLayout() が計算した占有高さ (baseH × scale) と実レイアウトがずれ、
       どアップの行が中央からずれて重なる。 */
    display:flex; flex-direction:column;
    transform-style:preserve-3d; will-change:transform;
    font-family:"Cascadia Mono","Consolas","SF Mono","Noto Sans Mono CJK JP","DejaVu Sans Mono",monospace;
    font-size:17px; line-height:var(--base-h);
    padding:0 clamp(10px,4vw,64px);
  }
  .ln{
    display:flex; align-items:center; height:var(--base-h);
    transform-origin:8% 50%; will-change:transform,filter,opacity;
    white-space:pre; position:relative;
  }
  .ln .gut{
    flex:0 0 auto; width:3.6ch; text-align:right; margin-right:1.2ch;
    color:#3b4763; font-size:.82em; user-select:none;
  }
  .ln.cur .gut{ color:var(--gold); }
  .ln .code{ flex:0 1 auto; position:relative; }
  .ln.cur .code{ text-shadow:0 0 22px rgba(90,215,232,.30); }
  /* 浮き上がり + クラッシュ (色収差) */
  .ln.lift .code{
    text-shadow:
      calc(var(--ab,0px) * -1) 0 0 rgba(255,77,126,.75),
      var(--ab,0px) 0 0 rgba(90,215,232,.75),
      0 0 26px rgba(255,255,255,.35);
  }
  .ln .hair{
    position:absolute; left:-1.4ch; right:-1.2ch; top:50%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,199,106,.55),transparent);
    opacity:0; pointer-events:none;
  }
  .ln.cur .hair{ opacity:.5; }

  /* シンタックス */
  .t-kw{ color:#ff8fb0; font-weight:600; }
  .t-op{ color:var(--gold); font-weight:700; }
  .t-qop{ color:#ff4d7e; font-weight:700; text-shadow:0 0 10px rgba(255,77,126,.45); }
  .t-num{ color:#9ae6a0; }
  .t-str{ color:#e8c76a; }
  .t-com{ color:#4d5a75; font-style:italic; }
  .t-fn{ color:var(--cyan); }
  .t-ns{ color:#c792ea; font-weight:700; }
  .t-ket{ color:#7ee0ff; text-shadow:0 0 12px rgba(126,224,255,.55); }
  .t-id{ color:var(--tx); }
  .t-punct{ color:#8d99b5; }
  .t-ws{ color:inherit; }
  .t-match{ background:rgba(232,199,106,.22); border-radius:2px; }

  /* カーソル */
  #caret{
    position:absolute; z-index:14; pointer-events:none;
    background:var(--gold); mix-blend-mode:screen; border-radius:1px;
    box-shadow:0 0 18px rgba(232,199,106,.8);
    transition:opacity .08s linear;
  }
  #caret.ins{ background:var(--cyan); box-shadow:0 0 18px rgba(90,215,232,.9); }
  #caret.blink{ opacity:.18; }

  /* 選択 */
  #selLayer{ position:absolute; inset:0; z-index:8; pointer-events:none; }
  .selbox{ position:absolute; background:rgba(90,215,232,.18); border-radius:2px; }

  /* FX / リーダー キャンバス */
  #fx,#leader{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #fx{ z-index:13; }
  #leader{ z-index:30; display:none; }

  /* 出力パネル */
  #side{
    flex:0 0 340px; min-width:0; border-left:1px solid var(--line);
    background:linear-gradient(180deg,#0a0f1a,#070a12);
    display:flex; flex-direction:column; z-index:20;
  }
  #side.hide{ display:none !important; }
  #side h2{
    margin:0; padding:7px 8px 7px 12px; font-size:12px; letter-spacing:1px;
    color:var(--tx2); border-bottom:1px solid var(--line); text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  #sideClose{
    margin-left:auto; background:transparent; color:var(--tx2); border:1px solid var(--line);
    border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #sideClose:hover{ color:var(--err); border-color:var(--err); }
  #out{
    flex:1 1 auto; overflow:auto; padding:10px 12px; font-size:12.5px;
    font-family:"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
    white-space:pre-wrap; word-break:break-word; line-height:1.65;
  }
  #out .o-ok{ color:var(--ok); }
  #out .o-err{ color:var(--err); }
  #out .o-dim{ color:var(--tx2); }
  #out .o-key{ color:var(--gold); }
  #out .o-q{ color:var(--cyan); }
  #out .bar{ display:inline-block; height:7px; background:linear-gradient(90deg,var(--cyan),var(--mag)); border-radius:3px; vertical-align:middle; }

  /* ステータスライン */
  #status{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:5px 12px; border-top:1px solid var(--line);
    background:#0a0f1a; font-size:12.5px; z-index:40;
    font-family:"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
  }
  #mode{
    padding:2px 10px; border-radius:5px; font-weight:800; letter-spacing:1.5px;
    background:var(--gold); color:#12161f; font-size:11.5px;
  }
  #mode.m-insert{ background:var(--ok); }
  #mode.m-visual,#mode.m-vline{ background:var(--mag); color:#fff; }
  #mode.m-command,#mode.m-search{ background:var(--cyan); color:#0a1016; }
  #mode.m-replace{ background:var(--amber); color:#12161f; }
  #fname{ color:var(--tx2); }
  #msg{ flex:1 1 auto; color:var(--cyan); white-space:pre; overflow:hidden; text-overflow:ellipsis; }
  #msg.err{ color:var(--err); }
  #pos{ color:var(--tx2); white-space:nowrap; }
  #cmdline{
    display:none; flex:1 1 auto; color:var(--tx); white-space:pre;
  }
  #cmdline.show{ display:block; }
  #cmdline .cc{ background:var(--gold); color:#12161f; }

  /* タッチ用キーバー (APK / タブレット) */
  #keys{
    flex:0 0 auto; display:none; gap:5px; padding:6px 7px; overflow-x:auto;
    border-top:1px solid var(--line); background:#080c15; z-index:40;
  }
  #keys.show{ display:flex; }
  #keys button{
    flex:0 0 auto; min-width:40px; padding:9px 9px; font-size:13px;
    background:#141c2c; color:var(--tx); border:1px solid var(--line);
    border-radius:7px; font-family:"Consolas",monospace; cursor:pointer;
  }
  #keys button:active{ background:var(--gold); color:#12161f; }
  #hidden{
    position:absolute; opacity:0; width:1px; height:1px; left:-9999px; top:0;
    border:0; padding:0;
  }

  /* カウントダウン HUD */
  #hud{
    position:absolute; right:14px; top:12px; z-index:31; text-align:right;
    font-family:"Cascadia Mono","Consolas",monospace; pointer-events:none;
    display:none;
  }
  #hud.show{ display:block; }
  #hudNum{ font-size:44px; font-weight:800; color:var(--mag); text-shadow:0 0 26px rgba(255,77,126,.7); line-height:1; }
  #hudLbl{ font-size:11px; letter-spacing:3px; color:var(--tx2); }

  /* ヘルプ オーバーレイ */
  #help{
    position:absolute; inset:0; z-index:50; display:none;
    background:rgba(3,5,10,.93); padding:18px; overflow:auto;
  }
  #help.show{ display:block; }
  #help .inner{ max-width:860px; margin:0 auto; }
  #help h3{ color:var(--gold); margin:16px 0 6px; font-size:14px; }
  #help table{ border-collapse:collapse; width:100%; font-size:12.5px; }
  #help td{ padding:3px 8px; border-bottom:1px solid #131a2a; vertical-align:top; }
  #help td:first-child{
    color:var(--cyan); white-space:nowrap; width:170px;
    font-family:"Cascadia Mono","Consolas",monospace;
  }
  #help .close{ float:right; }

  @media (max-width:900px){
    #side{ display:none; }
    #side.force{ display:flex; position:absolute; right:0; top:0; bottom:0; width:min(88vw,340px); }
    header h1 .sub{ display:none; }
    #doc{ font-size:15px; }
  }
  @media (prefers-reduced-motion:reduce){
    .ln{ transition:none !important; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="gold">Bada</span> <span class="cy">CineVim</span></h1>
  <span class="sub">量子言語 Bada の映画的 VIM エディタ</span>
  <span class="spacer"></span>
  <button class="tb on" id="btnFocus" title="カーソル行をどアップに (:focus)">🎬 シネマ</button>
  <button class="tb on" id="btnCrash" title="浮き上がりクラッシュ効果 (:crash)">💥 クラッシュ</button>
  <button class="tb" id="btnCount" title="映画のカウントダウン (:countdown 5)">⏱ カウントダウン</button>
  <button class="tb" id="btnRun" title="量子 Bada を実行 (:run)">▶ 実行</button>
  <button class="tb on" id="btnOut" title="量子 Bada 出力パネルの表示切替">⚛ 出力</button>
  <button class="tb" id="btnOpen" title="ファイルを開く (:e)">📂 開く</button>
  <button class="tb" id="btnSave" title="保存 (:w)">💾 保存</button>
  <button class="tb" id="btnHelp" title="キーバインド一覧 (:help)">？</button>
</header>

<div id="wrap">
  <div id="stage">
    <div id="shaker">
      <div id="selLayer"></div>
      <div id="doc"></div>
      <div id="caret"></div>
    </div>
    <canvas id="fx"></canvas>
    <canvas id="leader"></canvas>
    <div id="hud"><div id="hudNum">5</div><div id="hudLbl">T-MINUS</div></div>
    <div id="help"><div class="inner"></div></div>
  </div>
  <div id="side">
    <h2>⚛ 量子 Bada 出力<button id="sideClose" title="出力パネルを閉じる">✕</button></h2>
    <div id="out"></div>
  </div>
</div>

<div id="status">
  <span id="mode">NORMAL</span>
  <span id="fname">quantum.bada</span>
  <span id="msg"></span>
  <span id="cmdline"></span>
  <span id="pos">1:1</span>
</div>

<div id="keys"></div>
<input id="hidden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
<input id="fileIn" type="file" accept=".bada,.om,.txt,.md,.js,.c,.py,*/*" style="display:none">

<script>
"use strict";
/* =====================================================================
 *  Bada CineVim — エンジン
 *  すべて純関数として定義し、boot() だけが DOM に触れます
 *  (tools/engine-test.js が Node の vm でこのブロックを直接読み込みます)
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * 0. 既定のサンプル — 量子プログラミング言語 Bada
 * ------------------------------------------------------------------ */
var DEMO_SRC = [
  "// Bada v3 — 映画カウントダウン・シーケンス",
  "// ζ(s) = β(p,q) / log x    非可換作用素環プログラミング",
  "",
  "import Omega::Manifold;",
  "",
  "class CountdownNode <- TupleSpace {",
  "",
  "  operator <- (input) {",
  "    return beta(2, 3) / log(input);      // 非可換左作用 π(χ,x)",
  "  }",
  "",
  "  operator -< (state) {",
  "    return state -< 12.0;                // 多様体積分 ∬1/(x·log x)²",
  "  }",
  "",
  "  operator >- (output) {",
  "    return output >- 0.5;                // 量子作用素右作用 ⊕(iℏ∇)^⊕L",
  "  }",
  "}",
  "",
  "/* ---- T-5 : 量子レジスタを起こす ---- */",
  "qubit q[3];",
  "",
  "H q[0];              // 重ね合わせ  |0⟩ → (|0⟩+|1⟩)/√2",
  "CNOT q[0], q[1];     // もつれ      → ベル状態 Φ+",
  "X q[2];",
  "",
  "/* ---- T-0 : 崩壊させて観測する ---- */",
  "let shot = measure q;",
  "print shot;",
  "",
  "let zeta = 4.0 <- 2.0;",
  "let area = 2.0 -< 12.0;",
  "let grad = 1.0 >- 0.5;",
  "print zeta;",
  "print area;",
  "print grad;",
  "",
  "Omega::DATABASE[tuplespace] {",
  "  push(CountdownNode);   // Akashic Record への書き込み",
  "}"
].join("\n");

/* ---------------------------------------------------------------------
 * 1. Bada シンタックス トークナイザ
 * ------------------------------------------------------------------ */
var BADA_KW = ["class","operator","return","if","elif","else","for","while","do",
  "let","const","var","fn","func","def","import","export","module","new","this",
  "super","null","nil","true","false","break","continue","in","of","match","case",
  "yield","async","await","spawn","observe","collapse","entangle","superpose",
  "measure","qubit","qreg","gate","circuit","manifold","tuplespace","struct",
  "enum","trait","impl","pub","use","where","with","end"];

var BADA_FN = ["beta","gamma","zeta","log","ln","exp","sin","cos","tan","atan",
  "sqrt","abs","floor","ceil","round","pow","min","max","norm","trace","det",
  "tensor","kron","pi_operator","chi","psi","print","printf","push","pull","emit",
  "H","X","Y","Z","S","T","CNOT","CZ","SWAP","RX","RY","RZ","TOFFOLI"];

/* 量子/多様体オペレータ (長いものから照合すること) */
var BADA_QOPS = ["<-","-<",">-","::","⊕","⊗","∬","∇","√","ℏ"];
var BADA_OPS  = ["->","=>","===","!==","==","!=","<=",">=","&&","||","**",
  "+=","-=","*=","/=","%=","<<",">>","+","-","*","/","%","=","<",">","!","&","|","^","~","?"];

function isIdStart(ch){ return /[A-Za-z_$À-ɏͰ-Ͽ぀-ヿ一-鿿]/.test(ch); }
function isIdPart(ch){ return isIdStart(ch) || /[0-9]/.test(ch); }

/* badaTokenize(line, inBlock)
 *   -> { toks:[{t,v}], inBlock:Boolean }
 *   t: kw | fn | ns | qop | op | num | str | com | ket | id | punct | ws  */
function badaTokenize(line, inBlock){
  line = (line == null ? "" : String(line));
  var toks = [], i = 0, n = line.length, block = !!inBlock;

  /* ブロックコメントの継続 */
  if (block){
    var endAt = line.indexOf("*/");
    if (endAt < 0){ if (n) toks.push({t:"com", v:line}); return {toks:toks, inBlock:true}; }
    toks.push({t:"com", v:line.slice(0, endAt+2)});
    i = endAt + 2; block = false;
  }

  while (i < n){
    var ch = line[i], two = line.substr(i,2);

    /* 空白 */
    if (ch === " " || ch === "\t"){
      var j = i; while (j < n && (line[j] === " " || line[j] === "\t")) j++;
      toks.push({t:"ws", v:line.slice(i,j)}); i = j; continue;
    }
    /* 行コメント */
    if (two === "//" || ch === "#"){ toks.push({t:"com", v:line.slice(i)}); i = n; continue; }
    /* ブロックコメント開始 */
    if (two === "/*"){
      var e = line.indexOf("*/", i+2);
      if (e < 0){ toks.push({t:"com", v:line.slice(i)}); return {toks:toks, inBlock:true}; }
      toks.push({t:"com", v:line.slice(i, e+2)}); i = e + 2; continue;
    }
    /* 量子ケット |0⟩ |1⟩ |ψ⟩ |01> */
    if (ch === "|"){
      var km = /^\|[^|<>⟩\s]{0,8}(?:⟩|>)/.exec(line.slice(i));
      if (km){ toks.push({t:"ket", v:km[0]}); i += km[0].length; continue; }
    }
    /* 文字列 */
    if (ch === '"' || ch === "'" || ch === "`"){
      var k = i + 1, esc = false;
      while (k < n){
        if (esc){ esc = false; k++; continue; }
        if (line[k] === "\\"){ esc = true; k++; continue; }
        if (line[k] === ch){ k++; break; }
        k++;
      }
      toks.push({t:"str", v:line.slice(i,k)}); i = k; continue;
    }
    /* 数値 (16進 / 小数 / 指数 / 虚数 i) */
    if (/[0-9]/.test(ch) || (ch === "." && /[0-9]/.test(line[i+1] || ""))){
      var nm = /^(?:0[xX][0-9a-fA-F_]+|(?:[0-9][0-9_]*)?\.?[0-9][0-9_]*(?:[eE][+-]?[0-9]+)?)i?/.exec(line.slice(i));
      var v = nm ? nm[0] : ch;
      toks.push({t:"num", v:v}); i += v.length; continue;
    }
    /* 識別子 / 名前空間 / キーワード */
    if (isIdStart(ch)){
      var s = i; while (i < n && isIdPart(line[i])) i++;
      var w = line.slice(s, i);
      if (line.substr(i,2) === "::"){ toks.push({t:"ns", v:w}); continue; }
      if (BADA_KW.indexOf(w) >= 0) toks.push({t:"kw", v:w});
      else if (BADA_FN.indexOf(w) >= 0) toks.push({t:"fn", v:w});
      else toks.push({t:"id", v:w});
      continue;
    }
    /* 量子/多様体オペレータ (優先) */
    var hit = null, z;
    for (z = 0; z < BADA_QOPS.length; z++){
      var q = BADA_QOPS[z];
      if (line.substr(i, q.length) === q){ hit = q; break; }
    }
    if (hit){ toks.push({t:"qop", v:hit}); i += hit.length; continue; }
    /* 通常オペレータ */
    for (z = 0; z < BADA_OPS.length; z++){
      var o = BADA_OPS[z];
      if (line.substr(i, o.length) === o){ hit = o; break; }
    }
    if (hit){ toks.push({t:"op", v:hit}); i += hit.length; continue; }
    /* 区切り */
    toks.push({t:"punct", v:ch}); i++;
  }
  return {toks:toks, inBlock:block};
}

/* 全行をまとめてトークナイズ (ブロックコメント状態を持ち越す) */
function badaTokenizeAll(lines){
  var out = [], blk = false;
  for (var i = 0; i < lines.length; i++){
    var r = badaTokenize(lines[i], blk);
    blk = r.inBlock; out.push(r.toks);
  }
  return out;
}

/* ---------------------------------------------------------------------
 * 2. Bada の数学 — Γ(s) / β(p,q) / ζ(s) と 3 つの非可換オペレータ
 * ------------------------------------------------------------------ */
var HBAR_EFF = 1.0;   /* 自然単位系の実効 ℏ */

/* Lanczos 近似によるガンマ関数 */
var LANCZOS = [676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012,
  9.9843695780195716e-6, 1.5056327351493116e-7];

function gammaFn(z){
  if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gammaFn(1 - z));
  z -= 1;
  var x = 0.99999999999980993;
  for (var i = 0; i < LANCZOS.length; i++) x += LANCZOS[i] / (z + i + 1);
  var t = z + LANCZOS.length - 0.5;
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}

/* β(p,q) = Γ(p)Γ(q)/Γ(p+q) */
function betaFn(p, q){ return gammaFn(p) * gammaFn(q) / gammaFn(p + q); }

/* ζ(s) = β(p,q) / log x  (README の核心設計思想より) */
function zetaBeta(p, q, x){
  var l = Math.log(x);
  if (!isFinite(l) || l === 0) return NaN;
  return betaFn(p, q) / l;
}

/* `<-` 非可換左作用 π(χ,x) = [iπ, f(x)] の実数表現 */
function badaLeft(a, b){ return a * Math.cos(b) - b * Math.sin(a); }

/* `-<` 多様体積分 ∬ 1/(x·log x)² dx を [a,b] でシンプソン則により数値積分 */
function badaMani(a, b, steps){
  steps = steps || 200;
  if (steps % 2) steps++;
  if (!(a > 1) || !(b > 1)) return NaN;
  if (b === a) return 0;
  var sign = 1;
  if (b < a){ var t = a; a = b; b = t; sign = -1; }
  var f = function(x){ var L = Math.log(x); return 1 / (x * L * x * L); };
  var h = (b - a) / steps, s = f(a) + f(b);
  for (var i = 1; i < steps; i++) s += f(a + i * h) * (i % 2 ? 4 : 2);
  return sign * s * h / 3;
}

/* `>-` 量子作用素右作用 ⊕(iℏ∇)^⊕L — ℏ × 数値勾配 ∇sin(a) */
function badaRight(a, b){
  if (!b) return HBAR_EFF * Math.cos(a);
  return HBAR_EFF * (Math.sin(a + b) - Math.sin(a)) / b;
}

/* ---------------------------------------------------------------------
 * 3. 量子 Bada 実行系 — 状態ベクトルシミュレータ
 * ------------------------------------------------------------------ */
function qnew(n){
  var size = 1 << n;
  var re = new Array(size), im = new Array(size);
  for (var i = 0; i < size; i++){ re[i] = 0; im[i] = 0; }
  re[0] = 1;
  return {n:n, re:re, im:im};
}

/* 1 量子ビット ゲート: 2x2 行列 [[a,b],[c,d]] を複素数の平坦配列で */
var QGATES = {
  H: [Math.SQRT1_2,0, Math.SQRT1_2,0, Math.SQRT1_2,0, -Math.SQRT1_2,0],
  X: [0,0, 1,0, 1,0, 0,0],
  Y: [0,0, 0,-1, 0,1, 0,0],
  Z: [1,0, 0,0, 0,0, -1,0],
  S: [1,0, 0,0, 0,0, 0,1],
  T: [1,0, 0,0, 0,0, Math.SQRT1_2, Math.SQRT1_2]
};

function qapply1(st, g, q){
  if (q < 0 || q >= st.n) throw new Error("量子ビット番号が範囲外: " + q);
  var bit = 1 << q, size = 1 << st.n;
  for (var i = 0; i < size; i++){
    if (i & bit) continue;
    var j = i | bit;
    var ar = st.re[i], ai = st.im[i], br = st.re[j], bi = st.im[j];
    st.re[i] = g[0]*ar - g[1]*ai + g[2]*br - g[3]*bi;
    st.im[i] = g[0]*ai + g[1]*ar + g[2]*bi + g[3]*br;
    st.re[j] = g[4]*ar - g[5]*ai + g[6]*br - g[7]*bi;
    st.im[j] = g[4]*ai + g[5]*ar + g[6]*bi + g[7]*br;
  }
  return st;
}

function qgate1(st, name, q){
  var g = QGATES[name];
  if (!g) throw new Error("未知のゲート: " + name);
  return qapply1(st, g, q);
}

/* 回転ゲート RX / RY / RZ (角度 θ) */
function qrot(st, axis, q, theta){
  var c = Math.cos(theta/2), s = Math.sin(theta/2), g;
  if (axis === "RX") g = [c,0, 0,-s, 0,-s, c,0];
  else if (axis === "RY") g = [c,0, -s,0, s,0, c,0];
  else g = [c,-s, 0,0, 0,0, c,s];
  return qapply1(st, g, q);
}

function qcnot(st, c, t){
  if (c === t) throw new Error("CNOT の制御と標的が同じです");
  if (c < 0 || c >= st.n || t < 0 || t >= st.n) throw new Error("量子ビット番号が範囲外");
  var cb = 1 << c, tb = 1 << t, size = 1 << st.n;
  for (var i = 0; i < size; i++){
    if ((i & cb) && !(i & tb)){
      var j = i | tb;
      var r = st.re[i], m = st.im[i];
      st.re[i] = st.re[j]; st.im[i] = st.im[j];
      st.re[j] = r; st.im[j] = m;
    }
  }
  return st;
}

function qcz(st, c, t){
  var cb = 1 << c, tb = 1 << t, size = 1 << st.n;
  for (var i = 0; i < size; i++){
    if ((i & cb) && (i & tb)){ st.re[i] = -st.re[i]; st.im[i] = -st.im[i]; }
  }
  return st;
}

function qswap(st, a, b){ qcnot(st,a,b); qcnot(st,b,a); qcnot(st,a,b); return st; }

function qprobs(st){
  var size = 1 << st.n, p = new Array(size);
  for (var i = 0; i < size; i++) p[i] = st.re[i]*st.re[i] + st.im[i]*st.im[i];
  return p;
}

/* 決定的な擬似乱数 (テスト再現性のため) */
function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 観測 — 状態を固有状態へ collapse させ、測定値 (整数) を返す */
function qmeasure(st, rng){
  var p = qprobs(st), r = (rng ? rng() : Math.random()), acc = 0, idx = p.length - 1;
  for (var i = 0; i < p.length; i++){ acc += p[i]; if (r < acc){ idx = i; break; } }
  for (var k = 0; k < p.length; k++){ st.re[k] = 0; st.im[k] = 0; }
  st.re[idx] = 1;
  return idx;
}

function qbits(idx, n){
  var s = "";
  for (var i = n - 1; i >= 0; i--) s += ((idx >> i) & 1);
  return s;
}

/* ---------------------------------------------------------------------
 * 4. Bada 式評価器 — 再帰下降パーサ
 *    優先順位 (低→高):  <- -< >-   |  + -  |  * / %  |  **  |  単項  |  一次
 * ------------------------------------------------------------------ */
var BADA_MATHFN = {
  log:  function(a){ return Math.log(a); },
  ln:   function(a){ return Math.log(a); },
  exp:  function(a){ return Math.exp(a); },
  sin:  function(a){ return Math.sin(a); },
  cos:  function(a){ return Math.cos(a); },
  tan:  function(a){ return Math.tan(a); },
  atan: function(a){ return Math.atan(a); },
  sqrt: function(a){ return Math.sqrt(a); },
  abs:  function(a){ return Math.abs(a); },
  floor:function(a){ return Math.floor(a); },
  ceil: function(a){ return Math.ceil(a); },
  round:function(a){ return Math.round(a); },
  pow:  function(a,b){ return Math.pow(a,b); },
  min:  function(a,b){ return Math.min(a,b); },
  max:  function(a,b){ return Math.max(a,b); },
  gamma:function(a){ return gammaFn(a); },
  beta: function(a,b){ return betaFn(a,b); },
  zeta: function(a,b,c){ return zetaBeta(a,b,c); },
  pi_operator: function(a,b){ return badaLeft(a,b); },
  norm: function(a){ return Math.abs(a); }
};

function badaApplyQop(op, a, b){
  if (op === "<-") return badaLeft(a, b);
  if (op === "-<") return badaMani(a, b);
  if (op === ">-") return badaRight(a, b);
  throw new Error("未知の作用素: " + op);
}

function _peek(p){ return p.i < p.toks.length ? p.toks[p.i] : null; }
function _isOp(t, v){ return t && (t.t === "op" || t.t === "qop" || t.t === "punct") && t.v === v; }

function _parsePrimary(p, env){
  var t = _peek(p);
  if (!t) throw new Error("式が途中で終わっています");
  if (t.t === "num"){ p.i++; return parseFloat(String(t.v).replace(/_/g, "").replace(/i$/, "")); }
  if (t.t === "str"){ p.i++; return t.v.slice(1, -1); }
  if (_isOp(t, "(")){
    p.i++;
    var v = _parseQop(p, env);
    if (!_isOp(_peek(p), ")")) throw new Error("')' がありません");
    p.i++; return v;
  }
  if (t.t === "kw" && t.v === "measure"){
    p.i++;
    var nm = _peek(p);
    if (nm) p.i++;
    if (!env.q) throw new Error("観測する量子レジスタがありません (qubit q[n]; が必要)");
    var idx = qmeasure(env.q, env.rng);
    env.lastShot = idx;
    return idx;
  }
  if (t.t === "id" || t.t === "fn" || t.t === "ns" || t.t === "kw"){
    var name = t.v; p.i++;
    if (_isOp(_peek(p), "(")){
      p.i++;
      var args = [];
      if (!_isOp(_peek(p), ")")){
        for (;;){
          args.push(_parseQop(p, env));
          if (_isOp(_peek(p), ",")){ p.i++; continue; }
          break;
        }
      }
      if (!_isOp(_peek(p), ")")) throw new Error("')' がありません: " + name);
      p.i++;
      var f = BADA_MATHFN[name];
      if (!f) throw new Error("未知の関数: " + name);
      return f.apply(null, args);
    }
    /* q[3] のような添字は測定値のビット取り出しとして扱う */
    if (_isOp(_peek(p), "[")){
      p.i++;
      var ix = _parseQop(p, env);
      if (_isOp(_peek(p), "]")) p.i++;
      var base = env.vars.hasOwnProperty(name) ? env.vars[name] : (env.lastShot || 0);
      return (Number(base) >> Number(ix)) & 1;
    }
    if (env.vars.hasOwnProperty(name)) return env.vars[name];
    if (name === "PI" || name === "pi" || name === "π") return Math.PI;
    if (name === "E" || name === "e") return Math.E;
    if (name === "hbar" || name === "ℏ") return HBAR_EFF;
    throw new Error("未定義の識別子: " + name);
  }
  if (t.t === "ket"){ /* |0⟩ → そのビット列の整数値 */
    p.i++;
    var body = t.v.replace(/^\||[⟩>]$/g, "");
    return /^[01]+$/.test(body) ? parseInt(body, 2) : 0;
  }
  throw new Error("解釈できないトークン: " + t.v);
}

function _parseUnary(p, env){
  var t = _peek(p);
  if (_isOp(t, "-")){ p.i++; return -_parseUnary(p, env); }
  if (_isOp(t, "+")){ p.i++; return _parseUnary(p, env); }
  if (_isOp(t, "!")){ p.i++; return _parseUnary(p, env) ? 0 : 1; }
  if (_isOp(t, "√")){ p.i++; return Math.sqrt(_parseUnary(p, env)); }
  return _parsePrimary(p, env);
}

function _parsePow(p, env){
  var a = _parseUnary(p, env);
  if (_isOp(_peek(p), "**")){ p.i++; return Math.pow(a, _parsePow(p, env)); }
  return a;
}

function _parseMul(p, env){
  var a = _parsePow(p, env);
  for (;;){
    var t = _peek(p);
    if (_isOp(t, "*")){ p.i++; a = a * _parsePow(p, env); }
    else if (_isOp(t, "/")){ p.i++; a = a / _parsePow(p, env); }
    else if (_isOp(t, "%")){ p.i++; a = a % _parsePow(p, env); }
    else if (_isOp(t, "⊗")){ p.i++; a = a * _parsePow(p, env); }   /* テンソル積 */
    else return a;
  }
}

function _parseAdd(p, env){
  var a = _parseMul(p, env);
  for (;;){
    var t = _peek(p);
    if (_isOp(t, "+")){ p.i++; a = a + _parseMul(p, env); }
    else if (_isOp(t, "-")){ p.i++; a = a - _parseMul(p, env); }
    else if (_isOp(t, "⊕")){ p.i++; a = a + _parseMul(p, env); }   /* 直和 */
    else return a;
  }
}

function _parseQop(p, env){
  var a = _parseAdd(p, env);
  for (;;){
    var t = _peek(p);
    if (t && t.t === "qop" && (t.v === "<-" || t.v === "-<" || t.v === ">-")){
      p.i++; a = badaApplyQop(t.v, a, _parseAdd(p, env));
    } else return a;
  }
}

/* badaEval("4.0 <- 2.0", env) -> Number */
function badaEval(src, env){
  env = env || {vars:{}};
  var toks = badaTokenize(src).toks.filter(function(t){ return t.t !== "ws" && t.t !== "com"; });
  if (!toks.length) throw new Error("空の式");
  var p = {toks:toks, i:0};
  var v = _parseQop(p, env);
  return v;
}

/* 数値の表示整形 */
function fmtNum(v){
  if (typeof v === "string") return v;
  if (v == null || (typeof v === "number" && !isFinite(v))) return String(v);
  if (Number.isInteger(v)) return String(v);
  var a = Math.abs(v);
  if (a !== 0 && (a < 1e-4 || a >= 1e7)) return v.toExponential(6);
  return String(Math.round(v * 1e9) / 1e9);
}

/* ---------------------------------------------------------------------
 * 5. 量子 Bada プログラム実行
 *    quantumRun(src, seed) -> { out:[{cls,text}], vars, state, err }
 * ------------------------------------------------------------------ */
function stripComments(line){
  var r = badaTokenize(line), s = "";
  for (var i = 0; i < r.toks.length; i++){
    if (r.toks[i].t !== "com") s += r.toks[i].v;
  }
  return s;
}

function quantumRun(src, seed){
  var env = {
    vars:{}, q:null, rng: mulberry32(seed === undefined ? 0x5EED : (seed >>> 0)),
    lastShot: 0
  };
  var out = [], err = null;
  var push = function(cls, text){ out.push({cls:cls, text:text}); };

  var lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
  var depth = 0, blockComment = false, classes = [], ops = [];

  push("o-dim", "⚛ Bada 量子ランタイム — 起動");

  for (var li = 0; li < lines.length; li++){
    var raw = lines[li];
    /* ブロックコメントの追跡 */
    var tk = badaTokenize(raw, blockComment);
    blockComment = tk.inBlock;
    var text = "";
    for (var ti = 0; ti < tk.toks.length; ti++) if (tk.toks[ti].t !== "com") text += tk.toks[ti].v;
    text = text.trim();
    if (!text) continue;

    var opens = (text.match(/\{/g) || []).length;
    var closes = (text.match(/\}/g) || []).length;

    try {
      if (depth > 0){
        /* 定義ブロックの内部は宣言として記録するだけ */
        depth += opens - closes;
        if (depth < 0) depth = 0;
        continue;
      }

      var m;
      if ((m = /^import\s+(.+?);?$/.exec(text))){
        push("o-dim", "  import " + m[1]);
      } else if ((m = /^class\s+([A-Za-z_]\w*)/.exec(text))){
        classes.push(m[1]);
        push("o-key", "  class " + m[1] + " を定義");
      } else if ((m = /^operator\s+(\S+)/.exec(text))){
        ops.push(m[1]);
        push("o-key", "  operator " + m[1] + " を定義");
      } else if (/^Omega::|^Ω::/.test(text)){
        push("o-key", "  Ω::TupleSpace — Akashic Record へ接続");
      } else if ((m = /^qubit\s+([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*;?$/.exec(text))){
        var n = parseInt(m[2], 10);
        if (n < 1 || n > 14) throw new Error("量子ビット数は 1〜14 の範囲で指定してください");
        env.q = qnew(n); env.qname = m[1];
        push("o-q", "  qubit " + m[1] + "[" + n + "]  → |" + new Array(n + 1).join("0") + "⟩");
      } else if ((m = /^(H|X|Y|Z|S|T)\s+([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*;?$/.exec(text))){
        if (!env.q) throw new Error("量子レジスタが未宣言です");
        qgate1(env.q, m[1], parseInt(m[3], 10));
        push("o-q", "  " + m[1] + " → q[" + m[3] + "]");
      } else if ((m = /^(RX|RY|RZ)\s+([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*,\s*(.+?)\s*;?$/.exec(text))){
        if (!env.q) throw new Error("量子レジスタが未宣言です");
        var th = badaEval(m[4], env);
        qrot(env.q, m[1], parseInt(m[3], 10), th);
        push("o-q", "  " + m[1] + "(" + fmtNum(th) + ") → q[" + m[3] + "]");
      } else if ((m = /^(CNOT|CZ|SWAP)\s+([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*,\s*([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*;?$/.exec(text))){
        if (!env.q) throw new Error("量子レジスタが未宣言です");
        var a = parseInt(m[3], 10), b = parseInt(m[5], 10);
        if (m[1] === "CNOT") qcnot(env.q, a, b);
        else if (m[1] === "CZ") qcz(env.q, a, b);
        else qswap(env.q, a, b);
        push("o-q", "  " + m[1] + " q[" + a + "] , q[" + b + "]");
      } else if ((m = /^(?:let|const|var)\s+([A-Za-z_]\w*)\s*=\s*(.+?)\s*;?$/.exec(text))){
        env.vars[m[1]] = badaEval(m[2], env);
        push("", "  let " + m[1] + " = " + fmtNum(env.vars[m[1]]));
      } else if ((m = /^print\s*\(?\s*(.+?)\s*\)?\s*;?$/.exec(text))){
        var pv = badaEval(m[1], env);
        push("o-ok", "  ▸ " + fmtNum(pv));
      } else if ((m = /^measure\s+([A-Za-z_]\w*)\s*(?:->\s*([A-Za-z_]\w*)\s*)?;?$/.exec(text))){
        if (!env.q) throw new Error("観測する量子レジスタがありません");
        var sh = qmeasure(env.q, env.rng);
        env.lastShot = sh;
        if (m[2]) env.vars[m[2]] = sh;
        push("o-q", "  measure → |" + qbits(sh, env.q.n) + "⟩  (" + sh + ")");
      } else if ((m = /^([A-Za-z_]\w*)\s*=\s*(.+?)\s*;?$/.exec(text))){
        env.vars[m[1]] = badaEval(m[2], env);
        push("", "  " + m[1] + " = " + fmtNum(env.vars[m[1]]));
      } else if (/^[}{;]+$/.test(text)){
        /* 括弧のみの行 */
      } else {
        var val = badaEval(text.replace(/;$/, ""), env);
        push("", "  = " + fmtNum(val));
      }
    } catch (e){
      err = "行 " + (li + 1) + ": " + e.message;
      push("o-err", "  ✘ " + err);
      break;
    }
    depth += opens - closes;
    if (depth < 0) depth = 0;
  }

  /* 終了時の量子状態 */
  if (env.q){
    var probs = qprobs(env.q), rows = [];
    for (var i = 0; i < probs.length; i++){
      if (probs[i] > 1e-9) rows.push({ket: qbits(i, env.q.n), p: probs[i]});
    }
    rows.sort(function(a, b){ return b.p - a.p; });
    push("o-dim", "── 終状態 |ψ⟩ ──");
    for (var r = 0; r < Math.min(rows.length, 8); r++){
      push("o-q", "  |" + rows[r].ket + "⟩  " + (rows[r].p * 100).toFixed(2) + " %");
    }
  }
  push(err ? "o-err" : "o-ok", err ? "⚠ 実行中断" : "✔ 実行完了");
  return {out:out, vars:env.vars, state:env.q, err:err, classes:classes, ops:ops};
}

/* =====================================================================
 * 6. VIM エンジン
 *    モーダル編集の純ロジック。DOM に一切触れません。
