    o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.1);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.16);
  }
  function beep(freq, dur){
    if (!ST.opts.sound) return;
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime, g = ac.createGain(), o = ac.createOscillator();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
    o.type = "square"; o.frequency.value = freq;
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + (dur || 0.1) + 0.02);
  }

  /* ── イベントを 1 件ディスパッチして、対象行を光らせる ── */
  function dispatch(ev){
    var type = ev.type || "signal";
    var mag = (ev.mag === undefined) ? eventMag(type) : ev.mag;
    var line = (ev.line === undefined) ? ST.cur.l : ev.line;
    var sty = eventStyle(type);

    /* バスのログは効果が OFF でも残す (処理そのものは止まらない) */
    busLog.unshift({
      seq: ev.seq || (++ST.seq), type:type, label:sty.label, hue:sty.hue,
      line:line, what:ev.what || ev.key || ev.to || "", t0:performance.now()
    });
    if (busLog.length > 7) busLog.pop();
    busDirty = true;
    rate.push(performance.now());

    if (!ST.opts.flash) return;
    live.push({line:line, type:type, mag:Math.max(0.12, Math.min(1, mag)),
               hue:sty.hue, t0:performance.now()});
    if (live.length > 24) live.shift();
    if (mag >= 0.6) blip(type, mag);
  }
  /* 手動 / 内部発火のショートハンド */
  function flash(line, type, mag){ dispatch({type:type || "signal", line:line, mag:mag}); }
  /* 全画面フラッシュ (T-0 や実行完了のような「大きなイベント」) */
  function blastFlash(mag){
    if (!ST.opts.flash) return;
    blastT0 = performance.now(); blastMag = Math.max(0, Math.min(1, mag === undefined ? 1 : mag));
  }

  /* ── 行の描画 ── */
  function escHtml(s){ return escapeHtml(s); }
  function renderTokens(toks){
    if (!toks.length) return '<span class="t-ws"> </span>';
    var h = "";
    for (var i = 0; i < toks.length; i++){
      h += '<span class="t-' + toks[i].t + '">' + escHtml(toks[i].v) + "</span>";
    }
    return h;
  }
  function rebuild(){
    var N = ST.lines.length, cl = ST.cur.l;
    winLo = Math.max(0, cl - WIN); winHi = Math.min(N - 1, cl + WIN);
    /* ブロックコメント状態を先頭から積み上げる */
    var blk = false;
    for (var i = 0; i < winLo; i++) blk = badaTokenize(ST.lines[i], blk).inBlock;
    var gw = gutterWidth(N), html = [];
    for (var l = winLo; l <= winHi; l++){
      var r = badaTokenize(ST.lines[l], blk); blk = r.inBlock;
      var num = ST.opts.number ? String(l + 1) : "";
      html.push('<div class="ln' + (l === cl ? " cur" : "") + '" data-l="' + l + '">' +
                '<span class="hair"></span>' +
                '<span class="gut" style="width:' + (gw + 0.6) + 'ch">' + num + "</span>" +
                '<span class="code">' + renderTokens(r.toks) + "</span></div>");
    }
    doc.innerHTML = html.join("");
    lineEls = doc.children;
    dirtyDom = false;
  }

  /* ── 1 フレーム ── */
  function styleLines(now){
    var cl = ST.cur.l, o = ST.opts;
    var fo = {depth:o.focus ? o.depth : 0, peak:o.peak, spread:o.spread,
              maxBlur:o.maxBlur, minOpacity:o.minOpacity, maxZ:o.maxZ};
    var count = winHi - winLo + 1, scales = new Array(count), styles = new Array(count), i;
    for (i = 0; i < count; i++){
      styles[i] = focusStyle((winLo + i) - cl, fo);
      scales[i] = styles[i].scale;
    }
    var lay = docLayout(scales, BASE_H);

    /* 行ごとのフラッシュ量 — 同じ行に複数イベントが来たら最も強いものを採る */
    var fx = {};
    for (i = 0; i < live.length; i++){
      var c = live[i], t = (now - c.t0) / FLASH_MS;
      if (t >= 1) continue;
      var ff = flashFrame(t, c.mag);
      var cur = fx[c.line];
      if (!cur || ff.env > cur.env) fx[c.line] = {env:ff.env, glow:ff.glow, wash:ff.wash,
                                                  edge:ff.edge, rise:ff.rise, sweep:ff.sweep, hue:c.hue};
    }

    for (i = 0; i < count; i++){
      var el = lineEls[i]; if (!el) continue;
      var s = styles[i], l = winLo + i;
      var extra = (lay.heights[i] - BASE_H) / 2;
      var f = fx[l];
      var rise = f ? f.rise : 0;
      el.style.marginTop = extra + "px";
      el.style.marginBottom = extra + "px";
      el.style.transform = "translateY(" + (-rise) + "px) translateZ(" + (s.z + rise * 1.6) + "px) scale(" + s.scale + ")";
      /* フラッシュ中の行はぼかさない — 処理対象がはっきり見えるように */
      var blur = f ? s.blur * (1 - f.env) : s.blur;
      el.style.filter = blur > 0.04 ? "blur(" + blur.toFixed(2) + "px)" : "";
      el.style.opacity = (f ? Math.min(1, s.opacity + f.env * 0.9) : s.opacity).toFixed(3);
      if (f && f.env > 0.004){
        el.classList.add("flash");
        el.style.setProperty("--fh", f.hue.toFixed(0));
        el.style.setProperty("--fw", f.wash.toFixed(3));
        el.style.setProperty("--fg", f.glow.toFixed(1) + "px");
        el.style.setProperty("--fe", f.edge.toFixed(2) + "px");
        el.style.setProperty("--fs", f.sweep.toFixed(3));
      } else if (el.classList.contains("flash")){
        el.classList.remove("flash");
        el.style.removeProperty("--fh"); el.style.removeProperty("--fw");
        el.style.removeProperty("--fg"); el.style.removeProperty("--fe");
        el.style.removeProperty("--fs");
      }
    }
    /* カーソル行をステージ中央へ */
    var idx = cl - winLo;
    var offset = (stage.clientHeight / 2) - (lay.centers[idx] || 0);
    doc.style.transform = "translate(" + docX.toFixed(2) + "px," + offset.toFixed(2) + "px)";
    return {lay:lay, styles:styles, offset:offset};
  }

  function placeCaret(){
    var idx = ST.cur.l - winLo, el = lineEls[idx];
    if (!el){ caret.style.opacity = "0"; return null; }
    var code = el.querySelector(".code");
    var sr = stage.getBoundingClientRect();
    var rect = null, cw = 9, chH = BASE_H;
    var walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT, null, false);
    var node = null, off = 0, acc = 0, t;
    while ((t = walker.nextNode())){
      var len = t.nodeValue.length;
      if (acc + len > ST.cur.c){ node = t; off = ST.cur.c - acc; break; }
      acc += len; node = t; off = len;
    }
    try {
      if (node && node.nodeValue.length){
        var rg = document.createRange(), past = false;
        if (off < node.nodeValue.length){ rg.setStart(node, off); rg.setEnd(node, off + 1); }
        else { rg.setStart(node, off - 1); rg.setEnd(node, off); past = true; }
        var r = rg.getBoundingClientRect();
        rect = {left:r.left + (past ? r.width : 0), top:r.top, w:r.width || cw, h:r.height || chH};
      } else {
        var cr = code.getBoundingClientRect();
        rect = {left:cr.left, top:cr.top, w:cr.width || cw, h:cr.height || chH};
      }
    } catch (e){ rect = null; }
    if (!rect){ caret.style.opacity = "0"; return null; }
    var thin = (ST.mode === "insert" || ST.mode === "replace");
    caret.style.left = (rect.left - sr.left) + "px";
    caret.style.top = (rect.top - sr.top) + "px";
    caret.style.width = (thin ? Math.max(2, rect.w * 0.16) : rect.w) + "px";
    caret.style.height = rect.h + "px";
    caret.style.opacity = (ST.mode === "command" || ST.mode === "search") ? "0.35" : "1";
    caret.className = thin ? "ins" : "";

    /* 拡大した行は画面幅をはみ出すので、カーソルが常に見えるよう横に追従する */
    var x = rect.left - sr.left, padL = 44, padR = 90;
    if (x < padL) docX = Math.min(0, docX + (padL - x));
    else if (x + rect.w > sr.width - padR) docX -= (x + rect.w) - (sr.width - padR);
    if (docX > 0) docX = 0;
    return {rect:rect, sr:sr};
  }

  function drawSelection(){
    if (ST.mode !== "visual" && ST.mode !== "vline"){ selLayer.innerHTML = ""; return; }
    var r = visualRange(ST), sr = stage.getBoundingClientRect(), html = "";
    for (var l = r.a.l; l <= r.b.l; l++){
      var el = lineEls[l - winLo]; if (!el) continue;
      var code = el.querySelector(".code");
      var from = (l === r.a.l && !r.linewise) ? r.a.c : 0;
      var to = (l === r.b.l && !r.linewise) ? r.b.c : (ST.lines[l] || "").length;
      var box = charBox(code, from, to) || code.getBoundingClientRect();
      html += '<div class="selbox" style="left:' + (box.left - sr.left) + "px;top:" + (box.top - sr.top) +
              "px;width:" + Math.max(4, box.width) + "px;height:" + box.height + 'px"></div>';
    }
    selLayer.innerHTML = html;
  }
  function charBox(code, from, to){
    if (to <= from) to = from + 1;
    var walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT, null, false);
    var acc = 0, sN = null, sO = 0, eN = null, eO = 0, t;
    while ((t = walker.nextNode())){
      var len = t.nodeValue.length;
      if (!sN && acc + len > from){ sN = t; sO = from - acc; }
      if (acc + len >= to){ eN = t; eO = Math.min(len, to - acc); break; }
      acc += len; eN = t; eO = len;
    }
    if (!sN) return null;
    try {
      var rg = document.createRange();
      rg.setStart(sN, sO); rg.setEnd(eN || sN, eO);
      var b = rg.getBoundingClientRect();
      return b.width ? b : null;
    } catch (e){ return null; }
  }

  /* ── FX キャンバス ──
     左端の「イベントレール」。処理中のイベントが、対象行の高さに
     光点として並び、種別の色で減衰していきます。揺れも破片もありません。 */
  function sizeCanvas(cv){
    var w = stage.clientWidth, h = stage.clientHeight;
    if (cv.width !== Math.round(w * DPR) || cv.height !== Math.round(h * DPR)){
      cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    }
    return {w:w, h:h};
  }
  function drawFx(now){
    var d = sizeCanvas(fx);
    fxc.setTransform(DPR, 0, 0, DPR, 0, 0);
    fxc.clearRect(0, 0, d.w, d.h);

    /* レールの軸 */
    var railX = 5;
    fxc.fillStyle = "rgba(255,255,255,.05)";
    fxc.fillRect(railX - 1, 0, 2, d.h);

    var alive = [], sr = stage.getBoundingClientRect();
    for (var i = 0; i < live.length; i++){
      var c = live[i], t = (now - c.t0) / FLASH_MS;
      if (t >= 1) continue;
      alive.push(c);
      var ff = flashFrame(t, c.mag);
      if (ff.env <= 0.004) continue;

      /* 対象行の画面上の位置 (画面外のイベントも端に寄せて見せる) */
      var el = lineEls[c.line - winLo], y;
      if (el){ var bb = el.getBoundingClientRect(); y = bb.top - sr.top + bb.height / 2; }
      else y = (c.line < winLo) ? 6 : d.h - 6;
      y = Math.max(4, Math.min(d.h - 4, y));

      fxc.save();
      fxc.globalCompositeOperation = "lighter";
      /* 光点 */
      var r = 2.5 + 7 * ff.env;
      var g = fxc.createRadialGradient(railX, y, 0, railX, y, r * 3.2);
      g.addColorStop(0, "hsla(" + c.hue + ",95%,72%," + (ff.env * 0.95).toFixed(3) + ")");
      g.addColorStop(1, "hsla(" + c.hue + ",95%,72%,0)");
      fxc.fillStyle = g;
      fxc.fillRect(railX - r * 3.2, y - r * 3.2, r * 6.4, r * 6.4);
      fxc.fillStyle = "hsla(" + c.hue + ",95%,78%," + Math.min(1, ff.env * 1.4).toFixed(3) + ")";
      fxc.beginPath(); fxc.arc(railX, y, r * 0.55, 0, Math.PI * 2); fxc.fill();
      /* 行へ向かう細い導線 */
      fxc.strokeStyle = "hsla(" + c.hue + ",92%,68%," + (ff.env * 0.35).toFixed(3) + ")";
      fxc.lineWidth = 1;
      fxc.beginPath(); fxc.moveTo(railX, y);
      fxc.lineTo(railX + 26 + 40 * (1 - ff.env), y); fxc.stroke();
      fxc.restore();
    }
    live = alive;

    /* 全画面フラッシュ */
    if (blastMag > 0){
      var bt = (now - blastT0) / 620;
      if (bt >= 1){ blastMag = 0; blast.style.opacity = "0"; }
      else blast.style.opacity = (flashFrame(bt, blastMag).env * 0.55).toFixed(3);
    }
    return alive.length > 0;
  }

  /* ── イベントバス HUD ── */
  function drawBus(now){
    /* スループット: 直近 1 秒のディスパッチ数 */
    while (rate.length && now - rate[0] > 1000) rate.shift();
    if (!ST.opts.bus){
      if (!busEl.classList.contains("hide")){ busEl.classList.add("hide"); meterEl.classList.add("hide"); }
      return;
    }
    busEl.classList.remove("hide"); meterEl.classList.remove("hide");

    if (busDirty){
      var h = "";
      for (var i = 0; i < busLog.length; i++){
        var e = busLog[i];
        h += '<div class="ev" data-t0="' + e.t0 + '" style="--eh:' + e.hue + '">' +
             '<span class="tag">' + e.label + "</span>" +
             '<span class="at">' + (e.line + 1) + "L</span>" +
             '<span class="dt">' + escHtml(String(e.what).slice(0, 18)) + "</span></div>";
      }
      busEl.innerHTML = h;
      busDirty = false;
    }
    /* 処理中のものを光らせる */
    var rows = busEl.children;
    for (var k = 0; k < rows.length; k++){
      var t0 = parseFloat(rows[k].dataset.t0);
      rows[k].classList.toggle("hot", (now - t0) < FLASH_MS * 0.55);
    }
    meterEl.innerHTML = "<b>" + rate.length + "</b> ev/s &nbsp; 総 <b>" + ST.dispatched + "</b>" +
                        "<br>処理中 <b>" + live.length + "</b>";
  }

  /* ── 映画のカウントダウン (アカデミー・リーダー) ── */
  function drawLeader(now){
    if (!CD) return false;
    var d = sizeCanvas(leader);
    var elapsed = (now - CD.t0) / 1000;
    var cs = countdownState(elapsed, CD.total);
    ldc.setTransform(DPR, 0, 0, DPR, 0, 0);
    ldc.clearRect(0, 0, d.w, d.h);

    /* 秒の刻み — 1 秒ごとに TICK イベントをバスへ投入する */
    if (!cs.done && cs.n !== CD.lastTick){
      CD.lastTick = cs.n;
      beep(1000, 0.08);
      ST.dispatched++;
      dispatch({type:"tick", line:ST.cur.l, what:"T-" + cs.n,
                mag:0.45 + (CD.total - cs.n) * 0.07});
    }
    if (cs.done && !CD.zeroDone){
      CD.zeroDone = true; CD.zeroAt = now;
      beep(440, 0.35);
      ST.dispatched++;
      dispatch({type:"tick", line:ST.cur.l, what:"T-0", mag:1});
      blastFlash(1);
      ST.msg = "✨ T-0 — " + (ST.cur.l + 1) + " 行目へ最終ディスパッチ";
      paintStatus();
    }

    var cx = d.w / 2, cy = d.h / 2, R = Math.min(d.w, d.h) * 0.32;
    ldc.save();
    /* 暗幕 */
    ldc.fillStyle = "rgba(3,5,10,0.55)"; ldc.fillRect(0, 0, d.w, d.h);
    /* 掃引ウェッジ */
    if (!cs.done){
      ldc.beginPath(); ldc.moveTo(cx, cy);
      ldc.arc(cx, cy, R * 2.4, -Math.PI / 2, -Math.PI / 2 + cs.sweep);
      ldc.closePath();
      ldc.fillStyle = "rgba(255,255,255,0.055)"; ldc.fill();
    }
    /* 同心円 */
    ldc.strokeStyle = "rgba(232,236,247,0.30)"; ldc.lineWidth = 1.5;
    ldc.beginPath(); ldc.arc(cx, cy, R, 0, Math.PI * 2); ldc.stroke();
    ldc.beginPath(); ldc.arc(cx, cy, R * 1.55, 0, Math.PI * 2); ldc.stroke();
    /* 十字の走査線 */
    ldc.strokeStyle = "rgba(232,236,247,0.22)"; ldc.lineWidth = 1;
    ldc.beginPath(); ldc.moveTo(0, cy); ldc.lineTo(d.w, cy);
    ldc.moveTo(cx, 0); ldc.lineTo(cx, d.h); ldc.stroke();
    /* 指針 */
    if (!cs.done){
      ldc.save(); ldc.translate(cx, cy); ldc.rotate(cs.sweep);
      ldc.strokeStyle = "rgba(255,77,126,0.85)"; ldc.lineWidth = 2.5;
      ldc.beginPath(); ldc.moveTo(0, 0); ldc.lineTo(0, -R * 1.55); ldc.stroke();
      ldc.restore();
    }
    /* 数字 */
    var zt = CD.zeroDone ? (now - CD.zeroAt) / 900 : 0;
    var num = cs.done ? "0" : cs.label;
    var pop = cs.done ? (1 + 0.8 * Math.max(0, 1 - zt)) : (1 + 0.22 * (1 - cs.phase));
    ldc.save();
    ldc.translate(cx, cy); ldc.scale(pop, pop);
    ldc.font = "800 " + Math.round(R * 1.25) + 'px "Cascadia Mono",Consolas,monospace';
    ldc.textAlign = "center"; ldc.textBaseline = "middle";
    ldc.shadowColor = "rgba(90,215,232,0.85)"; ldc.shadowBlur = 40;
    ldc.fillStyle = cs.done ? "#ff4d7e" : "#e8ecf7";
    ldc.globalAlpha = cs.done ? Math.max(0, 1 - zt) : 1;
    ldc.fillText(num, 0, 0);
    ldc.restore();
    /* フィルムグレイン + キズ */
    ldc.globalAlpha = 0.09;
    for (var g = 0; g < 140; g++){
      ldc.fillStyle = Math.random() < 0.5 ? "#fff" : "#000";
      ldc.fillRect(Math.random() * d.w, Math.random() * d.h, 1.6, 1.6);
    }
    if (Math.random() < 0.22){
      ldc.globalAlpha = 0.16; ldc.fillStyle = "#fff";
      var sx = Math.random() * d.w;
      ldc.fillRect(sx, 0, 1, d.h);
    }
    ldc.restore();

    if (CD.zeroDone && (now - CD.zeroAt) > 1000){
      CD = null; leader.style.display = "none"; hud.classList.remove("show");
      return false;
    }
    hudNum.textContent = cs.done ? "0" : cs.label;
    hudLbl.textContent = cs.done ? "IMPACT" : "T-MINUS";
    return true;
  }

  function startCountdown(sec){
    CD = {total:sec, t0:performance.now(), lastTick:-1, zeroDone:false, zeroAt:0};
    leader.style.display = "block"; hud.classList.add("show");
    $("btnCount").classList.add("on");
    audio();
  }

  /* ═══ 文章ビュー (多段落 + 文のブロック) ═══ */
  var paras = [], blocks = [], proseDirty = true;
  var focusBlk = 0, waveT0 = -1, blkH = [];

  /* ブロック 1 つ分の HTML。行の断片ごとに .src を出すので、
     1 つの文が複数行にまたがっても VIM の (行,桁) が保てる。 */
  function renderBlock(blk){
    var html = "";
    for (var i = 0; i < blk.parts.length; i++){
      var pt = blk.parts[i];
      if (pt.sep) html += '<span class="sep">' + escHtml(pt.sep) + "</span>";
      html += '<span class="src" data-l="' + pt.line + '" data-c0="' + pt.c0 + '">' +
              escHtml(pt.text) + "</span>";
    }
    return html || "&#8203;";
  }

  /* 段組の幅を「どアップ倍率から逆算」して決める。
     こうしておくと、いちばん拡大されたブロックでも画面に収まる。 */
  function fitColumn(){
    var sw = stage.clientWidth;
    if (!sw) return;
    var gutter = Math.min(72, Math.max(14, sw * 0.05));
    var avail = sw - gutter * 2;
    var byZoom = Math.floor((sw - 44) / Math.max(1, ST.opts.bpeak));
    page.style.width = Math.max(220, Math.min(avail, byZoom, 620)) + "px";
  }

  function buildProse(){
    fitColumn();
    paras = splitParagraphs(ST.lines);
    blocks = [];
    var html = [], i, k;
    for (i = 0; i < paras.length; i++){
      var pa = paras[i];
      if (pa.kind === "gap"){
        blocks.push({kind:"gap", para:i, parts:[{line:pa.from, c0:0, text:"", sep:""}], first:pa.from});
        html.push('<div class="blk gap" data-b="' + (blocks.length - 1) + '" data-p="' + i + '">' +
                  '<span class="src" data-l="' + pa.from + '" data-c0="0"></span></div>');
        continue;
      }
      var plan = blockPlan(pa.lines);
      var open = '<p class="para" data-p="' + i + '">';
      for (k = 0; k < plan.length; k++){
        var parts = [];
        for (var q = 0; q < plan[k].parts.length; q++){
          var pp = plan[k].parts[q];
          parts.push({line:pa.from + pp.l, c0:pp.c0, text:pp.text, sep:pp.sep});
        }
        var blk = {kind:"text", para:i, parts:parts, first:parts.length ? parts[0].line : pa.from};
        blocks.push(blk);
        open += '<div class="blk" data-b="' + (blocks.length - 1) + '" data-p="' + i + '">' +
                renderBlock(blk) + "</div>";
      }
      html.push(open + "</p>");
    }
    page.innerHTML = html.join("");
    proseDirty = false;
    measureBlocks();
  }

  /* 自然な高さを 1 度だけ測っておく (拡大は transform で行うので、
     この高さは拡大しても変わらない) */
  function measureBlocks(){
    blkH = [];
    var els = page.querySelectorAll(".blk");
    for (var i = 0; i < els.length; i++){
      els[i].style.transform = "";
      blkH.push(els[i].offsetHeight || 1);
    }
  }

  /* 行/桁 -> その桁を含む .src 断片 */
  function proseFrag(l, c){
    var list = page.querySelectorAll('.src[data-l="' + l + '"]');
    if (!list.length) return null;
    for (var i = 0; i < list.length; i++){
      var c0 = parseInt(list[i].dataset.c0 || "0", 10);
      var len = list[i].textContent.length;
      if (c >= c0 && c <= c0 + len) return {el:list[i], c0:c0};
    }
    var last = list[list.length - 1];
    return {el:last, c0:parseInt(last.dataset.c0 || "0", 10)};
  }
  /* 行を含むブロックの添字 */
  function blockOfLine(l, c){
    var f = proseFrag(l, c === undefined ? 0 : c);
    if (!f) return focusBlk;
    var host = f.el.closest(".blk");
    return host ? parseInt(host.dataset.b, 10) : focusBlk;
  }

  /* ═══ どアップ + 波打ち ═══ */
  function setFocusBlock(bi, force){
    if (bi === undefined || bi < 0 || bi >= blocks.length) return;
    if (bi === focusBlk && !force) return;
    focusBlk = bi;
    waveT0 = performance.now();          /* ここから波が伝わる */
  }

  function styleBlocks(now){
    var els = page.querySelectorAll(".blk");
    if (!els.length) return;
    if (blkH.length !== els.length) measureBlocks();

    var t = (waveT0 < 0) ? 1 : (now - waveT0) / WAVE_MS;
    var o = {peak:ST.opts.bpeak, spread:ST.opts.bspread, amp:ST.opts.amp,
             lambda:ST.opts.lambda, omega:ST.opts.omega,
             depth:ST.opts.wave ? 1 : 0};
    var i, scales = [], frames = [];
    for (i = 0; i < els.length; i++){
      var f = waveFrame(i - focusBlk, t, o);
      frames.push(f); scales.push(f.scale);
    }
    var lay = blockLayout(blkH, scales);
    for (i = 0; i < els.length; i++){
      var el = els[i], fr = frames[i];
      el.style.transform = "translate(" + fr.x.toFixed(2) + "px," + (lay.offsets[i] + fr.y).toFixed(2) +
                           "px) scale(" + fr.scale.toFixed(4) + ")";
      var d = Math.abs(i - focusBlk);
      el.classList.toggle("hit", i === focusBlk);
      el.classList.toggle("near", d === 1);
      if (fr.glow > 0.02){
        el.classList.add("wave");
        el.style.setProperty("--wg", (fr.glow * 26).toFixed(1) + "px");
      } else if (el.classList.contains("wave")){
        el.classList.remove("wave");
        el.style.removeProperty("--wg");
      }
    }
    page.classList.toggle("dim", !!ST.opts.dim);
    /* 焦点ブロックを画面の中ほどへ (縦) と、はみ出さない位置へ (横) */
    var hit = els[focusBlk];
    if (hit){
      var hb = hit.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      var want = sr.top + sr.height * 0.42;
      var dy = (hb.top + hb.height / 2) - want;
      if (Math.abs(dy) > 1) pageTop -= dy * 0.18;
      followWide(hit);
      applyPageTop();
    }
  }

  /* ポインタ直下のテキスト位置 */
  function caretPosFromPoint(cx, cy){
    var p, r;
    if (document.caretPositionFromPoint){
      try { p = document.caretPositionFromPoint(cx, cy); } catch (e){ p = null; }
      if (p && p.offsetNode && p.offsetNode.nodeType === 3) return {node:p.offsetNode, offset:p.offset};
    }
    if (document.caretRangeFromPoint){
      try { r = document.caretRangeFromPoint(cx, cy); } catch (e){ r = null; }
      if (r && r.startContainer && r.startContainer.nodeType === 3) return {node:r.startContainer, offset:r.startOffset};
    }
    return null;
  }
  /* 位置 -> {bi, line, col} */
  function locateAt(cx, cy){
    var pos = caretPosFromPoint(cx, cy);
    var span = null, host = null;
    if (pos){
      var el = pos.node.parentElement;
      span = el && el.closest ? el.closest(".src") : null;
    }
    if (!span || !page.contains(span)){
      /* 文字の上でなくても、いちばん近いブロックを拾う */
      var e2 = document.elementFromPoint(cx, cy);
      host = e2 && e2.closest ? e2.closest(".blk") : null;
      if (!host) return null;
      return {bi:parseInt(host.dataset.b, 10), line:blocks[host.dataset.b].first, col:0};
    }
    host = span.closest(".blk");
    var c0 = parseInt(span.dataset.c0 || "0", 10);
    return {
      bi: host ? parseInt(host.dataset.b, 10) : focusBlk,
      line: parseInt(span.dataset.l, 10),
      col: c0 + (pos ? pos.offset : 0)
    };
  }

  /* 文章ビューのカーソル / 選択 */
  function placeCaretProse(){
    var f = proseFrag(ST.cur.l, ST.cur.c);
    if (!f){ caret.style.opacity = "0"; return; }
    var sr = stage.getBoundingClientRect();
    var rel = ST.cur.c - f.c0;
    var box = charBox(f.el, rel, rel + 1);
    if (!box){
      var past = charBox(f.el, Math.max(0, rel - 1), rel);
      if (past) box = {left:past.right, top:past.top, width:past.width, height:past.height};
    }
    if (!box){
      var sb = f.el.getBoundingClientRect();
      box = {left:sb.left, top:sb.top, width:Math.max(6, sb.width || 8), height:sb.height || 20};
    }
    var thin = (ST.mode === "insert" || ST.mode === "replace");
    caret.style.left = (box.left - sr.left) + "px";
    caret.style.top = (box.top - sr.top) + "px";
    caret.style.width = (thin ? Math.max(2, (box.width || 8) * 0.16) : (box.width || 8)) + "px";
    caret.style.height = (box.height || 20) + "px";
    caret.style.opacity = (ST.mode === "command" || ST.mode === "search") ? "0.35" : "1";
    caret.className = thin ? "ins" : "";
  }

  function drawSelectionProse(){
    if (ST.mode !== "visual" && ST.mode !== "vline"){ selLayer.innerHTML = ""; return; }
    var r = visualRange(ST), sr = stage.getBoundingClientRect(), html = "";
    for (var l = r.a.l; l <= r.b.l; l++){
      var list = page.querySelectorAll('.src[data-l="' + l + '"]');
      for (var i = 0; i < list.length; i++){
        var c0 = parseInt(list[i].dataset.c0 || "0", 10), len = list[i].textContent.length;
        var from = (l === r.a.l && !r.linewise) ? r.a.c : 0;
        var to = (l === r.b.l && !r.linewise) ? r.b.c : (ST.lines[l] || "").length;
        var a2 = Math.max(0, from - c0), b2 = Math.min(len, to - c0);
        if (b2 <= a2) continue;
        var box = charBox(list[i], a2, b2) || list[i].getBoundingClientRect();
        html += '<div class="selbox" style="left:' + (box.left - sr.left) + "px;top:" + (box.top - sr.top) +
                "px;width:" + Math.max(4, box.width) + "px;height:" + box.height + 'px"></div>';
      }
    }
    selLayer.innerHTML = html;
  }

  /* イベントフラッシュ — 対象行の断片を光らせる */
  function styleProse(now){
    var fx2 = {}, i;
    for (i = 0; i < live.length; i++){
      var c = live[i], t = (now - c.t0) / FLASH_MS;
      if (t >= 1) continue;
      var ff = flashFrame(t, c.mag);
      var cur = fx2[c.line];
      if (!cur || ff.env > cur.env) fx2[c.line] = {env:ff.env, glow:ff.glow, wash:ff.wash, sweep:ff.sweep, hue:c.hue};
    }
    var lit = page.querySelectorAll(".src.flash");
    for (i = 0; i < lit.length; i++){
      var l0 = parseInt(lit[i].dataset.l, 10);
      if (!fx2[l0] || fx2[l0].env <= 0.004){
        lit[i].classList.remove("flash");
        lit[i].style.removeProperty("--fh"); lit[i].style.removeProperty("--fw");
        lit[i].style.removeProperty("--fg"); lit[i].style.removeProperty("--fs");
      }
    }
    for (var key in fx2){
      var f = fx2[key]; if (f.env <= 0.004) continue;
      var list = page.querySelectorAll('.src[data-l="' + key + '"]');
      for (i = 0; i < list.length; i++){
        list[i].classList.add("flash");
        list[i].style.setProperty("--fh", f.hue.toFixed(0));
        list[i].style.setProperty("--fw", f.wash.toFixed(3));
        list[i].style.setProperty("--fg", f.glow.toFixed(1) + "px");
        list[i].style.setProperty("--fs", f.sweep.toFixed(3));
      }
    }
  }

  var pageTop = 0, pageX = 0;
  function applyPageTop(){
    var maxUp = -(page.scrollHeight - stage.clientHeight * 0.5);
    pageTop = Math.max(maxUp, Math.min(0, pageTop));
    page.style.transform = "translateX(calc(-50% + " + pageX.toFixed(1) + "px)) translateY(" +
                           pageTop.toFixed(1) + "px)";
  }

  /* 拡大したブロックが画面からはみ出さないよう、紙を横にずらす。
     行頭 (transform-origin:0) は必ず見えるほうを優先する。 */
  function followWide(hit){
    if (!hit) return;
    var hb = hit.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    var padL = 18, padR = 26, dx = 0;
    var over = hb.right - (sr.right - padR);
    if (over > 0) dx = -over;
    if (hb.left + dx < sr.left + padL) dx = (sr.left + padL) - hb.left;
    if (Math.abs(dx) > 0.5) pageX += dx * 0.22;
  }

  /* ビューの切り替え */
  function setView(v){
    ST.opts.view = v;
    var prose = (v === "prose");
    page.style.display = prose ? "" : "none";
    doc.style.display = prose ? "none" : "";
    $("btnView").textContent = prose ? "📄 文章" : "💻 コード";
    $("btnView").classList.toggle("on", prose);
    $("btnFocus").disabled = prose;
    if (prose){ proseDirty = true; pageTop = 0; }
    else { page.classList.remove("dim"); }
    dirtyDom = true;
  }

  /* ── メインループ ── */
  function frame(now){
    var prose = ST.opts.view === "prose";
    if (prose){
      if (dirtyDom || proseDirty){
        buildProse(); applyPageTop(); dirtyDom = false;
        /* 組み直すとブロックの番号が変わるので、カーソルから焦点を取り直す
           (編集した直後に焦点が古いブロックに残らないように) */
        setFocusBlock(blockOfLine(ST.cur.l, ST.cur.c));
      }
      styleBlocks(now);
      styleProse(now);
      placeCaretProse();
      drawSelectionProse();
    } else {
      if (dirtyDom) rebuild();
      styleLines(now);
      placeCaret();
      drawSelection();
    }
    drawFx(now);
    drawBus(now);
    var cdBusy = drawLeader(now);
    if (!cdBusy && !CD) $("btnCount").classList.remove("on");

    /* カーソル点滅 (挿入モードのみ) */
    if (ST.mode === "insert" || ST.mode === "replace"){
      if (now - blinkT > 530){ caret.classList.toggle("blink"); blinkT = now; }
    } else caret.classList.remove("blink");

    if (!isTouch) grabInput();
  requestAnimationFrame(frame);
  }

  /* ── ステータスライン ── */
  var MODE_LABEL = {normal:"NORMAL", insert:"INSERT", visual:"VISUAL", vline:"V-LINE",
                    command:"COMMAND", search:"SEARCH", replace:"REPLACE"};
  function paintStatus(){
    var mEl = $("mode");
    mEl.textContent = MODE_LABEL[ST.mode] || ST.mode.toUpperCase();
    mEl.className = "m-" + ST.mode;
    $("fname").textContent = ST.fname + (ST.dirty ? " [+]" : "");
    $("pos").textContent = (ST.cur.l + 1) + ":" + (ST.cur.c + 1) + "  " + ST.lines.length + "L";
    var msgEl = $("msg"), cmdEl = $("cmdline");
    if (ST.mode === "command" || ST.mode === "search"){
      msgEl.textContent = "";
      cmdEl.classList.add("show");
      cmdEl.innerHTML = escHtml(ST.cmdline) + '<span class="cc"> </span>';
    } else {
      cmdEl.classList.remove("show"); cmdEl.textContent = "";
      msgEl.textContent = ST.msg + (ST.pending ? "   " + ST.pending : "");
      msgEl.className = ST.msgErr ? "err" : "";
    }
    $("btnFocus").classList.toggle("on", !!ST.opts.focus);
    $("btnFlash").classList.toggle("on", !!ST.opts.flash);
    $("btnWave").classList.toggle("on", !!ST.opts.wave);
  }

  /* ── 出力パネル ── */
  /* 狭い画面では出力パネルがエディタに重なるため、開閉できるようにする */
  function showSide(on){
    if (on){ side.classList.remove("hide"); side.classList.add("force"); }
    else { side.classList.add("hide"); side.classList.remove("force"); }
    $("btnOut").classList.toggle("on", on);
  }
  function sideOpen(){ return !side.classList.contains("hide"); }
  function printOut(rows, clear, reveal){
    if (clear) out.innerHTML = "";
    var h = "";
    for (var i = 0; i < rows.length; i++){
      h += '<div class="' + (rows[i].cls || "") + '">' + escHtml(rows[i].text) + "</div>";
    }
    out.innerHTML += h;
    out.scrollTop = out.scrollHeight;
    if (reveal) showSide(true);
  }
  function runQuantum(){
    var t0 = performance.now();
    var r;
    try { r = quantumRun(vimText(ST), 0x5EED); }
    catch (e){ r = {out:[{cls:"o-err", text:"内部エラー: " + e.message}], err:e.message}; }
    printOut([{cls:"o-dim", text:"── " + new Date().toLocaleTimeString() + " ──"}], true, true);
    printOut(r.out, false);
    printOut([{cls:"o-dim", text:"(" + (performance.now() - t0).toFixed(1) + " ms)"}], false);
    ST.msg = r.err ? "⚠ " + r.err : "✔ 量子 Bada 実行完了";
    ST.msgErr = !!r.err;
    ST.dispatched++;
    dispatch({type: r.err ? "error" : "run", line:ST.cur.l,
              what: r.err ? "quantum-error" : "quantum-ok"});
    if (!r.err) blastFlash(0.55);
    paintStatus();
  }

  /* ── エンジンイベントの処理 ── */
  /* エンジンが発行したイベントを順にディスパッチする。
     副作用を伴うもの (run / write / open / …) はここでハンドラを呼び、
     それ以外は「処理された」という表示 (フラッシュ + バス) だけを行う。 */
  var SIDE_EFFECT = {countdown:1, run:1, write:1, open:1, quit:1, help:1, opts:1, view:1};
  function drainEvents(){
    for (var i = 0; i < ST.events.length; i++){
      var e = ST.events[i];
      switch (e.type){
        case "countdown": dispatch({type:"tick", line:e.line, what:"T-" + e.seconds}); startCountdown(e.seconds); break;
        case "run":       runQuantum(); break;
        case "write":     dispatch({type:"io", line:e.line, what:"write " + (e.name || "")}); saveFile(e.name); break;
        case "open":      dispatch({type:"io", line:e.line, what:"open"}); fileIn.click(); break;
        case "quit":      dispatch({type:"ex", line:e.line, what:"quit"}); ST.msg = "🎬 カット。(:e で再開 / :demo でデモ)"; break;
        case "help":      dispatch({type:"ex", line:e.line, what:"help"}); showHelp(true); break;
        case "opts":      dirtyDom = true; break;
        case "view":      setView(e.to); dispatch({type:"ex", line:e.line, what:"view " + e.to}); break;
        case "jump":      dispatch({type:"search", line:e.line, what:"jump"}); break;
        default:
          if (!SIDE_EFFECT[e.type]) dispatch(e);
      }
    }
    ST.events.length = 0;
  }

  /* ── ファイル入出力 ── */
  function saveFile(name){
    name = name || ST.fname || "quantum.bada";
    var blob = new Blob([vimText(ST)], {type:"text/plain;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  fileIn.addEventListener("change", function(){
    var f = fileIn.files && fileIn.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      snapshot(ST);
      ST.lines = String(rd.result).replace(/\r\n?/g, "\n").split("\n");
      if (!ST.lines.length) ST.lines = [""];
      ST.cur = {l:0, c:0}; ST.fname = f.name; ST.dirty = false;
      ST.msg = '"' + f.name + '" ' + ST.lines.length + " 行を読み込みました";
      dirtyDom = true; paintStatus(); ST.dispatched++; dispatch({type:"io", line:0, what:"read " + f.name});
    };
    rd.readAsText(f);
    fileIn.value = "";
  });

  /* ── キー入力 ── */
  function keyName(e){
    var k = e.key;
    if (e.ctrlKey || e.metaKey){
      if (k.length === 1) return "<C-" + k.toLowerCase() + ">";
      return null;
    }
    switch (k){
      case "Escape": return "<Esc>";
      case "Enter": return "<CR>";
      case "Backspace": return "<BS>";
      case "Delete": return "<Del>";
      case "Tab": return "<Tab>";
      case " ": return (ST.mode === "insert" || ST.mode === "replace" ||
                        ST.mode === "command" || ST.mode === "search") ? " " : "<Space>";
    }
    if (k.length === 1) return k;
    return null;
  }
  function arrowMove(dx, dy){
    var prev = ST.cur.l;
    if (dy){ ST.cur.l = Math.max(0, Math.min(ST.lines.length - 1, ST.cur.l + dy)); ST.cur.c = Math.min(ST.desired, _maxCol(ST, ST.cur.l)); }
    if (dx){ ST.cur.c = Math.max(0, Math.min(_maxCol(ST, ST.cur.l), ST.cur.c + dx)); ST.desired = ST.cur.c; }
    clampCur(ST);
    if (ST.cur.l !== prev){ ST.dispatched++; dispatch({type:"motion", line:ST.cur.l, what:"arrow"}); }
    after();
  }
  function after(){
    var txt = vimText(ST);
    if (txt !== lastText){ dirtyDom = true; proseDirty = true; }
    else if (ST.cur.l !== lastCurL){ dirtyDom = true; }
    var moved = ST.cur.l !== lastCurL;
    lastText = txt; lastCurL = ST.cur.l;
    drainEvents();
    paintStatus();
    /* 文章ビューでは、カーソルが別のブロックへ入ったら波を起こす */
    if (ST.opts.view === "prose" && !proseDirty){
      var bi = blockOfLine(ST.cur.l, ST.cur.c);
      if (bi !== focusBlk) setFocusBlock(bi);
      else if (moved) setFocusBlock(bi, true);   /* 同じブロック内でも段落移動なら波を出す */
    }
  }
  /* 1 キー = 1 ディスパッチ。feedKey が key / motion / edit / mode を
     すべてイベントとして積むので、ここでは drain するだけでよい。 */
  function send(key){
    feedKey(ST, key);
    after();
  }

  document.addEventListener("keydown", function(e){
    /* IME 変換中のキーは触らない。確定文字は #hidden の input で受け取る */
    if (e.isComposing || e.keyCode === 229) return;
    if (helpEl.classList.contains("show")){
      if (e.key === "Escape" || e.key === "?" || e.key === "q"){ showHelp(false); e.preventDefault(); }
      return;
    }
    if (e.key === "ArrowLeft"){ e.preventDefault(); return arrowMove(-1, 0); }
    if (e.key === "ArrowRight"){ e.preventDefault(); return arrowMove(1, 0); }
    if (e.key === "ArrowUp"){ e.preventDefault(); return arrowMove(0, -1); }
    if (e.key === "ArrowDown"){ e.preventDefault(); return arrowMove(0, 1); }
    if (e.key === "PageUp"){ e.preventDefault(); return arrowMove(0, -20); }
    if (e.key === "PageDown"){ e.preventDefault(); return arrowMove(0, 20); }
    if ((e.ctrlKey || e.metaKey) && ["c", "v", "a", "x"].indexOf(e.key) >= 0 && ST.mode !== "normal") return;
    var k = keyName(e);
    if (k === null) return;
    e.preventDefault();
    audio();                       /* 初回キーで音声コンテキストを解錠 */
    send(k);
  });

  /* IME / ソフトキーボード対策 —
     日本語は keydown では文字が取れない (変換確定は input で届く)。
     隠し input を焦点に置いておき、そこへ入った文字を流し込む。
     keydown 側で処理したキーは preventDefault 済みなので二重に入らない。 */
  hidden.addEventListener("input", function(){
    var v = hidden.value; hidden.value = "";
    for (var i = 0; i < v.length; i++) send(v.charAt(i));
  });
  hidden.addEventListener("compositionend", function(){
    var v = hidden.value; hidden.value = "";
    for (var i = 0; i < v.length; i++) send(v.charAt(i));
  });
  function grabInput(){
    if (helpEl.classList.contains("show")) return;
    try { hidden.focus({preventScroll:true}); } catch (e){ hidden.focus(); }
  }
  /* ボタンを押したあとも入力を取り戻す (押しっぱなしで日本語が打てなくならないように) */
  document.querySelectorAll("header button").forEach(function(btn){
    btn.addEventListener("click", function(){ setTimeout(grabInput, 0); });
  });
  /* ポインタが触れたブロックが焦点になる (拡大鏡は要らない) */
  var hoverRaf = 0;
  stage.addEventListener("pointermove", function(e){
    if (ST.opts.view !== "prose") return;
    if (hoverRaf) return;
    var cx = e.clientX, cy = e.clientY;
    hoverRaf = requestAnimationFrame(function(){
      hoverRaf = 0;
      var loc = locateAt(cx, cy);
      if (loc) setFocusBlock(loc.bi);
    });
  }, {passive:true});

  /* ホイール: そのままスクロール、Ctrl + ホイールでどアップの倍率 */
  stage.addEventListener("wheel", function(e){
    if (ST.opts.view !== "prose") return;
    if (e.ctrlKey){
      e.preventDefault();
      ST.opts.bpeak = peakStep(ST.opts.bpeak, e.deltaY < 0 ? 1 : -1);
      ST.msg = "🌊 どアップ " + ST.opts.bpeak + "×";
      proseDirty = true;              /* 幅を倍率に合わせて組み直す */
      setFocusBlock(focusBlk, true);
      paintStatus();
    } else {
      pageTop -= e.deltaY; applyPageTop();
    }
  }, {passive:false});

  stage.addEventListener("pointerdown", function(e){
    if (ST.opts.view === "prose"){
      var loc = locateAt(e.clientX, e.clientY);
      if (loc){
        ST.cur.l = loc.line;
        ST.cur.c = Math.min(loc.col, Math.max(0, (ST.lines[loc.line] || "").length - 1));
        ST.desired = ST.cur.c; clampCur(ST);
        setFocusBlock(loc.bi, true);
        ST.dispatched++; dispatch({type:"motion", line:loc.line, what:"point"});
        after();
      }
      grabInput();
      return;
    }
    /* タップした行へカーソルを移動 (どアップの焦点が移る) */
    var el = e.target.closest ? e.target.closest(".ln") : null;
    if (el && el.dataset && el.dataset.l !== undefined){
      var l = parseInt(el.dataset.l, 10);
      if (l !== ST.cur.l){
        ST.cur.l = l; ST.cur.c = Math.min(ST.desired, _maxCol(ST, l));
        clampCur(ST); ST.dispatched++; dispatch({type:"motion", line:l, what:"tap"}); after();
      } else {
        ST.dispatched++; dispatch({type:"signal", line:l, what:"tap"}); after();
      }
    }
    grabInput();
  });

  /* ── タッチ用キーバー ── */
  var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
  var KEYS = [
    ["Esc", "<Esc>"], ["i", "i"], ["a", "a"], ["o", "o"], ["：", ":"], ["/", "/"],
    ["h", "h"], ["j", "j"], ["k", "k"], ["l", "l"], ["w", "w"], ["b", "b"],
    ["0", "0"], ["$", "$"], ["gg", "gg"], ["G", "G"], ["x", "x"], ["dd", "dd"],
    ["yy", "yy"], ["p", "p"], ["u", "u"], ["✨", "<Space>"], ["⏎", "<CR>"], ["⌫", "<BS>"]
  ];
  function buildKeys(){
    var h = "";
    for (var i = 0; i < KEYS.length; i++){
      h += '<button data-k="' + KEYS[i][1].replace(/"/g, "&quot;") + '">' + KEYS[i][0] + "</button>";
    }
    h += '<button data-k="__kbd">⌨</button>';
    keysBar.innerHTML = h;
    keysBar.addEventListener("click", function(e){
      var b = e.target.closest("button"); if (!b) return;
      var k = b.dataset.k;
      if (k === "__kbd"){ hidden.focus(); return; }
      if (k.length > 1 && k.charAt(0) !== "<"){
        for (var i = 0; i < k.length; i++) send(k.charAt(i));
      } else send(k);
    });
    if (isTouch) keysBar.classList.add("show");
  }

  /* ── ヘルプ ── */
  var HELP_ROWS = [
    ["§", "モード"],
    ["i a I A o O", "挿入モードへ (o / O は EDIT イベントを発行)"],
    ["v  V", "ビジュアル / ビジュアル行"],
    ["R", "置換モード"],
    ["Esc", "ノーマルモードへ戻る"],
    ["§", "移動"],
    ["h j k l", "左 下 上 右 (矢印キーも可)"],
    ["w W b B e E", "単語単位の前後移動"],
    ["0 ^ $", "行頭 / 最初の非空白 / 行末"],
    ["gg  G  42G", "先頭 / 末尾 / 42 行目"],
    ["{ }", "段落 (空行) 単位で移動"],
    ["%", "対応する括弧へジャンプ"],
    ["f x  t x  F x  T x", "行内で文字 x を検索 ( ; , で繰り返し)"],
    ["/pat  ?pat  n  N", "検索 (JavaScript 正規表現)"],
    ["Ctrl-D Ctrl-U", "半画面 下 / 上"],
    ["§", "編集"],
    ["x X  r c", "一文字削除 / 一文字置換"],
    ["d{motion}  dd  D", "削除 (3dd, dw, d$ など)"],
    ["c{motion}  cc  C", "変更して挿入モードへ"],
    ["y{motion}  yy  Y  p P", "ヤンクと貼り付け"],
    [">> <<", "インデント / アンインデント"],
    ["J  ~", "行連結 / 大小文字反転"],
    ['"a yy   "a p', "名前付きレジスタ"],
    ["u  Ctrl-R  .", "取り消し / やり直し / 直前の変更を繰り返し"],
    ["§", "🌊 どアップと波打ち (文章ビュー)"],
    ["ポインタを動かす", "触れた文章のブロックがその場でどアップになる"],
    ["j k で移動", "次のブロックへ焦点が移り、そこから波が伝わる"],
    ["} {", "段落を移動。波は段落をまたいで同じように広がる"],
    ["クリック / タップ", "そこへカーソルを移して波を起こす"],
    ["Ctrl + ホイール", "どアップの倍率 (1.25× 〜 3.8×)。段組の幅も組み直される"],
    ["ホイール", "文章をスクロール"],
    [":wave", "どアップと波打ちの ON / OFF"],
    [":prose  :code", "文章ビュー (文のブロック) / コードビュー (等幅)"],
    [":set bpeak=2.4", "どアップの最大倍率"],
    [":set bspread=2", "どアップが及ぶ範囲 (ブロック数)"],
    [":set amp=30", "波の大きさ (px)"],
    [":set lambda=4", "波が届く距離 (ブロック数)"],
    [":set omega=5", "波の速さ"],
    [":set nodim", "まわりのブロックを暗くしない"],
    ["§", "🎬 シネマ演出 / ✨ イベント処理"],
    ["Space", "現在行へ SIGNAL イベントをディスパッチ"],
    ["行をタップ / クリック", "その行へ焦点を移して MOTION イベント"],
    [":focus", "コードビューのどアップ (被写界深度) の ON / OFF"],
    [":flash", "イベント処理フラッシュの ON / OFF"],
    [":bus", "イベントバス HUD の表示切替"],
    [":emit [名前]", "現在行へ手動で SIGNAL を発行"],
    [":countdown 5", "映画のカウントダウン (毎秒 TICK、T-0 で全画面フラッシュ)"],
    ["イベント種別", "KEY / MOTION / EDIT / MODE / EX / SEARCH / SIGNAL / TICK / RUN / IO / ERROR"],
    [":set peak=3.2", "どアップの最大倍率 (既定 2.6)"],
    [":set spread=1.4", "焦点の狭さ = 被写界深度 (既定 2.2)"],
    [":set maxBlur=5", "背景のぼかし量 (既定 3.2)"],
    [":set nosound", "効果音を切る"],
    ["§", "⚛ 量子 Bada"],
    [":run", "バッファを量子 Bada として実行"],
    ["qubit q[3];", "量子レジスタの確保"],
    ["H q[0];  X  Y  Z  S  T", "1 量子ビットゲート"],
    ["CNOT q[0], q[1];", "もつれ (CZ / SWAP も可)"],
    ["RX q[0], 1.57;", "回転ゲート (RY / RZ)"],
    ["let s = measure q;", "観測して collapse"],
    ["let z = 4.0 <- 2.0;", "非可換左作用 π(χ,x)"],
    ["let a = 2.0 -< 12.0;", "多様体積分 ∬1/(x·log x)²"],
    ["let g = 1.0 >- 0.5;", "量子作用素右作用 ⊕(iℏ∇)^⊕L"],
    ["print beta(2,3);", "β(p,q) = Γ(p)Γ(q)/Γ(p+q)"],
    ["§", "ファイル"],
    [":w [name]  :wq  :q  :q!", "保存 / 保存して終了 / 終了"],
    [":e", "ファイルを開く"],
    [":demo  :new", "デモを読み込む / 新規バッファ"],
    [":%s/pat/rep/g", "全体置換 (:3,9s/// で範囲指定)"],
    [":set number / :set nonumber", "行番号"],
    [":help", "このヘルプ (Esc で閉じる)"]
  ];
  function showHelp(on){
    if (on){
      var h = '<button class="tb close" id="helpClose">✕ 閉じる (Esc)</button>' +
              '<h3 style="margin-top:0">Bada CineVim — キーバインド</h3><table>';
      for (var i = 0; i < HELP_ROWS.length; i++){
        if (HELP_ROWS[i][0] === "§"){ h += '<tr><td colspan="2"><h3>' + HELP_ROWS[i][1] + "</h3></td></tr>"; continue; }
        h += "<tr><td>" + escHtml(HELP_ROWS[i][0]) + "</td><td>" + escHtml(HELP_ROWS[i][1]) + "</td></tr>";
      }
      h += "</table>";
      helpEl.querySelector(".inner").innerHTML = h;
      helpEl.classList.add("show");
      helpEl.querySelector("#helpClose").onclick = function(){ showHelp(false); };
    } else helpEl.classList.remove("show");
  }

  /* ── ツールバー ── */
  $("btnFocus").onclick = function(){ ST.opts.focus = !ST.opts.focus; ST.msg = "シネマフォーカス: " + (ST.opts.focus ? "ON" : "OFF"); paintStatus(); };
  $("btnFlash").onclick = function(){
    ST.opts.flash = !ST.opts.flash;
    ST.msg = "イベントフラッシュ: " + (ST.opts.flash ? "ON" : "OFF");
    paintStatus();
    if (ST.opts.flash) dispatch({type:"mode", line:ST.cur.l, what:"flash on"});
  };
  $("btnCount").onclick = function(){ audio(); startCountdown(5); ST.msg = "⏱ T-5 カウントダウン開始"; paintStatus(); };
  $("btnRun").onclick = function(){ runQuantum(); };
  $("btnOpen").onclick = function(){ fileIn.click(); };
  $("btnSave").onclick = function(){ saveFile(ST.fname); ST.dirty = false; paintStatus(); };
  $("btnHelp").onclick = function(){ showHelp(!helpEl.classList.contains("show")); };
  $("btnOut").onclick = function(){ showSide(!sideOpen()); };
  $("btnWave").onclick = function(){
    ST.opts.wave = !ST.opts.wave;
    $("btnWave").classList.toggle("on", ST.opts.wave);
    ST.msg = "🌊 どアップと波打ち: " + (ST.opts.wave ? "ON" : "OFF");
    setFocusBlock(focusBlk, true);
    paintStatus();
  };
  $("btnView").onclick = function(){ setView(ST.opts.view === "prose" ? "code" : "prose"); paintStatus(); };
  $("sideClose").onclick = function(){ showSide(false); };
  window.addEventListener("resize", function(){
    docX = 0; pageX = 0; dirtyDom = true; proseDirty = true; fitOpts();
  });

  /* ── 画面幅に応じた演出量 ── */
  function fitOpts(){
    var w = window.innerWidth;
    if (w < 560){
      ST.opts.peak = 1.75; ST.opts.spread = 2.6; ST.opts.maxZ = 16;
      ST.opts.bpeak = 1.25; ST.opts.amp = 12;   /* 電話ではどアップも波も控えめに */
    } else if (w < 900){
      ST.opts.peak = 2.1; ST.opts.spread = 2.4; ST.opts.maxZ = 20;
      ST.opts.bpeak = 1.45; ST.opts.amp = 17;
    }
    BASE_H = w < 560 ? 26 : 30;
    document.documentElement.style.setProperty("--base-h", BASE_H + "px");
    document.documentElement.style.setProperty("--prose-size", (w < 560 ? 17 : 19) + "px");
  }

  /* ── 起動 ── */
  fitOpts();
  buildKeys();
  setView(ST.opts.view);
  lastText = vimText(ST); lastCurL = ST.cur.l;
  ST.msg = "ポイントした文章がどアップ ・ 動かすと波打つ ・ Ctrl+ホイールで倍率 ・ :help";
  dirtyDom = true;
  paintStatus();
  printOut([
    {cls:"o-dim", text:"Bada CineVim — 文章ビュー (文のブロック + どアップと波打ち)"},
    {cls:"o-key", text:"▶ 実行 または :run でバッファを実行します"},
    {cls:"o-dim", text:"⏱ カウントダウン または :countdown 5 で映画の秒読み (毎秒 TICK イベント)"}
  ], true, false);
  requestAnimationFrame(frame);
  setTimeout(function(){ dispatch({type:"io", line:0, what:"buffer ready"}); }, 420);
}

if (typeof window !== "undefined" && !window.__ENGINE_TEST__) boot();
</script>
