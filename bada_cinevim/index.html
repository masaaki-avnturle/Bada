<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bada CineVim — 映画カウントダウンの VIM エディタ</title>
<!--
  Bada CineVim — 量子プログラミング言語 Bada 用の映画的 VIM エディタ
  (依存ゼロ・単一 HTML・オフライン動作)

  ・本物のモーダル編集 (ノーマル / 挿入 / ビジュアル / ビジュアル行 /
    コマンドライン / 置換) — hjkl w b e 0 ^ $ gg G { } % f t F T、
    オペレータ d c y > <、カウント、レジスタ、u / Ctrl-R、. リピート、
    / 検索、:%s/// 置換、:w :q :set などの Ex コマンド
  ・Bada 言語シンタックスハイライト (<- / -< / >- / Ω:: / qubit / gate …)
  ・📄 多段落の文章ビュー — 空行で段落に分け、折り返して組む。内側は
    行のままなので VIM のモーションもオペレータもそのまま効く
  ・🌊 ブロックのどアップと波打ち — 文章を文のブロックに分け、ポイント
    されたブロックが「その場で」拡大される (拡大鏡は要らない)。
    焦点が移ると、そこから外へ進行波が伝わって文章が波打ち、波の腹が
    フラッシュする。段落をまたいでも波は伝わる
  ・🎬 シネマフォーカス (コードビュー) — カーソル行を「どアップ」に拡大し、
    離れた行ほどガウス減衰で縮小・ぼかし・減光する被写界深度表現
  ・✨ イベント処理のフラッシュ効果 — すべての操作をイベントとして
    イベントバスに投入し、ディスパッチされた瞬間にその行が発光する。
    種別ごとに色が変わり (KEY / MOTION / EDIT / MODE / EX / SEARCH /
    TICK / RUN / IO / ERROR)、処理の光が行を左から右へ走り抜ける
  ・⏱ 映画のカウントダウン — アカデミー・リーダー (5→4→3→2→1) の
    スイープ + 走査線 + フィルムグレイン。秒ごとに TICK イベント、
    T-0 で全画面フラッシュ
  ・⚛ 量子 Bada 実行系 — 状態ベクトルシミュレータ (H X Y Z S T CNOT
    CZ SWAP / measure)、β(p,q)・Γ(s) の実装、<- -< >- の数値意味論
-->
<style>
  :root{
    --bg:#05070c; --panel:#0c111c; --panel2:#111827; --line:#1e2740;
    --tx:#e6ecf7; --tx2:#7f8aa3; --gold:#e8c76a; --cyan:#5ad7e8;
    --mag:#ff4d7e; --ok:#5fd68a; --err:#ff6b6b; --amber:#ffb454;
    --base-h:30px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(1200px 700px at 50% 38%, #101a2c 0%, #05070c 68%),
      var(--bg);
    color:var(--tx);
    font-family:"Segoe UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  /* ── ヘッダ ── */
  header{
    flex:0 0 auto; padding:9px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:linear-gradient(180deg,#0d1421,#080c15); z-index:40;
  }
  header h1{ margin:0; font-size:16px; letter-spacing:1.2px; white-space:nowrap; }
  header h1 .gold{ color:var(--gold); }
  header h1 .cy{ color:var(--cyan); }
  header .sub{ color:var(--tx2); font-size:11.5px; }
  .spacer{ flex:1 1 auto; }
  button.tb{
    background:var(--panel2); color:var(--tx); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; font-size:12.5px; cursor:pointer;
    font-family:inherit; white-space:nowrap;
  }
  button.tb:hover{ border-color:var(--cyan); color:#fff; }
  button.tb.on{ border-color:var(--gold); color:var(--gold); box-shadow:0 0 12px rgba(232,199,106,.22) inset; }
  button.tb:active{ transform:translateY(1px); }

  /* ── ステージ (どアップの舞台) ── */
  /* position:relative — 狭い画面で重ねる出力パネル (#side.force) を
     ヘッダの下、この領域の中だけに収めるための基準にする */
  #wrap{ flex:1 1 auto; display:flex; min-height:0; position:relative; }
  #stage{
    flex:1 1 auto; position:relative; overflow:hidden;
    perspective:1000px; perspective-origin:50% 50%;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.017) 0 1px, transparent 1px 3px),
      radial-gradient(900px 520px at 50% 50%, rgba(90,215,232,.07), transparent 70%);
  }
  /* ビネット (映画的な周辺減光) */
  #stage::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:12;
    background:radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,.62) 100%);
  }
  /* かつて画面を揺らしていたレイヤ。フラッシュ方式では揺らさず、
     行レイヤとイベント表示の重ね合わせの基準としてのみ使う */
  #layers{ position:absolute; inset:0; }
  #doc{
    position:absolute; left:0; right:0; top:0;
    /* flex-column にするのは見た目のためではなく、隣接する .ln の上下
       マージンが相殺(margin collapsing)されるのを防ぐため。相殺されると
       docLayout() が計算した占有高さ (baseH × scale) と実レイアウトがずれ、
       どアップの行が中央からずれて重なる。 */
    display:flex; flex-direction:column;
    transform-style:preserve-3d; will-change:transform;
    font-family:"Cascadia Mono","Consolas","SF Mono","Noto Sans Mono CJK JP","DejaVu Sans Mono",monospace;
    font-size:17px; line-height:var(--base-h);
    padding:0 clamp(10px,4vw,64px);
  }
  .ln{
    display:flex; align-items:center; height:var(--base-h);
    transform-origin:8% 50%; will-change:transform,filter,opacity;
    white-space:pre; position:relative;
  }
  .ln .gut{
    flex:0 0 auto; width:3.6ch; text-align:right; margin-right:1.2ch;
    color:#3b4763; font-size:.82em; user-select:none;
  }
  .ln.cur .gut{ color:var(--gold); }
  .ln .code{ flex:0 1 auto; position:relative; }
  .ln.cur .code{ text-shadow:0 0 22px rgba(90,215,232,.30); }

  /* ── イベント処理フラッシュ ──
     ディスパッチされた行が発光する。--fh が種別の色相、--fw が発光量、
     --fg が文字のにじみ、--fe が左端マーカーの太さ、--fs が
     「処理の光」が行を走る位置 (0→1)。すべて JS が 1 フレームごとに更新。 */
  .ln.flash .code{
    text-shadow:0 0 calc(var(--fg,0px)) hsla(var(--fh,200),95%,72%,.85);
  }
  .ln.flash .code::before{
    content:""; position:absolute; inset:-3px -10px; border-radius:4px;
    pointer-events:none; z-index:-1;
    background:
      /* 処理の光: 行を左から右へ走る */
      linear-gradient(90deg,
        transparent calc(var(--fs,0) * 100% - 16%),
        hsla(var(--fh,200),98%,76%,calc(var(--fw,0) * 0.9)) calc(var(--fs,0) * 100%),
        transparent calc(var(--fs,0) * 100% + 16%)),
      /* ディスパッチ中の行の下地 */
      linear-gradient(90deg,
        hsla(var(--fh,200),90%,60%,calc(var(--fw,0) * 0.55)),
        hsla(var(--fh,200),90%,60%,0) 88%);
  }
  /* 左端のイベントマーカー */
  .ln.flash::before{
    content:""; position:absolute; left:-2px; top:8%; bottom:8%;
    width:var(--fe,0px); border-radius:2px;
    background:hsl(var(--fh,200),95%,66%);
    box-shadow:0 0 calc(var(--fe,0px) * 3) hsla(var(--fh,200),95%,66%,.9);
  }
  .ln .hair{
    position:absolute; left:-1.4ch; right:-1.2ch; top:50%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,199,106,.55),transparent);
    opacity:0; pointer-events:none;
  }
  .ln.cur .hair{ opacity:.5; }

  /* ── 多段落の文章ビュー ──
     行ではなく段落として流し込み、ブラウザに折り返させる。
     各行は .src として残るので、VIM の (行, 桁) はそのまま使える。 */
  #page{
    position:absolute; left:50%; top:0; transform:translateX(-50%);
    width:min(54ch, calc(100% - 2 * clamp(14px,5vw,72px)));  /* JS が fitColumn() で上書きする */
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Georgia",serif;
    font-size:var(--prose-size,19px); line-height:2.0;
    color:#c3cde0; letter-spacing:.02em; text-align:justify;
    padding:calc(50vh - 3em) 0 60vh;
  }
  #page.mono{
    font-family:"Cascadia Mono","Consolas","Noto Sans Mono CJK JP",monospace;
    line-height:1.9; text-align:left; letter-spacing:0;
  }
  .para{ margin:0 0 1.55em; text-indent:1em; }
  .para:first-child{ text-indent:0; }
  .gap{ height:.5em; }
  .src{ white-space:pre-wrap; }

  /* ── 文章のブロック ──
     文ごとにブロックへ分ける。ポイントされたブロックはその場で拡大され
     (どアップ)、移動すると焦点から外へ波が伝わる。上下が重ならないよう、
     ずらし量は blockLayout() が求める (マージンは動かさないので、
     毎フレームのレイアウト再計算が起きない)。 */
  .blk{
    display:block; transform-origin:0 50%;   /* 行頭を動かさずに拡大する */
    will-change:transform, filter, opacity;
  }
  .blk .src{ white-space:pre-wrap; }
  /* 焦点から離れたブロックは静かに退く */
  #page.dim .blk{ opacity:.38; }
  #page.dim .blk.near{ opacity:.66; }
  #page.dim .blk.hit{ opacity:1; }
  /* 波の腹で光る (フラッシュ効果) */
  .blk.wave .src{
    color:#f2f7ff;
    text-shadow:0 0 calc(var(--wg,0px)) rgba(120,220,255,.85);
  }
  /* ポイントされたブロック */
  .blk.hit .src{ color:#eef4ff; }
  .blk.hit{
    background:linear-gradient(90deg,
      rgba(90,215,232,.10), rgba(90,215,232,.03) 72%, transparent);
    border-radius:4px;
    box-shadow:-3px 0 0 0 rgba(232,199,106,.8);
  }

  /* シンタックス */
  .t-kw{ color:#ff8fb0; font-weight:600; }
  .t-op{ color:var(--gold); font-weight:700; }
  .t-qop{ color:#ff4d7e; font-weight:700; text-shadow:0 0 10px rgba(255,77,126,.45); }
  .t-num{ color:#9ae6a0; }
  .t-str{ color:#e8c76a; }
  .t-com{ color:#4d5a75; font-style:italic; }
  .t-fn{ color:var(--cyan); }
  .t-ns{ color:#c792ea; font-weight:700; }
  .t-ket{ color:#7ee0ff; text-shadow:0 0 12px rgba(126,224,255,.55); }
  .t-id{ color:var(--tx); }
  .t-punct{ color:#8d99b5; }
  .t-ws{ color:inherit; }
  .t-match{ background:rgba(232,199,106,.22); border-radius:2px; }

  /* カーソル */
  #caret{
    position:absolute; z-index:14; pointer-events:none;
    background:var(--gold); mix-blend-mode:screen; border-radius:1px;
    box-shadow:0 0 18px rgba(232,199,106,.8);
    transition:opacity .08s linear;
  }
  #caret.ins{ background:var(--cyan); box-shadow:0 0 18px rgba(90,215,232,.9); }
  #caret.blink{ opacity:.18; }

  /* 選択 */
  #selLayer{ position:absolute; inset:0; z-index:8; pointer-events:none; }
  .selbox{ position:absolute; background:rgba(90,215,232,.18); border-radius:2px; }

  /* FX / リーダー キャンバス */
  #fx,#leader{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #fx{ z-index:13; }
  #leader{ z-index:30; display:none; }

  /* 出力パネル */
  #side{
    flex:0 0 340px; min-width:0; border-left:1px solid var(--line);
    background:linear-gradient(180deg,#0a0f1a,#070a12);
    display:flex; flex-direction:column; z-index:20;
  }
  #side.hide{ display:none !important; }
  #side h2{
    margin:0; padding:7px 8px 7px 12px; font-size:12px; letter-spacing:1px;
    color:var(--tx2); border-bottom:1px solid var(--line); text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  #sideClose{
    margin-left:auto; background:transparent; color:var(--tx2); border:1px solid var(--line);
    border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #sideClose:hover{ color:var(--err); border-color:var(--err); }
  #out{
    flex:1 1 auto; overflow:auto; padding:10px 12px; font-size:12.5px;
    font-family:"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
    white-space:pre-wrap; word-break:break-word; line-height:1.65;
  }
  #out .o-ok{ color:var(--ok); }
  #out .o-err{ color:var(--err); }
  #out .o-dim{ color:var(--tx2); }
  #out .o-key{ color:var(--gold); }
  #out .o-q{ color:var(--cyan); }
  #out .bar{ display:inline-block; height:7px; background:linear-gradient(90deg,var(--cyan),var(--mag)); border-radius:3px; vertical-align:middle; }

  /* ステータスライン */
  #status{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:5px 12px; border-top:1px solid var(--line);
    background:#0a0f1a; font-size:12.5px; z-index:40;
    font-family:"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
  }
  #mode{
    padding:2px 10px; border-radius:5px; font-weight:800; letter-spacing:1.5px;
    background:var(--gold); color:#12161f; font-size:11.5px;
  }
  #mode.m-insert{ background:var(--ok); }
  #mode.m-visual,#mode.m-vline{ background:var(--mag); color:#fff; }
  #mode.m-command,#mode.m-search{ background:var(--cyan); color:#0a1016; }
  #mode.m-replace{ background:var(--amber); color:#12161f; }
  #fname{ color:var(--tx2); }
  #msg{ flex:1 1 auto; color:var(--cyan); white-space:pre; overflow:hidden; text-overflow:ellipsis; }
  #msg.err{ color:var(--err); }
  #pos{ color:var(--tx2); white-space:nowrap; }
  #cmdline{
    display:none; flex:1 1 auto; color:var(--tx); white-space:pre;
  }
  #cmdline.show{ display:block; }
  #cmdline .cc{ background:var(--gold); color:#12161f; }

  /* タッチ用キーバー (APK / タブレット) */
  #keys{
    flex:0 0 auto; display:none; gap:5px; padding:6px 7px; overflow-x:auto;
    border-top:1px solid var(--line); background:#080c15; z-index:40;
  }
  #keys.show{ display:flex; }
  #keys button{
    flex:0 0 auto; min-width:40px; padding:9px 9px; font-size:13px;
    background:#141c2c; color:var(--tx); border:1px solid var(--line);
    border-radius:7px; font-family:"Consolas",monospace; cursor:pointer;
  }
  #keys button:active{ background:var(--gold); color:#12161f; }
  #hidden{
    position:absolute; opacity:0; width:1px; height:1px; left:-9999px; top:0;
    border:0; padding:0;
  }

  /* ── イベントバス HUD ──
     ディスパッチされたイベントが新しい順に並び、処理された瞬間に光る */
  #bus{
    position:absolute; left:10px; bottom:10px; z-index:32; pointer-events:none;
    display:flex; flex-direction:column-reverse; gap:3px; max-width:min(52vw,420px);
    font-family:"Cascadia Mono","Consolas",monospace; font-size:11px;
  }
  #bus.hide{ display:none; }
  #bus .ev{
    display:flex; align-items:center; gap:7px; padding:2px 8px 2px 5px;
    border-radius:5px; white-space:nowrap; overflow:hidden;
    background:rgba(10,15,26,.72); border:1px solid rgba(255,255,255,.07);
    border-left:3px solid hsl(var(--eh,200),90%,62%);
    color:var(--tx2);
  }
  #bus .ev .tag{
    color:hsl(var(--eh,200),95%,72%); font-weight:700; letter-spacing:.6px;
    min-width:6.2em;
  }
  #bus .ev .at{ color:#59657f; min-width:4.5em; }
  #bus .ev .dt{ color:#59657f; }
  #bus .ev.hot{
    background:hsla(var(--eh,200),70%,26%,.85);
    border-color:hsl(var(--eh,200),90%,62%);
    color:#eaf2ff;
    box-shadow:0 0 16px hsla(var(--eh,200),90%,60%,.45);
  }
  /* ディスパッチ統計 */
  #meter{
    position:absolute; right:14px; bottom:10px; z-index:32; pointer-events:none;
    font-family:"Cascadia Mono","Consolas",monospace; font-size:11px;
    color:var(--tx2); text-align:right; line-height:1.5;
  }
  #meter.hide{ display:none; }
  #meter b{ color:var(--cyan); font-weight:700; }

  /* 全画面フラッシュ (T-0 / :run の完了など) */
  #blast{
    position:absolute; inset:0; z-index:33; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.92), rgba(160,230,255,.35) 45%, transparent 72%);
  }

  /* カウントダウン HUD */
  #hud{
    position:absolute; right:14px; top:12px; z-index:31; text-align:right;
    font-family:"Cascadia Mono","Consolas",monospace; pointer-events:none;
    display:none;
  }
  #hud.show{ display:block; }
  #hudNum{ font-size:44px; font-weight:800; color:var(--mag); text-shadow:0 0 26px rgba(255,77,126,.7); line-height:1; }
  #hudLbl{ font-size:11px; letter-spacing:3px; color:var(--tx2); }

  /* ヘルプ オーバーレイ */
  #help{
    position:absolute; inset:0; z-index:50; display:none;
    background:rgba(3,5,10,.93); padding:18px; overflow:auto;
  }
  #help.show{ display:block; }
  #help .inner{ max-width:860px; margin:0 auto; }
  #help h3{ color:var(--gold); margin:16px 0 6px; font-size:14px; }
  #help table{ border-collapse:collapse; width:100%; font-size:12.5px; }
  #help td{ padding:3px 8px; border-bottom:1px solid #131a2a; vertical-align:top; }
  #help td:first-child{
    color:var(--cyan); white-space:nowrap; width:170px;
    font-family:"Cascadia Mono","Consolas",monospace;
  }
  #help .close{ float:right; }

  @media (max-width:900px){
    #side{ display:none; }
    #side.force{ display:flex; position:absolute; right:0; top:0; bottom:0; width:min(88vw,340px); }
    header h1 .sub{ display:none; }
    #doc{ font-size:15px; }
  }
  @media (prefers-reduced-motion:reduce){
    .ln{ transition:none !important; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="gold">Bada</span> <span class="cy">CineVim</span></h1>
  <span class="sub">量子言語 Bada の映画的 VIM エディタ</span>
  <span class="spacer"></span>
  <button class="tb on" id="btnWave" title="ブロックのどアップと波打ち (:wave)">🌊 波どアップ</button>
  <button class="tb" id="btnView" title="文章ビュー / コードビュー (:prose / :code)">📄 文章</button>
  <button class="tb" id="btnFocus" title="コードビューのどアップ (:focus)">🎬 シネマ</button>
  <button class="tb on" id="btnFlash" title="イベント処理のフラッシュ効果 (:flash)">✨ フラッシュ</button>
  <button class="tb" id="btnCount" title="映画のカウントダウン (:countdown 5)">⏱ カウントダウン</button>
  <button class="tb" id="btnRun" title="量子 Bada を実行 (:run)">▶ 実行</button>
  <button class="tb on" id="btnOut" title="量子 Bada 出力パネルの表示切替">⚛ 出力</button>
  <button class="tb" id="btnOpen" title="ファイルを開く (:e)">📂 開く</button>
  <button class="tb" id="btnSave" title="保存 (:w)">💾 保存</button>
  <button class="tb" id="btnHelp" title="キーバインド一覧 (:help)">？</button>
</header>

<div id="wrap">
  <div id="stage">
    <div id="layers">
      <div id="selLayer"></div>
      <div id="doc"></div>
      <div id="page"></div>
      <div id="caret"></div>
    </div>
    <canvas id="fx"></canvas>
    <div id="blast"></div>
    <div id="bus"></div>
    <div id="meter"></div>
    <canvas id="leader"></canvas>
    <div id="hud"><div id="hudNum">5</div><div id="hudLbl">T-MINUS</div></div>
    <div id="help"><div class="inner"></div></div>
  </div>
  <div id="side">
    <h2>⚛ 量子 Bada 出力<button id="sideClose" title="出力パネルを閉じる">✕</button></h2>
    <div id="out"></div>
  </div>
</div>

<div id="status">
  <span id="mode">NORMAL</span>
  <span id="fname">quantum.bada</span>
  <span id="msg"></span>
  <span id="cmdline"></span>
  <span id="pos">1:1</span>
</div>

<div id="keys"></div>
<input id="hidden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

/* ---------------------------------------------------------------------
 * 1. Bada シンタックス トークナイザ
 * ------------------------------------------------------------------ */
var BADA_KW = ["class","operator","return","if","elif","else","for","while","do",
  "let","const","var","fn","func","def","import","export","module","new","this",
  "super","null","nil","true","false","break","continue","in","of","match","case",
  "yield","async","await","spawn","observe","collapse","entangle","superpose",
  "measure","qubit","qreg","gate","circuit","manifold","tuplespace","struct",
  "enum","trait","impl","pub","use","where","with","end"];

var BADA_FN = ["beta","gamma","zeta","log","ln","exp","sin","cos","tan","atan",
  "sqrt","abs","floor","ceil","round","pow","min","max","norm","trace","det",
  "tensor","kron","pi_operator","chi","psi","print","printf","push","pull","emit",
  "H","X","Y","Z","S","T","CNOT","CZ","SWAP","RX","RY","RZ","TOFFOLI"];

/* 量子/多様体オペレータ (長いものから照合すること) */
var BADA_QOPS = ["<-","-<",">-","::","⊕","⊗","∬","∇","√","ℏ"];
var BADA_OPS  = ["->","=>","===","!==","==","!=","<=",">=","&&","||","**",
  "+=","-=","*=","/=","%=","<<",">>","+","-","*","/","%","=","<",">","!","&","|","^","~","?"];

function isIdStart(ch){ return /[A-Za-z_$À-ɏͰ-Ͽ぀-ヿ一-鿿]/.test(ch); }
function isIdPart(ch){ return isIdStart(ch) || /[0-9]/.test(ch); }

/* badaTokenize(line, inBlock)
 *   -> { toks:[{t,v}], inBlock:Boolean }
 *   t: kw | fn | ns | qop | op | num | str | com | ket | id | punct | ws  */
function badaTokenize(line, inBlock){
  line = (line == null ? "" : String(line));
  var toks = [], i = 0, n = line.length, block = !!inBlock;

  /* ブロックコメントの継続 */
  if (block){
    var endAt = line.indexOf("*/");
    if (endAt < 0){ if (n) toks.push({t:"com", v:line}); return {toks:toks, inBlock:true}; }
    toks.push({t:"com", v:line.slice(0, endAt+2)});
    i = endAt + 2; block = false;
  }

  while (i < n){
    var ch = line[i], two = line.substr(i,2);

    /* 空白 */
    if (ch === " " || ch === "\t"){
      var j = i; while (j < n && (line[j] === " " || line[j] === "\t")) j++;
      toks.push({t:"ws", v:line.slice(i,j)}); i = j; continue;
    }
    /* 行コメント */
    if (two === "//" || ch === "#"){ toks.push({t:"com", v:line.slice(i)}); i = n; continue; }
    /* ブロックコメント開始 */
    if (two === "/*"){
      var e = line.indexOf("*/", i+2);
      if (e < 0){ toks.push({t:"com", v:line.slice(i)}); return {toks:toks, inBlock:true}; }
      toks.push({t:"com", v:line.slice(i, e+2)}); i = e + 2; continue;
    }
    /* 量子ケット |0⟩ |1⟩ |ψ⟩ |01> */
    if (ch === "|"){
      var km = /^\|[^|<>⟩\s]{0,8}(?:⟩|>)/.exec(line.slice(i));
      if (km){ toks.push({t:"ket", v:km[0]}); i += km[0].length; continue; }
    }
    /* 文字列 */
    if (ch === '"' || ch === "'" || ch === "`"){
      var k = i + 1, esc = false;
      while (k < n){
        if (esc){ esc = false; k++; continue; }
        if (line[k] === "\\"){ esc = true; k++; continue; }
        if (line[k] === ch){ k++; break; }
        k++;
      }
      toks.push({t:"str", v:line.slice(i,k)}); i = k; continue;
    }
    /* 数値 (16進 / 小数 / 指数 / 虚数 i) */
    if (/[0-9]/.test(ch) || (ch === "." && /[0-9]/.test(line[i+1] || ""))){
      var nm = /^(?:0[xX][0-9a-fA-F_]+|(?:[0-9][0-9_]*)?\.?[0-9][0-9_]*(?:[eE][+-]?[0-9]+)?)i?/.exec(line.slice(i));
      var v = nm ? nm[0] : ch;
      toks.push({t:"num", v:v}); i += v.length; continue;
    }
    /* 識別子 / 名前空間 / キーワード */
    if (isIdStart(ch)){
      var s = i; while (i < n && isIdPart(line[i])) i++;
      var w = line.slice(s, i);
      if (line.substr(i,2) === "::"){ toks.push({t:"ns", v:w}); continue; }
      if (BADA_KW.indexOf(w) >= 0) toks.push({t:"kw", v:w});
      else if (BADA_FN.indexOf(w) >= 0) toks.push({t:"fn", v:w});
      else toks.push({t:"id", v:w});
      continue;
    }
    /* 量子/多様体オペレータ (優先) */
    var hit = null, z;
    for (z = 0; z < BADA_QOPS.length; z++){
      var q = BADA_QOPS[z];
      if (line.substr(i, q.length) === q){ hit = q; break; }
    }
    if (hit){ toks.push({t:"qop", v:hit}); i += hit.length; continue; }
    /* 通常オペレータ */
    for (z = 0; z < BADA_OPS.length; z++){
      var o = BADA_OPS[z];
      if (line.substr(i, o.length) === o){ hit = o; break; }
    }
    if (hit){ toks.push({t:"op", v:hit}); i += hit.length; continue; }
    /* 区切り */
    toks.push({t:"punct", v:ch}); i++;
  }
  return {toks:toks, inBlock:block};
}

/* 全行をまとめてトークナイズ (ブロックコメント状態を持ち越す) */
function badaTokenizeAll(lines){
  var out = [], blk = false;
  for (var i = 0; i < lines.length; i++){
    var r = badaTokenize(lines[i], blk);
    blk = r.inBlock; out.push(r.toks);
  }
  return out;
}

/* ---------------------------------------------------------------------
 * 2. Bada の数学 — Γ(s) / β(p,q) / ζ(s) と 3 つの非可換オペレータ
 * ------------------------------------------------------------------ */
var HBAR_EFF = 1.0;   /* 自然単位系の実効 ℏ */

/* Lanczos 近似によるガンマ関数 */
var LANCZOS = [676.5203681218851, -1259.1392167224028, 771.32342877765313,
  -176.61502916214059, 12.507343278686905, -0.13857109526572012,
  9.9843695780195716e-6, 1.5056327351493116e-7];

function gammaFn(z){
  if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gammaFn(1 - z));
  z -= 1;
  var x = 0.99999999999980993;
  for (var i = 0; i < LANCZOS.length; i++) x += LANCZOS[i] / (z + i + 1);
  var t = z + LANCZOS.length - 0.5;
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}

/* β(p,q) = Γ(p)Γ(q)/Γ(p+q) */
function betaFn(p, q){ return gammaFn(p) * gammaFn(q) / gammaFn(p + q); }

/* ζ(s) = β(p,q) / log x  (README の核心設計思想より) */
function zetaBeta(p, q, x){
  var l = Math.log(x);
  if (!isFinite(l) || l === 0) return NaN;
  return betaFn(p, q) / l;
}

/* `<-` 非可換左作用 π(χ,x) = [iπ, f(x)] の実数表現 */
function badaLeft(a, b){ return a * Math.cos(b) - b * Math.sin(a); }

/* `-<` 多様体積分 ∬ 1/(x·log x)² dx を [a,b] でシンプソン則により数値積分 */
function badaMani(a, b, steps){
  steps = steps || 200;
  if (steps % 2) steps++;
  if (!(a > 1) || !(b > 1)) return NaN;
  if (b === a) return 0;
  var sign = 1;
  if (b < a){ var t = a; a = b; b = t; sign = -1; }
  var f = function(x){ var L = Math.log(x); return 1 / (x * L * x * L); };
  var h = (b - a) / steps, s = f(a) + f(b);
  for (var i = 1; i < steps; i++) s += f(a + i * h) * (i % 2 ? 4 : 2);
  return sign * s * h / 3;
}

/* `>-` 量子作用素右作用 ⊕(iℏ∇)^⊕L — ℏ × 数値勾配 ∇sin(a) */
function badaRight(a, b){
  if (!b) return HBAR_EFF * Math.cos(a);
  return HBAR_EFF * (Math.sin(a + b) - Math.sin(a)) / b;
}

/* ---------------------------------------------------------------------
 * 3. 量子 Bada 実行系 — 状態ベクトルシミュレータ
 * ------------------------------------------------------------------ */
function qnew(n){
  var size = 1 << n;
  var re = new Array(size), im = new Array(size);
  for (var i = 0; i < size; i++){ re[i] = 0; im[i] = 0; }
  re[0] = 1;
  return {n:n, re:re, im:im};
}

/* 1 量子ビット ゲート: 2x2 行列 [[a,b],[c,d]] を複素数の平坦配列で */
var QGATES = {
  H: [Math.SQRT1_2,0, Math.SQRT1_2,0, Math.SQRT1_2,0, -Math.SQRT1_2,0],
  X: [0,0, 1,0, 1,0, 0,0],
  Y: [0,0, 0,-1, 0,1, 0,0],
  Z: [1,0, 0,0, 0,0, -1,0],
  S: [1,0, 0,0, 0,0, 0,1],
  T: [1,0, 0,0, 0,0, Math.SQRT1_2, Math.SQRT1_2]
};

function qapply1(st, g, q){
  if (q < 0 || q >= st.n) throw new Error("量子ビット番号が範囲外: " + q);
  var bit = 1 << q, size = 1 << st.n;
  for (var i = 0; i < size; i++){
    if (i & bit) continue;
    var j = i | bit;
    var ar = st.re[i], ai = st.im[i], br = st.re[j], bi = st.im[j];
    st.re[i] = g[0]*ar - g[1]*ai + g[2]*br - g[3]*bi;
    st.im[i] = g[0]*ai + g[1]*ar + g[2]*bi + g[3]*br;
    st.re[j] = g[4]*ar - g[5]*ai + g[6]*br - g[7]*bi;
    st.im[j] = g[4]*ai + g[5]*ar + g[6]*bi + g[7]*br;
  }
  return st;
}

function qgate1(st, name, q){
  var g = QGATES[name];
  if (!g) throw new Error("未知のゲート: " + name);
  return qapply1(st, g, q);
}

/* 回転ゲート RX / RY / RZ (角度 θ) */
function qrot(st, axis, q, theta){
  var c = Math.cos(theta/2), s = Math.sin(theta/2), g;
  if (axis === "RX") g = [c,0, 0,-s, 0,-s, c,0];
  else if (axis === "RY") g = [c,0, -s,0, s,0, c,0];
  else g = [c,-s, 0,0, 0,0, c,s];
  return qapply1(st, g, q);
}

function qcnot(st, c, t){
  if (c === t) throw new Error("CNOT の制御と標的が同じです");
  if (c < 0 || c >= st.n || t < 0 || t >= st.n) throw new Error("量子ビット番号が範囲外");
  var cb = 1 << c, tb = 1 << t, size = 1 << st.n;
  for (var i = 0; i < size; i++){
    if ((i & cb) && !(i & tb)){
      var j = i | tb;
      var r = st.re[i], m = st.im[i];
      st.re[i] = st.re[j]; st.im[i] = st.im[j];
      st.re[j] = r; st.im[j] = m;
    }
  }
  return st;
}

function qcz(st, c, t){
  var cb = 1 << c, tb = 1 << t, size = 1 << st.n;
  for (var i = 0; i < size; i++){
    if ((i & cb) && (i & tb)){ st.re[i] = -st.re[i]; st.im[i] = -st.im[i]; }
  }
  return st;
}

function qswap(st, a, b){ qcnot(st,a,b); qcnot(st,b,a); qcnot(st,a,b); return st; }

function qprobs(st){
  var size = 1 << st.n, p = new Array(size);
  for (var i = 0; i < size; i++) p[i] = st.re[i]*st.re[i] + st.im[i]*st.im[i];
  return p;
}

/* 決定的な擬似乱数 (テスト再現性のため) */
function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 観測 — 状態を固有状態へ collapse させ、測定値 (整数) を返す */
function qmeasure(st, rng){
  var p = qprobs(st), r = (rng ? rng() : Math.random()), acc = 0, idx = p.length - 1;
  for (var i = 0; i < p.length; i++){ acc += p[i]; if (r < acc){ idx = i; break; } }
  for (var k = 0; k < p.length; k++){ st.re[k] = 0; st.im[k] = 0; }
  st.re[idx] = 1;
  return idx;
}

function qbits(idx, n){
  var s = "";
  for (var i = n - 1; i >= 0; i--) s += ((idx >> i) & 1);
  return s;
}

/* ---------------------------------------------------------------------
 * 4. Bada 式評価器 — 再帰下降パーサ
 *    優先順位 (低→高):  <- -< >-   |  + -  |  * / %  |  **  |  単項  |  一次
 * ------------------------------------------------------------------ */
var BADA_MATHFN = {
  log:  function(a){ return Math.log(a); },
  ln:   function(a){ return Math.log(a); },
  exp:  function(a){ return Math.exp(a); },
  sin:  function(a){ return Math.sin(a); },
  cos:  function(a){ return Math.cos(a); },
  tan:  function(a){ return Math.tan(a); },
  atan: function(a){ return Math.atan(a); },
  sqrt: function(a){ return Math.sqrt(a); },
  abs:  function(a){ return Math.abs(a); },
  floor:function(a){ return Math.floor(a); },
  ceil: function(a){ return Math.ceil(a); },
  round:function(a){ return Math.round(a); },
  pow:  function(a,b){ return Math.pow(a,b); },
  min:  function(a,b){ return Math.min(a,b); },
  max:  function(a,b){ return Math.max(a,b); },
  gamma:function(a){ return gammaFn(a); },
  beta: function(a,b){ return betaFn(a,b); },
  zeta: function(a,b,c){ return zetaBeta(a,b,c); },
  pi_operator: function(a,b){ return badaLeft(a,b); },
  norm: function(a){ return Math.abs(a); }
};

function badaApplyQop(op, a, b){
  if (op === "<-") return badaLeft(a, b);
  if (op === "-<") return badaMani(a, b);
  if (op === ">-") return badaRight(a, b);
  throw new Error("未知の作用素: " + op);
}

function _peek(p){ return p.i < p.toks.length ? p.toks[p.i] : null; }
function _isOp(t, v){ return t && (t.t === "op" || t.t === "qop" || t.t === "punct") && t.v === v; }

function _parsePrimary(p, env){
  var t = _peek(p);
  if (!t) throw new Error("式が途中で終わっています");
  if (t.t === "num"){ p.i++; return parseFloat(String(t.v).replace(/_/g, "").replace(/i$/, "")); }
  if (t.t === "str"){ p.i++; return t.v.slice(1, -1); }
  if (_isOp(t, "(")){
    p.i++;
    var v = _parseQop(p, env);
    if (!_isOp(_peek(p), ")")) throw new Error("')' がありません");
    p.i++; return v;
  }
  if (t.t === "kw" && t.v === "measure"){
    p.i++;
    var nm = _peek(p);
    if (nm) p.i++;
    if (!env.q) throw new Error("観測する量子レジスタがありません (qubit q[n]; が必要)");
    var idx = qmeasure(env.q, env.rng);
    env.lastShot = idx;
    return idx;
  }
  if (t.t === "id" || t.t === "fn" || t.t === "ns" || t.t === "kw"){
    var name = t.v; p.i++;
    if (_isOp(_peek(p), "(")){
      p.i++;
      var args = [];
      if (!_isOp(_peek(p), ")")){
        for (;;){
          args.push(_parseQop(p, env));
          if (_isOp(_peek(p), ",")){ p.i++; continue; }
          break;
        }
      }
      if (!_isOp(_peek(p), ")")) throw new Error("')' がありません: " + name);
      p.i++;
      var f = BADA_MATHFN[name];
      if (!f) throw new Error("未知の関数: " + name);
      return f.apply(null, args);
    }
    /* q[3] のような添字は測定値のビット取り出しとして扱う */
    if (_isOp(_peek(p), "[")){
      p.i++;
      var ix = _parseQop(p, env);
      if (_isOp(_peek(p), "]")) p.i++;
      var base = env.vars.hasOwnProperty(name) ? env.vars[name] : (env.lastShot || 0);
      return (Number(base) >> Number(ix)) & 1;
    }
    if (env.vars.hasOwnProperty(name)) return env.vars[name];
    if (name === "PI" || name === "pi" || name === "π") return Math.PI;
    if (name === "E" || name === "e") return Math.E;
    if (name === "hbar" || name === "ℏ") return HBAR_EFF;
    throw new Error("未定義の識別子: " + name);
  }

    p.i++;

    return /^[01]+$/.test(body) ? parseInt(body, 2) : 0;

function _parseUnary(p, env){
  var t = _peek(p);
  if (_isOp(t, "-")){ p.i++; return -_parseUnary(p, env); }
  if (_isOp(t, "+")){ p.i++; return _parseUnary(p, env); }
  if (_isOp(t, "!")){ p.i++; return _parseUnary(p, env) ? 0 : 1; }
  if (_isOp(t, "√")){ p.i++; return Math.sqrt(_parseUnary(p, env)); }
  return _parsePrimary(p, env);

function _parsePow(p, env){
  var a = _parseUnary(p, env);
  if (_isOp(_peek(p), "**")){ p.i++; return Math.pow(a, _parsePow(p, env)); }
  return a;
}

function _parseMul(p, env){
  var a = _parsePow(p, env);
  for (;;){
    var t = _peek(p);
    if (_isOp(t, "*")){ p.i++; a = a * _parsePow(p, env); }
    else if (_isOp(t, "/")){ p.i++; a = a / _parsePow(p, env); }
    else if (_isOp(t, "%")){ p.i++; a = a % _parsePow(p, env); }
    else if (_isOp(t, "⊗")){ p.i++; a = a * _parsePow(p, env); }   /* テンソル積 */
    else return a;
  }
}

function _parseAdd(p, env){
  var a = _parseMul(p, env);
  for (;;){
    var t = _peek(p);
    if (_isOp(t, "+")){ p.i++; a = a + _parseMul(p, env); }
    else if (_isOp(t, "-")){ p.i++; a = a - _parseMul(p, env); }
    else if (_isOp(t, "⊕")){ p.i++; a = a + _parseMul(p, env); }   /* 直和 */
    else return a;
  }
}

function _parseQop(p, env){
  var a = _parseAdd(p, env);
  for (;;){
    var t = _peek(p);
    if (t && t.t === "qop" && (t.v === "<-" || t.v === "-<" || t.v === ">-")){
      p.i++; a = badaApplyQop(t.v, a, _parseAdd(p, env));
    } else return a;
  }
}

/* badaEval("4.0 <- 2.0", env) -> Number */
function badaEval(src, env){
  env = env || {vars:{}};
  var toks = badaTokenize(src).toks.filter(function(t){ return t.t !== "ws" && t.t !== "com"; });
  if (!toks.length) throw new Error("空の式");
  var p = {toks:toks, i:0};
  var v = _parseQop(p, env);
  return v;
}

/* 数値の表示整形 */
function fmtNum(v){
  if (typeof v === "string") return v;
  if (v == null || (typeof v === "number" && !isFinite(v))) return String(v);
  if (Number.isInteger(v)) return String(v);
  var a = Math.abs(v);
  if (a !== 0 && (a < 1e-4 || a >= 1e7)) return v.toExponential(6);
  return String(Math.round(v * 1e9) / 1e9);
}

/* ---------------------------------------------------------------------
 * 5. 量子 Bada プログラム実行
 *    quantumRun(src, seed) -> { out:[{cls,text}], vars, state, err }
 * ------------------------------------------------------------------ */
function stripComments(line){
  var r = badaTokenize(line), s = "";
  for (var i = 0; i < r.toks.length; i++){
    if (r.toks[i].t !== "com") s += r.toks[i].v;
  }
  return s;
}

function quantumRun(src, seed){
  var env = {
    vars:{}, q:null, rng: mulberry32(seed === undefined ? 0x5EED : (seed >>> 0)),
    lastShot: 0
  };
  var out = [], err = null;
  var push = function(cls, text){ out.push({cls:cls, text:text}); };

  var lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
  var depth = 0, blockComment = false, classes = [], ops = [];

  push("o-dim", "⚛ Bada 量子ランタイム — 起動");

  for (var li = 0; li < lines.length; li++){
    var raw = lines[li];
    /* ブロックコメントの追跡 */
    var tk = badaTokenize(raw, blockComment);
    blockComment = tk.inBlock;
    var text = "";
    for (var ti = 0; ti < tk.toks.length; ti++) if (tk.toks[ti].t !== "com") text += tk.toks[ti].v;
    text = text.trim();
    if (!text) continue;

    var opens = (text.match(/\{/g) || []).length;
    var closes = (text.match(/\}/g) || []).length;

    try {
      if (depth > 0){
        /* 定義ブロックの内部は宣言として記録するだけ */
        depth += opens - closes;
        if (depth < 0) depth = 0;
        continue;
      }

      var m;
      if ((m = /^import\s+(.+?);?$/.exec(text))){
        push("o-dim", "  import " + m[1]);
      } else if ((m = /^class\s+([A-Za-z_]\w*)/.exec(text))){
        classes.push(m[1]);
        push("o-key", "  class " + m[1] + " を定義");
      } else if ((m = /^operator\s+(\S+)/.exec(text))){
        ops.push(m[1]);
        push("o-key", "  operator " + m[1] + " を定義");
      } else if (/^Omega::|^Ω::/.test(text)){
        push("o-key", "  Ω::TupleSpace — Akashic Record へ接続");
      } else if ((m = /^qubit\s+([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*;?$/.exec(text))){
        var n = parseInt(m[2], 10);
        if (n < 1 || n > 14) throw new Error("量子ビット数は 1〜14 の範囲で指定してください");
        env.q = qnew(n); env.qname = m[1];
        push("o-q", "  qubit " + m[1] + "[" + n + "]  → |" + new Array(n + 1).join("0") + "⟩");
      } else if ((m = /^(H|X|Y|Z|S|T)\s+([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*;?$/.exec(text))){
        if (!env.q) throw new Error("量子レジスタが未宣言です");
        qgate1(env.q, m[1], parseInt(m[3], 10));
        push("o-q", "  " + m[1] + " → q[" + m[3] + "]");
      } else if ((m = /^(RX|RY|RZ)\s+([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*,\s*(.+?)\s*;?$/.exec(text))){
        if (!env.q) throw new Error("量子レジスタが未宣言です");
        var th = badaEval(m[4], env);
        qrot(env.q, m[1], parseInt(m[3], 10), th);
        push("o-q", "  " + m[1] + "(" + fmtNum(th) + ") → q[" + m[3] + "]");
      } else if ((m = /^(CNOT|CZ|SWAP)\s+([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*,\s*([A-Za-z_]\w*)\s*\[\s*(\d+)\s*\]\s*;?$/.exec(text))){
        if (!env.q) throw new Error("量子レジスタが未宣言です");
        var a = parseInt(m[3], 10), b = parseInt(m[5], 10);
        if (m[1] === "CNOT") qcnot(env.q, a, b);
        else if (m[1] === "CZ") qcz(env.q, a, b);
        else qswap(env.q, a, b);
        push("o-q", "  " + m[1] + " q[" + a + "] , q[" + b + "]");
      } else if ((m = /^(?:let|const|var)\s+([A-Za-z_]\w*)\s*=\s*(.+?)\s*;?$/.exec(text))){
        env.vars[m[1]] = badaEval(m[2], env);
        push("", "  let " + m[1] + " = " + fmtNum(env.vars[m[1]]));
      } else if ((m = /^print\s*\(?\s*(.+?)\s*\)?\s*;?$/.exec(text))){
        var pv = badaEval(m[1], env);
        push("o-ok", "  ▸ " + fmtNum(pv));
      } else if ((m = /^measure\s+([A-Za-z_]\w*)\s*(?:->\s*([A-Za-z_]\w*)\s*)?;?$/.exec(text))){
        if (!env.q) throw new Error("観測する量子レジスタがありません");
        var sh = qmeasure(env.q, env.rng);
        env.lastShot = sh;
        if (m[2]) env.vars[m[2]] = sh;
        push("o-q", "  measure → |" + qbits(sh, env.q.n) + "⟩  (" + sh + ")");
      } else if ((m = /^([A-Za-z_]\w*)\s*=\s*(.+?)\s*;?$/.exec(text))){
        env.vars[m[1]] = badaEval(m[2], env);
        push("", "  " + m[1] + " = " + fmtNum(env.vars[m[1]]));
      } else if (/^[}{;]+$/.test(text)){
        /* 括弧のみの行 */
      } else {
        var val = badaEval(text.replace(/;$/, ""), env);
        push("", "  = " + fmtNum(val));
      }
    } catch (e){
      err = "行 " + (li + 1) + ": " + e.message;
      push("o-err", "  ✘ " + err);
      break;
    }
    depth += opens - closes;
    if (depth < 0) depth = 0;
  }

  /* 終了時の量子状態 */
  if (env.q){
    var probs = qprobs(env.q), rows = [];
    for (var i = 0; i < probs.length; i++){
      if (probs[i] > 1e-9) rows.push({ket: qbits(i, env.q.n), p: probs[i]});
    }
    rows.sort(function(a, b){ return b.p - a.p; });
    push("o-dim", "── 終状態 |ψ⟩ ──");
    for (var r = 0; r < Math.min(rows.length, 8); r++){
      push("o-q", "  |" + rows[r].ket + "⟩  " + (rows[r].p * 100).toFixed(2) + " %");
    }
  }
  push(err ? "o-err" : "o-ok", err ? "⚠ 実行中断" : "✔ 実行完了");
  return {out:out, vars:env.vars, state:env.q, err:err, classes:classes, ops:ops};
}

/* ── 文字クラスと位置の前後移動 ── */

    if (q.c === 0 && _len(st, q.l) === 0) return q;
    pv = posRetreat(st, q); if (!pv) return q; q = pv;
  }
  var cls = _cls(st, q, big);
  for (;;){
    pv = posRetreat(st, q); if (!pv) return q;
    if (_cls(st, pv, big) !== cls) return q;

      var cmd = st.lastFind.cmd;
      if (m === ","){ cmd = {f:"F", F:"f", t:"T", T:"t"}[cmd]; }
      var fp2 = findChar(st, p, cmd, st.lastFind.ch, count);
      return fp2 ? {pos:fp2, linewise:false, inclusive:(cmd === "f" || cmd === "t")} : null;
    }
    case "n": case "N": {
      if (!st.search.pat){ st.msg = "検索パターンがありません"; return null; }
      var dir = st.search.dir * (m === "n" ? 1 : -1), sp = {l:p.l, c:p.c};
      for (i = 0; i < count; i++){
        var f = searchFrom(st, st.search.pat, dir, sp);
        if (!f) return null; sp = f;
      }
      return {pos:sp, linewise:false, inclusive:false};
    }
  }
  return null;
}

/* ── 範囲操作 ── */
function cmpPos(a, b){ return a.l !== b.l ? a.l - b.l : a.c - b.c; }
function makeRange(st, from, to, linewise, inclusive){
  var a = from, b = to;
  if (cmpPos(a, b) > 0){ var t = a; a = b; b = t; }
  if (linewise) return {a:{l:a.l, c:0}, b:{l:b.l, c:_len(st, b.l)}, linewise:true};
  return {a:{l:a.l, c:a.c}, b:{l:b.l, c:inclusive ? b.c + 1 : b.c}, linewise:false};
}
function extractRange(st, r){
  if (r.linewise) return st.lines.slice(r.a.l, r.b.l + 1);
  if (r.a.l === r.b.l) return [(st.lines[r.a.l] || "").slice(r.a.c, r.b.c)];
  var out = [(st.lines[r.a.l] || "").slice(r.a.c)];
  for (var l = r.a.l + 1; l < r.b.l; l++) out.push(st.lines[l] || "");
  out.push((st.lines[r.b.l] || "").slice(0, r.b.c));
  return out;
}
function deleteRange(st, r){
  if (r.linewise){
    st.lines.splice(r.a.l, r.b.l - r.a.l + 1);
    if (!st.lines.length) st.lines = [""];
    st.cur.l = Math.min(r.a.l, st.lines.length - 1);
    st.cur.c = firstNonBlank(st, st.cur.l);
  } else {
    var head = (st.lines[r.a.l] || "").slice(0, r.a.c);
    var tail = (st.lines[r.b.l] || "").slice(r.b.c);
    st.lines.splice(r.a.l, r.b.l - r.a.l + 1, head + tail);
    st.cur.l = r.a.l; st.cur.c = r.a.c;
  }
  st.dirty = true;
}
function setReg(st, name, text, linewise){
  var rec = {text:text.slice(), linewise:!!linewise};
  st.regs['"'] = rec;
  if (name && name !== '"') st.regs[name] = {text:text.slice(), linewise:!!linewise};
}
function getReg(st, name){ return st.regs[name || '"'] || {text:[""], linewise:false}; }

function indentLines(st, l0, l1, dir){
  var pad = new Array(st.shiftwidth + 1).join(" ");
  for (var l = l0; l <= l1 && l < st.lines.length; l++){
    if (dir > 0) st.lines[l] = pad + st.lines[l];
    else st.lines[l] = st.lines[l].replace(new RegExp("^(?: {1," + st.shiftwidth + "}|\\t)"), "");
  }
  st.cur.l = l0; st.cur.c = firstNonBlank(st, l0); st.dirty = true;
}

function applyOp(st, op, r, reg){
  var txt = extractRange(st, r);
  if (op === "y"){
    setReg(st, reg, txt, r.linewise);
    st.cur = {l:r.a.l, c:r.linewise ? firstNonBlank(st, r.a.l) : r.a.c};
    st.msg = (r.linewise ? txt.length + " 行" : txt.join("").length + " 文字") + "をヤンクしました";
    clampCur(st); return;
  }
  if (op === ">" || op === "<"){
    snapshot(st); indentLines(st, r.a.l, r.b.l, op === ">" ? 1 : -1); return;
  }
  snapshot(st);
  setReg(st, reg, txt, r.linewise);
  if (op === "c" && r.linewise){
    /* cc — 行を空にして挿入モードへ (インデントは保持) */
    var ind = (st.lines[r.a.l] || "").match(/^\s*/)[0];
    st.lines.splice(r.a.l, r.b.l - r.a.l + 1, ind);
    st.cur = {l:r.a.l, c:ind.length};
    st.mode = "insert"; st.dirty = true; return;
  }
  deleteRange(st, r);
  if (op === "c"){ st.mode = "insert"; }
  clampCur(st);
}

function doPut(st, after, count, reg){
  var R = getReg(st, reg);
  if (!R.text.length) return;
  snapshot(st); count = count || 1;
  var i, k;
  if (R.linewise){
    var ins = [];
    for (k = 0; k < count; k++) for (i = 0; i < R.text.length; i++) ins.push(R.text[i]);
    var at = st.cur.l + (after ? 1 : 0);
    st.lines.splice.apply(st.lines, [at, 0].concat(ins));
    st.cur.l = at; st.cur.c = firstNonBlank(st, at);
  } else {
    var line = st.lines[st.cur.l] || "";
    var at2 = st.cur.c + (after && line.length ? 1 : 0);
    if (R.text.length === 1){
      var piece = "";
      for (k = 0; k < count; k++) piece += R.text[0];
      st.lines[st.cur.l] = line.slice(0, at2) + piece + line.slice(at2);
      st.cur.c = at2 + piece.length - 1;
    } else {
      var head = line.slice(0, at2), tail = line.slice(at2), blk = R.text.slice();
      var nl = [head + blk[0]];
      for (i = 1; i < blk.length - 1; i++) nl.push(blk[i]);
      nl.push(blk[blk.length - 1] + tail);
      st.lines.splice.apply(st.lines, [st.cur.l, 1].concat(nl));
      st.cur.l = st.cur.l + blk.length - 1;
      st.cur.c = Math.max(0, blk[blk.length - 1].length - 1);
    }
  }
  st.dirty = true; clampCur(st);
}

/* ── 挿入モード ── */
function insertKey(st, key){
  var line = st.lines[st.cur.l] || "";
  if (key === "<Esc>"){
    st.mode = "normal";
    if (st.lastChange && st.insertLog) st.lastChange.insert = st.insertLog.slice();
    st.insertLog = null;
    st.cur.c = Math.max(0, st.cur.c - 1);
    clampCur(st); st.desired = st.cur.c;
    return;
  }
  if (st.insertLog) st.insertLog.push(key);
  if (key === "<CR>"){
    var ind = line.slice(0, st.cur.c).match(/^\s*/)[0];
    var head = line.slice(0, st.cur.c), tail = ind + line.slice(st.cur.c);
    st.lines.splice(st.cur.l, 1, head, tail);
    st.cur.l++; st.cur.c = ind.length; st.dirty = true; st.rev++; return;
  }
  if (key === "<BS>"){
    if (st.cur.c > 0){
      st.lines[st.cur.l] = line.slice(0, st.cur.c - 1) + line.slice(st.cur.c);
      st.cur.c--;
    } else if (st.cur.l > 0){
      var prev = st.lines[st.cur.l - 1] || "";
      st.lines.splice(st.cur.l - 1, 2, prev + line);
      st.cur.l--; st.cur.c = prev.length;
    }
    st.dirty = true; st.rev++; return;
  }
  if (key === "<Del>"){
    if (st.cur.c < line.length) st.lines[st.cur.l] = line.slice(0, st.cur.c) + line.slice(st.cur.c + 1);
    else if (st.cur.l < st.lines.length - 1) st.lines.splice(st.cur.l, 2, line + (st.lines[st.cur.l + 1] || ""));
    st.dirty = true; st.rev++; return;
  }
  var ins = (key === "<Tab>") ? new Array(st.shiftwidth + 1).join(" ") : key;
  if (ins.length !== 1 && key !== "<Tab>") return;      /* 未知の特殊キーは無視 */
  if (st.mode === "replace"){
    st.lines[st.cur.l] = line.slice(0, st.cur.c) + ins + line.slice(st.cur.c + ins.length);
  } else {
    st.lines[st.cur.l] = line.slice(0, st.cur.c) + ins + line.slice(st.cur.c);
  }
  st.cur.c += ins.length; st.dirty = true; st.rev++;
}

/* ── コマンドライン / 検索モード ── */
function cmdlineKey(st, key){
  if (key === "<Esc>"){ st.mode = "normal"; st.cmdline = ""; return; }
  if (key === "<BS>"){
    st.cmdline = st.cmdline.slice(0, -1);
    if (!st.cmdline){ st.mode = "normal"; }
    return;
  }
  if (key === "<CR>"){
    var line = st.cmdline, kind = line.charAt(0), body = line.slice(1);
    st.cmdline = ""; st.mode = "normal";
    if (kind === ":") execEx(st, body);
    else {
      st.search.pat = body || st.search.pat;
      st.search.dir = (kind === "/") ? 1 : -1;
      var f = searchFrom(st, st.search.pat, st.search.dir, st.cur);
      if (f){ st.cur = f; st.desired = f.c; st.msg = kind + st.search.pat; emit(st, "jump", {line:f.l}); }
      else { st.msg = "パターンが見つかりません: " + st.search.pat; st.msgErr = true; }
    }
    clampCur(st); return;
  }
  if (key === "<Tab>") return;
  if (key.length === 1) st.cmdline += key;
}

/* ── Ex コマンド ── */
function execEx(st, cmd){
  cmd = String(cmd || "").trim();
  st.msgErr = false;
  if (!cmd) return;
  var m;

  /* 行番号ジャンプ  :42  :$  */
  if ((m = /^(\d+)$/.exec(cmd))){
    st.cur.l = Math.max(0, Math.min(st.lines.length - 1, parseInt(m[1], 10) - 1));
    st.cur.c = firstNonBlank(st, st.cur.l); st.desired = st.cur.c;
    emit(st, "jump", {line:st.cur.l}); return;
  }
  if (cmd === "$"){ st.cur.l = st.lines.length - 1; st.cur.c = 0; emit(st, "jump", {line:st.cur.l}); return; }

  /* 置換  :%s/pat/rep/g   :s/pat/rep/   :3,9s/pat/rep/g */
  if ((m = /^(%|\d+\s*,\s*\d+|\.)?\s*s\/((?:[^\/\\]|\\.)*)\/((?:[^\/\\]|\\.)*)\/?([gi]*)$/.exec(cmd))){
    var lo = st.cur.l, hi = st.cur.l;
    if (m[1] === "%"){ lo = 0; hi = st.lines.length - 1; }
    else if (m[1] && m[1].indexOf(",") >= 0){
      var pr = m[1].split(",");
      lo = Math.max(0, parseInt(pr[0], 10) - 1);
      hi = Math.min(st.lines.length - 1, parseInt(pr[1], 10) - 1);
    }
    var flags = m[4] || "", re;
    try { re = new RegExp(m[2], flags.indexOf("g") >= 0 ? "g" + (flags.indexOf("i") >= 0 ? "i" : "") : (flags.indexOf("i") >= 0 ? "i" : "")); }
    catch (e){ st.msg = "不正な正規表現: " + m[2]; st.msgErr = true; return; }
    var rep = m[3].replace(/\\\//g, "/"), hits = 0, hitLines = 0;
    snapshot(st);
    for (var l = lo; l <= hi; l++){
      var before = st.lines[l];
      var after = before.replace(re, function(){
        hits++; return rep.replace(/\$(\d)|\\(\d)/g, function(_, a, b){ return arguments[parseInt(a || b, 10)] || ""; });
      });
      if (after !== before){ st.lines[l] = after; hitLines++; }
    }
    if (!hits){ st.undo.pop(); st.msg = "パターンが見つかりません: " + m[2]; st.msgErr = true; }
    else { st.dirty = true; st.msg = hits + " 件を " + hitLines + " 行で置換しました"; }
    clampCur(st); return;
  }

  var parts = cmd.split(/\s+/), head = parts[0], arg = cmd.slice(head.length).trim();

  switch (head){
    case "w": case "write":
      emit(st, "write", {name:arg || st.fname});
      if (arg) st.fname = arg;
      st.dirty = false; st.msg = '"' + st.fname + '" を保存しました'; return;
    case "wq": case "x":
      emit(st, "write", {name:arg || st.fname}); emit(st, "quit", {});
      st.dirty = false; st.msg = '"' + st.fname + '" を保存して終了'; return;
    case "q": case "quit": case "q!":
      if (st.dirty && head === "q"){ st.msg = "変更が保存されていません (:q! で破棄)"; st.msgErr = true; return; }
      emit(st, "quit", {}); st.msg = "終了"; return;
    case "e": case "edit":
      emit(st, "open", {name:arg}); st.msg = "ファイルを開きます…"; return;
    case "new": case "enew":
      snapshot(st); st.lines = [""]; st.cur = {l:0, c:0}; st.dirty = false;
      st.fname = arg || "untitled.bada"; st.msg = "新規バッファ"; return;
    case "demo":
      snapshot(st); st.lines = DEMO_SRC.split("\n"); st.cur = {l:0, c:0};
      st.fname = "quantum.bada"; st.msg = "デモを読み込みました"; return;
    case "run": case "q!run": case "quantum":
      emit(st, "run", {}); st.msg = "⚛ 量子 Bada を実行"; return;
    case "emit": case "signal": case "slam":
      emit(st, "signal", {line:st.cur.l, mag:1, what:arg || "manual"});
      st.msg = "✨ " + (st.cur.l + 1) + " 行目へイベントをディスパッチ"; return;
    case "countdown": case "cd": {
      var sec = parseFloat(arg);
      if (!isFinite(sec) || sec <= 0) sec = 5;
      sec = Math.min(60, sec);
      emit(st, "countdown", {seconds:sec});
      st.msg = "⏱ T-" + sec + " カウントダウン開始"; return;
    }
    case "focus":
      st.opts.focus = !st.opts.focus;
      st.msg = "シネマフォーカス: " + (st.opts.focus ? "ON" : "OFF"); return;
    case "prose": case "text":
      st.opts.view = "prose"; st.msg = "📄 文章ビュー (文のブロック + どアップと波打ち)";
      emit(st, "view", {to:"prose"}); return;
    case "code": case "mono":
      st.opts.view = "code"; st.msg = "💻 コードビュー";
      emit(st, "view", {to:"code"}); return;
    case "wave": case "ripple":
      st.opts.wave = !st.opts.wave;
      st.msg = "🌊 どアップと波打ち: " + (st.opts.wave ? "ON" : "OFF"); return;
    case "flash":
      st.opts.flash = !st.opts.flash;
      st.msg = "イベントフラッシュ: " + (st.opts.flash ? "ON" : "OFF"); return;
    case "bus":
      st.opts.bus = !st.opts.bus;
      st.msg = "イベントバス表示: " + (st.opts.bus ? "ON" : "OFF");
      emit(st, "opts", {}); return;
    case "noh": case "nohl": case "nohlsearch":
      st.search.pat = ""; st.msg = ""; return;
    case "help": case "h":
      emit(st, "help", {}); return;
    case "reg": case "registers":
      st.msg = "レジスタ: " + Object.keys(st.regs).join(" "); return;
    case "set": {
      if (!arg){ st.msg = "使い方: :set number / :set nonumber / :set peak=3.0"; st.msgErr = true; return; }
      var toks = arg.split(/\s+/);
      for (var ti = 0; ti < toks.length; ti++){
        var t = toks[ti], mm;
        /* 文字列を取るオプション (view) */
        if ((mm = /^(view)=(\w+)$/.exec(t))){
          var ok = {view:["prose", "code"]};
          if (ok[mm[1]].indexOf(mm[2]) < 0){
            st.msg = mm[1] + " は " + ok[mm[1]].join(" / ") + " のいずれかです";
            st.msgErr = true; return;
          }
          st.opts[mm[1]] = mm[2];
          continue;
        }
        if ((mm = /^(\w+)=([-\d.]+)$/.exec(t))){
          var key = {sw:"shiftwidth", shiftwidth:"shiftwidth"}[mm[1]] || mm[1];
          if (key === "shiftwidth"){ st.shiftwidth = Math.max(1, Math.min(8, parseFloat(mm[2]))); }
          else if (st.opts.hasOwnProperty(key)) st.opts[key] = parseFloat(mm[2]);
          else { st.msg = "未知のオプション: " + mm[1]; st.msgErr = true; return; }
        } else {
          var on = true, nm = t;
          if (/^no/.test(t) && !st.opts.hasOwnProperty(t)){ on = false; nm = t.slice(2); }
          nm = {nu:"number", number:"number", so:"sound", sound:"sound"}[nm] || nm;
          if (!st.opts.hasOwnProperty(nm)){ st.msg = "未知のオプション: " + t; st.msgErr = true; return; }
          st.opts[nm] = on;
        }
      }
      st.msg = "set " + arg; emit(st, "opts", {}); return;
    }
  }
  st.msg = "未知のコマンド: " + cmd; st.msgErr = true;
}

/* ── ビジュアルモードの範囲 ── */
function visualRange(st){
  var a = st.visStart, b = st.cur;
  if (cmpPos(a, b) > 0){ var t = a; a = b; b = t; }
  if (st.mode === "vline") return {a:{l:a.l, c:0}, b:{l:b.l, c:_len(st, b.l)}, linewise:true};
  return {a:{l:a.l, c:a.c}, b:{l:b.l, c:Math.min(_len(st, b.l), b.c + 1)}, linewise:false};
}

/* ── ノーマル/ビジュアルモードのパース ──
 * runNormal は "incomplete" を返した場合のみ pending を保持します。  */
function parseMotionKeys(s){
  if (!s) return "incomplete";
  var c = s.charAt(0);
  if ("hjklwWbBeE0^$G{}%;,nN+-".indexOf(c) >= 0) return {m:c, len:1};
  if (c === "g"){
    if (s.length < 2) return "incomplete";
    if (s.charAt(1) === "g") return {m:"gg", len:2};
    return null;
  }
  if ("ftFT".indexOf(c) >= 0){
    if (s.length < 2) return "incomplete";
    return {m:c, arg:s.charAt(1), len:2};
  }
  return null;
}

function runNormal(st, seq){
  var vis = (st.mode === "visual" || st.mode === "vline");
  var cm = /^([1-9][0-9]*)/.exec(seq), count = cm ? parseInt(cm[1], 10) : 0;
  var rest = seq.slice(cm ? cm[1].length : 0);
  if (rest === "") return "incomplete";
  var n = count || 1, c0 = rest.charAt(0), i;
  /* <Esc> <CR> <BS> <Space> <C-r> … は単一の特殊キー。
     先頭の '<' を unindent オペレータと取り違えないよう先に切り分ける。 */
  var isSpecial = /^<[A-Za-z][A-Za-z-]*>$/.test(rest);

  /* レジスタ指定 "a */
  if (c0 === '"'){
    if (rest.length < 2) return "incomplete";
    var reg = rest.charAt(1);
    var sub = runNormal(st, (count ? String(count) : "") + rest.slice(2));
    if (sub === "incomplete") return "incomplete";
    return sub;
  }

  /* ── オペレータ (ビジュアルモードでは即時適用) ── */
  if (!vis && !isSpecial && "dcy><".indexOf(c0) >= 0){
    var after = rest.slice(1);
    if (after === "") return "incomplete";
    var cm2 = /^([1-9][0-9]*)/.exec(after);
    var n2 = cm2 ? parseInt(cm2[1], 10) : 1;
    after = after.slice(cm2 ? cm2[1].length : 0);
    if (after === "") return "incomplete";
    var total = n * n2;
    if (after.charAt(0) === c0){                       /* dd yy cc >> << */
      var l1 = Math.min(st.lines.length - 1, st.cur.l + total - 1);
      st.lastChange = {seq:seq, insert:null};
      applyOp(st, c0, {a:{l:st.cur.l, c:0}, b:{l:l1, c:_len(st, l1)}, linewise:true}, null);
      if (st.mode === "insert") st.insertLog = [];
      clampCur(st); return "done";
    }
    var mo = parseMotionKeys(after);
    if (mo === "incomplete") return "incomplete";
    if (!mo) return "done";
    /* vim の特例: cw / cW は ce / cE として振る舞い、末尾の空白を食わない */
    var mk = mo.m;
    if (c0 === "c" && (mk === "w" || mk === "W")) mk = (mk === "w") ? "e" : "E";
    var res = evalMotion(st, mk, (mk === "G" && !cm2 && !count) ? 0 : total, mo.arg);
    if (!res){ st.msg = "移動できません"; st.msgErr = true; return "done"; }
    var lw = res.linewise || (mk === "gg" || mk === "G");
    st.lastChange = {seq:seq, insert:null};
    applyOp(st, c0, makeRange(st, st.cur, res.pos, lw, res.inclusive), null);
    if (st.mode === "insert") st.insertLog = [];
    clampCur(st); return "done";
  }

  /* ── モーション単体 ── */
  var mo2 = isSpecial ? null : parseMotionKeys(rest);
  if (mo2 === "incomplete") return "incomplete";
  if (mo2 && mo2.len === rest.length){
    var r2 = evalMotion(st, mo2.m, (mo2.m === "G" && !count) ? 0 : n, mo2.arg);
    if (!r2){ if (!st.msg) { st.msg = "見つかりません"; st.msgErr = true; } return "done"; }
    var prevL = st.cur.l;
    st.cur = {l:r2.pos.l, c:r2.pos.c};
    if (mo2.m !== "j" && mo2.m !== "k") st.desired = st.cur.c;
    clampCur(st);
    if (st.cur.l !== prevL) emit(st, "motion", {line:st.cur.l, from:prevL, what:mo2.m});
    return "done";
  }

  /* ── 単発コマンド ── */
  switch (rest){
    case "i": snapshot(st); st.mode = "insert"; st.lastChange = {seq:seq, insert:null}; st.insertLog = []; return "done";
    case "a": snapshot(st); st.mode = "insert"; st.cur.c = Math.min(_len(st, st.cur.l), st.cur.c + 1); st.lastChange = {seq:seq, insert:null}; st.insertLog = []; return "done";
    case "I": snapshot(st); st.mode = "insert"; st.cur.c = firstNonBlank(st, st.cur.l); st.lastChange = {seq:seq, insert:null}; st.insertLog = []; return "done";
    case "A": snapshot(st); st.mode = "insert"; st.cur.c = _len(st, st.cur.l); st.lastChange = {seq:seq, insert:null}; st.insertLog = []; return "done";
    case "o": case "O": {
      snapshot(st);
      var at = st.cur.l + (rest === "o" ? 1 : 0);
      var ind = (st.lines[st.cur.l] || "").match(/^\s*/)[0];
      st.lines.splice(at, 0, ind);
      st.cur.l = at; st.cur.c = ind.length; st.mode = "insert"; st.dirty = true;
      st.lastChange = {seq:seq, insert:null}; st.insertLog = [];
      emit(st, "edit", {line:at, mag:0.55, what:rest === "o" ? "open-below" : "open-above"});
      return "done";
    }
    case "R": snapshot(st); st.mode = "replace"; st.lastChange = {seq:seq, insert:null}; st.insertLog = []; return "done";
    case "v": st.mode = (st.mode === "visual") ? "normal" : "visual"; st.visStart = {l:st.cur.l, c:st.cur.c}; return "done";
    case "V": st.mode = (st.mode === "vline") ? "normal" : "vline"; st.visStart = {l:st.cur.l, c:st.cur.c}; return "done";
    case ":": st.mode = "command"; st.cmdline = ":"; return "done";
    case "/": st.mode = "search"; st.cmdline = "/"; return "done";
    case "?": st.mode = "search"; st.cmdline = "?"; return "done";
    case "u": doUndo(st); return "done";
    case "<C-r>": doRedo(st); return "done";
    case "x": {
      snapshot(st); st.lastChange = {seq:seq, insert:null};
      var line = st.lines[st.cur.l] || "";
      var cut = line.slice(st.cur.c, st.cur.c + n);
      if (cut){ setReg(st, null, [cut], false);
        st.lines[st.cur.l] = line.slice(0, st.cur.c) + line.slice(st.cur.c + n); st.dirty = true; }
      clampCur(st); return "done";
    }
    case "X": {
      snapshot(st); st.lastChange = {seq:seq, insert:null};
      var line2 = st.lines[st.cur.l] || "", from = Math.max(0, st.cur.c - n);
      if (st.cur.c > 0){
        setReg(st, null, [line2.slice(from, st.cur.c)], false);
        st.lines[st.cur.l] = line2.slice(0, from) + line2.slice(st.cur.c);
        st.cur.c = from; st.dirty = true;
      }
      clampCur(st); return "done";
    }
    case "D": st.lastChange = {seq:seq, insert:null};
      applyOp(st, "d", makeRange(st, st.cur, {l:st.cur.l, c:_len(st, st.cur.l)}, false, false), null); clampCur(st); return "done";
    case "C": st.lastChange = {seq:seq, insert:null};
      applyOp(st, "c", makeRange(st, st.cur, {l:st.cur.l, c:_len(st, st.cur.l)}, false, false), null);
      st.insertLog = []; return "done";
    case "Y": applyOp(st, "y", {a:{l:st.cur.l, c:0}, b:{l:st.cur.l, c:_len(st, st.cur.l)}, linewise:true}, null); return "done";
    case "p": st.lastChange = {seq:seq, insert:null}; doPut(st, true, n, null); emit(st, "edit", {line:st.cur.l, mag:0.7, what:"put-after"}); return "done";
    case "P": st.lastChange = {seq:seq, insert:null}; doPut(st, false, n, null); emit(st, "edit", {line:st.cur.l, mag:0.7, what:"put-before"}); return "done";
    case "J": {
      snapshot(st); st.lastChange = {seq:seq, insert:null};
      for (i = 0; i < Math.max(1, n - 1) && st.cur.l < st.lines.length - 1; i++){
        var a1 = st.lines[st.cur.l], b1 = (st.lines[st.cur.l + 1] || "").replace(/^\s+/, "");
        st.cur.c = a1.length;
        st.lines.splice(st.cur.l, 2, a1 + (a1 && b1 ? " " : "") + b1);
      }
      st.dirty = true; clampCur(st); return "done";
    }
    case "~": {
      snapshot(st); st.lastChange = {seq:seq, insert:null};
      var l3 = st.lines[st.cur.l] || "", e3 = Math.min(l3.length, st.cur.c + n);
      var mid = l3.slice(st.cur.c, e3).replace(/./g, function(ch){
        return ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase();
      });
      st.lines[st.cur.l] = l3.slice(0, st.cur.c) + mid + l3.slice(e3);
      st.cur.c = Math.min(Math.max(0, l3.length - 1), e3); st.dirty = true; return "done";
    }
    case "ZZ": emit(st, "write", {name:st.fname}); emit(st, "quit", {}); return "done";
    case "Z": return "incomplete";
    case ".": {
      if (!st.lastChange){ st.msg = "繰り返す変更がありません"; return "done"; }
      var lc = st.lastChange;
      runNormal(st, lc.seq);
      if (lc.insert && st.mode === "insert"){
        for (i = 0; i < lc.insert.length; i++) insertKey(st, lc.insert[i]);
        insertKey(st, "<Esc>");
      } else if (st.mode === "insert") insertKey(st, "<Esc>");
      st.lastChange = lc; return "done";
    }
    case "<Esc>":
      if (vis){ st.mode = "normal"; st.visStart = null; }
      st.msg = ""; st.msgErr = false; return "done";
    case "<CR>": {
      var pl = st.cur.l;
      st.cur.l = Math.min(st.lines.length - 1, st.cur.l + n);
      st.cur.c = firstNonBlank(st, st.cur.l); clampCur(st);
      if (st.cur.l !== pl) emit(st, "motion", {line:st.cur.l, from:pl, what:"<CR>"});
      return "done";
    }
    case "<Space>":
      emit(st, "signal", {line:st.cur.l, mag:1, what:"manual"});
      st.msg = "✨ " + (st.cur.l + 1) + " 行目へイベントをディスパッチ";
      return "done";
    case "<C-d>": st.cur.l = Math.min(st.lines.length - 1, st.cur.l + 12); clampCur(st); emit(st, "motion", {line:st.cur.l, what:"<C-d>"}); return "done";
    case "<C-u>": st.cur.l = Math.max(0, st.cur.l - 12); clampCur(st); emit(st, "motion", {line:st.cur.l, what:"<C-u>"}); return "done";
    case "<C-b>": st.cur.l = Math.max(0, st.cur.l - 24); clampCur(st); emit(st, "motion", {line:st.cur.l, what:"<C-b>"}); return "done";
    case "<C-f>": st.cur.l = Math.min(st.lines.length - 1, st.cur.l + 24); clampCur(st); emit(st, "motion", {line:st.cur.l, what:"<C-f>"}); return "done";
  }

  /* r<char> — 一文字置換 */
  if (rest.charAt(0) === "r"){
    if (rest.length < 2) return "incomplete";
    snapshot(st); st.lastChange = {seq:seq, insert:null};
    var rl = st.lines[st.cur.l] || "", rep = new Array(n + 1).join(rest.charAt(1));
    if (st.cur.c + n <= rl.length){
      st.lines[st.cur.l] = rl.slice(0, st.cur.c) + rep + rl.slice(st.cur.c + n);
      st.cur.c += n - 1; st.dirty = true;
    }
    clampCur(st); return "done";
  }

  /* ── ビジュアルモードの操作 ── */
  if (vis){
    switch (rest){
      case "d": case "x": case "y": case "c": case ">": case "<": {
        var vr = visualRange(st), wasLine = st.mode === "vline";
        st.mode = "normal"; st.visStart = null;
        applyOp(st, (rest === "x" ? "d" : rest), vr, null);
        if (rest === "c") st.insertLog = [];
        if (wasLine && rest === "y") st.msg = (vr.b.l - vr.a.l + 1) + " 行をヤンクしました";
        clampCur(st); return "done";
      }
      case "o": {
        var t2 = st.visStart; st.visStart = {l:st.cur.l, c:st.cur.c}; st.cur = {l:t2.l, c:t2.c};
        clampCur(st); return "done";
      }
      case "u": case "U": {
        snapshot(st);
        var vr2 = visualRange(st), txt2 = extractRange(st, vr2);
        var f2 = (rest === "u") ? "toLowerCase" : "toUpperCase";
        if (vr2.linewise){
          for (i = vr2.a.l; i <= vr2.b.l; i++) st.lines[i] = st.lines[i][f2]();
        } else {
          st.lines[vr2.a.l] = st.lines[vr2.a.l].slice(0, vr2.a.c) +
            txt2.join("")[f2]() + (st.lines[vr2.b.l] || "").slice(vr2.b.c);
        }
        st.mode = "normal"; st.visStart = null; st.dirty = true; clampCur(st); return "done";
      }
      case "✨": case "<Space>":
        emit(st, "signal", {line:st.cur.l, mag:1, what:"manual"}); return "done";
    }
  }

  /* 認識できないキー列 */
  st.msg = ""; return "done";
}

/* ── 単一キーの入力 ──
 * すべての入力を「イベント」として扱います。1 キー = 1 ディスパッチで、
 *   1. key    — 入力そのもの
 *   2. ハンドラが発行するイベント (motion / edit / ex / search / …)
 *   3. mode   — モードが遷移した場合
 *   4. edit   — 本文が変化した場合 (rev の差分で検出)
 * を st.events に積み、UI 側がこの順にディスパッチして行を光らせます。 */
function feedKey(st, key){
  st.events.length = 0;
  var beforeMode = st.mode, beforeRev = st.rev, beforeLine = st.cur.l;

  emit(st, "key", {key:key, line:st.cur.l, mode:beforeMode});

  if (st.mode === "insert" || st.mode === "replace"){
    insertKey(st, key); clampCur(st);
  } else if (st.mode === "command" || st.mode === "search"){
    cmdlineKey(st, key);
  } else {
    if (key === "<Esc>") st.pending = "";
    st.pending += key;
    var r = runNormal(st, st.pending);
    if (r !== "incomplete") st.pending = "";
    if (st.pending.length > 12) st.pending = "";
    clampCur(st);
  }

  /* 本文が変わったなら edit イベント (ハンドラが個別に出していない場合のみ) */
  if (st.rev !== beforeRev && !st.events.some(function(e){ return e.type === "edit"; })){
    emit(st, "edit", {line:st.cur.l, mag:0.62, what:key});
  }
  /* モード遷移 */
  if (st.mode !== beforeMode){
    emit(st, "mode", {line:st.cur.l, from:beforeMode, to:st.mode, mag:0.5});
  }
  /* 挿入モード中のカーソル行移動も motion として拾う */
  if (st.cur.l !== beforeLine && !st.events.some(function(e){ return e.type === "motion"; })){
    emit(st, "motion", {line:st.cur.l, from:beforeLine, mag:0.42, what:key});
  }
  st.dispatched += st.events.length;
  return st;
}
function feedKeys(st, keys){
  for (var i = 0; i < keys.length; i++) feedKey(st, keys[i]);
  return st;
}
/* "ciw" のような文字列をキー列として流し込む (テスト用のショートハンド) */
function feedString(st, s){
  var i = 0;
  while (i < s.length){
    if (s.charAt(i) === "<"){
      var e = s.indexOf(">", i);
      if (e > 0){ feedKey(st, s.slice(i, e + 1)); i = e + 1; continue; }
    }
    feedKey(st, s.charAt(i)); i++;
  }
  return st;
}

/* =====================================================================
 * 7. シネマ演出の数理
 * ================================================================== */

/* focusStyle(dist, o)
 *   カーソル行からの距離 dist に対する被写界深度。
 *   dist=0 (ポイントされた行) が最大倍率・ぼかし 0・最前面。
 *   ガウス核 k = exp(-d²/2σ²) で滑らかに減衰します。
 *     -> { scale, blur, opacity, z, k }                                */
function focusStyle(dist, o){
  o = o || {};
  var depth   = (o.depth   === undefined) ? 1    : Math.max(0, Math.min(1, o.depth));
  var peak    = (o.peak    === undefined) ? 2.6  : o.peak;
  var spread  = (o.spread  === undefined) ? 2.2  : Math.max(0.35, o.spread);
  var maxBlur = (o.maxBlur === undefined) ? 3.2  : o.maxBlur;
  var minOp   = (o.minOpacity === undefined) ? 0.13 : o.minOpacity;
  var maxZ    = (o.maxZ    === undefined) ? 26   : o.maxZ;
  var d = Math.abs(dist);
  var k = Math.exp(-(d * d) / (2 * spread * spread));
  return {
    k: k,
    scale:   1 + (peak - 1) * k * depth,
    blur:    maxBlur * (1 - k) * depth,
    opacity: 1 - (1 - minOp) * (1 - k) * depth,
    z:       maxZ * k * depth
  };
}

/* docLayout(scales, baseH)
 *   拡大した行が重ならないよう、行ごとの占有高さと中心位置を求めます。
 *     -> { tops:[], heights:[], centers:[], total }                    */
function docLayout(scales, baseH){
  var tops = [], heights = [], centers = [], y = 0;
  for (var i = 0; i < scales.length; i++){
    var h = baseH * scales[i];
    tops.push(y); heights.push(h); centers.push(y + h / 2);
    y += h;
  }
  return {tops:tops, heights:heights, centers:centers, total:y};
}

/* ── イベント種別の見た目 ──
 * 種別ごとに色相と表示名を固定します (UI とテストの両方が参照)。   */
var EVENT_STYLE = {
  key:    {hue:205, label:"KEY"},
  motion: {hue:188, label:"MOTION"},
  edit:   {hue:145, label:"EDIT"},
  mode:   {hue:268, label:"MODE"},
  ex:     {hue:45,  label:"EX"},
  search: {hue:320, label:"SEARCH"},
  signal: {hue:52,  label:"SIGNAL"},
  tick:   {hue:18,  label:"TICK"},
  run:    {hue:168, label:"RUN"},
  io:     {hue:96,  label:"IO"},
  error:  {hue:358, label:"ERROR"}
};
function eventStyle(type){
  return EVENT_STYLE[type] || {hue:210, label:String(type == null ? "EVENT" : type).toUpperCase()};
}

/* 種別ごとの既定の強さ (明示的な mag がないイベントに使う) */
var EVENT_MAG = {
  key:0.22, motion:0.45, edit:0.66, mode:0.5, ex:0.7,
  search:0.8, signal:1, tick:0.75, run:0.85, io:0.9, error:1
};
function eventMag(type){
  var m = EVENT_MAG[type];
  return (m === undefined) ? 0.5 : m;
}

/* flashFrame(t, intensity)
 *   イベント処理フラッシュの 1 フレーム。t は 0→1 の進行、
 *   intensity は 0→1 の強さ。信号ランプのように「立ち上がりが速く、
 *   指数的に減衰する」包絡をとります (揺れも破片もありません)。
 *     env   — 包絡そのもの (0→1→0、ピークは t = ATTACK)
 *     glow  — 文字のにじみ (px)
 *     wash  — 行の下地の発光量 (0→1)
 *     edge  — 左端イベントマーカーの太さ (px)
 *     rise  — 処理中の行がわずかに浮く量 (px)
 *     sweep — 処理の光が行を走る位置 (0→1、t と同じ)
 *     -> { env, glow, wash, edge, rise, sweep }                       */
var FLASH_ATTACK = 0.12;
function flashFrame(t, intensity){
  intensity = (intensity === undefined) ? 1 : Math.max(0, Math.min(1, intensity));
  if (!(t > 0) || t >= 1) return {env:0, glow:0, wash:0, edge:0, rise:0, sweep:0};
  var shape = (t < FLASH_ATTACK) ? (t / FLASH_ATTACK) : Math.exp(-(t - FLASH_ATTACK) * 5.2);
  var env = shape * (1 - t) * intensity;
  return {
    env:   env,
    glow:  30  * env,
    wash:  0.9 * env,
    edge:  5   * env,
    rise:  7   * env,
    sweep: t
  };
}

/* =====================================================================
 * 7b. 多段落の文章、文のブロック、どアップと波打ち
 * ================================================================== */

/* splitParagraphs(lines)
 *   空行を区切りとして、行の並びを段落に分けます。空行そのものも
 *   「段落の隙間」として 1 件返すので、どの行にもカーソルを置けます。
 *     -> [{kind:"para"|"gap", from, to, lines:[…]}]                   */
function splitParagraphs(lines){
  var out = [], cur = null;
  for (var i = 0; i < lines.length; i++){
    var blank = /^\s*$/.test(lines[i]);
    if (blank){
      cur = null;
      out.push({kind:"gap", from:i, to:i, lines:[lines[i]]});
    } else {
      if (!cur){ cur = {kind:"para", from:i, to:i, lines:[]}; out.push(cur); }
      cur.to = i; cur.lines.push(lines[i]);
    }
  }
  return out;
}

/* CJK かどうか (行を継ぐときに空白を入れるかの判定に使う) */
function isCJK(ch){
  if (!ch) return false;
  return /[\u3000-\u303f\u3040-\u309f\u30a0-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uff60]/.test(ch);
}

/* lineSeparator(prev, next)
 *   段落内で行を継ぐときの区切り。和文どうしは詰めて continue し、
 *   欧文が絡むところだけ空白を入れます (日本語に余計な空白を入れない)。 */
function lineSeparator(prev, next){
  if (!prev || !next) return "";
  var a = prev.charAt(prev.length - 1), b = next.charAt(0);
  if (isCJK(a) || isCJK(b)) return "";
  return " ";
}

/* paragraphText(lines)
 *   段落を 1 本の文章に連結し、段落内オフセット → 行/桁 の対応表も返します。
 *     -> { text, map:[{l, start, len, sep}] }   l は lines 内の添字        */
function paragraphText(lines){
  var text = "", map = [];
  for (var i = 0; i < lines.length; i++){
    var sep = (i === 0) ? "" : lineSeparator(lines[i - 1], lines[i]);
    text += sep;
    map.push({l:i, start:text.length, len:lines[i].length, sep:sep});
    text += lines[i];
  }
  return {text:text, map:map};
}

/* offsetToLine(map, off) — 段落内オフセットを {l, c} に戻す */
function offsetToLine(map, off){
  if (!map.length) return {l:0, c:0};
  for (var i = 0; i < map.length; i++){
    var m = map[i];
    if (off < m.start) return {l:m.l, c:0};
    /* 行境界のオフセットは「次の行の先頭」に属する
       (そこにある文字は次の行の 1 文字目なので) */
    if (off < m.start + m.len) return {l:m.l, c:off - m.start};
  }
  var last = map[map.length - 1];
  return {l:last.l, c:last.len};
}

/* 文字クラス — 語の切れ目を見るために、ひらがな/カタカナ/漢字/ラテンを分ける */
function textClass(ch){
  if (!ch) return 0;
  if (/\s/.test(ch)) return 0;
  if (/[\u3040-\u309f]/.test(ch)) return 1;                    /* ひらがな */
  if (/[\u30a0-\u30ff\uff66-\uff9f]/.test(ch)) return 2;      /* カタカナ */
  if (/[\u3400-\u4dbf\u4e00-\u9fff]/.test(ch)) return 3;      /* 漢字 */
  if (/[A-Za-z0-9_'\u00c0-\u024f]/.test(ch)) return 4;         /* ラテン/数字 */
  return 5;                                                    /* 約物 */
}

/* wordAt(text, idx) — idx の位置にある「語」
 *   規則: ひらがな / カタカナ / 漢字 / ラテン・数字 / 約物 をそれぞれ 1 つの
 *   類とし、同じ類の連なりを 1 語とする。ただし漢字の直後に続くひらがなは
 *   送り仮名として同じ語に含める (「動く」「文章は」)。辞書は使わないため、
 *   カタカナと漢字の境目 (「カタカナ|語」) では語が分かれる。            */
function wordAt(text, idx){
  text = String(text == null ? "" : text);
  if (!text.length) return {from:0, to:0, text:""};
  idx = Math.max(0, Math.min(text.length - 1, idx));
  var cls = textClass(text.charAt(idx));
  if (cls === 0) return {from:idx, to:idx + 1, text:text.charAt(idx)};
  var a = idx, b = idx;
  while (a > 0 && textClass(text.charAt(a - 1)) === cls) a--;
  while (b < text.length - 1 && textClass(text.charAt(b + 1)) === cls) b++;

  /* 送り仮名 — 漢字の直後に続くひらがなは同じ語として扱う
     (「動く」「浮かび」のように、漢字とひらがなで 1 語になるため) */
  if (cls === 3){
    while (b < text.length - 1 && textClass(text.charAt(b + 1)) === 1) b++;
  } else if (cls === 1 && a > 0 && textClass(text.charAt(a - 1)) === 3){
    while (a > 0 && textClass(text.charAt(a - 1)) === 3) a--;
  }
  return {from:a, to:b + 1, text:text.slice(a, b + 1)};
}

/* 文の終止符か (ASCII の '.' は数値の小数点と紛れるので後続を見る) */
function isSentenceEnd(text, i){
  var ch = text.charAt(i);
  if ("。！？．…‥".indexOf(ch) >= 0) return true;
  if ("!?".indexOf(ch) >= 0) return true;
  if (ch === "."){
    var nx = text.charAt(i + 1);
    return nx === "" || /[\s"'\)\]」』]/.test(nx);
  }
  return false;
}

/* sentenceAt(text, idx) — idx を含む「文」。閉じ括弧は文末に含めます。 */
function sentenceAt(text, idx){
  text = String(text == null ? "" : text);
  if (!text.length) return {from:0, to:0, text:""};
  idx = Math.max(0, Math.min(text.length - 1, idx));
  var a = 0, i;
  for (i = idx - 1; i >= 0; i--){
    if (isSentenceEnd(text, i)){
      a = i + 1;
      while (a < text.length && /[\s」』\)\]”’]/.test(text.charAt(a))) a++;
      break;
    }
  }
  var b = text.length;
  for (i = idx; i < text.length; i++){
    if (isSentenceEnd(text, i)){
      b = i + 1;
      while (b < text.length && /[」』\)\]”’]/.test(text.charAt(b))) b++;
      break;
    }
  }
  if (a > idx) a = 0;
  return {from:a, to:b, text:text.slice(a, b)};
}

/* HTML エスケープ (描画とテストの両方から使う) */
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* markRange(lineText, lineStart, from, to)
 *   段落座標 [from,to) の強調範囲のうち、この行に掛かる部分だけを
 *   <span class="snap"> で包んだ HTML を返します。掛からなければ素の行。 */
function markRange(lineText, lineStart, from, to){
  lineText = String(lineText == null ? "" : lineText);
  if (from == null || to == null || !(to > from)) return escapeHtml(lineText);
  var end = lineStart + lineText.length;
  if (to <= lineStart || from >= end) return escapeHtml(lineText);
  var a = Math.max(0, from - lineStart);
  var b = Math.min(lineText.length, to - lineStart);
  return escapeHtml(lineText.slice(0, a)) +
         '<span class="snap">' + escapeHtml(lineText.slice(a, b)) + "</span>" +
         escapeHtml(lineText.slice(b));
}

/* splitSentences(text)
 *   文章を「文」のブロックに切り分けます。連結すると必ず元の文章に戻る
 *   (取りこぼしがない) ことをテストで保証しています。
 *     -> [{from, to, text}]                                           */
function splitSentences(text){
  text = String(text == null ? "" : text);
  if (!text.length) return [];
  var out = [], start = 0, i, e;
  for (i = 0; i < text.length; i++){
    if (!isSentenceEnd(text, i)) continue;
    e = i + 1;
    while (e < text.length && /[」』\)\]”’]/.test(text.charAt(e))) e++;
    out.push({from:start, to:e, text:text.slice(start, e)});
    start = e; i = e - 1;
  }
  if (start < text.length) out.push({from:start, to:text.length, text:text.slice(start)});
  return out;
}

/* blockPlan(lines)
 *   段落の行から「文のブロック」を組み立てます。1 つの文が複数行に
 *   またがることも、1 行が複数の文を含むこともあるので、ブロックは
 *   行の断片 (parts) の列として持ちます。
 *     -> [{from, to, parts:[{l, c0, text, sep}]}]
 *        l は lines 内の添字、c0 はその行の中での開始桁               */
function blockPlan(lines){
  var pt = paragraphText(lines);
  var sents = splitSentences(pt.text);
  if (!sents.length) sents = [{from:0, to:pt.text.length, text:pt.text}];
  var blocks = [], s, k;
  for (s = 0; s < sents.length; s++){
    var parts = [];
    for (k = 0; k < pt.map.length; k++){
      var m = pt.map[k];
      var a = Math.max(sents[s].from, m.start);
      var b = Math.min(sents[s].to, m.start + m.len);
      var touches = (b > a) || (m.len === 0 && m.start >= sents[s].from && m.start < sents[s].to);
      if (!touches) continue;
      /* 行を継ぐ区切り (欧文の空白) は、その位置を含むブロックが持つ */
      var sep = (m.sep && a === m.start && sents[s].from < m.start) ? m.sep : "";
      parts.push({l:k, c0:a - m.start, text:lines[k].slice(a - m.start, b - m.start), sep:sep});
    }
    blocks.push({from:sents[s].from, to:sents[s].to, parts:parts});
  }
  return blocks;
}

/* blockLayout(heights, scales)
 *   ブロックをその場で拡大したとき、上下が重ならないように各ブロックを
 *   どれだけ下へずらすかを求めます。マージンを動かさず transform だけで
 *   済ませるので、毎フレームのレイアウト再計算が起きません。
 *     offsets[i] = Σ_{j<i} h_j(s_j-1) + h_i(s_i-1)/2
 *     -> { offsets:[], extras:[], total }                             */
function blockLayout(heights, scales){
  var offsets = [], extras = [], acc = 0;
  for (var i = 0; i < heights.length; i++){
    var extra = heights[i] * ((scales[i] === undefined ? 1 : scales[i]) - 1);
    extras.push(extra);
    offsets.push(acc + extra / 2);
    acc += extra;
  }
  return {offsets:offsets, extras:extras, total:acc};
}

/* waveFrame(d, t, o)
 *   ポイントされたブロックから d ブロック離れたところの見え方。
 *   t は焦点が移ってからの進行 (0→1)。
 *     scale — その場のどアップ (ガウス核。d=0 が最大)
 *     x     — 波打ちの横ゆれ (焦点から外へ伝わる進行波。距離と時間で減衰)
 *     y     — 縦ゆれ。横の WAVE_Y 倍に抑えてある。ブロックは上下に
 *             隙間なく積まれているので、縦に大きく振ると文字が重なる。
 *             行間に収まる範囲だけ動かし、波の主役は横ゆれに任せる
 *     glow  — 波の腹で明るくなるフラッシュ量
 *     -> { scale, x, y, glow, gauss, env }                            */
var WAVE_Y = 0.15;
function waveFrame(d, t, o){
  o = o || {};
  var peak   = (o.peak   === undefined) ? 1.9  : o.peak;
  var spread = (o.spread === undefined) ? 1.6  : Math.max(0.3, o.spread);
  var amp    = (o.amp    === undefined) ? 22   : o.amp;
  var kNum   = (o.k      === undefined) ? 1.15 : o.k;
  var omega  = (o.omega  === undefined) ? 3.4  : o.omega;
  var lambda = (o.lambda === undefined) ? 3.2  : Math.max(0.3, o.lambda);
  var depth  = (o.depth  === undefined) ? 1    : Math.max(0, Math.min(1, o.depth));

  var ad = Math.abs(d);
  var gauss = Math.exp(-(ad * ad) / (2 * spread * spread));
  var scale = 1 + (peak - 1) * gauss * depth;

  var tt = t;
  if (!(tt > 0) || tt >= 1) return {scale:scale, x:0, y:0, glow:0, gauss:gauss, env:0};
  var env = Math.pow(1 - tt, 1.6);
  var phase = kNum * ad - omega * tt * Math.PI * 2;
  var swing = Math.sin(phase);
  var fall = Math.exp(-ad / lambda);
  var a = amp * fall * env * depth;
  return {
    scale: scale,
    x:     a * swing,
    /* 1/4 周期ずらすことで、横ゆれと合わせて緩やかな楕円を描く */
    y:     a * WAVE_Y * Math.sin(phase + Math.PI / 2),
    glow:  Math.abs(swing) * fall * env * depth,
    gauss: gauss,
    env:   env
  };
}

/* どアップの倍率の段階 (ホイールや :set peak= で行き来する) */
var PEAK_STEPS = [1.25, 1.5, 1.9, 2.4, 3, 3.8];
function peakStep(v, dir){
  var i = 0, best = 1e9, k;
  for (k = 0; k < PEAK_STEPS.length; k++){
    var dd = Math.abs(PEAK_STEPS[k] - v);
    if (dd < best){ best = dd; i = k; }
  }
  i = Math.max(0, Math.min(PEAK_STEPS.length - 1, i + dir));
  return PEAK_STEPS[i];
}

/* countdownState(elapsed, total)
 *   映画のアカデミー・リーダー。残り秒 n と、その 1 秒間の進行 phase、
 *   掃引する指針の角度 sweep を返します。
 *     -> { n, label, phase, sweep, done, remaining }                   */
function countdownState(elapsed, total){
  var remaining = total - elapsed;
  if (!(remaining > 0)){
    return {n:0, label:"0", phase:1, sweep:Math.PI * 2, done:true, remaining:0};
  }
  var n = Math.ceil(remaining);
  var frac = remaining - (n - 1);              /* 1 → 0 でその秒が進む */
  var phase = 1 - frac;                        /* 0 → 1 */
  return {
    n: n, label: String(n), phase: phase,
    sweep: phase * Math.PI * 2, done: false, remaining: remaining
  };
}

/* 行番号の桁数 (ガター幅) */
function gutterWidth(n){ return String(Math.max(1, n)).length; }

/* =====================================================================
 * 8. UI — ここから下だけが DOM / Canvas / Audio に触れます
 * ================================================================== */
function boot(){
  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), layers = $("layers"), doc = $("doc"), caret = $("caret"),
      selLayer = $("selLayer"), fx = $("fx"), leader = $("leader"), out = $("out"),
      hud = $("hud"), hudNum = $("hudNum"), hudLbl = $("hudLbl"), helpEl = $("help"),
      keysBar = $("keys"), hidden = $("hidden"), fileIn = $("fileIn"),
      side = $("side"), busEl = $("bus"), meterEl = $("meter"), blast = $("blast"),
      page = $("page");

  var ST = vimNew(PROSE_SRC, "bada-reader.txt");
  var BASE_H = 30, WIN = 70;
  var lineEls = [], winLo = 0, winHi = 0, lastText = null, lastCurL = -1;
  var live = [];        /* ディスパッチ中のイベント {line, type, mag, t0, seq} */
  var busLog = [];      /* イベントバスの表示用ログ (新しい順) */
  var rate = [];        /* 直近のディスパッチ数 (スループット計) */
  var blastT0 = 0, blastMag = 0;
  var CD = null;                        /* {total, t0, lastTick, flash} */
  var AC = null, blinkT = 0, dirtyDom = true, docX = 0, busDirty = true;
  var WAVE_MS = 900;    /* 波が伝わって収まるまで */
  var fxc = fx.getContext("2d"), ldc = leader.getContext("2d");
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var FLASH_MS = 520;   /* 1 イベントの処理表示時間 */

  /* ── 音 (合成: 外部ファイルなし) ── */
  function audio(){
    if (!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { AC = new C(); } catch (e){ return null; }
    }
    if (AC.state === "suspended") AC.resume();
    return AC;
  }
  /* イベントごとの短いブリップ (種別で音程が変わる。破砕音ではない) */
  function blip(type, mag){
    if (!ST.opts.sound) return;
    var ac = audio(); if (!ac) return;
    var hue = eventStyle(type).hue;
    var freq = 320 + (hue / 360) * 760;            /* 色相と同じ並びで音程を決める */
    var vol = 0.035 + 0.085 * Math.max(0, Math.min(1, mag));
    var t = ac.currentTime, g = ac.createGain(), o = ac.createOscillator();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o.type = "triangle";
    o.frequency.setValueAtTime(freq, t);
