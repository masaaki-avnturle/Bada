[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-critical-guard"
version = "0.2.0"
description = "擬似量子VMをフィードバック制御器に使う臨界連鎖防止シミュレーション（教育用分岐過程モデル、実機解析不可）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Masaaki Yamaguchi" }]
keywords = ["branching-process", "criticality-safety", "simulation", "pseudo-quantum", "bada", "omega"]
dependencies = ["omega-mobius-drive"]

[project.scripts]
omega-critical-guard = "omega_critical_guard.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["omega_critical_guard"]
