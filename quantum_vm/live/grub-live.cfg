# ============================================================================
# grub-live.cfg — the REAL GRUB 2 menu of the BadaOS live ISO.
# This is what the PC shows at power-on when booting the USB stick / ISO.
# (ASCII-only entries so they render on every BIOS/UEFI console.)
# ============================================================================
set default=0
set timeout=8

if loadfont unicode ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

# BadaOS Commander look (System Commander style menu colors)
set menu_color_normal=white/blue
set menu_color_highlight=yellow/red
set color_normal=light-cyan/black
set color_highlight=yellow/blue

menuentry "BadaOS GNU/Quantum 12.0 (Live)" {
    linux  /live/vmlinuz boot=live quiet
    initrd /live/initrd
}

menuentry "BadaOS GNU/Quantum 12.0 (Live, copy to RAM / toram)" {
    linux  /live/vmlinuz boot=live toram quiet
    initrd /live/initrd
}

menuentry "BadaOS console (text only -- sudo badaos-install for a real disk)" {
    linux  /live/vmlinuz boot=live textonly quiet
    initrd /live/initrd
}

menuentry "Install BadaOS into FREE SPACE of /dev/vda (VM, keeps other partitions)" {
    linux  /live/vmlinuz boot=live textonly badaos.autoinstall-free=/dev/vda quiet
    initrd /live/initrd
}

menuentry "Install BadaOS to /dev/vda (VIRTUAL MACHINE, unattended -- ERASES vda)" {
    linux  /live/vmlinuz boot=live textonly badaos.autoinstall=/dev/vda quiet
    initrd /live/initrd
}
