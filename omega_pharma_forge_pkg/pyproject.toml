[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-pharma-forge"
version = "0.1.0"
description = "擬似量子VMで触媒投与を制御する自己触媒連鎖の反応速度論シミュレーション（教育用抽象モデル・実合成には使用不可）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Masaaki Yamaguchi" }]
keywords = ["reaction-kinetics", "autocatalysis", "mass-action", "simulation", "pseudo-quantum", "bada", "omega"]
dependencies = ["omega-mobius-drive"]

[project.scripts]
omega-pharma-forge = "omega_pharma_forge.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["omega_pharma_forge"]
