<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omega_neurothermal — Gamma-Manifold Neuro-Thermal Workbench</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">
    <h1>omega_neurothermal</h1>
    <p>Gamma-Manifold Neuro-Thermal Workbench &middot;
       <code>T' = &int; &Gamma;(&gamma;)' dx<sub>m</sub></code></p>
  </div>
  <div class="warn">教育・可視化シミュレーション / not a medical device</div>
</header>

<!-- 全アプリ共通: 赤外線センサー + 温度計 のセンサーバー -->
<section id="sensorbar" class="sensorbar">
  <div class="gauge" id="g-ir">
    <span class="lbl">🔴 赤外線センサー (IR)</span>
    <span class="val" id="v-ir">--</span><span class="unit">°C</span>
    <div class="meter"><div class="fill" id="m-ir"></div></div>
  </div>
  <div class="gauge" id="g-th">
    <span class="lbl">🌡️ 温度計 (Thermo)</span>
    <span class="val" id="v-th">--</span><span class="unit">°C</span>
    <div class="meter"><div class="fill" id="m-th"></div></div>
  </div>
  <div class="gauge" id="g-fu">
    <span class="lbl">⚖️ 融合体温 (Fused)</span>
    <span class="val" id="v-fu">--</span><span class="unit">°C</span>
    <div class="meter"><div class="fill" id="m-fu"></div></div>
  </div>
  <div class="gauge" id="g-en">
    <span class="lbl">Γ熱エネルギー T'</span>
    <span class="val" id="v-en">--</span><span class="unit">Ω</span>
    <div class="meter"><div class="fill" id="m-en"></div></div>
  </div>
  <label class="live"><input type="checkbox" id="live" checked> ライブ更新</label>
</section>

<nav id="tabs"></nav>

<main id="panel"><div class="loading">読み込み中…</div></main>

<footer>omega_neurothermal &middot; C99 + dependency-free web GUI &middot;
  全API応答に赤外線センサー・温度計の現在値を同梱</footer>

<script src="app.js"></script>
</body>
</html>
