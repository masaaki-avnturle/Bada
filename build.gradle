// Bada — root build.
// Provides an aggregate `assembleDebug` task that produces a debug build of
// every application in the repository. Run a single app with, e.g.:
//   gradle :omega_finance_pkg:assembleDebug
plugins { id 'base' }

tasks.register('assembleDebug') {
    group = 'build'
    description = 'Assembles a debug build of every application in the repository.'
    dependsOn subprojects.collect { "${it.path}:assembleDebug" }
}

tasks.named('assemble') { dependsOn 'assembleDebug' }
