<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BADA SPACE — 空間コンピューティング</title>
<style>
:root{--txt:rgba(240,246,255,.96);--txt2:rgba(180,198,230,.66);--accent:#8fd0ff;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overscroll-behavior:none}
body{background:#05070e;color:var(--txt);font-family:-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
 height:100vh;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#env{position:fixed;inset:0;display:block;touch-action:none;z-index:0}
#space{position:fixed;inset:0;z-index:1;touch-action:none}

/* 視線レティクル（gaze） */
#gaze{position:fixed;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(200,230,255,.55);
 transform:translate(-50%,-50%);pointer-events:none;z-index:60;box-shadow:0 0 14px rgba(143,208,255,.5);mix-blend-mode:screen;transition:width .12s,height .12s}
#gaze::after{content:'';position:absolute;inset:8px;border-radius:50%;background:rgba(210,235,255,.75)}

/* グラス・ウィンドウ（visionOS 参考） */
.win{position:absolute;z-index:10;border-radius:26px;overflow:hidden;
 background:rgba(20,28,48,.42);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
 border:1px solid rgba(180,210,255,.18);
 box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 60px rgba(80,130,220,.05);
 transition:box-shadow .2s;will-change:transform}
.win.hover{box-shadow:0 40px 100px rgba(0,0,0,.6), 0 0 0 1.5px rgba(160,210,255,.55), inset 0 1px 0 rgba(255,255,255,.2)}
.win .wb{width:100%;height:100%;padding:16px 18px;display:flex;flex-direction:column;overflow:hidden}
.win .close{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;
 background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);color:rgba(230,240,255,.85);
 font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;opacity:0;transition:.15s}
.win.hover .close{opacity:1}
.win .grab{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:74px;height:6px;border-radius:4px;
 background:rgba(210,225,255,.35);cursor:grab;z-index:3}
.win .grab:active{cursor:grabbing}
.wtitle{font-size:12px;letter-spacing:.14em;color:var(--txt2);text-transform:uppercase;margin-bottom:8px;font-weight:600}

/* clock */
.clock-t{font-size:52px;font-weight:250;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.clock-d{font-size:13px;color:var(--txt2);margin-top:8px;letter-spacing:.1em}
/* photo */
.photo{flex:1;border-radius:14px;background-size:cover;filter:saturate(1.1)}
/* music */
.mrow{display:flex;gap:12px;align-items:center}
.mart{width:56px;height:56px;border-radius:12px;flex:0 0 auto;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.mtitle{font-size:15px;font-weight:600}.martist{font-size:11px;color:var(--txt2);margin-top:3px}
.mwave{flex:1;height:44px;margin-top:12px}
.mbtn{margin-top:10px;display:flex;gap:10px;align-items:center;justify-content:center}
.mb{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
 color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mb.play{width:46px;height:46px;font-size:17px;background:rgba(143,208,255,.22);border-color:rgba(143,208,255,.5)}
/* browser */
.badr{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);
 border-radius:11px;padding:7px 11px;font-size:11px;color:var(--txt2);margin-bottom:10px}
.badr .dot{width:8px;height:8px;border-radius:50%;background:#5cd08a}
.bpage{flex:1;overflow:hidden}
.bpage h3{font-size:16px;font-weight:700;margin-bottom:8px;color:rgba(235,244,255,.97)}
.bline{height:8px;border-radius:4px;background:rgba(200,220,255,.14);margin:7px 0}
/* weather */
.wtemp{font-size:44px;font-weight:250;line-height:1}
.wcond{font-size:12px;color:var(--txt2);margin-top:4px;letter-spacing:.08em}
.whrs{display:flex;gap:8px;margin-top:14px;align-items:flex-end;flex:1}
.whr{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.whr .bar{width:70%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#8fd0ff,#5a7bff)}
.whr .h{font-size:9px;color:var(--txt2)}
/* 3d */
.obj{flex:1}
/* news（実物のインターネットTVニュース動画） */
.nv{position:relative;flex:1;border-radius:14px;overflow:hidden;background:#000;min-height:96px}
.nv video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.nlive{position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.14em;
 background:rgba(206,42,52,.9);padding:3px 7px;border-radius:5px;color:#fff;font-weight:700}
.nlive .d{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.nlower{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 10px 7px;font-size:10px;color:#fff;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)}
.nstat{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;text-align:center;
 padding:14px;font-size:10.5px;line-height:1.5;color:#dbeaff;background:rgba(3,6,14,.8)}
.nstat.show{display:flex}
.nstat .spin{width:22px;height:22px;border:2px solid rgba(143,208,255,.3);border-top-color:#8fd0ff;border-radius:50%;
 margin:0 auto 10px;animation:nspin .9s linear infinite}
@keyframes nspin{to{transform:rotate(360deg)}}
.nctl{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.nch,.nbtn{font-size:9.5px;padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
 background:rgba(30,42,70,.6);border:1px solid rgba(180,210,255,.2);color:rgba(215,230,255,.85);transition:.12s}
.nch.on,.nbtn.on{background:rgba(143,208,255,.25);border-color:rgba(143,208,255,.55);color:#fff}
.nurl{display:flex;gap:5px;margin-top:6px}
.nurl input{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(180,210,255,.2);border-radius:8px;
 color:#dff0ff;font-size:9.5px;padding:5px 7px;min-width:0;outline:none}
.nnote{font-size:7.5px;color:rgba(150,175,215,.6);margin-top:5px;line-height:1.4}
/* トランスポート（早送り/巻き戻し/シーク/速度）— Bada 言語で駆動 */
.ntime{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:9px;color:var(--txt2);font-variant-numeric:tabular-nums}
.nseek{flex:1;accent-color:#8fd0ff;height:4px;min-width:0}
.ntrans{display:flex;gap:7px;margin-top:8px;align-items:center;justify-content:center}
.tb{width:34px;height:34px;border-radius:50%;background:rgba(30,42,70,.6);border:1px solid rgba(180,210,255,.2);
 color:#dfeaff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;position:relative}
.tb:hover{background:rgba(50,84,150,.6)}
.tb.play{width:42px;height:42px;font-size:15px;background:rgba(143,208,255,.22);border-color:rgba(143,208,255,.5)}
.tb small{position:absolute;bottom:-2px;font-size:6px;opacity:.8}
.tb:disabled{opacity:.3;cursor:not-allowed}
.trate{font-size:9px;padding:5px 8px;border-radius:8px;background:rgba(30,42,70,.6);border:1px solid rgba(180,210,255,.2);color:#dfeaff;cursor:pointer;flex:0 0 auto}
.nplay-ov{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;cursor:pointer;background:rgba(3,6,14,.28)}
.nplay-ov.show{display:flex}
.nplay-ov .big{width:54px;height:54px;border-radius:50%;background:rgba(143,208,255,.92);color:#05203a;font-size:22px;
 display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.bconsole{margin-top:7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:7.5px;line-height:1.55;color:rgba(150,200,255,.75);
 background:rgba(0,0,0,.3);border:1px solid rgba(120,170,255,.16);border-radius:8px;padding:6px 8px;max-height:46px;overflow:auto;white-space:pre-wrap}
.bconsole b{color:#8fd0ff;letter-spacing:.1em}
.win.newswin .wb{overflow-y:auto}

/* 上部ステータス */
#status{position:fixed;top:16px;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
 padding:0 22px;pointer-events:none;font-weight:300}
#status .l{font-size:12px;letter-spacing:.3em;color:rgba(200,225,255,.7)}
#status .l small{display:block;font-size:7.5px;letter-spacing:.28em;color:var(--txt2);margin-top:3px}
#status .c{font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.1em;color:rgba(210,230,255,.85)}
#status .r{font-size:9px;letter-spacing:.2em;color:var(--txt2);text-align:right;line-height:1.7}
#status .r b{color:rgba(190,220,255,.9)}

/* 下部コントロール（Digital Crown 相当の没入ダイヤル / Home / 環境） */
#dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px;
 background:rgba(16,24,44,.42);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 border:1px solid rgba(180,210,255,.18);border-radius:22px;padding:12px 18px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.dbtn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(180,210,255,.22);background:rgba(24,34,58,.55);
 color:rgba(220,235,255,.92);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;touch-action:manipulation}
.dbtn:hover{background:rgba(50,84,150,.6)}
.imm{display:flex;flex-direction:column;gap:3px;min-width:150px}
.imm label{font-size:8px;letter-spacing:.2em;color:var(--txt2);text-transform:uppercase}
.imm input{width:100%;accent-color:#8fd0ff}
#env-name{font-size:11px;color:var(--txt2);letter-spacing:.1em;min-width:96px;text-align:center}

/* ホームビュー（アプリグリッド） */
#home{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;
 background:rgba(6,9,16,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#home.show{display:flex}
#home .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;max-width:520px;padding:24px}
.appi{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;transition:.18s}
.appi:hover{transform:scale(1.12)}
.appi .ic{width:74px;height:74px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:32px;
 background:rgba(30,42,70,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border:1px solid rgba(180,210,255,.2);box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.16)}
.appi .nm{font-size:10px;letter-spacing:.08em;color:rgba(210,225,255,.85)}
#toast{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:70;pointer-events:none;
 background:rgba(10,18,34,.95);border:1px solid rgba(143,208,255,.5);color:#dff0ff;font-size:12px;padding:9px 15px;border-radius:9px;opacity:0;transition:opacity .3s}
#note{position:fixed;left:0;right:0;bottom:3px;text-align:center;font-size:8px;color:rgba(120,150,195,.5);z-index:5;pointer-events:none}
</style>
</head>
<body>
<canvas id="env"></canvas>
<div id="space"></div>
<div id="gaze"></div>

<div id="status">
  <div class="l">BADA SPACE<small>空間コンピューティング · visionOS 参考</small></div>
  <div class="c" id="clock">--:--</div>
  <div class="r"><div>環境 <b id="st-env">—</b></div><div>没入 <b id="st-imm">—</b></div></div>
</div>

<div id="home"><div class="grid" id="home-grid"></div></div>

<div id="dock">
  <button class="dbtn" id="d-home" title="ホーム">⌂</button>
  <button class="dbtn" id="d-env" title="環境切替">◑</button>
  <span id="env-name">—</span>
  <div class="imm"><label>没入 / IMMERSION</label><input type="range" id="imm" min="0" max="1" step="0.01" value="0.35"></div>
  <button class="dbtn" id="d-reset" title="ウィンドウ整列">▦</button>
</div>

<div id="toast"></div>
<div id="note">※ Apple Vision Pro / visionOS の空間UIを参考にしたオリジナルデザインです（Apple のロゴ・商標・製品名は不使用、Apple とは無関係）。</div>

<!-- 実写プレーヤーのトランスポート制御プログラム（Bada 言語）。内蔵インタプリタが実行する。 -->
<script type="application/x-bada" id="bada-src">
# player.bada — Bada 言語で書いた実写動画プレーヤーの制御プログラム
# bada_ruby の Interpreter と同じ演算子・名前空間文法。
set fwd    = 10
set back   = -10
set rate   = 1.0
set cursor = 0

# 実行証跡：進行位置に大域的部分積分多様体の不変量を効かせる
cursor <- "global manifold transport"
cursor -< 1.0
cursor >- cursor
Omega::push cursor as transport_node
print cursor

# トランスポート命令（各ボタンのタップで1行ずつ実行される）
#   ▶ Media::play   ⏸ Media::pause   ⏩ Media::seek fwd   ⏪ Media::seek back
#   ⏭ Media::channel next   ⏮ Media::channel prev   速度 Media::rate rate
</script>

<script>
// ═══════════════════════════════════════════════════════════════
// 環境（空間の背景）
// ═══════════════════════════════════════════════════════════════
const env=document.getElementById('env'),ex=env.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;env.width=W*DPR;env.height=H*DPR;ex.setTransform(DPR,0,0,DPR,0,0);layoutIfNeeded();}
addEventListener('resize',resize);
const ENVS=[
 {name:'Dawn Peak', a:[255,154,107], b:[106,123,255], c:[10,16,48]},
 {name:'Aurora',    a:[58,255,192],  b:[106,91,255],  c:[5,16,26]},
 {name:'Deep Space',a:[42,58,106],   b:[16,20,38],    c:[4,6,13]},
 {name:'Sunset Bay',a:[255,120,90],  b:[150,80,200],  c:[12,8,26]}
];
let envIdx=0, immersion=0.35;
const BOKEH=[];for(let i=0;i<46;i++)BOKEH.push({x:Math.random(),y:Math.random(),z:Math.random(),r:Math.random()*40+10});
let animT=0, tpx=0,tpy=0,px=0,py=0;
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c,al){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+al+')';}
function drawEnv(){
 const e=ENVS[envIdx];
 // 没入で暗い c 側へ寄せる
 const top=mix(e.a, e.c, immersion*0.85), midc=mix(e.b, e.c, immersion*0.7), bot=e.c;
 const g=ex.createLinearGradient(0,0,0,H);
 g.addColorStop(0,rgb(top,1));g.addColorStop(0.55,rgb(midc,1));g.addColorStop(1,rgb(bot,1));
 ex.fillStyle=g;ex.fillRect(0,0,W,H);
 // ボケ（bokeh）粒子
 BOKEH.forEach(b=>{const x=((b.x+animT*0.005*b.z)%1.1-0.05)*W+px*40*b.z, y=b.y*H+py*30*b.z;
  const rr=b.r*(0.5+b.z);const gg=ex.createRadialGradient(x,y,0,x,y,rr);
  const col=mix(e.a,e.b,b.x);gg.addColorStop(0,rgb(col,(0.05+0.10*b.z)*(0.4+immersion)));gg.addColorStop(1,rgb(col,0));
  ex.fillStyle=gg;ex.beginPath();ex.arc(x,y,rr,0,7);ex.fill();});
 // 没入時の星
 if(immersion>0.4){ex.fillStyle='rgba(230,240,255,'+((immersion-0.4)*0.5)+')';
  for(let i=0;i<80;i++){const x=((i*97+animT*3)%W), y=(i*53)%H;ex.fillRect(x,y,1.3,1.3);}}
 // ヴィネット
 const v=ex.createRadialGradient(W/2,H*0.5,H*0.3,W/2,H*0.5,Math.max(W,H)*0.75);
 v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,'+(0.25+immersion*0.4)+')');
 ex.fillStyle=v;ex.fillRect(0,0,W,H);
}

// ═══════════════════════════════════════════════════════════════
// 浮遊ウィンドウ
// ═══════════════════════════════════════════════════════════════
const space=document.getElementById('space');
const WINDOWS=[
 {id:'clock',  title:'時計',      w:250,h:150, dx:-0.30,dy:-0.16, depth:0.6, open:true},
 {id:'music',  title:'ミュージック',w:280,h:210, dx:0.24, dy:-0.10, depth:1.0, open:true},
 {id:'photo',  title:'写真',      w:300,h:200, dx:-0.26,dy:0.20, depth:0.8, open:true},
 {id:'browser',title:'ブラウザ',   w:320,h:220, dx:0.28, dy:0.22, depth:0.5, open:true},
 {id:'weather',title:'天気',      w:250,h:180, dx:-0.04,dy:-0.28, depth:1.2, open:true},
 {id:'news',   title:'実写プレーヤー',w:388,h:454, dx:0.05, dy:0.0, depth:0.7, open:true},
 {id:'object', title:'3D オブジェクト',w:230,h:200, dx:-0.34,dy:0.30, depth:1.4, open:false}
];
const APPS=[
 {id:'news',ic:'📺',nm:'ニュース'},
 {id:'clock',ic:'🕐',nm:'時計'},{id:'music',ic:'🎵',nm:'ミュージック'},{id:'photo',ic:'🏔',nm:'写真'},
 {id:'browser',ic:'🌐',nm:'ブラウザ'},{id:'weather',ic:'⛅',nm:'天気'},{id:'object',ic:'🧊',nm:'3D'}
];
const byId={};
function buildWindows(){
 WINDOWS.forEach(w=>{
  const el=document.createElement('div');el.className='win'+(w.id==='news'?' newswin':'');el.style.width=w.w+'px';el.style.height=w.h+'px';
  el.innerHTML='<div class="close">✕</div><div class="wb" id="wb-'+w.id+'"></div><div class="grab"></div>';
  space.appendChild(el);w.el=el;byId[w.id]=w;
  el.querySelector('.close').onclick=(e)=>{e.stopPropagation();w.open=false;el.style.display='none';if(w.id==='news')nCleanup();};
  el.addEventListener('pointerenter',()=>{w.hover=true;el.classList.add('hover');bringFront(w);});
  el.addEventListener('pointerleave',()=>{w.hover=false;el.classList.remove('hover');});
  const grab=el.querySelector('.grab');
  grab.addEventListener('pointerdown',e=>{e.preventDefault();startDrag(w,e);grab.setPointerCapture(e.pointerId);});
  renderContent(w);
 });
 layout();
}
let zTop=10;
function bringFront(w){zTop++;w.el.style.zIndex=zTop;}

function renderContent(w){
 const b=w.el.querySelector('.wb');
 if(w.id==='clock'){b.innerHTML='<div class="wtitle">時計</div><div class="clock-t" id="ck-t">--:--</div><div class="clock-d" id="ck-d"></div>';}
 else if(w.id==='music'){b.innerHTML='<div class="wtitle">再生中</div><div class="mrow"><div class="mart" id="mart"></div>'+
   '<div><div class="mtitle">Global Manifold</div><div class="martist">Bada Sound · β(p,q)</div></div></div>'+
   '<canvas class="mwave" id="mwave"></canvas><div class="mbtn"><div class="mb">⏮</div><div class="mb play" id="mplay">▶</div><div class="mb">⏭</div></div>';}
 else if(w.id==='photo'){b.innerHTML='<div class="wtitle">写真</div><div class="photo" id="photo"></div>';}
 else if(w.id==='browser'){b.innerHTML='<div class="wtitle">ブラウザ</div><div class="badr"><span class="dot"></span>bada.space/spatial</div>'+
   '<div class="bpage"><h3>空間コンピューティングへようこそ</h3><div class="bline" style="width:96%"></div><div class="bline" style="width:88%"></div><div class="bline" style="width:92%"></div><div class="bline" style="width:70%"></div></div>';}
 else if(w.id==='weather'){b.innerHTML='<div class="wtitle">天気 · 東京</div><div class="wtemp">22°</div><div class="wcond">晴れ時々くもり</div><div class="whrs" id="whrs"></div>';}
 else if(w.id==='news'){b.innerHTML='<div class="wtitle">実写プレーヤー · Bada 言語駆動</div>'+

// 実写プレーヤー — トランスポートを「Bada 言語」で駆動
//   ・実写のパブリックドメイン動画（シーク可＝早送り/巻き戻し）＋各局ライブ
//   ・内蔵 Bada インタプリタ（bada_ruby と同じ演算子/名前空間文法）が
//     player.bada を実行し、Media:: 命令で <video> を制御する
// ═══════════════════════════════════════════════════════════════

// ── Bada 数理（language.rb の Special/Manifold を JS に移植）──
function bXLogX(x){return x<=0?0:x*Math.log(x);}
function bManifoldElement(x){const d=bXLogX(x);const dd=d*d;return dd>1e-12?1/dd:0;}
function bXi(str){ // 文字列の大域的部分積分多様体不変量（シャノン基準）
 const toks=String(str).match(/[A-Za-z0-9_]+|[぀-ヿ㐀-鿿]/g)||['_'];
 const f={};toks.forEach(t=>f[t]=(f[t]||0)+1);const n=toks.length;let H=0;
 Object.values(f).forEach(c=>{const p=c/n;H-=p*Math.log2(p);});
 return H/Math.log(n+1)+bManifoldElement(n+2);
}
// ── BadaNode：<- / -< / >- 演算子 ──
function BadaNode(v){this.value=v||0;this.history=[];}
BadaNode.prototype.coerce=function(v){return typeof v==='number'?v:(v instanceof BadaNode?v.value:bXi(v));};
BadaNode.prototype.leftAct=function(inp){const chi=this.coerce(inp);const x=(Math.abs(this.value)<1e-9?1:Math.abs(this.value))+1;
 this.value=Math.abs(Math.PI*chi*Math.log(x));this.history.push(['<-',inp]);return this;};
BadaNode.prototype.manifoldIntegral=function(s){const v=s==null?this.value:this.coerce(s);const x=Math.abs(v)+2;
 this.value=bXLogX(x)*bManifoldElement(x)+bManifoldElement(x);this.history.push(['-<',s]);return this;};
BadaNode.prototype.rightAct=function(o){const v=o==null?this.value:this.coerce(o);const x=Math.abs(v)+1e-6;
 this.value=Math.exp(-bXLogX(x));this.history.push(['>-',o]);return this;};

// ── Bada インタプリタ（set / <- / -< / >- / Omega::push / print / Media::）──
function BadaInterp(onMedia){this.env={};this.out=[];this.onMedia=onMedia;}
BadaInterp.prototype.evalExpr=function(s){s=s.trim();let m;
 if((m=s.match(/^"(.*)"$/)))return m[1];
 if(/^[-+]?\d+(?:\.\d+)?$/.test(s))return parseFloat(s);
 if(this.env.hasOwnProperty(s))return this.env[s];
 return s;};
BadaInterp.prototype.valOf=function(x){return x instanceof BadaNode?x.value:x;};
BadaInterp.prototype.nodef=function(n){if(!(this.env[n] instanceof BadaNode))this.env[n]=new BadaNode(typeof this.env[n]==='number'?this.env[n]:0);return this.env[n];};
BadaInterp.prototype.exec=function(line){let m;
 if((m=line.match(/^set\s+(\w+)\s*=\s*(.+)$/))){const v=this.evalExpr(m[2]);this.env[m[1]]=(typeof v==='number')?v:new BadaNode(bXi(v));return;}
 if((m=line.match(/^(\w+)\s*<-\s*(.+)$/))){this.nodef(m[1]).leftAct(this.evalExpr(m[2]));return;}
 if((m=line.match(/^(\w+)\s*-<\s*(.+)$/))){this.nodef(m[1]).manifoldIntegral(this.evalExpr(m[2]));return;}
 if((m=line.match(/^(\w+)\s*>-\s*(.+)$/))){this.nodef(m[1]).rightAct(this.evalExpr(m[2]));return;}
 if((m=line.match(/^(?:Omega|Ω)::push\s+(\w+)(?:\s+as\s+(\w+))?$/))){const n=this.nodef(m[1]);
  this.out.push('Ω::push '+(m[2]||'node')+' (Ξ='+n.value.toFixed(4)+')');return;}
 if((m=line.match(/^print\s+(.+)$/))){const v=this.evalExpr(m[1]);this.out.push(String(this.valOf(v)));return;}
 if((m=line.match(/^Media::(\w+)(?:\s+(.+))?$/))){const cmd=m[1];const arg=m[2]?m[2].trim():null;
  let val=null;if(arg!=null){const e=this.evalExpr(arg);val=(e==='next'||e==='prev')?e:this.valOf(e);}
  if(this.onMedia)this.onMedia(cmd,val);this.out.push('Media::'+cmd+(arg!=null?' '+arg:''));return;}
 throw new Error('Bada syntax error: '+line);};
BadaInterp.prototype.run=function(src){String(src).split('\n').forEach(raw=>{
 const line=raw.replace(/#.*$/,'').trim();if(line)this.exec(line);});return this.out;};

// Bada の Media:: 命令を <video> に適用（＝早送り/巻き戻し等の実体）
function applyMedia(cmd,val,vid){vid=vid||nplayer;if(!vid)return;
 switch(cmd){
  case 'play': if(vid.play){const p=vid.play();if(p&&p.catch)p.catch(()=>{});}else{vid.paused=false;} break;
  case 'pause': if(vid.pause)vid.pause();else vid.paused=true; break;
  case 'toggle': (vid.paused?applyMedia('play',null,vid):applyMedia('pause',null,vid)); break;
  case 'seek': if(typeof val==='number'){let t=(vid.currentTime||0)+val;t=Math.max(0,t);
    if(isFinite(vid.duration)&&vid.duration>0)t=Math.min(t,vid.duration-0.2);try{vid.currentTime=t;}catch(e){}} break;
  case 'rate': if(typeof val==='number'){nRate=val;vid.playbackRate=val;} break;
  case 'channel': if(val==='next')nSelect(nIndex+1);else if(val==='prev')nSelect(nIndex-1);
    else if(typeof val==='number')nSelect(val|0); break;
 }
}

 }
 const au=document.getElementById('naudio');if(au)au.onclick=()=>{nAudio=!nAudio;au.classList.toggle('on',nAudio);
  au.textContent=nAudio?'🔊 音声 ON':'🔇 ミュート';if(nplayer){nplayer.muted=!nAudio;nplayer.play().catch(()=>{});}};
 const fl=document.getElementById('nfull');if(fl)fl.onclick=()=>{const wrap=nplayer.parentElement;
  if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen();}
  else{(wrap.requestFullscreen||wrap.webkitRequestFullscreen||nplayer.webkitEnterFullscreen||function(){}).call(wrap);}};
 const add=document.getElementById('nadd');if(add)add.onclick=()=>{const inp=document.getElementById('ncust');const u=inp.value.trim();if(!u)return;
  const kind=/\.m3u8(\?|#|$)/i.test(u)?'live':'vod';
  NEWS_CHANNELS.push({name:'追加'+(NEWS_CHANNELS.length),desc:'あなたが貼り付けたURL（'+(kind==='vod'?'シーク可':'ライブ')+'）',url:u,kind});
  inp.value='';nBuildList();nSelect(NEWS_CHANNELS.length-1);};
 nBuildList();
 nSelect(nIndex>=0?nIndex:0); // 先頭＝実写VOD へ自動接続（実映像＋シーク可）
}

// ═══════════════════════════════════════════════════════════════
// ループ
// ═══════════════════════════════════════════════════════════════
function loop(){animT+=0.016;px+=(tpx-px)*0.06;py+=(tpy-py)*0.06;
 drawEnv();apply();drawWave();drawObject();
 document.getElementById('st-env').textContent=ENVS[envIdx].name;
 document.getElementById('st-imm').textContent=Math.round(immersion*100)+'%';
 document.getElementById('env-name').textContent=ENVS[envIdx].name;
 requestAnimationFrame(loop);}

// ═══════════════════════════════════════════════════════════════
// ホームビュー・コントロール
// ═══════════════════════════════════════════════════════════════
function buildHome(){const g=document.getElementById('home-grid');
 APPS.forEach(a=>{const d=document.createElement('div');d.className='appi';
  d.innerHTML='<div class="ic">'+a.ic+'</div><div class="nm">'+a.nm+'</div>';
  d.onclick=()=>{const w=byId[a.id];w.open=true;w.el.style.display='';bringFront(w);
   if(a.id==='news')nSelect(nIndex>=0?nIndex:0);
   document.getElementById('home').classList.remove('show');flash(a.nm+' を開きました');};
  g.appendChild(d);});}
document.getElementById('d-home').onclick=()=>document.getElementById('home').classList.toggle('show');
document.getElementById('home').addEventListener('pointerdown',e=>{if(e.target.id==='home')e.currentTarget.classList.remove('show');});
document.getElementById('d-env').onclick=()=>{envIdx=(envIdx+1)%ENVS.length;flash('環境: '+ENVS[envIdx].name);};
document.getElementById('d-reset').onclick=()=>{layout();flash('ウィンドウを整列しました');};
document.getElementById('imm').oninput=e=>{immersion=parseFloat(e.target.value);};
function flash(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2000);}

// ジャイロ（任意）：端末の傾きで視差
let motionOn=false;
window.addEventListener('deviceorientation',e=>{if(e.gamma==null&&e.beta==null)return;motionOn=true;
 tpx=Math.max(-1,Math.min(1,(e.gamma||0)/40));tpy=Math.max(-1,Math.min(1,((e.beta||0)-40)/40));});

// init
resize();buildWindows();buildHome();updateClock();requestAnimationFrame(loop);
</script>
</body>
