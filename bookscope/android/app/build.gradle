plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.bookscope.app'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.bookscope.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Web 版 (bookscope/public/) をそのままアプリ内アセットとして同梱する
tasks.register('copyWebAssets', Copy) {
    from rootProject.file('../public')
    into layout.projectDirectory.dir('src/main/assets/www')
}
preBuild.dependsOn 'copyWebAssets'
