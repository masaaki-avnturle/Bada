[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-medsafe"
version = "0.1.0"
description = "服薬リスクの重複（中枢抑制・降圧・QT延長など）を指摘する教育用チェッカー。用量・配合・製造は扱わない。"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Masaaki Yamaguchi" }]
keywords = ["medication-safety", "drug-class", "education", "bada", "omega"]
dependencies = []

[project.scripts]
omega-medsafe = "omega_medsafe.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["omega_medsafe"]
