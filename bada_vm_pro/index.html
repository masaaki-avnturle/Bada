<html lang="ja">
<head>

<title>Bada VM Pro — 量子Bada OS (w9wm デスクトップ / BadaGPT / Ubuntu ユーザーランド)</title>
<!--
  Bada VM Pro — w9wm デスクトップ版
  ─────────────────────────────────────────────────────────────
  ・デスクトップは window manager「w9wm」(9wm + 仮想スクリーン) の移植:
      右クリック(B3) = WMメニュー New / Reshape / Move / Delete / Hide
                       + 隠したウィンドウ一覧 + 仮想スクリーン 0-3
      左クリック(B1) = アプリケーションメニュー
      ウィンドウはタイトルバーなし・4px ボーダー (枠ドラッグで移動 /
      右下角で リサイズ / Ctrl+Alt+←→ で仮想スクリーン切替)
  ・Ubuntu 風ユーザーランドを事前インストール:
      bash / apt / vim / emacs / ssh / xinetd / texlive-full /
      screen / fcitx-mozc / xterm / x-terminal-emulator / terminal
  ・ターミナルは日本語入力対応 (OS の IME による変換入力 + 内蔵
      fcitx-mozc ローマ字かな変換, Ctrl+Space で切替)
  ・カーネルベースは BadaGPT: OS update/upgrade を担当 (apt upgrade 連動)
  ・Bada on Rails / 量子 Bada 実行系 / 合い言葉 / トランスフォーマー /
      GUI・CUI プログラミングは従来どおり同梱
  依存ゼロ・単一 HTML・オフライン動作。APK / EXE / AppImage は
  .github/workflows/badavmpro-app-build.yml がビルドします。
-->
<style>
:root{
  --panel:#131826; --panel2:#0f1420; --edge:#232b3d;
  --text:#d7dce8; --dim:#8a93a8; --gold:#c8a44a; --cyan:#40b8c0;
  --purple:#9060d0; --blue:#4a80d0; --green:#4ac077; --red:#d05a5a;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --wmgray:#9c9c9c; --wmborder:#55585e; --wmactive:#2f3540; --menu:#e7e7e7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--wmgray);color:var(--text);font:14px/1.55 -apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--edge);border-radius:6px;padding:5px 8px}
input:focus,textarea:focus{outline:none;border-color:var(--cyan)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3450;border-radius:5px}

/* ── w9wm ルート (デスクトップ) ─────────────────── */
#desk{position:fixed;inset:0;overflow:hidden;
  background-color:var(--wmgray);
  background-image:repeating-conic-gradient(#a4a4a4 0% 25%, #989898 0% 50%);
  background-size:4px 4px;cursor:default;-webkit-user-select:none;user-select:none}
#desk.sweep{cursor:crosshair}
#desk.pick-del{cursor:not-allowed}
#rootstatus{position:absolute;right:6px;bottom:6px;z-index:5;background:#00000055;color:#f0f0f0;
  font:11px var(--mono);padding:3px 8px;border-radius:4px;max-width:64vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#deskhint{position:absolute;left:8px;bottom:6px;z-index:5;color:#00000088;font:11px var(--mono);pointer-events:none}
#menubtn{position:absolute;left:8px;top:8px;z-index:5;background:#00000033;border:1px solid #00000044;color:#111;
  font-size:15px;border-radius:6px;padding:2px 9px}
#menubtn:hover{background:#00000055;border-color:#000}

/* ── w9wm ウィンドウ (タイトルバーなし・4px ボーダー) ── */
.win{position:absolute;background:var(--panel);border:4px solid #c9c9c9;outline:1px solid #444;
  box-shadow:2px 3px 0 #00000042;display:flex;flex-direction:column;min-width:140px;min-height:100px}
.win.focus{border-color:var(--wmactive);outline-color:#0a0c10}
.win .body{flex:1;overflow:auto;background:var(--panel);position:relative}
.win .rsz{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;cursor:nwse-resize;z-index:3}
.win.hidden{display:none!important}

/* ── w9wm メニュー ─────────────────────────────── */
.wmenu{position:absolute;z-index:99;background:var(--menu);color:#000;border:1px solid #000;
  font:13px/1.2 var(--mono);min-width:150px;box-shadow:2px 2px 0 #00000055;-webkit-user-select:none;user-select:none}
.wmenu .it{padding:5px 12px;cursor:pointer;white-space:nowrap}
.wmenu .it:hover{background:#000;color:#fff}
.wmenu .sep{border-top:1px solid #777;margin:2px 0}
.wmenu .cap{padding:3px 12px;font-size:11px;color:#555}
.wmenu .vrow{display:flex;gap:4px;padding:5px 10px}
.wmenu .vbox{width:22px;height:16px;border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;background:#fff}
.wmenu .vbox.cur{background:#000;color:#fff}
#sweepbox{position:absolute;z-index:98;border:2px dashed #000;background:#ffffff22;pointer-events:none;display:none}

/* ── ページ (ウィンドウ内アプリ共通) ──────────── */
.page{padding:16px 16px 30px;max-width:100%}
.page h1{font-size:18px;color:var(--gold);margin-bottom:4px}
.page h2{font-size:14px;color:var(--cyan);margin:16px 0 8px}
.page .sub{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.card{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;cursor:pointer;text-align:center}
.appicon:hover{border-color:var(--gold)}
.appicon .em{font-size:28px}
.appicon .nm{font-size:12px}
.appicon .ds{font-size:10px;color:var(--dim)}
pre.code{background:#080b12;border:1px solid var(--edge);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;border:1px solid var(--edge);color:var(--dim)}
.badge.ok{color:var(--green);border-color:var(--green)}
.badge.warn{color:var(--gold);border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kbd{font-family:var(--mono);background:#1a2133;border:1px solid var(--edge);border-radius:5px;padding:0 6px;font-size:12px}
a.link{color:var(--cyan);cursor:pointer;text-decoration:underline}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{border:1px solid var(--edge);padding:5px 8px;text-align:left}
.tbl th{color:var(--dim);font-weight:600}

/* ── ターミナル (xterm / x-terminal-emulator / terminal) ── */
.termwrap{position:absolute;inset:0;display:flex;flex-direction:column;font-family:var(--mono);font-size:13px;line-height:1.35}
.termwrap .screen{flex:1;overflow-y:auto;padding:6px 8px;white-space:pre-wrap;word-break:break-all;cursor:text}
.termwrap.theme-xterm{background:#ffffff;color:#000}
.termwrap.theme-xterm .cur{background:#000;color:#fff}
.termwrap.theme-dark{background:#000;color:#d8d8d8}
.termwrap.theme-dark .cur{background:#d8d8d8;color:#000}
.termwrap.theme-ubuntu{background:#300a24;color:#eeeeec}
.termwrap.theme-ubuntu .cur{background:#eeeeec;color:#300a24}
.termwrap .ime{text-decoration:underline;text-underline-offset:2px;opacity:.92}
.termwrap .imebadge{position:absolute;right:6px;top:4px;font-size:10px;padding:1px 7px;border-radius:8px;background:#0008;color:#ffd166;z-index:2;pointer-events:none}
.termwrap textarea.kb{position:absolute;left:0;bottom:0;width:4px;height:4px;opacity:0.01;border:none;resize:none;background:transparent;color:transparent;caret-color:transparent;z-index:1}
.termwrap .modeline{background:#00000033;font-size:12px;padding:1px 8px;white-space:pre;overflow:hidden}
.termwrap.theme-xterm .modeline{background:#00000014;color:#000}

/* ── BadaGPT ── */
#chatlog{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:10px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:13px}
.msg.user{align-self:flex-end;background:#233150}
.msg.gpt{align-self:flex-start;background:#1c2436;border:1px solid var(--edge)}
.prog{height:5px;background:#0d1119;border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan))}

/* ── GUIデザイナ ── */
#designer{display:grid;grid-template-columns:150px 1fr 170px;gap:10px}
#canvas{position:relative;min-height:280px;background:#0a0e17;border:1px dashed var(--edge);border-radius:8px;overflow:hidden}
.cmp{position:absolute;font-size:12px;padding:4px 10px;border-radius:5px;cursor:move;-webkit-user-select:none;user-select:none}
.cmp.TButton{background:#2a3a5c;border:1px solid var(--blue)}
.cmp.TLabel{color:var(--gold)}
.cmp.TEdit{background:#0d1119;border:1px solid var(--edge);min-width:110px;color:var(--dim)}
.cmp.sel{outline:2px solid var(--cyan)}
#guiprev{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:200}
#gp-inner{width:min(480px,94vw);background:#e8e8ec;color:#16181d;border-radius:10px;overflow:hidden}
#gp-title{background:linear-gradient(180deg,#3c4a68,#232c42);color:#fff;padding:6px 12px;font-size:13px;display:flex;justify-content:space-between}
#gp-body{position:relative;height:320px}

/* ── attention ── */
.attn{display:grid;gap:2px}
.attn div{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fffa}
</style>

<div id="desk"></div>
<div id="sweepbox"></div>
<button id="menubtn" title="アプリケーションメニュー (B1)">☰</button>
<div id="deskhint">w9wm — B3(右クリック):WMメニュー / B1(左クリック):アプリ / Ctrl+Alt+←→:仮想スクリーン</div>
<div id="rootstatus"><span id="st-ver"></span> · 合い言葉 <span id="st-aikotoba"></span> · rails <span id="st-rails"></span> · <span id="st-msg"></span></div>
<button id="micbtn" style="display:none"></button>

<div id="guiprev"><div id="gp-inner">
  <div id="gp-title"><span>Form1 — Bada VM Pro (プレビュー)</span><span style="cursor:pointer" onclick="closeGuiPreview()">✕</span></div>
  <div id="gp-body"></div>
</div></div>

<script>
"use strict";
/* =====================================================================
 * Bada VM Pro — カーネル: BadaGPT / デスクトップ: w9wm window manager
 * ===================================================================== */

/* ── 永続ストア (localStorage) ──────────────────────────────────── */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("badavm."+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("badavm."+k, JSON.stringify(v)); }catch(e){} }
};

/* ── OS 状態 ────────────────────────────────────────────────────── */
function osVersion(){ return store.get("os.version", "5.0.0"); }
function setStatus(msg){ const el = document.getElementById("st-msg"); if(el) el.textContent = msg || ""; }
function refreshStatusbar(){
  document.getElementById("st-ver").textContent = "BadaVMPro v" + osVersion();
  document.getElementById("st-aikotoba").textContent = "「" + aikotoba() + "」";
  document.getElementById("st-rails").textContent = store.get("rails.server", false) ? ":3000" : "stop";
}

/* OS update / upgrade は BadaGPT が担う。ここは version 台帳の操作のみ。 */
function osUpdate(kind){
  const v = osVersion().split(".").map(Number);
  if (kind === "upgrade") { v[0] += 1; v[1] = 0; v[2] = 0; }
  else                    { v[2] += 1; }
  const nv = v.join(".");
  store.set("os.version", nv);
  const log = store.get("os.changelog", []);
  log.unshift({ v: nv, kind: kind, at: new Date().toISOString(),
    notes: kind === "upgrade"
      ? "メジャーアップグレード: 量子スケジューラ刷新 / BadaGPT カーネル世代交代 / Rails ブリッジ高速化"
      : "アップデート: セキュリティ修正 / zone:// スタック調整 / attention キャッシュ最適化" });
  store.set("os.changelog", log.slice(0, 30));
  refreshStatusbar();
  return nv;
}

/* =====================================================================
 * 量子 Bada 言語インタープリタ (状態ベクトル・シミュレータ)
 * ===================================================================== */
function badaInterpret(src){
  const out = [];
  const vars = Object.create(null);
  let qnames = [];
  let state = null;

  function initQ(names){
    for (const n of names) if (!qnames.includes(n)) qnames.push(n);
    if (qnames.length > 8) throw new Error("qubit は最大 8 個までです");
    const dim = 1 << qnames.length;
    state = new Array(dim).fill(null).map(function(_, i){ return { re: i === 0 ? 1 : 0, im: 0 }; });
  }
  function qi(name){
    const i = qnames.indexOf(name);
    if (i < 0) throw new Error("未宣言の qubit: " + name + " (先に `qubit " + name + "` を実行)");
    return i;
  }
  function apply1(t, m){
    const n = qnames.length, dim = 1 << n, bit = 1 << (n - 1 - t);
    const ns = state.map(function(a){ return { re: a.re, im: a.im }; });
    for (let i = 0; i < dim; i++){
      if (i & bit) continue;
      const j = i | bit, a = state[i], b = state[j];
      ns[i] = { re: m[0][0]*a.re + m[0][1]*b.re, im: m[0][0]*a.im + m[0][1]*b.im };
      ns[j] = { re: m[1][0]*a.re + m[1][1]*b.re, im: m[1][0]*a.im + m[1][1]*b.im };
    }
    state = ns;
  }
  function applyCNOT(c, t){
    const n = qnames.length, dim = 1 << n;
    const cb = 1 << (n - 1 - c), tb = 1 << (n - 1 - t);
    const ns = state.map(function(a){ return { re: a.re, im: a.im }; });
    for (let i = 0; i < dim; i++) if (i & cb) ns[i ^ tb] = state[i];
    state = ns;
  }
  function measureAll(){
    const dim = state.length;
    let r = Math.random(), acc = 0, hit = 0;
    for (let i = 0; i < dim; i++){
      acc += state[i].re*state[i].re + state[i].im*state[i].im;
      if (r <= acc){ hit = i; break; }
      hit = i;
    }
    const bits = hit.toString(2).padStart(qnames.length, "0");
    state = state.map(function(_, i){ return { re: i === hit ? 1 : 0, im: 0 }; });
    return bits;
  }
  function amplitudes(){
    const dim = state.length, lines = [];
    for (let i = 0; i < dim; i++){
      const p = state[i].re*state[i].re + state[i].im*state[i].im;
      if (p > 1e-9) lines.push("|" + i.toString(2).padStart(qnames.length,"0") + "⟩ " +
        (state[i].re.toFixed(3)) + (state[i].im >= 0 ? "+" : "") + state[i].im.toFixed(3) + "i  (p=" + p.toFixed(3) + ")");
    }
    return lines.join("\n");
  }
  function evalExpr(e){
    e = e.trim();
    const safe = e.replace(/[A-Za-z_][A-Za-z0-9_]*/g, function(name){
      if (name in vars) return "(" + vars[name] + ")";
      if (["sqrt","sin","cos","abs","floor","pow","PI","E","log","exp"].includes(name)) return "Math." + name;
      throw new Error("未定義の変数: " + name);
    });
    if (!/^[-+*/%().,0-9\sMathsqrtincoabflwpPIElgex]*$/.test(safe)) throw new Error("式に使えない文字があります: " + e);
    return Function('"use strict";return (' + safe + ")")();
  }

  const H = [[Math.SQRT1_2, Math.SQRT1_2],[Math.SQRT1_2, -Math.SQRT1_2]];
  const X = [[0,1],[1,0]], Z = [[1,0],[0,-1]];

  const lines = String(src).split(/\r?\n/);
  for (let ln = 0; ln < lines.length; ln++){
    let line = lines[ln].replace(/(#|\/\/).*$/, "").trim();
    if (!line) continue;
    try {
      let m;
      if ((m = line.match(/^qubit\s+(.+)$/i)))           { initQ(m[1].split(/[\s,]+/).filter(Boolean)); out.push("qubit: [" + qnames.join(" ") + "] を |0…0⟩ に初期化"); }
      else if ((m = line.match(/^H\s+(\S+)$/)))          { if(!state) throw new Error("先に qubit 宣言"); apply1(qi(m[1]), H); out.push("H " + m[1]); }
      else if ((m = line.match(/^X\s+(\S+)$/)))          { if(!state) throw new Error("先に qubit 宣言"); apply1(qi(m[1]), X); out.push("X " + m[1]); }
      else if ((m = line.match(/^Z\s+(\S+)$/)))          { if(!state) throw new Error("先に qubit 宣言"); apply1(qi(m[1]), Z); out.push("Z " + m[1]); }
      else if ((m = line.match(/^CNOT\s+(\S+)\s+(\S+)$/i))){ if(!state) throw new Error("先に qubit 宣言"); applyCNOT(qi(m[1]), qi(m[2])); out.push("CNOT " + m[1] + "→" + m[2]); }
      else if (/^state$/i.test(line))                    { if(!state) throw new Error("先に qubit 宣言"); out.push(amplitudes()); }
      else if (/^measure$/i.test(line))                  { if(!state) throw new Error("先に qubit 宣言"); out.push("measure → |" + measureAll() + "⟩"); }
      else if ((m = line.match(/^let\s+([A-Za-z_]\w*)\s*=\s*(.+)$/))) { vars[m[1]] = evalExpr(m[2]); out.push(m[1] + " = " + vars[m[1]]); }
      else if ((m = line.match(/^print\s+(.+)$/)))       {
        const arg = m[1].trim();
        if (/^".*"$/.test(arg)) out.push(arg.slice(1, -1));
        else out.push(String(evalExpr(arg)));
      }
      else throw new Error("構文エラー: " + line);
    } catch (e) {
      out.push("!! " + (ln+1) + "行目: " + e.message);
    }
  }
  return out.join("\n");
}

/* =====================================================================
 * トランスフォーマー・スタジオ (16次元 1ヘッド self-attention + bigram)
 * ===================================================================== */
const TF = {
  dim: 16,
  vocab: ["qubit","H","X","Z","CNOT","measure","state","let","print","=","q0","q1","q2","form","button","label","on","click","rails","scaffold","\"こんにちは\"","1","2","+","*"],
  bigram: store.get("tf.bigram", {}),
  lastAttn: null, lastTokens: null
};
function tfHash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function tfRand(seed){ let s = seed || 1; return function(){ s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff; return s / 0x7fffffff * 2 - 1; }; }
function tfEmbed(tok){ const r = tfRand(tfHash("emb:" + tok)); const v = []; for (let i = 0; i < TF.dim; i++) v.push(r()); return v; }
function tfMat(name){ const r = tfRand(tfHash(name)); const m = []; for (let i = 0; i < TF.dim; i++){ const row = []; for (let j = 0; j < TF.dim; j++) row.push(r() * 0.6); m.push(row); } return m; }
const TF_Wq = tfMat("Wq"), TF_Wk = tfMat("Wk"), TF_Wv = tfMat("Wv");
function tfMatVec(M, v){ const o = []; for (let i = 0; i < TF.dim; i++){ let s = 0; for (let j = 0; j < TF.dim; j++) s += M[i][j] * v[j]; o.push(s); } return o; }
function tfDot(a, b){ let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
function tfSoftmax(xs){ const mx = Math.max.apply(null, xs); const es = xs.map(function(x){ return Math.exp(x - mx); }); const z = es.reduce(function(a,b){ return a+b; }, 0); return es.map(function(e){ return e / z; }); }
function tfTokenize(code){ return String(code).replace(/([=+*])/g, " $1 ").split(/\s+/).filter(Boolean); }

function tfTrain(code){
  const toks = tfTokenize(code);
  for (let i = 0; i + 1 < toks.length; i++){
    const k = toks[i];
    if (!TF.bigram[k]) TF.bigram[k] = {};
    TF.bigram[k][toks[i+1]] = (TF.bigram[k][toks[i+1]] || 0) + 1;
    if (!TF.vocab.includes(toks[i])) TF.vocab.push(toks[i]);
    if (!TF.vocab.includes(toks[i+1])) TF.vocab.push(toks[i+1]);
  }
  store.set("tf.bigram", TF.bigram);
  return toks.length;
}

function transformerPredict(context, topk){
  const toks = tfTokenize(context).slice(-8);
  if (!toks.length) return { tokens: [], preds: [], attn: [] };
  const emb = toks.map(tfEmbed);
  const qs = emb.map(function(v){ return tfMatVec(TF_Wq, v); });
  const ks = emb.map(function(v){ return tfMatVec(TF_Wk, v); });
  const vs = emb.map(function(v){ return tfMatVec(TF_Wv, v); });
  const scale = 1 / Math.sqrt(TF.dim);
  const attn = [];
  let ctxVec = null;
  for (let i = 0; i < toks.length; i++){
    const scores = [];
    for (let j = 0; j <= i; j++) scores.push(tfDot(qs[i], ks[j]) * scale);
    const w = tfSoftmax(scores);
    attn.push(w);
    const o = new Array(TF.dim).fill(0);
    for (let j = 0; j <= i; j++) for (let d = 0; d < TF.dim; d++) o[d] += w[j] * vs[j][d];
    ctxVec = o;
  }
  const last = toks[toks.length - 1];
  const bg = TF.bigram[last] || {};
  const raw = TF.vocab.map(function(w){
    const a = tfDot(ctxVec, tfEmbed(w)) * 0.35;
    const b = Math.log(1 + (bg[w] || 0)) * 2.2;
    return a + b;
  });
  const probs = tfSoftmax(raw);
  const order = TF.vocab.map(function(w, i){ return { w: w, p: probs[i] }; })
    .sort(function(x, y){ return y.p - x.p; }).slice(0, topk || 5);
  TF.lastAttn = attn; TF.lastTokens = toks;
  return { tokens: toks, preds: order, attn: attn };
}

/* =====================================================================
 * Bada on Rails — scaffold 生成 + ミニ CRUD サーバー (bada://rails/*)
 * ===================================================================== */
function railsDB(){ return store.get("rails.db", { resources: {} }); }
function railsSave(db){ store.set("rails.db", db); }

function railsScaffold(name, fieldSpecs){
  const res = name.toLowerCase();
  const fields = (fieldSpecs || []).map(function(fs){
    const p = fs.split(":");
    return { name: p[0], type: p[1] || "string" };
  });
  if (!fields.length) fields.push({ name: "title", type: "string" }, { name: "body", type: "text" });
  const db = railsDB();
  db.resources[res] = db.resources[res] || { fields: fields, rows: [], nextId: 1 };
  db.resources[res].fields = fields;
  railsSave(db);
  const Model = res.charAt(0).toUpperCase() + res.slice(1).replace(/s$/, "");
  const code =
    "# == Bada on Rails scaffold ==\n" +
    "# app/models/" + res + ".bada\n" +
    "model " + Model + " {\n" +
    fields.map(function(f){ return "  field :" + f.name + ", :" + f.type; }).join("\n") + "\n" +
    "  validates_presence " + (fields[0] ? ":" + fields[0].name : ":title") + "\n" +
    "}\n\n" +
    "# app/controllers/" + res + "_controller.bada\n" +
    "controller " + Model + "s {\n" +
    "  def index   { @" + res + " = " + Model + ".all }\n" +
    "  def create  { " + Model + ".create(params) ; redirect \"bada://rails/" + res + "\" }\n" +
    "  def destroy { " + Model + ".find(params.id).delete }\n" +
    "}\n\n" +
    "# config/routes.bada\n" +
    "routes { resources :" + res + " }   # → bada://rails/" + res + "\n";
  return { resource: res, fields: fields, code: code };
}
function railsCreateRow(res, values){
  const db = railsDB(), r = db.resources[res];
  if (!r) return false;
  const row = { id: r.nextId++ };
  r.fields.forEach(function(f){ row[f.name] = values[f.name] || ""; });
  r.rows.push(row); railsSave(db); return true;
}
function railsDeleteRow(res, id){
  const db = railsDB(), r = db.resources[res];
  if (!r) return;
  r.rows = r.rows.filter(function(x){ return x.id !== id; }); railsSave(db);
}

/* =====================================================================
 * 合い言葉コマンド — 正規化 + レーベンシュタイン類似度
 * ===================================================================== */
function aikotoba(){ return store.get("aikotoba", "バダ、起動"); }
function normalizeSpeech(s){
  s = String(s || "").trim().toLowerCase();
  s = s.replace(/[ァ-ン]/g, function(ch){ return ch; });
  s = s.replace(/[ぁ-ん]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) + 0x60); });
  s = s.replace(/[\s、。,.!?！?・「」『』:;ー―\-]/g, "");
  return s;
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = []; for (let j = 0; j <= n; j++) prev.push(j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      cur.push(Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)));
    }
    prev = cur;
  }
  return prev[n];
}
function similarity(a, b){
  a = normalizeSpeech(a); b = normalizeSpeech(b);
  if (!a.length && !b.length) return 1;
  const d = levenshtein(a, b);
  return 1 - d / Math.max(a.length, b.length, 1);
}
const VOICE_COMMANDS = [
  { words: ["ターミナル", "たーみなる", "terminal", "コンソール", "xterm"], url: "bada://terminal", desc: "ターミナル (xterm) を開く" },
  { words: ["レール", "レールズ", "rails", "れーるず"],             url: "bada://rails",    desc: "Bada on Rails を開く" },
  { words: ["ジーピーティー", "gpt", "チャット", "アシスタント"],   url: "bada://gpt",      desc: "BadaGPT を開く" },
  { words: ["トランスフォーマー", "transformer", "注意", "アテンション"], url: "bada://transformer", desc: "トランスフォーマー・スタジオ" },
  { words: ["スタジオ", "デザイナ", "gui", "フォーム"],             url: "bada://studio",   desc: "GUI デザイナを開く" },
  { words: ["ホーム", "home", "デスクトップ"],                       url: "bada://home",     desc: "ホームを開く" },
  { words: ["設定", "せってい", "settings"],                          url: "bada://settings", desc: "設定を開く" },
  { words: ["アップデート", "update", "更新"],                        action: "update",       desc: "BadaGPT に OS update を依頼" },
  { words: ["アップグレード", "upgrade"],                             action: "upgrade",      desc: "BadaGPT に OS upgrade を依頼" }
];
function matchPassphrase(input){
  const pass = aikotoba();
  const nIn = normalizeSpeech(input), nPass = normalizeSpeech(pass);
  let rest = null, passScore = 0;
  if (nIn.startsWith(nPass)) { rest = nIn.slice(nPass.length); passScore = 1; }
  else {
    const head = nIn.slice(0, nPass.length);
    passScore = 1 - levenshtein(head, nPass) / Math.max(nPass.length, 1);
    if (passScore >= 0.7) rest = nIn.slice(nPass.length);
  }
  if (rest === null) return { ok: false, passScore: passScore, reason: "合い言葉が一致しません" };
  if (!rest) return { ok: true, passScore: passScore, cmd: null };
  let best = null, bestScore = 0;
  for (const c of VOICE_COMMANDS){
    for (const w of c.words){
      const s = similarity(rest, w);
      if (s > bestScore){ bestScore = s; best = c; }
    }
  }
  if (best && bestScore >= 0.62) return { ok: true, passScore: passScore, cmd: best, cmdScore: bestScore };
  return { ok: true, passScore: passScore, cmd: null, cmdScore: bestScore };
}
function executeVoice(input, sourceLabel){
  const r = matchPassphrase(input);
  if (!r.ok){ setStatus("✗ " + r.reason + " (score " + (r.passScore*100|0) + "%)"); return r; }
  if (r.cmd){
    setStatus("✓ " + sourceLabel + " → " + r.cmd.desc + " (精度 " + Math.round((r.cmdScore||1)*100) + "%)");
    if (r.cmd.url) navigate(r.cmd.url);
    else if (r.cmd.action === "update" || r.cmd.action === "upgrade"){ navigate("bada://gpt"); setTimeout(function(){ gptSend("os " + r.cmd.action); }, 150); }
  } else {
    setStatus("✓ 合い言葉を確認。コマンド語が見つかりません");
  }
  return r;
}

function fsNorm(path, cwd){
  let p = String(path || "");
  if (!p) p = cwd;
  if (p.startsWith("~")) p = "/home/user" + p.slice(1);
  if (!p.startsWith("/")) p = (cwd === "/" ? "" : cwd) + "/" + p;
  const parts = [];
  p.split("/").forEach(function(seg){
    if (!seg || seg === ".") return;
    if (seg === "..") parts.pop();
    else parts.push(seg);
  });
  return "/" + parts.join("/");

function fsGet(tree, path){
  if (path === "/") return tree;
  let node = tree;
  for (const seg of path.split("/").filter(Boolean)){
    if (!node || !node.d || !(seg in node.d)) return null;
    node = node.d[seg];
  }
  return node;
}
function fsPut(path, content){ /* content: string(file) か null(dir) */
  const t = vfs();
  const parts = path.split("/").filter(Boolean);
  let node = t;
  for (let i = 0; i < parts.length - 1; i++){
    if (!node.d[parts[i]]) node.d[parts[i]] = { d: {} };
    if (!node.d[parts[i]].d) return false;
    node = node.d[parts[i]];
  }
  const name = parts[parts.length - 1];
  if (content === null) node.d[name] = node.d[name] && node.d[name].d ? node.d[name] : { d: {} };
  else node.d[name] = { f: content };
  vfsSave(t);
  return true;
}
function fsDelete(path){
  const t = vfs();
  const parts = path.split("/").filter(Boolean);
  let node = t;
  for (let i = 0; i < parts.length - 1; i++){
    node = node.d && node.d[parts[i]];
    if (!node) return false;
  }
  const name = parts[parts.length - 1];
  if (!node.d || !(name in node.d)) return false;
  delete node.d[name];
  vfsSave(t);
  return true;
}

    for (let len = 3; len >= 1; len--){

      if (ROMAJI[chunk]){ out += ROMAJI[chunk]; i += len; hit = true; break; }
    }
    if (!hit){ out += s[i]; i++; }
  }
  return out;
}
function kanaToKatakana(s){
  return String(s).replace(/[ぁ-ゖ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) + 0x60); });
}

/* ── xinetd / サービス台帳 ── */
function svcState(){ return store.get("svc", { xinetd: true, sshd: true, "fcitx-mozc": true }); }
function svcSave(s){ store.set("svc", s); }
function xinetdServices(){
  const t = vfs();
  const dir = fsGet(t, "/etc/xinetd.d");
  const names = dir && dir.d ? Object.keys(dir.d) : [];
  const ports = { echo: 7, daytime: 13, chargen: 19, zoneqkd: 9999 };
  return names.map(function(n){ return { name: n, port: ports[n] || 0 }; });
}

/* =====================================================================
 * bash シェル (runShell) — ターミナルから ctx 付きで呼ばれる。

function shellCtx(){ return { cwd: "/home/user", host: "badavm", user: "user", term: null }; }
function runShell(cmd, ctx){
  ctx = ctx || shellCtx();

  const cmd0 = argv[0];

  function P(s){ out.push(s); }

  function notFound(){ return "bash: " + cmd0 + ": command not found (apt install " + cmd0 + " を試してください)"; }
  let m;

  switch (cmd0){
  case "help": return [
    "Bada VM Pro シェル (bash " + db.installed.bash.ver.split("-")[0] + ") — 主なコマンド:",
    "  ls / cd / pwd / cat / echo / mkdir / touch / rm / cp / mv   ファイル操作 (echo hi > file 可)",
    "  apt update|upgrade|install|remove|list --installed          パッケージ管理",
    "  vim <file> / emacs <file>                                   エディタ (プリインストール)",

    "  xinetd status / service xinetd start|stop                    スーパーサーバー",

    "  uname -a / lsb_release -a / ps / man <cmd> / history / clear / exit",
    "  ver / os update|upgrade / rails scaffold <Name> [f:t ...] / open <app> / aikotoba <語>",
    "  qubit/H/X/Z/CNOT/measure/state/let/print                     量子 Bada (セミコロン区切り可)"
  ].join("\n");
  case "ver": return "Bada VM Pro v" + osVersion() + " (kernel: BadaGPT / wm: w9wm)";
  case "pwd": return ctx.cwd;
  case "whoami": return ctx.user;
  case "hostname": return ctx.host;
  case "date": return new Date().toString();
  case "uname":
    if (argv[1] === "-a") return "Linux " + ctx.host + " 6.8.0-badaquantum #1 SMP PREEMPT_DYNAMIC Bada x86_64 x86_64 x86_64 GNU/Linux";
    return "Linux";
  case "lsb_release":
    return "No LSB modules are available.\nDistributor ID:\tUbuntu\nDescription:\tBadaVMPro OS (Ubuntu-flavoured) 24.04\nRelease:\t24.04\nCodename:\tbadable";
  case "clear": if (ctx.term) ctx.term.clear(); return "";
  case "exit":
    if (ctx.remote){ ctx.remote = false; ctx.host = "badavm"; ctx.cwd = "/home/user"; return "logout\nConnection to " + (ctx.lastHost || "remote") + " closed."; }
    if (ctx.term && ctx.term.screenSession){ return ctx.term.screenExit(); }
    if (ctx.term){ ctx.term.requestClose(); return "exit"; }
    return "exit";
  case "history": return ctx.term ? ctx.term.history.map(function(h, i){ return "  " + (i+1) + "  " + h; }).join("\n") : "";
  case "which": {
    const name = argv[1] || "";
    const known = ["bash","apt","apt-get","vim","emacs","ssh","sshd","xinetd","screen","latex","pdflatex","tex","fcitx-mozc","xterm","x-terminal-emulator","terminal","ls","cat","echo","uname","w9wm"];
    return known.includes(name) ? "/usr/bin/" + name : "";
  }
  case "ps": {
    const svcs = svcState();
    const rows = ["  PID TTY      TIME     CMD",
      "    1 ?        00:00:01 badagpt-kernel", "   77 ?        00:00:00 w9wm",
      "  120 pts/0    00:00:00 bash"];
    if (svcs.xinetd) rows.push("  201 ?        00:00:00 xinetd");
    if (svcs.sshd) rows.push("  202 ?        00:00:00 sshd");
    if (svcs["fcitx-mozc"]) rows.push("  203 ?        00:00:00 fcitx5 (mozc)");
    if (ctx.term && ctx.term.screens.length) rows.push("  3" + (10 + ctx.term.screens.length) + " ?        00:00:00 screen");
    rows.push("  999 pts/0    00:00:00 ps");
    return rows.join("\n");
  }

  /* ── ファイル系 ── */
  case "ls": {
    const flags = argv.filter(function(a){ return a.startsWith("-"); }).join("");
    const target = argv.filter(function(a, i){ return i > 0 && !a.startsWith("-"); })[0];
    const path = fsNorm(target || ctx.cwd, ctx.cwd);
    const node = fsGet(vfs(), path);
    if (!node) return "ls: cannot access '" + (target || path) + "': No such file or directory";
    if (node.f !== undefined) return path.split("/").pop();
    let names = Object.keys(node.d).sort();
    if (!flags.includes("a")) names = names.filter(function(n){ return !n.startsWith("."); });
    if (flags.includes("l")){
      return names.map(function(n){
        const ch = node.d[n];
        const isDir = !!ch.d;
        const size = isDir ? 4096 : (ch.f || "").length;
        return (isDir ? "drwxr-xr-x" : "-rw-r--r--") + " 1 user user " + String(size).padStart(7) + " " +
          new Date().toISOString().slice(5, 10).replace("-", " ") + " " + n + (isDir ? "/" : "");
      }).join("\n");
    }
    return names.map(function(n){ return node.d[n].d ? n + "/" : n; }).join("  ");
  }
  case "cd": {
    const path = fsNorm(argv[1] || "~", ctx.cwd);
    const node = fsGet(vfs(), path);
    if (!node || node.f !== undefined) return "bash: cd: " + (argv[1] || path) + ": No such file or directory";
    ctx.cwd = path; return "";
  }
  case "cat": {
    if (!argv[1]) return "cat: 引数がありません";
    const node = fsGet(vfs(), fsNorm(argv[1], ctx.cwd));
    if (!node) return "cat: " + argv[1] + ": No such file or directory";
    if (node.d) return "cat: " + argv[1] + ": Is a directory";
    return node.f;
  }
  case "mkdir": {
    if (!argv[1]) return "mkdir: 引数がありません";
    fsPut(fsNorm(argv[1], ctx.cwd), null); return "";
  }
  case "touch": {
    if (!argv[1]) return "touch: 引数がありません";
    const p = fsNorm(argv[1], ctx.cwd);
    if (!fsGet(vfs(), p)) fsPut(p, "");
    return "";
  }
  case "rm": {
    const target = argv.filter(function(a, i){ return i > 0 && !a.startsWith("-"); })[0];
    if (!target) return "rm: 引数がありません";
    const p = fsNorm(target, ctx.cwd);
    const node = fsGet(vfs(), p);
    if (!node) return "rm: cannot remove '" + target + "': No such file or directory";
    if (node.d && !argv.includes("-r") && !argv.includes("-rf")) return "rm: cannot remove '" + target + "': Is a directory (rm -r を使用)";
    fsDelete(p); return "";
  }
  case "cp": case "mv": {
    if (argv.length < 3) return cmd0 + ": 引数が足りません";
    const src = fsNorm(argv[1], ctx.cwd), dst = fsNorm(argv[2], ctx.cwd);
    const node = fsGet(vfs(), src);
    if (!node || node.d) return cmd0 + ": '" + argv[1] + "' が読めません (ファイルのみ対応)";
    fsPut(dst, node.f);
    if (cmd0 === "mv") fsDelete(src);
    return "";
  }
  case "echo": {
    const rest = c.replace(/^echo\s*/, "");
    const rd = rest.match(/^(.*?)\s*>>?\s*(\S+)\s*$/);
    if (rd){
      const text = rd[1].replace(/^"(.*)"$/, "$1");
      const p = fsNorm(rd[2], ctx.cwd);
      const prev = rest.includes(">>") ? ((fsGet(vfs(), p) || {}).f || "") : "";
      fsPut(p, prev + text + "\n");
      return "";
    }
    return rest.replace(/^"(.*)"$/, "$1");
  }
  case "grep": {
    if (argv.length < 3) return "grep: 使い方: grep <pattern> <file>";

    if (!node || node.d) return "grep: " + argv[2] + ": No such file";
    try {
      const re = new RegExp(argv[1]);
      return node.f.split("\n").filter(function(l){ return re.test(l); }).join("\n");
    } catch(e){ return "grep: 不正なパターン"; }
  }

  /* ── apt ── */
  case "apt": case "apt-get": {

      .replace(/\\maketitle/, title ? "《" + title + "》\n" : "")
      .replace(/\\section\{([^}]*)\}/g, "\n■ $1\n")

  case "man": {

  case "free": return "               total        used        free\nMem:         8388608     1048576     7340032\nQubits:            8           2           6";

  }

  if ((m = c.match(/^open\s+(\w+)/))){ navigate("bada://" + m[1]); return "→ bada://" + m[1]; }

    return r.code + "→ bada://rails/" + r.resource;
  }
  if ((m = c.match(/^aikotoba\s+(.+)$/))){ store.set("aikotoba", m[1].trim()); refreshStatusbar(); return "合い言葉を「" + m[1].trim() + "」に変更しました"; }
  if ((m = c.match(/^bada\s+(.+)$/))) return badaInterpret(m[1].split(";").join("\n"));
  if (/^(qubit|H|X|Z|CNOT|measure|state|let|print)\b/.test(c)) return badaInterpret(c.split(";").join("\n"));
  return notFound();
}

/* =====================================================================
 * ターミナル・エミュレータ (xterm / x-terminal-emulator / terminal)
 *   日本語入力: OS IME (composition イベント) + 内蔵 fcitx-mozc
 * ===================================================================== */
const TERM_THEMES = {
  xterm: { cls: "theme-xterm",  name: "xterm" },
  xte:   { cls: "theme-dark",   name: "x-terminal-emulator" },
  term:  { cls: "theme-ubuntu", name: "terminal" }
};
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function Terminal(kind, body){
  const self = this;
  const theme = TERM_THEMES[kind] || TERM_THEMES.xterm;
  this.kind = kind;
  this.ctx = shellCtx(); this.ctx.term = this;
  this.lines = [
    "BadaVMPro OS (Ubuntu-flavoured) 24.04 — " + theme.name + " (bash)",
    "プリインストール: vim emacs ssh xinetd texlive-full screen fcitx-mozc bash apt",
    "日本語入力: そのまま IME で入力可 / Ctrl+Space で内蔵 Mozc (ローマ字→かな)",
    "`help` でコマンド一覧",
    ""
  ];
  this.input = ""; this.cursor = 0;
  this.history = []; this.hidx = -1;
  this.mode = "shell";           // shell | vim | emacs
  this.compose = "";             // IME 変換中テキスト
  this.mozcOn = false; this.mozcBuf = "";
  this.screens = []; this.screenSession = null; this.savedShell = null;
  this.vim = null; this.emacs = null;
  this.onClose = null;

  const wrap = document.createElement("div");
  wrap.className = "termwrap " + theme.cls;
  wrap.innerHTML = '<div class="imebadge"></div><div class="screen"></div><div class="modeline" style="display:none"></div><textarea class="kb" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>';
  body.appendChild(wrap);
  this.el = wrap;
  this.scr = wrap.querySelector(".screen");
  this.modeline = wrap.querySelector(".modeline");
  this.kb = wrap.querySelector("textarea.kb");
  this.badge = wrap.querySelector(".imebadge");
  this.composingNative = false;

  wrap.addEventListener("mousedown", function(e){ setTimeout(function(){ self.kb.focus(); }, 0); });
  this.kb.addEventListener("keydown", function(e){ self.onKey(e); });
  this.kb.addEventListener("input", function(e){ self.onInput(e); });
  this.kb.addEventListener("compositionstart", function(){ self.composingNative = true; self.compose = ""; self.render(); });
  this.kb.addEventListener("compositionupdate", function(e){ self.compose = e.data || ""; self.render(); });
  this.kb.addEventListener("compositionend", function(e){
    self.composingNative = false; self.compose = "";
    if (e.data) self.insertText(e.data);
    self.kb.value = "";
    self.render();
  });
  this.kb.addEventListener("paste", function(e){
    e.preventDefault();
    const t = (e.clipboardData && e.clipboardData.getData("text")) || "";
    if (t) self.insertText(t.replace(/\r?\n/g, " "));
  });

  this.prompt = function(){
    const c = self.ctx;
    let p = c.user + "@" + c.host + ":" + (c.cwd === "/home/user" ? "~" : c.cwd) + "$ ";
    if (self.screenSession) p = "[screen " + self.screenSession.id + "] " + p;
    return p;
  };
  this.updateBadge();
  this.render();
}
Terminal.prototype.updateBadge = function(){
  this.badge.textContent = this.mozcOn ? "Mozc あ" : (this.composingNative ? "IME" : "直接 A");
};
Terminal.prototype.clear = function(){ this.lines = []; };
Terminal.prototype.print = function(text){
  const self = this;
  String(text).split("\n").forEach(function(l){ self.lines.push(l); });
  if (this.lines.length > 600) this.lines = this.lines.slice(-600);
};
Terminal.prototype.insertText = function(t){
  if (this.mode === "vim"){ this.vimInsert(t); return; }
  if (this.mode === "emacs"){ this.emacsInsert(t); return; }
  this.input = this.input.slice(0, this.cursor) + t + this.input.slice(this.cursor);
  this.cursor += t.length;
  this.render();
};
Terminal.prototype.requestClose = function(){ if (this.onClose) this.onClose(); };

/* ── screen (多重化) ── */
Terminal.prototype.screenNew = function(){
  const id = 10000 + Math.floor(Math.random() * 20000);
  const sess = { id: id, at: new Date().toISOString().slice(0, 16).replace("T", " "), lines: [] };
  this.screens.push(sess);
  this.savedShell = { lines: this.lines, input: this.input, cursor: this.cursor };
  this.screenSession = sess;
  this.lines = ["[screen " + id + " を開始 — Ctrl+a d でデタッチ / exit で終了]", ""];
  this.input = ""; this.cursor = 0;
  return "";
};
Terminal.prototype.screenDetach = function(){
  if (!this.screenSession) return;
  this.screenSession.lines = this.lines;
  const id = this.screenSession.id;
  this.screenSession = null;
  const sv = this.savedShell || { lines: [], input: "", cursor: 0 };
  this.lines = sv.lines; this.input = sv.input; this.cursor = sv.cursor;
  this.print("[detached from " + id + ".pts-0]");
  this.render();
};
Terminal.prototype.screenResume = function(idArg){
  let sess = null;
  if (idArg) sess = this.screens.find(function(s){ return String(s.id) === String(idArg).split(".")[0]; }) || null;
  else sess = this.screens[this.screens.length - 1] || null;
  if (!sess) return "screen: There is no screen to be resumed" + (idArg ? " matching " + idArg : "") + ".";
  this.savedShell = { lines: this.lines, input: this.input, cursor: this.cursor };
  this.screenSession = sess;
  this.lines = sess.lines.length ? sess.lines : ["[screen " + sess.id + " に再接続]", ""];
  this.input = ""; this.cursor = 0;
  return "";
};
Terminal.prototype.screenExit = function(){
  const id = this.screenSession.id;
  this.screens = this.screens.filter(function(s){ return s.id !== id; });
  this.screenSession = null;
  const sv = this.savedShell || { lines: [], input: "", cursor: 0 };
  this.lines = sv.lines; this.input = sv.input; this.cursor = sv.cursor;
  return "[screen " + id + " is terminating]";
};

/* ── vim ── */
Terminal.prototype.openVim = function(path){
  const node = path ? fsGet(vfs(), path) : null;
  this.vim = {
    path: path, buf: (node && node.f !== undefined ? node.f : "").split("\n"),
    row: 0, col: 0, mode: "normal", cmdline: "", msg: path ? '"' + path + '"' : "[無名]",
    pend: "", yank: null, dirty: false
  };
  if (this.vim.buf.length === 0) this.vim.buf = [""];
  this.mode = "vim";
  this.modeline.style.display = "block";
  this.render();
};
Terminal.prototype.vimInsert = function(t){
  const v = this.vim;
  if (v.mode === "insert"){
    const line = v.buf[v.row];
    v.buf[v.row] = line.slice(0, v.col) + t + line.slice(v.col);
    v.col += t.length; v.dirty = true;
  } else if (v.mode === "cmd"){ v.cmdline += t; }
  this.render();
};
Terminal.prototype.vimKey = function(e){
  const v = this.vim, self = this;
  const k = e.key;
  function clamp(){ v.row = Math.max(0, Math.min(v.row, v.buf.length - 1)); v.col = Math.max(0, Math.min(v.col, Math.max(0, v.buf[v.row].length - (v.mode === "insert" ? 0 : 1)))); if (v.buf[v.row].length === 0) v.col = 0; }
  function exCmd(cmd){
    if (cmd === "w" || cmd === "wq" || cmd === "x"){
      if (!v.path) v.path = "/home/user/untitled.txt";
      fsPut(v.path, v.buf.join("\n"));
      v.msg = '"' + v.path + '" ' + v.buf.length + "L written";
      v.dirty = false;
      if (cmd !== "w"){ self.closeEditor(); return; }
    } else if (cmd === "q"){
      if (v.dirty){ v.msg = "E37: 変更が保存されていません (:q! で強制終了)"; }
      else { self.closeEditor(); return; }
    } else if (cmd === "q!"){ self.closeEditor(); return; }
    else if (cmd) v.msg = "E492: エディタのコマンドではありません: " + cmd;
    v.mode = "normal"; v.cmdline = "";
  }
  if (v.mode === "cmd"){
    if (k === "Enter"){ exCmd(v.cmdline); this.render(); return; }
    if (k === "Escape"){ v.mode = "normal"; v.cmdline = ""; this.render(); return; }
    if (k === "Backspace"){ v.cmdline = v.cmdline.slice(0, -1); if (!v.cmdline){ v.mode = "normal"; } this.render(); return; }
    if (k.length === 1 && !e.ctrlKey && !e.metaKey){ v.cmdline += k; this.render(); return; }
    return;
  }
  if (v.mode === "insert"){
    if (k === "Escape"){ v.mode = "normal"; if (v.col > 0) v.col--; clamp(); this.render(); return; }
    if (k === "Enter"){ const line = v.buf[v.row]; const rest = line.slice(v.col); v.buf[v.row] = line.slice(0, v.col); v.buf.splice(v.row + 1, 0, rest); v.row++; v.col = 0; v.dirty = true; this.render(); return; }
    if (k === "Backspace"){
      if (v.col > 0){ v.buf[v.row] = v.buf[v.row].slice(0, v.col - 1) + v.buf[v.row].slice(v.col); v.col--; }
      else if (v.row > 0){ const prev = v.buf[v.row - 1]; v.col = prev.length; v.buf[v.row - 1] = prev + v.buf[v.row]; v.buf.splice(v.row, 1); v.row--; }
      v.dirty = true; this.render(); return;
    }
    if (k === "ArrowLeft"){ v.col = Math.max(0, v.col - 1); this.render(); return; }
    if (k === "ArrowRight"){ v.col = Math.min(v.buf[v.row].length, v.col + 1); this.render(); return; }
    if (k === "ArrowUp"){ v.row = Math.max(0, v.row - 1); clamp(); this.render(); return; }
    if (k === "ArrowDown"){ v.row = Math.min(v.buf.length - 1, v.row + 1); clamp(); this.render(); return; }
    if (k.length === 1 && !e.ctrlKey && !e.metaKey){ this.vimInsert(k); return; }
    return;
  }
  /* normal モード */
  if (v.pend === "d"){
    v.pend = "";
    if (k === "d"){ v.yank = [v.buf[v.row]]; v.buf.splice(v.row, 1); if (!v.buf.length) v.buf = [""]; clamp(); v.dirty = true; v.msg = "1 行削除 (dd)"; this.render(); }
    return;
  }
  if (v.pend === "y"){
    v.pend = "";
    if (k === "y"){ v.yank = [v.buf[v.row]]; v.msg = "1 行ヤンク (yy)"; this.render(); }
    return;
  }
  if (v.pend === "g"){
    v.pend = "";
    if (k === "g"){ v.row = 0; v.col = 0; this.render(); }
    return;
  }
  switch (k){
    case "i": v.mode = "insert"; break;
    case "a": v.mode = "insert"; v.col = Math.min(v.buf[v.row].length, v.col + 1); break;
    case "A": v.mode = "insert"; v.col = v.buf[v.row].length; break;
    case "o": v.buf.splice(v.row + 1, 0, ""); v.row++; v.col = 0; v.mode = "insert"; v.dirty = true; break;
    case "O": v.buf.splice(v.row, 0, ""); v.col = 0; v.mode = "insert"; v.dirty = true; break;
    case "x": if (v.buf[v.row].length){ v.buf[v.row] = v.buf[v.row].slice(0, v.col) + v.buf[v.row].slice(v.col + 1); clamp(); v.dirty = true; } break;
    case "p": if (v.yank){ v.buf.splice(v.row + 1, 0, v.yank[0]); v.row++; v.dirty = true; } break;
    case "d": v.pend = "d"; break;
    case "y": v.pend = "y"; break;
    case "g": v.pend = "g"; break;
    case "G": v.row = v.buf.length - 1; clamp(); break;
    case "0": v.col = 0; break;
    case "$": v.col = Math.max(0, v.buf[v.row].length - 1); break;
    case "h": case "ArrowLeft": v.col = Math.max(0, v.col - 1); break;
    case "l": case "ArrowRight": v.col = Math.min(Math.max(0, v.buf[v.row].length - 1), v.col + 1); break;
    case "k": case "ArrowUp": v.row = Math.max(0, v.row - 1); clamp(); break;
    case "j": case "ArrowDown": v.row = Math.min(v.buf.length - 1, v.row + 1); clamp(); break;
    case "w": { const rest = v.buf[v.row].slice(v.col); const mm = rest.match(/^\S*\s+/); v.col = mm ? v.col + mm[0].length : v.buf[v.row].length; clamp(); break; }
    case "b": { const head = v.buf[v.row].slice(0, v.col).replace(/\s+$/, ""); const idx = head.lastIndexOf(" "); v.col = idx >= 0 ? idx + 1 : 0; break; }
    case ":": v.mode = "cmd"; v.cmdline = ""; break;
  }
  this.render();
};

/* ── emacs ── */
Terminal.prototype.openEmacs = function(path){
  const node = path ? fsGet(vfs(), path) : null;
  this.emacs = {
    path: path, buf: (node && node.f !== undefined ? node.f : "").split("\n"),
    row: 0, col: 0, kill: "", pendCx: false, dirty: false,
    msg: "Welcome to GNU Emacs (Bada). C-x C-s 保存 / C-x C-c 終了"
  };
  if (this.emacs.buf.length === 0) this.emacs.buf = [""];
  this.mode = "emacs";
  this.modeline.style.display = "block";
  this.render();
};
Terminal.prototype.emacsInsert = function(t){
  const b = this.emacs;
  const line = b.buf[b.row];
  b.buf[b.row] = line.slice(0, b.col) + t + line.slice(b.col);
  b.col += t.length; b.dirty = true;
  this.render();
};
Terminal.prototype.emacsKey = function(e){
  const b = this.emacs, self = this;
  const k = e.key;
  function clamp(){ b.row = Math.max(0, Math.min(b.row, b.buf.length - 1)); b.col = Math.max(0, Math.min(b.col, b.buf[b.row].length)); }
  if (b.pendCx){
    b.pendCx = false;
    if (e.ctrlKey && (k === "s" || k === "S")){
      if (!b.path) b.path = "/home/user/untitled.txt";
      fsPut(b.path, b.buf.join("\n"));
      b.msg = "Wrote " + b.path; b.dirty = false; this.render(); return;
    }
    if (e.ctrlKey && (k === "c" || k === "C")){ this.closeEditor(); return; }
    b.msg = "C-x " + k + " is undefined"; this.render(); return;
  }
  if (e.ctrlKey){
    switch (k.toLowerCase()){
      case "x": b.pendCx = true; b.msg = "C-x -"; this.render(); return;
      case "a": b.col = 0; this.render(); return;
      case "e": b.col = b.buf[b.row].length; this.render(); return;
      case "k": b.kill = b.buf[b.row].slice(b.col); b.buf[b.row] = b.buf[b.row].slice(0, b.col); b.dirty = true; b.msg = "killed"; this.render(); return;
      case "y": this.emacsInsert(b.kill); b.msg = "yank"; return;
      case "d": { const l = b.buf[b.row]; if (b.col < l.length){ b.buf[b.row] = l.slice(0, b.col) + l.slice(b.col + 1); b.dirty = true; } this.render(); return; }
      case "n": b.row = Math.min(b.buf.length - 1, b.row + 1); clamp(); this.render(); return;
      case "p": b.row = Math.max(0, b.row - 1); clamp(); this.render(); return;
      case "f": b.col = Math.min(b.buf[b.row].length, b.col + 1); this.render(); return;
      case "b": b.col = Math.max(0, b.col - 1); this.render(); return;
      case "g": b.msg = "Quit"; this.render(); return;
    }
    return;
  }
  if (k === "Enter"){ const line = b.buf[b.row]; const rest = line.slice(b.col); b.buf[b.row] = line.slice(0, b.col); b.buf.splice(b.row + 1, 0, rest); b.row++; b.col = 0; b.dirty = true; this.render(); return; }
  if (k === "Backspace"){
    if (b.col > 0){ b.buf[b.row] = b.buf[b.row].slice(0, b.col - 1) + b.buf[b.row].slice(b.col); b.col--; }
    else if (b.row > 0){ const prev = b.buf[b.row - 1]; b.col = prev.length; b.buf[b.row - 1] = prev + b.buf[b.row]; b.buf.splice(b.row, 1); b.row--; }
    b.dirty = true; this.render(); return;
  }
  if (k === "ArrowLeft"){ b.col = Math.max(0, b.col - 1); this.render(); return; }
  if (k === "ArrowRight"){ b.col = Math.min(b.buf[b.row].length, b.col + 1); this.render(); return; }
  if (k === "ArrowUp"){ b.row = Math.max(0, b.row - 1); clamp(); this.render(); return; }
  if (k === "ArrowDown"){ b.row = Math.min(b.buf.length - 1, b.row + 1); clamp(); this.render(); return; }
  if (k.length === 1 && !e.metaKey){ this.emacsInsert(k); return; }
};
Terminal.prototype.closeEditor = function(){
  this.mode = "shell"; this.vim = null; this.emacs = null;
  this.modeline.style.display = "none";
  this.render();
};

/* ── 入力ディスパッチ ── */
Terminal.prototype.onInput = function(e){
  if (this.composingNative || (e && e.isComposing)) return;
  const t = this.kb.value;
  this.kb.value = "";
  if (!t) return;
  if (this.mozcOn && /^[a-zA-Z\-,.!?]+$/.test(t)){
    this.mozcBuf += t.toLowerCase();
    this.compose = romajiToKana(this.mozcBuf);
    this.render();
    return;
  }
  this.insertText(t);
};
Terminal.prototype.commitMozc = function(kata){
  if (!this.mozcBuf) return;
  const text = kata ? kanaToKatakana(romajiToKana(this.mozcBuf)) : romajiToKana(this.mozcBuf);
  this.mozcBuf = ""; this.compose = "";
  this.insertText(text);
};
Terminal.prototype.onKey = function(e){
  const self = this;
  if (e.isComposing || e.keyCode === 229) return;      /* OS の IME 変換中はすべて IME に委ねる */
  /* Ctrl+Space → 内蔵 fcitx-mozc 切替 (どのモードでも) */
  if (e.ctrlKey && (e.key === " " || e.code === "Space")){
    e.preventDefault();
    this.mozcOn = !this.mozcOn;
    if (!this.mozcOn){ this.mozcBuf = ""; this.compose = ""; }
    this.updateBadge(); this.render();
    return;
  }
  /* Mozc 変換中のキー */
  if (this.mozcOn && this.mozcBuf){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); this.commitMozc(false); this.render(); return; }
    if (e.key === "F7"){ e.preventDefault(); this.commitMozc(true); this.render(); return; }
    if (e.key === "Escape"){ e.preventDefault(); this.mozcBuf = ""; this.compose = ""; this.render(); return; }
    if (e.key === "Backspace"){ e.preventDefault(); this.mozcBuf = this.mozcBuf.slice(0, -1); this.compose = romajiToKana(this.mozcBuf); this.render(); return; }
  }
  if (this.mode === "vim"){
    if (["Escape","Enter","Backspace","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Tab"].includes(e.key) || e.ctrlKey) e.preventDefault();
    this.vimKey(e);
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) e.preventDefault(); /* input イベントの二重挿入防止 → vimKey が処理済み */
    return;
  }
  if (this.mode === "emacs"){
    if (["Escape","Enter","Backspace","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Tab"].includes(e.key) || e.ctrlKey) e.preventDefault();
    this.emacsKey(e);
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) e.preventDefault();
    return;
  }
  /* shell モード */
  if (e.ctrlKey && e.key === "a" && this.screenPending){ /* handled below */ }
  if (this.screenPending){
    this.screenPending = false;
    if (e.key === "d"){ e.preventDefault(); this.screenDetach(); return; }
    if (e.key === "a" && e.ctrlKey){ e.preventDefault(); return; }
  }
  if (e.ctrlKey){
    switch (e.key.toLowerCase()){
      case "c": e.preventDefault(); this.print(this.prompt() + this.input + "^C"); this.input = ""; this.cursor = 0; this.render(); return;
      case "l": e.preventDefault(); this.clear(); this.render(); return;
      case "a": e.preventDefault();
        if (this.screenSession){ this.screenPending = true; return; }
        this.cursor = 0; this.render(); return;
      case "e": e.preventDefault(); this.cursor = this.input.length; this.render(); return;
      case "u": e.preventDefault(); this.input = this.input.slice(this.cursor); this.cursor = 0; this.render(); return;
      case "v": return; /* paste イベントに委ねる */
    }
    return;
  }
  switch (e.key){
    case "Enter": {
      e.preventDefault();
      const cmd = this.input;
      this.print(this.prompt() + cmd);
      this.input = ""; this.cursor = 0;
      if (cmd.trim()){
        this.history.push(cmd); this.hidx = this.history.length;
        const r = runShell(cmd, this.ctx);
        if (r) this.print(r);
      }
      this.render();
      return;
    }
    case "Backspace":
      e.preventDefault();
      if (this.cursor > 0){ this.input = this.input.slice(0, this.cursor - 1) + this.input.slice(this.cursor); this.cursor--; this.render(); }
      return;
    case "Delete":
      e.preventDefault();
      this.input = this.input.slice(0, this.cursor) + this.input.slice(this.cursor + 1); this.render(); return;
    case "ArrowLeft": e.preventDefault(); this.cursor = Math.max(0, this.cursor - 1); this.render(); return;
    case "ArrowRight": e.preventDefault(); this.cursor = Math.min(this.input.length, this.cursor + 1); this.render(); return;
    case "ArrowUp":
      e.preventDefault();
      if (this.hidx > 0){ this.hidx--; this.input = this.history[this.hidx] || ""; this.cursor = this.input.length; this.render(); }
      return;
    case "ArrowDown":
      e.preventDefault();
      if (this.hidx < this.history.length){ this.hidx++; this.input = this.history[this.hidx] || ""; this.cursor = this.input.length; this.render(); }
      return;
    case "Tab": {
      e.preventDefault();
      const CMDS = ["apt","vim","emacs","ssh","screen","xinetd","service","pdflatex","latex","fcitx-mozc","ls","cd","cat","echo","mkdir","touch","rm","help","clear","history","man","rails","open","xterm","x-terminal-emulator","terminal","dpkg","ps","uname"];
      const head = this.input.slice(0, this.cursor);
      const mm = head.match(/(\S+)$/);
      if (mm){
        const cands = CMDS.filter(function(x){ return x.startsWith(mm[1]); });
        if (cands.length === 1){
          const add = cands[0].slice(mm[1].length) + " ";
          this.insertText(add);
        } else if (cands.length > 1){
          this.print(this.prompt() + this.input);
          this.print(cands.join("  "));
          this.render();
        }
      }
      return;
    }
  }
};
Terminal.prototype.render = function(){
  if (this.mode === "vim" && this.vim){
    const v = this.vim;
    const rows = [];
    for (let i = 0; i < v.buf.length; i++){
      if (i === v.row){
        const line = v.buf[i], col = Math.min(v.col, line.length);
        rows.push(esc(line.slice(0, col)) +
          (this.compose ? '<span class="ime">' + esc(this.compose) + "</span>" : "") +
          '<span class="cur">' + esc(line[col] || " ") + "</span>" + esc(line.slice(col + 1)));
      } else rows.push(esc(v.buf[i]));
    }
    for (let i = v.buf.length; i < 18; i++) rows.push('<span style="opacity:.4">~</span>');
    this.scr.innerHTML = rows.join("\n");
    this.modeline.textContent =
      (v.mode === "cmd" ? ":" + v.cmdline :
       (v.mode === "insert" ? "-- INSERT --  " : "") + (v.path || "[無名]") + (v.dirty ? " [+]" : "") +
       "  " + (v.row + 1) + "," + (v.col + 1) + "   " + v.msg);
    this.scr.scrollTop = this.scr.scrollHeight;
    return;
  }
  if (this.mode === "emacs" && this.emacs){
    const b = this.emacs;
    const rows = [];
    for (let i = 0; i < b.buf.length; i++){
      if (i === b.row){
        const line = b.buf[i], col = Math.min(b.col, line.length);
        rows.push(esc(line.slice(0, col)) +
          (this.compose ? '<span class="ime">' + esc(this.compose) + "</span>" : "") +
          '<span class="cur">' + esc(line[col] || " ") + "</span>" + esc(line.slice(col + 1)));
      } else rows.push(esc(b.buf[i]));
    }
    this.scr.innerHTML = rows.join("\n");
    this.modeline.textContent = "-UUU:" + (b.dirty ? "**" : "--") + "-F1  " +
      (b.path ? b.path.split("/").pop() : "*scratch*") + "   (Fundamental)  L" + (b.row + 1) + "   " + b.msg;
    this.scr.scrollTop = this.scr.scrollHeight;
    return;
  }
  const before = this.input.slice(0, this.cursor);
  const at = this.input[this.cursor] || " ";
  const after = this.input.slice(this.cursor + 1);
  const composeHtml = this.compose ? '<span class="ime">' + esc(this.compose) + "</span>" : "";
  this.scr.innerHTML = this.lines.map(esc).join("\n") + "\n" +
    esc(this.prompt()) + esc(before) + composeHtml + '<span class="cur">' + esc(at) + "</span>" + esc(after);
  this.scr.scrollTop = this.scr.scrollHeight;
  this.updateBadge();
};

/* =====================================================================
 * w9wm ウィンドウマネージャ
 *   B3 = WM メニュー (New/Reshape/Move/Delete/Hide + 仮想スクリーン)
 *   B1 = アプリケーションメニュー / Ctrl+Alt+←→ = 仮想スクリーン切替
 * ===================================================================== */
const WM = {
  wins: [], seq: 0, z: 10, desk: 0, NDESK: 4,
  mode: null,       // null | "reshape" | "move" | "delete" | "hide"
  pickWin: null
};
const PAGES = {
  "home":        { title: "ホーム",        fav: "🜁" },
  "gpt":         { title: "BadaGPT",       fav: "✦" },
  "rails":       { title: "Bada on Rails", fav: "🚂" },
  "terminal":    { title: "xterm",         fav: "🖥" },
  "studio":      { title: "GUI スタジオ",   fav: "🎨" },
  "transformer": { title: "Transformer",   fav: "🧠" },
  "voice":       { title: "合い言葉",       fav: "🎙" },
  "settings":    { title: "設定",           fav: "⚙" }
};
function pageKey(url){
  const m = String(url).match(/^bada:\/\/([a-z]+)/i);
  return m ? m[1].toLowerCase() : "home";
}
function deskEl(){ return document.getElementById("desk"); }

function wmCreate(opts){
  const desk = deskEl();
  const el = document.createElement("div");
  el.className = "win";
  const W = opts.w || 560, H = opts.h || 420;
  WM.seq++;
  const x = opts.x !== undefined ? opts.x : (40 + (WM.seq * 36) % 260);
  const y = opts.y !== undefined ? opts.y : (30 + (WM.seq * 28) % 180);
  el.style.left = x + "px"; el.style.top = y + "px";
  el.style.width = W + "px"; el.style.height = H + "px";
  el.style.zIndex = ++WM.z;
  el.innerHTML = '<div class="body"></div><div class="rsz"></div>';
  desk.appendChild(el);
  const win = { id: "w" + WM.seq, key: opts.key, url: opts.url || "", title: opts.title || opts.key,
    el: el, body: el.querySelector(".body"), desk: WM.desk, hidden: false, term: null };
  WM.wins.push(win);

  el.addEventListener("mousedown", function(e){
    if (WM.mode){ wmPickTarget(win, e); e.stopPropagation(); e.preventDefault(); return; }
    wmFocus(win);
    /* 4px ボーダー部をドラッグで移動 (9wm 流) */
    if (e.target === el){
      const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
      function mv(e2){ el.style.left = Math.max(0, e2.clientX - sx) + "px"; el.style.top = Math.max(0, e2.clientY - sy) + "px"; }
      function up(){ document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); }
      document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
      e.preventDefault();
    }
  });
  const rsz = el.querySelector(".rsz");
  rsz.addEventListener("mousedown", function(e){
    e.stopPropagation(); e.preventDefault();
    wmFocus(win);
    const sw = el.offsetWidth, sh = el.offsetHeight, sx = e.clientX, sy = e.clientY;
    function mv(e2){ el.style.width = Math.max(160, sw + e2.clientX - sx) + "px"; el.style.height = Math.max(110, sh + e2.clientY - sy) + "px"; }
    function up(){ document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); }
    document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
  });
  wmFocus(win);
  return win;
}
function wmFocus(win){
  WM.wins.forEach(function(w){ w.el.classList.remove("focus"); });
  win.el.classList.add("focus");
  win.el.style.zIndex = ++WM.z;
  WM.focused = win;
  if (win.term) setTimeout(function(){ win.term.kb.focus(); }, 0);
}
function wmClose(win){
  WM.wins = WM.wins.filter(function(w){ return w !== win; });
  if (win.el && win.el.parentNode) win.el.parentNode.removeChild(win.el);
  if (WM.focused === win) WM.focused = WM.wins[WM.wins.length - 1] || null;
}
function wmHide(win){ win.hidden = true; win.el.classList.add("hidden"); }
function wmUnhide(win){
  win.hidden = false; win.desk = WM.desk;
  win.el.classList.remove("hidden");
  wmFocus(win);
}
function wmSwitchDesk(n){
  WM.desk = ((n % WM.NDESK) + WM.NDESK) % WM.NDESK;
  WM.wins.forEach(function(w){
    if (w.hidden) return;
    if (w.desk === WM.desk) w.el.classList.remove("hidden");
    else w.el.classList.add("hidden");
  });
  setStatus("仮想スクリーン " + WM.desk);
}
function wmPickTarget(win, e){
  const mode = WM.mode;
  WM.mode = null;
  deskEl().className = "";
  if (mode === "delete"){ wmClose(win); setStatus("Delete: " + win.title); return; }
  if (mode === "hide"){ wmHide(win); setStatus("Hide: " + win.title + " (B3 メニューから戻せます)"); return; }
  if (mode === "move"){
    const el = win.el;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    function mv(e2){ el.style.left = Math.max(0, e2.clientX - sx) + "px"; el.style.top = Math.max(0, e2.clientY - sy) + "px"; }
    function up(){ document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); }
    document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
    return;
  }
  if (mode === "reshape"){
    const box = document.getElementById("sweepbox");
    const x0 = e.clientX, y0 = e.clientY;
    box.style.display = "block";
    function set(e2){
      const x = Math.min(x0, e2.clientX), y = Math.min(y0, e2.clientY);
      const w = Math.abs(e2.clientX - x0), h = Math.abs(e2.clientY - y0);
      box.style.left = x + "px"; box.style.top = y + "px";
      box.style.width = w + "px"; box.style.height = h + "px";
      return { x: x, y: y, w: w, h: h };
    }
    set(e);
    function mv(e2){ set(e2); }
    function up(e2){
      document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up);
      const g = set(e2);
      box.style.display = "none";
      if (g.w > 60 && g.h > 50){
        win.el.style.left = g.x + "px"; win.el.style.top = g.y + "px";
        win.el.style.width = Math.max(160, g.w) + "px"; win.el.style.height = Math.max(110, g.h) + "px";
      }
      wmFocus(win);
    }
    document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
  }
}

/* ── メニュー ── */
let menuEl = null;
function closeMenu(){ if (menuEl && menuEl.parentNode) menuEl.parentNode.removeChild(menuEl); menuEl = null; }
function showMenu(items, x, y){
  closeMenu();
  const el = document.createElement("div");

    if (it === "-"){ const s = document.createElement("div"); s.className = "sep"; el.appendChild(s); return; }

    if (it.vrow){
      const row = document.createElement("div"); row.className = "vrow";
      for (let i = 0; i < WM.NDESK; i++){
        (function(n){
          const b = document.createElement("div");
          b.className = "vbox" + (n === WM.desk ? " cur" : "");
          b.textContent = n;
          b.onmousedown = function(e){ e.stopPropagation(); };
          b.onclick = function(){ closeMenu(); wmSwitchDesk(n); };
          row.appendChild(b);
        })(i);
      }
      el.appendChild(row); return;
    }
    const d = document.createElement("div");
    d.className = "it"; d.textContent = it.label;
    d.onclick = function(){ closeMenu(); it.fn(); };
    el.appendChild(d);
  });
  el.style.left = Math.min(x, Math.max(0, (window.innerWidth || 1200) - 220)) + "px";
  el.style.top = Math.min(y, Math.max(0, (window.innerHeight || 800) - 300)) + "px";
  deskEl().appendChild(el);
  menuEl = el;
}
function wmMenu(x, y){

/* ── ターミナル起動 (xterm / x-terminal-emulator / terminal) ── */
function openTerm(kind){
  const theme = TERM_THEMES[kind] || TERM_THEMES.xterm;
  const win = wmCreate({ key: "term-" + kind, title: theme.name, w: 620, h: 400 });
  const term = new Terminal(kind, win.body);
  win.term = term;
  term.onClose = function(){ wmClose(win); };
  wmFocus(win);
  return win;
}

/* ── アプリウィンドウ (単一インスタンス) / bada:// ルーター ── */
function findWin(key){ return WM.wins.find(function(w){ return w.key === key; }) || null; }
function navigate(url){
  const key = pageKey(url);
  if (key === "terminal"){ const w = WM.wins.find(function(x){ return x.term && !x.hidden; }); if (w){ wmFocus(w); } else openTerm("xterm"); return; }
  const meta = PAGES[key] || PAGES.home;
  let win = findWin(key);
  if (!win){
    win = wmCreate({ key: key, url: url, title: meta.fav + " " + meta.title, w: key === "studio" ? 760 : 620, h: 460 });
  }
  win.url = url;
  if (win.hidden) wmUnhide(win);
  win.desk = WM.desk; win.el.classList.remove("hidden");
  renderPage(url, win.body);
  wmFocus(win);
  refreshStatusbar();
}
function renderCurrent(){
  const w = WM.focused;
  if (w && !w.term) renderPage(w.url || ("bada://" + w.key), w.body);
  refreshStatusbar();
}

/* ── ページレンダラー ──────────────────────────────────────────── */
function renderPage(url, vp){
  const key = pageKey(url);
  switch (key){
    case "gpt":         return pageGPT(vp);
    case "rails":       return pageRails(vp, url);
    case "studio":      return pageStudio(vp);
    case "transformer": return pageTransformer(vp);
    case "voice":       return pageVoice(vp);
    case "settings":    return pageSettings(vp);
    default:            return pageHome(vp);
  }
}

/* bada://studio — GUI プログラミング */
let guiCmps = store.get("gui.cmps", [
  { type: "TLabel",  x: 30, y: 24,  caption: "量子フォーム Form1" },
  { type: "TButton", x: 30, y: 70,  caption: "測定する" },
  { type: "TEdit",   x: 30, y: 120, caption: "" }
]);
let guiSel = -1, guiSeq = guiCmps.length;
function pageStudio(vp){
  vp.innerHTML =
  '<div class="page"><h1>🎨 GUI スタジオ</h1><div class="sub">GUI プログラミング — 部品を置いてドラッグ → Bada コード生成 → ▶ 実行 (ボタンは量子測定を発火)</div>' +
  '<div id="designer">' +
  '<div class="card" id="palette" style="margin:0"><b style="font-size:12px;color:var(--gold)">パレット</b><br><br>' +
  '<button data-t="TButton">□ TButton</button><button data-t="TLabel">A TLabel</button><button data-t="TEdit">▭ TEdit</button>' +
  '<hr style="border-color:var(--edge);margin:10px 0"/>' +
  '<button id="guirun" style="background:var(--green);border-color:var(--green)">▶ 実行 (F9)</button>' +
  '<button id="guidel">🗑 選択を削除</button></div>' +
  '<div class="card" style="margin:0"><div id="canvas"></div></div>' +
  '<div class="card" style="margin:0"><b style="font-size:12px;color:var(--gold)">プロパティ</b>' +
  '<div id="props" style="margin-top:8px;font-size:12.5px;color:var(--dim)">部品を選択してください</div></div>' +
  '</div>' +
  '<h2>生成された Bada コード</h2><pre class="code" id="guicode"></pre></div>';
  vp.querySelectorAll("#palette button[data-t]").forEach(function(b){
    b.onclick = function(){
      guiSeq++;
      guiCmps.push({ type: b.getAttribute("data-t"), x: 40 + (guiSeq*17)%180, y: 40 + (guiSeq*23)%200,
        caption: b.getAttribute("data-t") === "TEdit" ? "" : b.getAttribute("data-t").slice(1) + guiSeq });
      saveGui(); drawGui(vp);
    };
  });
  vp.querySelector("#guirun").onclick = runGuiPreview;
  vp.querySelector("#guidel").onclick = function(){ if (guiSel >= 0){ guiCmps.splice(guiSel, 1); guiSel = -1; saveGui(); drawGui(vp); } };
  drawGui(vp);
}
function saveGui(){ store.set("gui.cmps", guiCmps); }
function guiCode(){
  return "form Form1 {\n  title \"Bada VM Pro Form\"\n" +
    guiCmps.map(function(c, i){
      let l = "  " + c.type.slice(1).toLowerCase() + " c" + i + " at (" + c.x + "," + c.y + ")";
      if (c.caption) l += ' caption "' + c.caption + '"';
      if (c.type === "TButton") l += ' on click {\n    qubit q0; H q0\n    print measure   # 量子測定\n  }';
      return l;
    }).join("\n") + "\n}";
}
function drawGui(vp){
  const cv = vp.querySelector("#canvas");
  cv.innerHTML = "";
  guiCmps.forEach(function(c, i){
    const el = document.createElement("div");
    el.className = "cmp " + c.type + (i === guiSel ? " sel" : "");
    el.style.left = c.x + "px"; el.style.top = c.y + "px";
    el.textContent = c.type === "TEdit" ? (c.caption || "") : c.caption;
    if (c.type === "TEdit" && !c.caption) el.innerHTML = "&nbsp;";
    el.onmousedown = function(ev){
      guiSel = i; drawGui(vp);
      const sx = ev.clientX - c.x, sy = ev.clientY - c.y;
      function mv(e2){ c.x = Math.max(0, e2.clientX - sx); c.y = Math.max(0, e2.clientY - sy);
        el.style.left = c.x + "px"; el.style.top = c.y + "px"; }
      function up(){ document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); saveGui(); drawGui(vp); }
      document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
      ev.preventDefault(); ev.stopPropagation();
    };
    cv.appendChild(el);
  });
  const props = vp.querySelector("#props");
  if (guiSel >= 0 && guiCmps[guiSel]){
    const c = guiCmps[guiSel];
    props.innerHTML = '<div>type: <b>' + c.type + '</b></div><div>at: (' + c.x + ',' + c.y + ')</div>' +
      '<div style="margin-top:6px">caption<br/><input id="propcap" style="width:100%" value="' + String(c.caption).replace(/"/g, "&quot;") + '"/></div>';
    props.querySelector("#propcap").oninput = function(e){ c.caption = e.target.value; saveGui();
      const cvv = document.querySelectorAll("#canvas .cmp")[guiSel]; if (cvv) cvv.textContent = c.caption; };
  } else props.textContent = "部品を選択してください";
  vp.querySelector("#guicode").textContent = guiCode();
}
function runGuiPreview(){
  const ov = document.getElementById("guiprev"), body = document.getElementById("gp-body");
  body.innerHTML = "";
  guiCmps.forEach(function(c){
    let el;
    if (c.type === "TButton"){ el = document.createElement("button"); el.className = "cmp TButton"; el.textContent = c.caption;
      el.style.cursor = "pointer";
      el.onclick = function(){ const r = badaInterpret("qubit q0\nH q0\nmeasure");
        alert("on click → 量子測定\n" + r); }; }
    else if (c.type === "TEdit"){ el = document.createElement("input"); el.className = "cmp TEdit"; el.value = c.caption; }
    else { el = document.createElement("div"); el.className = "cmp TLabel"; el.textContent = c.caption; }
    el.style.position = "absolute"; el.style.left = c.x + "px"; el.style.top = c.y + "px"; el.style.cursor = el.style.cursor || "default";
    body.appendChild(el);
  });
  ov.style.display = "flex";
}
function closeGuiPreview(){ document.getElementById("guiprev").style.display = "none"; }

/* bada://transformer */
function pageTransformer(vp){
  vp.innerHTML =
  '<div class="page"><h1>🧠 トランスフォーマー・スタジオ</h1>' +
  '<div class="sub">16次元・1ヘッド self-attention の本物の順伝播 + 学習可能な bigram 統計。文脈を入れて次トークンを予測し、attention 行列を可視化します</div>' +
  '<div class="card"><div class="row"><input id="tfctx" style="flex:1" value="qubit q0 q1 H q0 CNOT"/>' +
  '<button id="tfgo" style="background:var(--cyan);border-color:var(--cyan);color:#04252a">予測</button></div>' +
  '<div id="tfout" style="margin-top:12px"></div></div>' +
  '<div class="card"><h2 style="margin-top:0">トランスフォーマーをプログラムする (学習)</h2>' +
  '<div class="sub">Bada コードを与えると bigram 統計を更新し、予測が変わります</div>' +
  '<textarea id="tftrain" rows="4" style="width:100%">qubit q0 q1\nH q0\nCNOT q0 q1\nmeasure</textarea>' +
  '<div class="row" style="margin-top:8px"><button id="tftrainbtn" style="background:var(--purple);border-color:var(--purple)">学習</button>' +
  '<button id="tfreset">統計リセット</button><span id="tfstat" class="badge"></span></div></div></div>';
  function show(){
    const p = transformerPredict(vp.querySelector("#tfctx").value, 6);
    let html = "<b>文脈:</b> <span class='kbd'>" + p.tokens.join("</span> <span class='kbd'>") + "</span>" +
      "<h2>次トークン予測</h2><table class='tbl'><tr><th>#</th><th>token</th><th>p</th></tr>" +
      p.preds.map(function(x, i){ return "<tr><td>" + (i+1) + "</td><td><b>" + String(x.w).replace(/</g,"&lt;") + "</b></td><td>" + x.p.toFixed(4) + "</td></tr>"; }).join("") +
      "</table><h2>attention 行列 (causal)</h2>";
    const n = p.tokens.length;
    html += "<div class='attn' style='grid-template-columns:repeat(" + n + ",1fr);max-width:" + (n*46) + "px'>";
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){
      const w = (p.attn[i] && j < p.attn[i].length) ? p.attn[i][j] : 0;
      const c = Math.round(255 * w);
      html += "<div style='background:rgb(" + Math.round(c*0.56) + "," + Math.round(c*0.38) + "," + c + ")'><span>" + (w ? w.toFixed(2).slice(1) : "·") + "</span></div>";
    }
    html += "</div><div class='sub' style='margin-top:6px'>行 = query 位置 / 列 = key 位置。下三角のみ (causal mask)。</div>";
    vp.querySelector("#tfout").innerHTML = html;
  }
  vp.querySelector("#tfgo").onclick = show;
  vp.querySelector("#tfctx").addEventListener("keydown", function(e){ if (e.key === "Enter") show(); });
  vp.querySelector("#tftrainbtn").onclick = function(){
    const n = tfTrain(vp.querySelector("#tftrain").value);
    vp.querySelector("#tfstat").textContent = n + " トークンを学習 (語彙 " + TF.vocab.length + ")";
    show();
  };
  vp.querySelector("#tfreset").onclick = function(){ TF.bigram = {}; store.set("tf.bigram", {}); vp.querySelector("#tfstat").textContent = "リセット"; show(); };
  show();
}

/* ── 起動 (w9wm セッション開始) ────────────────────────────────── */
(function boot(){
  const desk = deskEl();
  /* B3 = WM メニュー (ルート/どこでも) */
  desk.addEventListener("contextmenu", function(e){
    e.preventDefault();
    wmMenu(e.clientX, e.clientY);
  });
  /* B1 (ルート素地) = アプリメニュー */
  desk.addEventListener("mousedown", function(e){
    if (menuEl && !menuEl.contains(e.target)){ closeMenu(); }
    if (e.target !== desk) return;
    if (WM.mode){ WM.mode = null; desk.className = ""; setStatus(""); return; }
    if (e.button === 0){ appMenu(e.clientX, e.clientY); }
  });
  const mb = document.getElementById("menubtn");
  if (mb) mb.onclick = function(e){ appMenu(10, 40); e.stopPropagation(); };
  /* Ctrl+Alt+←→ = 仮想スクリーン */
  document.addEventListener("keydown", function(e){
    if (e.ctrlKey && e.altKey){
      if (e.key === "ArrowRight"){ e.preventDefault(); wmSwitchDesk(WM.desk + 1); }
      if (e.key === "ArrowLeft"){ e.preventDefault(); wmSwitchDesk(WM.desk - 1); }
    }
  });
  pkgDB(); vfs();
  navigate("bada://home");
  const t = openTerm("xterm");
  t.el && t.el.style && (t.el.style.left = "360px", t.el.style.top = "160px");
  refreshStatusbar();
  setStatus("w9wm セッション開始 — 右クリックで WM メニュー");
})();
</script>
