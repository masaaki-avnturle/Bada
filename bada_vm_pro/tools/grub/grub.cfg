# grub.cfg — Bada VM Pro レガシー GRUB マルチブート (BIOS / i386-pc)
#
# 設計: GRUB を MBR に置く「マルチ OS セレクタ」。先頭ヘッダを占有せず、
#   ・Windows は前方パーティションのまま chainload で起動
#   ・Bada VM Pro はディスク末尾パーティション (ラベル BADAVMPRO) を chainload
#   他の OS と共存し、起動時にメニューで選択する。
#
# これはライブ ISO (grub-mkrescue) 用。実機へインストールすると
# install-grub-multiboot.sh が /boot/grub/grub.cfg を具体的な
# パーティション番号付きで生成する。

insmod part_msdos
insmod part_gpt
insmod fat
insmod ntfs
insmod chain
insmod biosdisk
insmod all_video
insmod gfxterm

set timeout=15
set default=0

if loadfont unicode ; then
  set gfxmode=auto
  terminal_output gfxterm
fi

set menu_color_normal=cyan/black
set menu_color_highlight=black/cyan

# ── Bada VM Pro (ディスク末尾パーティション) ──
# ラベル BADAVMPRO の FAT パーティション (ディスク末尾) を検出し、GRUB が
# 起動バナーを表示する。OS 本体は同パーティション内の INDEX.HTM で、
# どの PC のブラウザで開いても w9wm デスクトップが起動する。
menuentry "Bada VM Pro  (quantum Bada OS / w9wm desktop)" --class bada {
  insmod fat
  insmod search_label
  if search --no-floppy --label --set=root BADAVMPRO ; then
    echo ""
    if [ -f /BANNER.TXT ]; then cat /BANNER.TXT ; fi
    echo ""
    echo " OS 本体: (BADAVMPRO)/INDEX.HTM をブラウザで開くと起動します。"
    echo " 何かキーを押すとメニューへ戻ります。"
    read
  else
    echo "Bada VM Pro partition (BADAVMPRO) not found."
    echo "Install it with: sudo bash install-grub-multiboot.sh --apply"
    sleep 6
  fi
}

# ── Windows (前方パーティション / chainload) ──
# Windows は自分が 1 台目ディスクの先頭にいる前提なので drivemap で入替えて
# chainload する。実機では install スクリプトが実際のパーティションに置換。
menuentry "Windows  (chainload — front partition)" --class windows {
  insmod chain
  insmod ntfs
  insmod ntldr
  set root=(hd0,msdos1)
  drivemap -s (hd0) (hd0)
  chainloader +1
}

# ── 1台目ハードディスクからそのまま起動 (既存ブートローダへ委譲) ──
menuentry "Boot from the first hard disk (existing OS)" {
  insmod chain
  set root=(hd0)
  chainloader +1
}

menuentry "Bada VM Pro について (このディスクの使い方)" {
  echo "================================================================"
  echo " Bada VM Pro  --  legacy GRUB multiboot (BIOS / i386-pc)"
  echo "================================================================"
  echo ""
  echo " この OS は他の OS と共存するため、ディスクの *末尾* パーティションに"
  echo " 入れ、GRUB を MBR のマルチ OS セレクタにします (先頭は占有しません)。"
  echo ""
  echo " 既存の Ubuntu などから次を実行するとインストールされます:"
  echo "   sudo bash install-grub-multiboot.sh            # 下見 (非破壊)"
  echo "   sudo bash install-grub-multiboot.sh --apply    # 実行"
  echo ""
  echo " OS 本体は INDEX.HTM です。どの PC のブラウザでも開けば起動します。"
  echo ""
  echo " 何かキーを押すとメニューへ戻ります。"
  read
}

menuentry "System firmware setup (UEFI/BIOS)" {
  fwsetup
}
menuentry "Reboot" { reboot }
menuentry "Shut down" { halt }
