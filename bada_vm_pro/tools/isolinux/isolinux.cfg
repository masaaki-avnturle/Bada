; isolinux.cfg — Bada VM Pro ライブ CD/USB
; OS 本体は INDEX.HTM (カーネルを持たない Web OS) のため、isolinux は
; 起動時に boot.msg のバナーを表示します。この標準 isolinux 構成により
; Rufus はディスクを認識し「ISO イメージモード」で USB ブートディスクを
; 作成できます (DD モードは不要)。
DEFAULT bada
PROMPT 1
TIMEOUT 300
DISPLAY boot.msg

; カーネルを持たないため、選択しても案内メッセージを再表示するだけ。
LABEL bada
  LOCALBOOT 0x80
