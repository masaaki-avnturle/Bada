plugins {
    id 'com.android.application'
}

android {
    namespace 'bada.android'
    compileSdk 34

    defaultConfig {
        applicationId "bada.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Share the exact same pure-Java Space Telegraph core as the desktop/EXE app.
    sourceSets {
        main {
            java.srcDirs += ['../../core/src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
